<div class="mw-parser-output"><p><b>iNES Mapper 243</b> denotes the Sachen <b>SA-020A</b> circuit board. Using an eight-register ASIC with a fake &quot;<a href="Sachen_74LS374N_pinout.xhtml" title="Sachen 74LS374N pinout">74LS374N</a>&quot; marking, it supports up to 128 KiB PRG-ROM, and 128 KiB of CHR-ROM. It is used for only one game, <i>美女拳 - Honey Peach</i> (SA-006).
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$FFFF: switchable 32 KiB PRG-ROM bank</li>
<li>PPU $0000-$1FFF: switchable 8 KiB CHR-ROM bank</li>
<li>Nametable mirroring: switchable H/V/Vertically-flipped L/One-screen</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Register_Index_.28.244100.2C_write.29"/><span class="mw-headline" id="Register_Index_($4100,_write)">Register Index ($4100, write)</span></h2>
<pre>Mask: $C101

D~7654 3210
  ---------
  .... .RRR
        +++- Select register number (Rx)
</pre>
<h2><span id="Register_Data_.28.244101.2C_read.2Fwrite.29"/><span class="mw-headline" id="Register_Data_($4101,_read/write)">Register Data ($4101, read/write)</span></h2>
<pre>Mask: $C101

D~7654 3210
  ---------
  .... .RRR
        +++- Register data

D~7654 3210
  ---------
  .... ...A  R2: CHR A13
  .... ...B  R4: CHR A14
  .... ..PP  R5: PRG A16..A15
  .... ..DC  R6: CHR A16..A15
  ...  .MM.  R7: Nametable mirroring
              0: S0-S0-S0-S1 (lower right unique, or vertically-flipped L)
              1: Horizontal
              2: Vertical
              3: Single-screen, page 1
</pre>
<p>Registers 0, 1, and 3 have no external effect. All three bits in all eight registers are fully implemented and can be read from and written to.
</p>
<h1><span class="mw-headline" id="Errata">Errata</span></h1>
<p>The <b>SA-150</b> PCB, denoted by <a href="INES_Mapper_150.xhtml" title="INES Mapper 150">INES Mapper 150</a>, connects the same ASIC differently, changing the meaning of the CHR-bank-related register bits.
</p>
