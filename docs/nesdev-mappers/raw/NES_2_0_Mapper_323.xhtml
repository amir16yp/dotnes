<div class="mw-parser-output"><p>NES 2.0 Mapper 323 is used for Farid's homebrew 8-in-1 SLROM multicart board. It consists of an MMC1 (clone) with WRAM replaced by an outer bank register. Its UNIF board name is <b>FARID_SLROM_8-IN-1</b> (note underscores).
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  .OOO L...
   ||| +---- 1=Disable decoder (lock Outer Bank)
   +++------ Select 128 KiB outer PRG-ROM and CHR-ROM bank
</pre>
<p>WRAM must be enabled in the MMC1's registers for writes to be effective.
</p><p>This register is cleared on both warm and cold boot.
</p>
<h2><span id="MMC1_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC1_registers_($8000-$FFFF)">MMC1 registers ($8000-$FFFF)</span></h2>
<p>See <a href="MMC1.xhtml" class="mw-redirect" title="INES Mapper 001">INES Mapper 001</a>.
</p>
