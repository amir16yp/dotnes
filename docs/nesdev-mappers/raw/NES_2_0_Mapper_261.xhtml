<div class="mw-parser-output"><p><b>NES 2.0 Mapper 261</b> was assigned by FCEUX for the <b>810544-C-A1</b> and <b>NTDEC 2746</b> multicart circuit boards. Its UNIF board name is <b>BMC-810544-C-A1</b>.
</p>
<ul><li><i>200-in-1 - Elfland</i></li>
<li><i>14-in-1</i> (NTDEC)</li></ul>
<h1><span class="mw-headline" id="Address_latch">Address latch</span></h1>
<pre>A~1... ..PP PmpM CCCC
         || |||| ++++- Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF
         || |||+------ Select nametable mirroring type
         || |||         0: Vertical
         || |||         1: Horizontal
         || ||+------- Lowest bit of 16 KiB PRG-ROM bank number
         || ||         at CPU $8000-$BFFF/$C000-$FFF in NROM-128 mode
         || |+-------- PRG-ROM banking mode
         || |           0: NROM-128 (16 KiB PRG-ROM at $8000-$BFFF, mirrored)
         || |           1: NROM-256 (32 KiB PRG-ROM at $8000-$FFFF)
         ++-+--------- Select 32 KiB PRG-ROM bank in NROM-256 mode/
                       bits 1-3 of 16 KiB PRG-ROM bank in NROM-128 mode
</pre>
<p>The first game on that multicart, <i>Elfland</i>, is actually a CNROM game that writes to the multicart address latch to switch CHR-ROM banks.
</p>
