</head><body><h1>INES Mapper 020</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_020">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_020">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p>Mapper 20 is defined as reserved for the Famicom Disk System (<a href="Family_Computer_Disk_System.xhtml" class="mw-redirect" title="FDS">FDS</a>) in official <a href="INES.xhtml" title="INES">iNES</a> specs.
The mapper number is mostly intended for being internally used by emulators (to indicate to themselves that they are emulating the FDS hardware).
</p><p>Actual FDS game disk images normally use the <a href="FDS_disk_format.xhtml" title="FDS disk format">FDS disk format</a>.
</p><p>The mapper number could be theoretically used for the FDS BIOS ROM-image, but this isn't done in practice. The FDS BIOS is typically stored as <a href="NROM.xhtml" title="NROM">NROM</a> if it is dumped in <a href="INES.xhtml" title="INES">iNES</a> format, or it's stored as raw BIOS dump (without iNES header and thus without mapper number).
</p>
