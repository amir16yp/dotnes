<div class="mw-parser-output"><p>This mapper was allocated for a naïve misdumping of the <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/1547">JF-10</a> board that contains <i>Urusei Yatsura - Lum no Wedding Bell</i>, which assumed the bank bits were reversed. Otherwise, it is entirely identical to <a href="INES_Mapper_087.xhtml" title="INES Mapper 087">J87</a>.
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_Select_.28.246000-.247FFF.29"/><span class="mw-headline" id="Bank_Select_($6000-$7FFF)">Bank Select ($6000-$7FFF)</span></h3>
<p>This will select an 8 KB CHR ROM bank for PPU $0000-$1FFF.
</p>
<pre>7  bit  0
---- ----
CCCC CCHL
|||| ||||
|||| |||+- (Normal) Low CHR bit
|||| ||+-- (Normal) High CHR bit
++++-++--- (Oversize only) Extra CHR bits
</pre>
<p><br/>
This is the same as J87 but with the bits in order, and so has a better defined <a href="Oversize.xhtml" title="Oversize">oversize</a> extension; or the same as <a href="CNROM.xhtml" title="CNROM">CNROM</a> without bus conflicts.
</p>
