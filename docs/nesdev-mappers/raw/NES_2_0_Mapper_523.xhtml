<div class="mw-parser-output"><p>NES 2.0 Mapper 523 is used for the 晶科泰 (Jncota) re-release of the game 封神榜: 伏魔三太子 (Fēngshénbǎng: Fúmó Sān Tàizǐ), originally released by C&amp;E on <a href="INES_Mapper_246.xhtml" title="INES Mapper 246">INES Mapper 246</a>. It is basically identical to the <a href="INES_Mapper_176.xhtml" title="INES Mapper 176">Waixing FS005</a> board, except that ...
</p>
<ul><li>Mirroring is hard-wired (to Horizontal in Fēngshénbǎng's case),</li>
<li>CHR-ROM A10 is directly connected to PPU A10,</li>
<li>CHR-ROM A11-A18 are connected to the MMC3 clone's CHR A10-A17 outputs,</li>
<li>the MMC3 clone's PPU A10 input is connected to Ground.</li></ul>
<p>With the MMC3 clone set to <a href="INES_Mapper_176.xhtml#MMC3-compatible_registers_(%248000/%248001,_%24A000,_%24C000/%24C001,_%24E000/%24E001)" title="INES Mapper 176">Extended MMC3 Mode</a>, the bank registers at $8000 therefore change from their normal to the following meanings:
</p>
<pre>$0: Select 2 KiB CHR bank at PPU $0000-$07FF (or $1000-$17FF)
$1: Select 2 KiB CHR bank at PPU $0800-$0FFF (or $1800-$1FFF)
$2: Select 2 KiB CHR bank at PPU $1000-$17FF (or $0000-$07FF)
$3: No function
$4: Select 2 KiB CHR bank at PPU $1800-$1FFF (or $0800-$0FFF)
$5: No function
$6: Select 8 KiB PRG ROM bank at $8000-$9FFF (or $C000-$DFFF)
$7: Select 8 KiB PRG ROM bank at $A000-$BFFF
$8: Select 8 KiB PRG ROM bank at $C000-$DFFF (or $8000-$9FFF)
$9: Select 8 KiB PRG ROM bank at $E000-$FFFF
$A: No function
$B: No function
</pre>
