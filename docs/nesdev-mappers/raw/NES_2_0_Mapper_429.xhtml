<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: 512 KB (or 1024 KB, FCFC1 DIY)</li>
<li>PRG ROM bank size: 32 KB</li>
<li>PRG RAM: None</li>
<li>CHR capacity: 32 KB RAM, optional battery-backup or FeRAM</li>
<li>CHR bank size: 8 KB</li>
<li>Nametable <a href="Mirroring.xhtml" title="Mirroring">mirroring</a>: vertical or horizontal selected by switch, or fixed (or Single-screen, FCFC1 DIY)</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: No</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Bank_select_($8000-$FFFF)">Bank select ($8000-$FFFF)</span></h3>
<h4><span class="mw-headline" id="Regular">Regular</span></h4>
<pre>7  bit  0
---- ----
xpPP PPCC
 ||| ||||
 ||| ||++- Select 8 KB CHR RAM bank for PPU $0000-$1FFF, initial bank 0
 +++-++--- Select 32 KB PRG ROM bank for CPU $8000-$FFFF, initial bank 1
</pre>
<h4><span id="Submapper_.231"/><span class="mw-headline" id="Submapper_#1">Submapper #1</span></h4>
<pre>7  bit  0
---- ----
MpPP PPCC
|||| ||||
|||| ||++- Select 8 KB CHR RAM bank for PPU $0000-$1FFF, initial bank 0
|+++-++--- Select 32 KB PRG ROM bank for CPU $8000-$FFFF, initial bank 1
+--------- Same as <a href="AxROM.xhtml" title="AxROM">AxROM</a>
</pre>
<h2><span class="mw-headline" id="FCFC1_Details">FCFC1 Details</span></h2>
<ul><li>The A mode of FCFC1 has compatibility with <a href="CNROM.xhtml" title="CNROM">CNROM</a>/<a href="GxROM.xhtml" title="GxROM">GxROM</a>, but the compatibility is fragile, some games will switch back to the page where the firmware is located, causing problems such as crashes.</li></ul>
<ul><li>The B mode of FCFC1 is a <a href="BNROM.xhtml" title="BNROM">BNROM</a>/<a href="AxROM.xhtml" title="AxROM">AxROM</a> with initial bank 4 and no <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflict</a>, and has compatibility with <a href="NROM.xhtml" title="NROM">NROM</a>/<a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a>.</li></ul>
<ul><li>To simplify the circuit implementation, the actual location of the page in ROM is shuffled.</li></ul>
<ul><li>It is recommended to save the preserved data to a page other than 0 of CHR RAM, as this avoids being overwritten by the kazzo programming process, and it can also make the bank selection play a role similar to the WRAM lock bit.</li></ul>
<ul><li>Some FCFC1 sold as game carriers do not have switches, or the switches do not have the W position. These FCFC1 are not compatible with kazzo.</li></ul>
