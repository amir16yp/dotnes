<div class="mw-parser-output"><p>NES 2.0 Mapper 282 is used by at least three J.Y. multicarts:
</p>
<ul><li><i>1997 Super HIK 18-in-1 (JY-101)</i></li>
<li><i>1997 Super HIK 21-in-1 (JY-105)</i></li>
<li><i>1998 Super HIK 5-in-1 (JY-114)</i></li>
<li><i>Super 25-in-1 Final Fight (SC-128)</i></li></ul>
<p>Each of them have 1 MiB each of PRG-ROM and CHR-ROM. They use the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>. Register $D003 controls 256 KiB outer banks.
</p>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<pre>Mask: $F003

7654 3210
---- ----
..LM CPPc
  || |||+- Select 256 KiB outer CHR-ROM bank (CHR A18), ignored if L=1
  || |++-- Select 256/512 KiB outer PRG-ROM bank
  || +---- If bit 4==1: Select 512 KiB outer CHR-ROM bank
  |+------ 0: Ignore bit 3
  |        1: Obey bit 3
  +------- Select outer CHR-ROM bank size
            0: Mask $900x/$A00x to 256 KiB, use c
            1: Mask $900x/$A00x to 512 KiB, ignore c
</pre>
<p>PRG ($8000-$8FFF) and CHR ($9000-$AFFF) bank select register bits that select 256 KiB banks (L=0)/512 KiB banks (L=1) are masked off. 
</p><p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
<h1><span class="mw-headline" id="Trivia">Trivia</span></h1>
<p>Some of the multicarts show different version of menu according to what $5000 is returned from the mapper (the value that is read is masked with $C0, so only bits 7 &amp; 6 matters.):
</p>
<pre>1997 Super HIK 18-in-1 (JY-101)
 $00   -&gt; 18 in 1
 $40   -&gt; 900 in 1
 $80   -&gt; 1600 in 1
 $C0   -&gt; 6000000 in 1
</pre>
<pre>1997 Super HIK 21-in-1 (JY-105)
 $00   -&gt; 21 in 1
 $40   -&gt; 350 in 1
 $80   -&gt; 1200 in 1
 $C0   -&gt; 7000000 in 1
</pre>
