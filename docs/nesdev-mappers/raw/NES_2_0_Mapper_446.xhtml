<div class="mw-parser-output"><p><b>NES 2.0 Mapper 446</b> denotes Mindkids' <b>SMD172B_FPGA</b> circuit board. It is used for some large multicarts from <i>Pixel Games</i> as well as for homebrew games such as:
</p>
<ul><li><i>Jay and Silent Bob Mall Brawl</i></li>
<li><i>Blazing Rangers</i>/<i>炎のRangerman</i></li></ul>

<h1><span class="mw-headline" id="Supervisor_Registers">Supervisor Registers</span></h1>
<h2><span id="Mapper_Selection_.28.245000.2C_write.29"/><span class="mw-headline" id="Mapper_Selection_($5000,_write)">Mapper Selection ($5000, write)</span></h2>
<pre>D~[L..M MMMM]
   |  +-++++-- Mapper for the FPGA to emulate
   +---------- 1=Lock supervisor registers until reset
</pre>

<h2><span id="Outer_8_KiB_PRG-ROM_Bank_LSB_.28.245001.2C_write.29"/><span class="mw-headline" id="Outer_8_KiB_PRG-ROM_Bank_LSB_($5001,_write)">Outer 8 KiB PRG-ROM Bank LSB ($5001, write)</span></h2>
<pre>D~[BBBB BBBB]
   ++++-++++- PRG A20..A13
</pre>
<h2><span id="Outer_8_KiB_PRG-ROM_Bank_MSB_.28.245002.2C_write.29"/><span class="mw-headline" id="Outer_8_KiB_PRG-ROM_Bank_MSB_($5002,_write)">Outer 8 KiB PRG-ROM Bank MSB ($5002, write)</span></h2>
<pre>D~[BBBB BBBB]
   ++++-++++- PRG A28..A21
</pre>
<h2><span id="Inner_8_KiB_PRG-ROM_Bank_Mask_.28.245003.2C_write.29"/><span class="mw-headline" id="Inner_8_KiB_PRG-ROM_Bank_Mask_($5003,_write)">Inner 8 KiB PRG-ROM Bank Mask ($5003, write)</span></h2>
<pre>D~[MMMM MMMM]
   ++++-++++- PRG A20..A13 mask
</pre>
<p>The register has an inverted meaning in Submapper 2 vs. Submappers 0-1. In Submappers 0-1, an &quot;1&quot; bit means that the Outer Bank bit is used. In Submapper 2, an &quot;1&quot; bit means that the Inner Bank bit is used.
</p>
<h2><span id="Flags_.28.245004.2C_write.29"/><span class="mw-headline" id="Flags_($5004,_write)">Flags ($5004, write)</span></h2>
<pre>D~[..CC ...M]
     ||    +- Mirroring (V=1)
     ++------ Inner CHR-RAM address mask
              0x: 256 KiB
              10: 128 KiB
              11: 32 KiB
</pre>
<p>The mirroring bit has no effect when selecting an FPGA mapper with software-selectable mirroring.
</p>
<h2><span id="CHR_RAM_protect_.28.245005.2C_write.29"/><span class="mw-headline" id="CHR_RAM_protect_($5005,_write)">CHR RAM protect ($5005, write)</span></h2>
<pre>D~[.... .P..]
         +- 1: Write-protect CHR-RAM
</pre>
<h2><span id="Outer_8_KiB_CHR-RAM_Bank_.28.245006.2C_write.29"/><span class="mw-headline" id="Outer_8_KiB_CHR-RAM_Bank_($5006,_write)">Outer 8 KiB CHR-RAM Bank ($5006, write)</span></h2>
<pre>D~[...B BBBB]
      +-++++- CHR A17..A13
</pre>
