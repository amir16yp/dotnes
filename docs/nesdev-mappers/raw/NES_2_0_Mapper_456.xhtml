<div class="mw-parser-output"><p><b>NES 2.0 Mapper 456</b> denotes the <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based Realtec <b>K6C3001A</b> multicart PCB, used for the <i>(ST-401) Super 4-in-1</i> multicart. It is basically an oversized version of <a href="INES_Mapper_047.xhtml" title="INES Mapper 047">INES Mapper 047</a> with the outer bank register moved from $6000 to $4100.
</p>
<h2><span id="Extra_Register_.28.244100.2C_write.29"/><span class="mw-headline" id="Extra_Register_($4100,_write)">Extra Register ($4100, write)</span></h2>
<pre>Mask: $E100

D~[.... ..BB]
          ++- PRG/CHR A18..A17
Value on reset: $00
</pre>
