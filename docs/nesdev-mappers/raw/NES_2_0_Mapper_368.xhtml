<p>NES 2.0 Mapper 368 denotes the Yung-08 cartridge conversion PCB of the disk system game <i>Super Mario Bros. 2 (Japan)</i>. It is the &quot;parent&quot; of the <a href="INES_Mapper_050.xhtml" title="INES Mapper 050">N-32</a> and <a href="NES_2_0_Mapper_357.xhtml" title="NES 2.0 Mapper 357">Mr. Mary 2</a> conversions, as both retain (jumped-over) <a href="#Latch_read_.28.244122.2C_read.29">protection-reading code</a> from this version.
</p><p>There are two 32 KiB PRG-ROM chips, one 2 KiB PRG-ROM, and one 8 KiB CHR-ROM chip. The ROM image's 128 KiB PRG-ROM part is arranged as follows:
</p>
<ol><li>Offset $00000: First PRG-ROM chip (32 KiB)</li>
<li>Offset $08000: Second PRG-ROM chip (32 KiB)</li>
<li>Offset $10000: Third PRG-ROM chip, repeated 32 times (64 KiB)</li></ol>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB PRG-ROM bank, fixed to #2</li>
<li>CPU $8000-$9FFF: 8 KiB PRG-ROM bank, fixed to #1</li>
<li>CPU $A000-$BFFF: 8 KiB PRG-ROM bank, fixed to #0</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-ROM bank, switchable</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank, fixed to #8 (2 KiB PRG-ROM repeated four times)</li>
<li>PPU $0000-$1FFF: unbanked 8 KiB CHR-ROM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_Bank_Select_.28.244022.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Select_($4022,_write)">PRG Bank Select ($4022, write)</span></h2>
<pre>Mask: $F1FF

Bit 7654 3210
    ---------
    .... .CCC
          +++- Select 8 KiB PRG-ROM bank at CPU $C000-$DFFF
</pre>
<p>The actual bank number is:
</p>
<pre>Value  Bank#
------------
0      4
1      3
2      5
3      3
4      6
5      3
6      7
7      3
</pre>
<h2><span id="Latch_write.2FIRQ_Control_.28.244122.2C_write.29"/><span class="mw-headline" id="Latch_write/IRQ_Control_($4122,_write)">Latch write/IRQ Control ($4122, write)</span></h2>
<pre>Mask: $F1FF

D~7654 3210
  ---------
  ..LL .L.I
    ||  | +- 0: Acknowledge and disable IRQ, reset counter
    ||  | |  1: Enable IRQ
    ++--+-+- Bits to be read-back
</pre>
<p>When enabled, the 12-bit IRQ counter increases on every M2 cycle until it overflows, upon which an IRQ is fired.
</p>
<h2><span id="Latch_read_.28.244122.2C_read.29"/><span class="mw-headline" id="Latch_read_($4122,_read)">Latch read ($4122, read)</span></h2>
<pre>Mask: $F1FF

D~7654 3210
  ---------
  10LL 1L1L
    ++--+-+- Latched bits
</pre>
<p>When holding the A button while pressing START to begin in World A-1, the game checks the latch's functionality and returns to the title screen if the check fails.
</p>
