<div class="mw-parser-output"><p><b>NES 2.0 Mapper 321</b> denotes the <b>820310</b> <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based multicart circuit board, <a href="UNIF.xhtml" title="UNIF">UNIF</a> MAPR <b>BMC-820310-C</b>. It is basically <a href="NES_2_0_Mapper_287.xhtml" title="NES 2.0 Mapper 287">NES 2.0 Mapper 287</a> looking at differently-ordered address bits.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>A~[011. .... ..PP MB..], A001.7=1, A001.6=0
               || |+---- PRG/CHR A17
               || +----- 0=PRG A16..A13 from MMC3
               ||        1=PRG A16..A15 from PP,
               ||          PRG A14..A13=CPU A14..A13
               ||          (NROM-256-like PRG banking)
               ++------- PRG A16..A15 is M=1
</pre>
