<div class="mw-parser-output"><p><b>NES 2.0 Mapper 437</b> denotes the NTDEC <b>TH2348</b> multicart circuit board for eight <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> games with an additional outer bank register.
</p>
<h2><span id="Outer_Bank_register_.28.245000-.245FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_($5000-$5FFF,_write)">Outer Bank register ($5000-$5FFF, write)</span></h2>
<pre>A~[0101 .... .... MOOO]
                  |+++- PRG A19..A17
                  +---- Nametable mirroring
                        0: CIRAM A10=PPU A10 (vertical)
                        1: CIRAM A10=PPU A11 (horizontal)
</pre>
