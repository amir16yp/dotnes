<div class="mw-parser-output"><p>NES 2.0 Mapper 527 is used for a bootleg version of Taito's 不動明王伝 (Fudō Myōō Den). Its UNIF board name is <b>UNL-AX-40G</b>. The original <a href="INES_Mapper_207.xhtml" title="INES Mapper 207">INES Mapper 207</a> is replaced with a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC2">VRC2</a> clone (A0/A1, i.e. VRC2b) while retaining Mapper 207's extended mirroring. Accordingly, CHR A17 is connected to CIRAM A10.
</p>
