<div class="mw-parser-output"><p>NES 2.0 Mapper 361 is used for an early MMC3-based multicart PCB (YY841101C) from J.Y. Company, preceding the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>:
</p>
<ul><li><i>1994 Ball 4-in-1 Series (JY-009)</i></li>
<li><i>1996 Super HiK 4-in-1 (JY-018)</i></li>
<li><i>1995 Super HiK 4-in-1 (JY-019)</i></li>
<li><i>Game 4-in-1 (OK-411)</i></li></ul>

<h2><span id="Outer_Bank_Register_.28.247000.29"/><span class="mw-headline" id="Outer_Bank_Register_($7000)">Outer Bank Register ($7000)</span></h2>
<pre>Mask: unknown

D~7654 3210
  ---------
  OOOO ....
  ++++------ Select outer 128 KiB PRG-ROM and CHR-ROM bank
</pre>
<p>This register is accessible regardless of whether WRAM is enabled in the MMC3 clone's A001 register.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
<h2><span class="mw-headline" id="Note">Note</span></h2>
<p><a rel="nofollow" class="external text" href="https://github.com/TASVideos/fceux/blob/master/src/boards/mmc3.cpp">FCEUX emulates this PCB under mapper number 205</a> as &quot;OK-411&quot; together with the GN-45 PCB, both of which are in turn different from the <a href="INES_Mapper_205.xhtml" title="INES Mapper 205">iNES Mapper 205</a> described in that mapper's wiki article.
</p>
<h2><span class="mw-headline" id="See_also">See also</span></h2>
<p><a href="NES_2_0_Mapper_364.xhtml" title="NES 2.0 Mapper 364">NES 2.0 Mapper 364</a> describes a slightly more complex variant supporting a selectable outer bank size.
</p>
