<div class="mw-parser-output"><p><b>NES 2.0 Mapper 393</b> denotes the <b>820720C</b> multicart PCB.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF,_write)">MMC3-compatible registers ($8000-$FFFF, write)</span></h2>
<p>These registers function identically to a normal <a href="MMC3.xhtml" title="MMC3">MMC3</a>, except in UNROM/BNROM mode.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000
 
A~FEDC BA98 7654 3210
  --------- ---------
  011. .... ..MM CPPP
              || |+++- PRG A19..A17
              || +---- CHR Mode
              ||        0: CHR-ROM with MMC3 banking
              ||        1: 8 KiB unbanked CHR-RAM
              ++------ PRG Mode
                        0: MMC3 (PRG A13-A16)
                        1: same as 0
                        2: BNROM (PRG A15-A16 from MMC3 R6,
                           PRG A13-A14=CPU A13-A14)
                        3: UNROM (PRG A14-A16 from $8000-$FFFF latch,
                           PRG A13=CPU A13) 
</pre>
<p>Selected by the MMC3's PRG-RAM /CE, WRAM must be enabled and writable in the MMC3's A001 register for Outer Bank Register writes to be recognized.
</p>
