<div class="mw-parser-output"><p>NES 2.0 Mapper 530 is used for <i>Super Mario Bros. Pocker Mali</i> (sic), a bootleg version of Bandai's <i>Crayon Shin-chan: Ora to Poi Poi</i>. It's a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone (A0/A1, VRC4f) with the PRG and CHR address lines scrambled: PRG A14 is swapped with PRG A16, and CHR A15 is swapped with CHR A16. Its UNIF board name is <b>UNL-AX5705</b>.
</p>
