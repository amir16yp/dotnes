From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_168">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_168">other pages</a>

<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 168</a> represents the board used for Racermate Challenge 2. It could be thought of as a hybrid of <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> and <a href="CPROM.xhtml" title="CPROM">CPROM</a>.
</p><p>Note that some Chinese ROM websites have both the <a href="NES_2_0_Mapper_514.xhtml" title="NES 2.0 Mapper 514">NES 2.0 Mapper 514</a> and the <a href="NES_2_0_Mapper_518.xhtml" title="NES 2.0 Mapper 518">NES 2.0 Mapper 518</a> Subor games set to Mapper 168, although no known emulator (Chinese or other) emulates them at that number.
</p><p>The software is more-or-less useless without also emulating its <a href="https://www.nesdev.org/w/index.php?title=RacerMate_Bicycle&amp;action=edit&amp;redlink=1" class="new" title="RacerMate Bicycle (page does not exist)">exercise bike</a>.
</p>

<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: 64 KiB</li>
<li>PRG ROM bank size: 16 KiB</li>
<li>PRG RAM: No</li>
<li>CHR capacity: 64 KiB RAM, half (or all) battery-backed.</li>
<li>CHR bank size: 4 KiB</li>
<li>Nametable mirroring: Hardwired vertical mirroring</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: no</li></ul>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$0FFF: 4 KiB CHR RAM bank, fixed to the first bank, but see notes in Hardware.</li>
<li>PPU $1000-$1FFF: 4 KiB switchable CHR RAM bank</li></ul>
<h2><span class="mw-headline" id="Jumpers">Jumpers</span></h2>
<p>All boards contain 32KB SRAM chips at U1 and U2.  SRAM U2, holding CHR RAM banks 8-15, is always protected and battery-backed.  Whether SRAM U1, holding CHR RAM banks 0-7, is battery backed is determined by the following jumpers on the board :
</p>
<ul><li>J1: force deselect SRAM U1 when +5V fails</li>
<li>J2: allow SRAM U1 to remain selected after +5V fails</li>
<li>J3: Power SRAM U1 from +5V line</li>
<li>J4: Power SRAM U1 from battery-backed supply</li></ul>
<p>J1+J4 vs J2+J3 should be selected as a pair. 
</p><p>To the best of our knowledge (5 samples), all delivered boards had J2+J3 hardwired, so the default factory configuration for RacerMate is that only U2 SRAM is battery backed.
</p><p>J2+J3 can be disconnected and J1+J4 can be connected.  This modification allows 64kB of battery-backed memory as U1 SRAM and U2 SRAM will be battery backed with the J1+J4 jumper combination.  
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_Select_.28.248000-.24BFFF.29"/><span class="mw-headline" id="Bank_Select_($8000-$BFFF)">Bank Select ($8000-$BFFF)</span></h3>
<pre>7  bit  0
---- ----
PPxx CCCC
||   ||||
||   ++++- Select 4 KB CHR RAM bank for PPU $1000-$1FFF
++-------- Select 16 KB PRG ROM bank for CPU $8000-$BFFF
</pre>
<h3><span id="RAM_Protection_and_IRQ_acknowledge_.28.24C000-.24FFFF.29"/><span class="mw-headline" id="RAM_Protection_and_IRQ_acknowledge_($C000-$FFFF)">RAM Protection and IRQ acknowledge ($C000-$FFFF)</span></h3>
<pre>15   11 address   0  7 data  0
---- ---- ---- ----  ---- ----
11.. .... Y... ....  XXXX XZXX
          |          |||| ||||
          +----------++++-++++- See below
</pre>
<p>Only one of the 9 above bits is used, but the software has no <i>a priori</i> reason to know which. The firmware thus writes $FF to $F080 and $00 to $F000.
The PCBs were originally laid out to use the bit above marked &quot;Y&quot; (A7).
To the best of our knowledge (5 samples), all delivered boards were reworked to instead use the bit labeled &quot;Z&quot; (D2)
</p><p>When this bit is high, the IRQ is acknowledged and the IRQ counter is frozen at 0. When this bit is low, the IRQ counter counts up every M2 cycle.
</p><p>When this bit changes from 1 to 0, the RAM protection bit is cleared. While RAM is protected, battery-backed CHR RAMs can neither be read nor written (reads will return open bus, writes will be ignored). Non-battery-backed CHR RAMs can always be read and written.
</p><p>This IRQ disable bit is cleared and the RAM protection bit is set when power is removed from the cartridge.
</p><p>The 2A03's IRQ line is asserted while the counter's 1024s bit is set.
</p>
<h2><span class="mw-headline" id="Interrupt">Interrupt</span></h2>
<p>The interrupt is implemented with a large binary counter which drives the /IRQ line low after 1024 M2 cycles. Because the counter continues counting, it will automatically acknowledge itself after another 1024 M2 cycles (for a net frequency of no lower than 874 Hz). In practice, nocash says that the software requires at least 27 IRQs per vblank (for a spacing of not more than 1104 M2 cycles), and the software reliably clears the counter within 30 cycles.
</p><p>A board could have the resistor placed in the adjacent position, which would choose a delay of 2048 M2 cycles instead, but to the best of our knowledge (5 samples), none were.
</p>
<h2><span class="mw-headline" id="Hardware">Hardware</span></h2>
<p>This cartridge uses two <a href="7400.xhtml" title="7400">74LS00s</a>, two <a href="7432.xhtml" title="7432">74HCT32s</a>, a 74HCT74, a 74LS174, a 74HCT4040, and a PNP transistor as a low-voltage detection circuit. <sup id="cite_ref-1" class="reference"><a href="#cite_note-1">[1]</a></sup>
</p><p>Unlike <a href="CPROM.xhtml" title="CPROM">CPROM</a> or <a href="INES_Mapper_180.xhtml" title="INES Mapper 180">iNES Mapper 180</a>, which use AND logic to fix the first bank to 0 and switch the upper bank, the CHR-RAM here instead uses NAND logic, where the CHR banks are the 2's complement of those specified above. Because nothing else can read or write the RAMs except through this interface, the only question is whether the fixed bank is normally battery backed. It is NOT. The difference between NAND and AND logic is invisible to the software, and so emulators could use either convention if exchange of save files between emulators is not anticipated.
</p><p>It is of casual interest, but also completely irrelevant, that the lower bits of the CHR bank register are out of order: 3012. Once again, because nothing else can read or write the RAMs except through this bank register, this only could matter if one were to desolder the RAMs to read them.
</p><p>There is a space on the PCB to accept a donor <a href="CIC_lockout_chip.xhtml" class="mw-redirect" title="CIC">CIC</a>, labelled U11. In editions released before the top-loading NES-101, this space was populated with a Tengen CIC.
</p>
