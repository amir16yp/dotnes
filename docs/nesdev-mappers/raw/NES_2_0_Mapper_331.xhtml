<div class="mw-parser-output"><p>NES 2.0 mapper 331 is used for the <i>7-in-1 (NS03)</i> multicart. Its UNIF board name is <b>BMC-12-IN-1</b>.
</p>
<h2><span id="Inner_Bank_Register_A_.28.24A000-.24BFFF.29"/><span class="mw-headline" id="Inner_Bank_Register_A_($A000-$BFFF)">Inner Bank Register A ($A000-$BFFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  CCCC CPPP
  |||| |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF and CPU $C000-$FFFF
  |||| |     active when the PPU is rendering from $0000-$0FFF, subject to A14-A16 modification
  ++++-+---- Select 4 KiB inner CHR-ROM bank at PPU $0000-$0FFF
</pre>
<h2><span id="Inner_Bank_Register_B_.28.24C000-.24DFFF.29"/><span class="mw-headline" id="Inner_Bank_Register_B_($C000-$DFFF)">Inner Bank Register B ($C000-$DFFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  CCCC CPPP
  |||| |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF and CPU $C000-$FFFF
  |||| |     active when the PPU is rendering from $1000-$1FFF, subject to A14-A16 modification
  ++++-+---- Select 4 KiB inner CHR-ROM bank at PPU $1000-$1FFF
</pre>
<h2><span id="Outer_Bank_and_Mode_Register_.28.24E000-.24FFFF.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($E000-$FFFF)">Outer Bank and Mode Register ($E000-$FFFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  .... PMOO
       ||++- Select 128 KiB outer PRG-ROM and CHR-ROM bank
       |+--- Select nametable mirroring type
       |      0: Vertical
       |      1: Horizontal
       +---- Select PRG A14-A16 mode
              0: Force PRG A14-A16 to 111b if CPU A14=1 (UNROM-like)
              1: PRG A14=CPU A14 (NROM-256)
              
</pre>
<p>It's probably a good idea to initialize the PPP bits of both inner bank registers to the same value to prevent the PRG-ROM bank at $8000-$BFFF from changing back and forth as the PPU is rendering.
</p>
