<p><b>NES 2.0 Mapper 444</b> denotes the <b>NC7000M</b> multicart circuit board. Its UNIF board name is <b>BMC-BS-110</b>, which is the name of a different PCB whose name was mixed-up.
</p><p>The top-right solder pads are relevant for bankswitching and are denoted by Submapper bits. A clear bit represents the <i>upper</i> pad connection:
</p>
<ul><li>Submapper bit 0 (top-rightmost pad): CHR-ROM A17 connected to $6000.0 (clear) or to the MMC3 CHR A17 output (set). Selects whether the MMC3 can address 128 or 256 KiB of CHR data.</li>
<li>Submapper bit 1 (the top-second-rightmost pad): CHR-ROM A18 connected to $6000.1 (clear) or to $6000.4 (set). Since PRG A18 is also determined by $6000.1, it thus selects whether CHR A18 can be determined separately or not.</li></ul>
<p>Known cartridges:
</p>
<ul><li><i>7000-in-1</i> (CA-004): both bits set (submapper 3)</li>
<li><i>Super 8000-in-1</i>: both bits clear (submapper 0)</li></ul>
<p>With both pads in the position represented by submapper 0, NC7000M's definition has a subset in the <a rel="nofollow" class="external text" href="https://forums.nesdev.org/viewtopic.php?p=277283"><b>K-3043</b> PCB</a>.
</p>
<h2><span id="Outer_Bank_and_Mode_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($6000-$7FFF,_write)">Outer Bank and Mode Register ($6000-$7FFF, write)</span></h2>
<pre>A~[011. .... ...C MMBA]
                | ||++- PRG A18..17
                | |||+- CHR A17 if submapper bit 0 clear
                | ||+-- CHR A18 if submapper bit 1 clear
                | ++--- Select PRG-ROM mode
                |        0: MMC3 mode
                |        1: NROM-256 mode (PRG A13..14=CPU A13..14, PRG A15..16=MMC3 A15..16)
                |        2: Read solder pads' value in D0/D1 (leftmost pads in picture)
                |        3: NROM-128 mode (PRG A13=CPU A13, PRG A14..16=MMC3 A14..16)
                +------ CHR A18 if submapper bit 1 set
</pre>
<ul><li>WRAM must be enabled in $A001.7 before writing to this register.</li>
<li>The inner PRG bank is restricted to 128 KiB.</li>
<li>NROM mode forces MMC3's CPU A13 and A14 inputs to GND to make MMC3 bank register 6 apply to the entire CPU $8000-$FFFF range.</li></ul>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>Mask: $E001
</p><p>See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
