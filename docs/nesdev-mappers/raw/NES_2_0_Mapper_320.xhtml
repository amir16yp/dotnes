<div class="mw-parser-output"><p>NES 2.0 Mapper 320 is used for the <i>Super HiK 6-in-1 A-030</i> multicart. Basically <a href="UxROM.xhtml" title="UxROM">UxROM</a> with an address-latch-based outer bank register, its UNIF board name is <b>BMC-830425C-4391T</b>. Mirroring is hard-wired.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable inner and outer PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB fixed inner and switchable outer PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h2><span id="Outer_Bank_Register_.28.24F0E0-.24F0FF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($F0E0-$F0FF,_write)">Outer Bank Register ($F0E0-$F0FF, write)</span></h2>
<pre>Mask: $FFE0

A~FEDC BA98 7654 3210
  -------------------
  1111 0000 111M BBBB
               | ++++- Select 128 KiB Outer Bank at CPU $8000-$FFFF
               +------ Select Outer Bank Size
                        0: 256 KiB (UOROM), fixed inner bank #15 at CPU $C000-$FFFF
                        1: 128 KiB (UNROM), fixed inner bank #7 at CPU $C000-$FFFF
</pre>
<h2><span id="Inner_Bank_Register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Inner_Bank_Register_($8000-$FFFF,_write)">Inner Bank Register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  .... pPPP
       |+++- Select 16 KiB Inner PRG-ROM bank at CPU $8000-$BFFF
       +---- Select 128 KiB Inner PRG-ROM bank at CPU $8000-$BFFF if Outer Bank bit 4=0
</pre>
