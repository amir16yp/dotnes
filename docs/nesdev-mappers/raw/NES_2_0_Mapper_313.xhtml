<div class="mw-parser-output"><p><b>NES 2.0 Mapper 313</b> denotes reset-based multicarts around the <a href="MMC3.xhtml" title="MMC3">MMC3</a> ASIC. Its UNIF board name is <b>BMC-RESET-TXROM</b>. When an interruption of the M2 signal is detected, the higher address lines are automatically incremented. The Submapper field denotes the sizes of the individual games between which the switching occurs:
</p>
<ul><li><b>Submapper 0</b>: 128 KiB PRG, 128 KiB CHR
<ul><li><i>1995 Super HiK 4-in-1 - 新系列熱血專輯組合卡 (JY-008)</i></li>
<li><i>1997 Super HiK 4-in-1 - 新系列獅子王組合卡 (JY-047)</i></li>
<li><i>1997 Super HiK 4-in-1 - 新系列米奇老鼠Ⅲ组合卡 (JY-024)</i></li>
<li><i>4-in-1 (CK-015)</i></li>
<li><i>Mario Series 4-in-1 (JY-013)</i></li>
<li><i>Sheng Tian Gao K 4-in-1 Huang Jin Zu He</i></li></ul></li>
<li><b>Submapper 1</b>: 256 KiB PRG, 128 KiB CHR
<ul><li><i>1995 Super HiK 4-in-1 (JY-044)</i></li></ul></li>
<li><b>Submapper 2</b>: 128 KiB PRG, 256 KiB CHR
<ul><li><i>1995 Super HiK 4-in-1 - 新系列蝙蝠俠Ⅲ组合强卡 (JY-040)</i></li></ul></li>
<li><b>Submapper 3</b>: 256 KiB PRG, 256 KiB CHR</li>
<li><b>Submapper 4</b>: 256 KiB PRG on first game, 128 KiB PRG on all others, 128 KiB CHR
<ul><li><i>4-in-1 (A01-1)</i></li></ul></li></ul>
