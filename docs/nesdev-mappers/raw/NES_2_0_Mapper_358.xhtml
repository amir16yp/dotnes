<div class="mw-parser-output"><p>NES 2.0 Mapper 358 denotes a variation of <a href="NES_2_0_Mapper_282.xhtml" title="NES 2.0 Mapper 282">NES 2.0 Mapper 282</a> with partially overlapping PRG/CHR outer banks:
</p>
<ul><li><i>1997 Super Game 7-in-1 (JY-016)</i> (PCB YY860606C, 512 kiB PRG-ROM)</li>
<li><i>1998 Super HiK 5-in-1 (JY-113)</i> (PCB YY860606C, 512 kiB PRG-ROM)</li>
<li><i>1998 Super HiK 6-in-1 (JY-117)</i> (unmarked PCB, 1024 KiB PRG-ROM)</li></ul>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<pre>Mask: $F803

7654 3210
---- ----
..M. .ppC
  |   ||+-- CHR-ROM A18 if M=0, ignored if M=1
  |   ++--- PRG-ROM A18-A19
  |   +---- CHR-ROM A19
  +-------- Outer CHR bank size and selection
             0: Mask to 256 KiB, use C
             1: Mask to 512 KiB, ignore C
</pre>
<p>PRG ($8000-$8FFF) bank select register bits that select 256 KiB banks are masked off. Dumping the CHR-ROM does not work reliably in 1 KiB CHR-ROM banking mode.
</p><p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
