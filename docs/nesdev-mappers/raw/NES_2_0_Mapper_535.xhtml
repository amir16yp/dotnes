<div class="mw-parser-output"><p>NES 2.0 Mapper 535 is used for Whirlwind Manu's cartridge conversion (cartrige code LH53) of the Famicom Disk System Game <i>謎の村雨城</i> (Nazo no Murasamejō). Its UNIF board name is <b>UNL-LH53</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $8000-$FFFF: 32 KiB fixed PRG-ROM bank #3, except where overlaid by PRG-RAM</li>
<li>CPU $B800-$D7FF: 8 KiB fixed PRG-RAM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="IRQ_register_.28.24E000-.24EFFF.2C_write.29"/><span class="mw-headline" id="IRQ_register_($E000-$EFFF,_write)">IRQ register ($E000-$EFFF, write)</span></h2>
<pre>Mask: probably $F000

D~7654 3210
  ---------
  .... ..E.
         +-- 1= Enable counting
</pre>
<p>Writing to this register acknowledges a pending IRQ, and resets the counter to zero. When counting is enabled, the counter increases on every M2 cycle; upon reaching a value of 7560, an IRQ is generated (according to <a rel="nofollow" class="external text" href="https://github.com/TASVideos/fceux/blob/master/src/boards/lh53.cpp">FCEUX source code</a>).
</p>
<h2><span id="PRG_bank_register_.28.24F000-.24FFFF.2C_write.29"/><span class="mw-headline" id="PRG_bank_register_($F000-$FFFF,_write)">PRG bank register ($F000-$FFFF, write)</span></h2>
<p>Mask: probably $F000
</p><p>Sets the 8 KiB PRG-ROM bank at CPU $6000-$7FFF.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Whirlwind Manu cartridge did not.</li>
<li>Game progress cannot be saved.</li></ul>
