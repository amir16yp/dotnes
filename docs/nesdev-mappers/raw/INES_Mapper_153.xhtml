<div class="mw-parser-output"><p>iNES Mapper 153 is used for a <a href="Bandai_FCG_board.xhtml" class="mw-redirect" title="Bandai FCG">Bandai FCG</a> board with an <a href="Bandai_LZ93D50_pinout.xhtml" title="Bandai LZ93D50 pinout">LZ93D50 ASIC</a> and 8192 bytes of battery-backed WRAM. These 8192 bytes must be denoted as PRG-NVRAM in the <a href="NES_2_0.xhtml" title="NES 2.0">NES 2.0</a> header using byte value $70. Only one game, <i>Famicom Jump II: Saikyou no 7-nin</i>, uses this mapper. 
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB battery-backed WRAM</li>
<li>CPU $8000-$BFFF: 16 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Outer_PRG-ROM_Bank_Select_.28.248000-.248003_write.29"/><span class="mw-headline" id="Outer_PRG-ROM_Bank_Select_($8000-$8003_write)">Outer PRG-ROM Bank Select ($8000-$8003 write)</span></h2>
<pre>Mask: $800F

7  bit  0
---- ----
xxxx xxxP
        |
        +-- Select 256 KiB outer PRG-ROM bank at CPU $8000-$FFFF
</pre>
<ul><li>The same value must be written to all four registers, or the outer PRG-ROM bank would be switched as the PPU is rendering.</li>
<li>Because the ASIC's PA12 and PA13 inputs are grounded, only registers $8000-$8003 instead of $8000-$8007 are relevant.</li>
<li>No CHR banking is available.</li></ul>
<h2><span id="Inner_PRG-ROM_Bank_Select_.28.248008_write.29"/><span class="mw-headline" id="Inner_PRG-ROM_Bank_Select_($8008_write)">Inner PRG-ROM Bank Select ($8008 write)</span></h2>
<h2><span id="Nametable_Mirroring_Type_Select_.28.248009_write.29"/><span class="mw-headline" id="Nametable_Mirroring_Type_Select_($8009_write)">Nametable Mirroring Type Select ($8009 write)</span></h2>
<h2><span id="IRQ_Control_.28.24800A_write.29"/><span class="mw-headline" id="IRQ_Control_($800A_write)">IRQ Control ($800A write)</span></h2>
<h2><span id="IRQ_Latch_.28.24800B-.24800C_write.29"/><span class="mw-headline" id="IRQ_Latch_($800B-$800C_write)">IRQ Latch ($800B-$800C write)</span></h2>
<p>These four registers function the same way as on <a href="INES_Mapper_016.xhtml" title="INES Mapper 016">INES Mapper 016</a>, submapper 5.
</p>
<h2><span id="PRG-RAM_Control_.28.24800D_write.29"/><span class="mw-headline" id="PRG-RAM_Control_($800D_write)">PRG-RAM Control ($800D write)</span></h2>
<pre>Mask: $800F

7  bit  0
---- ----
..E. ....
  |
  +-------- PRG-RAM Chip Enable (1=Enable)
</pre>
<h1><span class="mw-headline" id="Note">Note</span></h1>
<p>When booting with WRAM filled with zeroes, <i>Famicom Jump II</i> will freeze with a black screen. Simply soft-resetting the console will then always run the game properly unless WRAM is zeroed out again.
</p>
