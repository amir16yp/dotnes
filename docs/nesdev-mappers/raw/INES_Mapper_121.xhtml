<div class="mw-parser-output"><p>iNES Mapper 121 is used for the 卡聖 (Kǎshèng) A9711 and A9713 <a href="MMC3.xhtml" title="MMC3">MMC3</a>-clone-bearing protected boards.
</p><p>A9711 (256 KiB PRG-ROM):
</p>
<ul><li><i>MK6</i> (title screen hack of <a href="INES_Mapper_115.xhtml" title="INES Mapper 115"><i>幽☆遊☆白書 Final</i></a>)</li>
<li><i>Sonic &amp; Knuckles 5</i> (hack of <i>Somari</i>, originally released by 哥德 (Gouder) on <a href="INES_Mapper_116.xhtml" title="INES Mapper 116">INES Mapper 116</a>)</li>
<li><i>Sonic 3D Blast 6</i> (hack of <i>Somari</i>, originally released by 哥德 (Gouder) on <a href="INES_Mapper_116.xhtml" title="INES Mapper 116">INES Mapper 116</a>)</li>
<li><i>Street Fighter Zero 2 '97</i> (not <a href="INES_Mapper_187.xhtml" title="INES Mapper 187"><i>Street Fighter Zero 2</i></a>)</li>
<li><i>Super Real Bout 97</i> (hack of <i>餓狼伝説 Special</i>, originally released by 哥德 (Gouder) on INES Mapper 116)</li>
<li><i>The Panda Prince/Super Lion King 2/熊貓太子</i> (<i>Xióngmāo Tàizǐ</i>)</li>
<li><i>Ultimate Mortal Kombat 3</i> (hack of <a href="INES_Mapper_123.xhtml" title="INES Mapper 123"><i>Mortal Kombat 3</i></a>)</li>
<li><i>Ultimate Mortal Kombat 4</i> (hack of <a href="INES_Mapper_123.xhtml" title="INES Mapper 123"><i>Mortal Kombat 3</i></a>)</li>
<li><i>幽☆遊☆白書 97 V</i> (<i>Yū Yū Hakusho 97 V</i>, title screen hack of <a href="INES_Mapper_115.xhtml" title="INES Mapper 115"><i>幽☆遊☆白書 Final</i></a>)</li></ul>
<p>A9713 (512 KiB PRG-ROM):
</p>
<ul><li><i>3-in-1: Earthworm Jim 2+4, The Lion King</i></li></ul>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Protection_Array_Read_.28.245000-.245FFF.29"/><span class="mw-headline" id="Protection_Array_Read_($5000-$5FFF)">Protection Array Read ($5000-$5FFF)</span></h2>
<p>Mask: probably $F000
</p><p>Returns the value from the four-byte protection array ($83, $83, $42, $00) indexed by the previous write to $5000-$5FFF.
</p>
<h2><span id="Protection_Array_Index_.28.245000-.245FFF.29"/><span class="mw-headline" id="Protection_Array_Index_($5000-$5FFF)">Protection Array Index ($5000-$5FFF)</span></h2>
<pre>Mask: probably $F000

D~7654 3210
  ---------
  .... ..II
         ++- Select index into protection array on next $5000-$5FFF read
</pre>
<p><a rel="nofollow" class="external text" href="https://github.com/asfdfdfd/fceux/blob/master/src/boards/121.cpp">FCEUX' source code</a> claims that address bit 8 switches between two protection arrays, the second one being $00, $02, $02, $03.
</p>
<h2><span id="Outer_Bank_Register_.28.245180.2C_A9713_only.29"/><span class="mw-headline" id="Outer_Bank_Register_($5180,_A9713_only)">Outer Bank Register ($5180, A9713 only)</span></h2>
<pre>Mask: $F180

D~7654 3210
  ---------
  M... ....
  +--------- Select outer 256 KiB PRG-ROM and CHR-ROM bank
</pre>
<h2><span id="CHR_A18_Control_.28.248000-.249FFF.2C_even.3B_A9711_only.29"/><span class="mw-headline" id="CHR_A18_Control_($8000-$9FFF,_even;_A9711_only)">CHR A18 Control ($8000-$9FFF, even; A9711 only)</span></h2>
<pre>Mask: $E001

D~7654 3210
  ---------
  M... ....
  +--------- Select CHR A18 Mode
              0: CHR A18=inverted PPU A12
              1: CHR A18=PPU A12
</pre>
<p>On the A9711 board, either sprites or background tiles will come from the second 256 KiB of CHR-ROM. Note that setting bit 7 will still also activate the MMC3 clone's CHR A12 inversion.
</p>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<p>Mask: $E001, see <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
<h2><span id="Protection_Latch_.28.248001.29"/><span class="mw-headline" id="Protection_Latch_($8001)">Protection Latch ($8001)</span></h2>
<p>Mask: $E003
</p><p>If the previous write to the Protection Index register ($8003) selected indices $26, $28 or $2A, the value written to $8001 --- with the lower six bits reversed -- is immediately applied. Otherwise, it will only be applied upon the next write to the $8003. Regardless of the $8003 setting, the MMC3 clone will always receive the write as well.
</p>
<h2><span id="Protection_Index_.28.248003.29"/><span class="mw-headline" id="Protection_Index_($8003)">Protection Index ($8003)</span></h2>
<p>Mask: $E003
</p><p>Bits 0-5 select a protection index register. If a valid index has been selected, the value previously written to $8001 --- with the lower six bits reversed --- is applied. If an invalid index has been selected, the $A000/$C000/$E000 banks selected via $8003 expire, and normal MMC3 PRG-ROM banking is restored.
</p>
<ul><li>Index $26: Select 8 KiB PRG-ROM bank at CPU $E000-$FFFF using current bit-reversed $8001 value, and apply subsequent writes to $8001 to this index as well.</li>
<li>Index $28: Select 8 KiB PRG-ROM bank at CPU $C000-$DFFF using current bit-reversed $8001 value, and apply subsequent writes to $8001 to this index as well.</li>
<li>Index $2A: Select 8 KiB PRG-ROM bank at CPU $A000-$BFFF using current bit-reversed $8001 value, and apply subsequent writes to $8001 to this index as well.</li>
<li>Index $2C: Select 8 KiB PRG-ROM bank at CPU $E000-$FFFF using current bit-reversed $8001 value <i>if it is not zero</i>, but do not apply subsequent writes to $8001 to this index.</li>
<li>Index $2F: Do nothing, but keep the $A000/$C000/$E000 banks previously selected via $8003.</li>
<li>Indices $20/$29/$2B/$3C/$3F: Select 8 KiB PRG-ROM bank at CPU $E000-$FFFF using current bit-reversed $8001 value, but do not apply subsequent writes to $8001 to this index.</li>
<li>All other indices: Restore normal MMC3 PRG-ROM banking.</li></ul>
<p>Writing to $8003 also has the side effect of writing the same value to the MMC clone's $8000 register.
</p>
<h1><span class="mw-headline" id="Errata">Errata</span></h1>
<ul><li>GoodNES 3.23b has several INES Mapper 121 images erroneously set to 187.</li></ul>
<h1><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h1>
<ul><li>iNES Mapper <a href="INES_Mapper_187.xhtml" title="INES Mapper 187">187</a> has the same CHR A18 behavior as the A9711 board, adds an NROM override register, and drops the complex protection.</li></ul>
