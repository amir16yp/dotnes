<div class="mw-parser-output"><p>NES 2.0 Mapper 315 is used for multicarts using <i>820732C</i>- and <i>830134C</i>-numbered PCBs such as <i>4-in-1 Street Blaster 5</i>. Its UNIF board name is <b>BMC-830134C</b>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF,_write)">MMC3-compatible registers ($8000-$FFFF, write)</span></h2>
<p>These registers function identically to a normal <a href="MMC3.xhtml" title="MMC3">MMC3</a>, except in <a href="#GNROM-like_Mode">GNROM mode</a>.
</p>
<h2><span id="Outer_Bank_Register_.28.246800.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6800,_write)">Outer Bank Register ($6800, write)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  .... CPpC
       |||+- Select 256 KiB outer CHR-ROM bank (i.e. CHR A18)
       |++-- Select 128 KiB outer PRG-ROM bank (i.e. PRG A17-A18)
       | +-- Select 128 KiB outer CHR-ROM bank (i.e. CHR A17)
       +---- Select  64 KiB outer CHR-ROM bank (i.e. CHR A16)
</pre>
<ul><li>This bank register functions as a substitute for WRAM and can only be written to if $A001 bit 7 is set and $A001 bit 6 is clear.</li>
<li>The Outer Bank Register's PRG A17-A18 replace the MMC3's, while the Outer Bank Register's CHR A16 and CHR A17 are OR'd with the respective MMC3 bits.</li></ul>
<h1><span class="mw-headline" id="GNROM-like_Mode">GNROM-like Mode</span></h1>
<p>If PRG A17 and PRG A18 are both 1 (i.e. if $6800 AND $06==$06), standard MMC3 PRG-ROM banking is replaced with an odd GNROM-ish mode, in which the MMC3's CPU A14 input is held low and PRG A14 is directly connected to CPU A14, resulting in the following bank layout:
</p>
<ul><li>CPU $8000-$BFFF: MMC3 banks effective in the $8000-$BFFF range but as if their bank register values were AND'd with $FD</li>
<li>CPU $C000-$FFFF: MMC3 banks effective in the $8000-$BFFF range but as if their bank register values were OR'd with $02</li></ul>
<h1><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h1>
<p><a href="NES_2_0_Mapper_348.xhtml" title="NES 2.0 Mapper 348">NES 2.0 Mapper 348</a> is similar but with the Outer Bank Register bits being arranged slightly differently.
</p>
