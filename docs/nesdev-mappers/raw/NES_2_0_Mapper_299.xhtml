<div class="mw-parser-output"><p>NES 2.0 Mapper 299 is used for the TXC 6-in-1 multicart (MGC-023). Its UNIF board name is <b>BMC-11160</b>. 
</p>
<h2><span class="mw-headline" id="Data_latch">Data latch</span></h2>
<pre>Mask: $8000

Bit 7654 3210
    ---------
    M.PP ..CC
    | ||   ++- Select 8 KiB (inner) CHR-ROM bank at PPU $0000-$1FFF
    | ++------ Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF, and 32 KiB (outer) CHR-ROM bank
    +--------- Select nametable mirroring, 0=horizontal, 1=vertical
</pre>
