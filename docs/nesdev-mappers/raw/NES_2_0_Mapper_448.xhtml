<div class="mw-parser-output"><p><b>NES 2.0 Mapper 448</b> denotes the <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>-based <b>830768C</b> multicart circuit board used by a <i>Super 6-in-1</i> multicart. The VRC4 clone's A0/A1 inputs are connected to CPU A2/A3, and its PRG-RAM chip-enable signal drives an outer bank register. The VRC4 is otherwise mainly used for its IRQ and mirroring selection functionalities; discrete circuits implement UNROM/UOROM/AOROM-like PRG banking with 8 KiB of unbanked CHR-RAM.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>A~[0110 .... .... BUPP]
                  |+++- PRG A19..A17
                  |+--- Fixed bank when B=0
                  |      0: 7 (UNROM)
                  |      1: 15 (UOROM)
                  +---- PRG mode
                         0: UNROM/UOROM
                         1: AOROM
</pre>
<p>In UNROM/UOROM mode, the VRC4's PRG register at $8000 selects the 16 KiB PRG bank at $8000-$BFFF, and mirroring depends on the VRC4's normal mirroring register. In AOROM mode, the VRC4's PRG bank and mirroring is ignored, and the entire $8000-$FFFF address range functions like <a href="AxROM.xhtml" class="mw-redirect" title="INES Mapper 007">INES Mapper 007</a> with respect to PRG banking and single-screen mirroring, subject only to PRG A19 and A18 set via the outer bank register.
</p>
