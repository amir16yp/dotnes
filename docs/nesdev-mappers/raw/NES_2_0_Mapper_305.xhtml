<div class="mw-parser-output"><p>NES 2.0 Mapper 305 is used for Kaiser's ROM cartridge conversion of the Japanese Famicom Disk System version of <i>ドラキュラII 呪いの封印</i> (Dracula II: Noroi no Fūin). Its UNIF board name is <b>KS7031</b> (without any prefix).
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$67FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $6800-$6FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $7000-$77FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $7800-$7FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $8000-$87FF: 2 KiB fixed PRG-ROM bank #15</li>
<li>CPU $8800-$8FFF: 2 KiB fixed PRG-ROM bank #14</li>
<li>CPU $9000-$97FF: 2 KiB fixed PRG-ROM bank #13</li>
<li>CPU $9800-$9FFF: 2 KiB fixed PRG-ROM bank #12</li>
<li>CPU $A000-$A7FF: 2 KiB fixed PRG-ROM bank #11</li>
<li>CPU $A800-$AFFF: 2 KiB fixed PRG-ROM bank #10</li>
<li>CPU $B000-$B7FF: 2 KiB fixed PRG-ROM bank #9</li>
<li>CPU $B800-$BFFF: 2 KiB fixed PRG-ROM bank #8</li>
<li>CPU $C000-$C7FF: 2 KiB fixed PRG-ROM bank #7</li>
<li>CPU $C800-$CFFF: 2 KiB fixed PRG-ROM bank #6</li>
<li>CPU $D000-$D7FF: 2 KiB fixed PRG-ROM bank #5</li>
<li>CPU $D800-$DFFF: 2 KiB fixed PRG-ROM bank #4</li>
<li>CPU $E000-$E7FF: 2 KiB fixed PRG-ROM bank #3</li>
<li>CPU $E800-$EFFF: 2 KiB fixed PRG-ROM bank #2</li>
<li>CPU $F000-$F7FF: 2 KiB fixed PRG-ROM bank #1</li>
<li>CPU $F800-$FFFF: 2 KiB fixed PRG-ROM bank #0</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Bank_.28.248000-.24FFFF.29"/><span class="mw-headline" id="PRG-ROM_Bank_($8000-$FFFF)">PRG-ROM Bank ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1..R R... .... ....
     + +-------------- Select register number
                       $8000: Set 2 KiB PRG-ROM bank at CPU $6000-$67FF
                       $8800: Set 2 KiB PRG-ROM bank at CPU $6800-$6FFF
                       $9000: Set 2 KiB PRG-ROM bank at CPU $7000-$77FF
                       $9800: Set 2 KiB PRG-ROM bank at CPU $7800-$7FFF
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mirroring is hard-wired to Vertical. One of the two common UNIF ROM images of this game has no MIRR chunk.</li>
<li>Save data is not retained, even as one of the two common UNIF ROM images has a BATT chunk.</li>
<li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Kaiser cartridge did not.</li></ul>
