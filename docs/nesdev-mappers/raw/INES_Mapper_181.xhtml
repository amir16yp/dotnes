From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_181">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_181">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 181</a> is currently being used by FCEUX's checksum patch list to represent <i><a rel="nofollow" class="external text" href="http://bootgod.dyndns.org:7777/profile.php?id=2332">Seicross v2</a></i>, which would have been <a href="INES_Mapper_185.xhtml" title="INES Mapper 185">mapper 185</a> except that it doesn't comply with the heuristic documented there. A more complex heuristic that pays attention to the addresses read from the PPU would obviate this.
</p><p>A better solution would be to either elaborate the heuristic, or use submappers with mapper 185. No ROM dumps are believed to exist tagged with this mapper number, and hopefully this mapper number can still be saved for something else later.
</p>
