From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_185">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_185">other pages</a>

<div class="mw-parser-output"><p><b>iNES Mapper 185</b> denotes the <a href="CNROM.xhtml" title="CNROM">CNROM</a> circuit board with only 8 KiB of CHR-ROM. The particular ROM chip model (Sharp LH2367 or equivalent) changes the functionality of pins 26 (normally A13) and 27 (normally A14) into two programmable (during manufacturing) Chip Select inputs, effectively disabling CHR-ROM and tri-stating its data outputs when the one correct bank of four possible CHR-ROM banks is not selected.
</p><p>While the original purpose of these two chip select pins was to allow four chips to sit on the same bus selected by a two-bit chip select number that does not have to be demultiplexed into four chip enable signals, Mapper 185 uses them as a second (and equally weak) copy protection mechanism, in addition to the <a href="CNROM.xhtml#Security_diodes" title="CNROM">security diodes</a>.
</p>

<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: 16 KiB or 32 KiB</li>
<li>PRG ROM bank size: Not bankswitched</li>
<li>PRG RAM: None</li>
<li>CHR capacity: 8 KiB ROM (copy protected)</li>
<li>Nametable <a href="Mirroring.xhtml" title="Mirroring">mirroring</a>: Solder pads select vertical or horizontal mirroring</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: Yes</li></ul>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Bank_select_($8000-$FFFF)">Bank select ($8000-$FFFF)</span></h3>
<pre>7  bit  0
---- ----
..DC ..BA
  ||   ||
  ||   |+- Chip Select 2 (CS2)
  ||   +-- Chip Select 1 (CS1)
  |+------ Output to Diode 2 (D2)
  +------- Output to Diode 1 (D1)
</pre>
<p>The games verify the functionality of the Chip Select bits by writing the wrong CS1/CS2 value, thereby disabling CHR-ROM, verify that reading CHR-ROM does not return the correct value, then write the correct CS1/CS2 bits to enable CHR-ROM so that graphics can be displayed. A few titles additionally verify that reading CHR-ROM <i>now</i> does return the correct value. If either check fails, the game is either reset or freezes. The correct CS1/CS2 value that enables CHR-ROM is game-specific and specified in the Submapper field of the <a href="NES_2_0.xhtml" title="NES 2.0">NES 2.0</a> header with a base of 4:
</p>
<pre>Submapper  Meaning
  4        CS1/CS2=0 enables CHR-ROM, all other values disable CHR-ROM
  5        CS1/CS2=1 enables CHR-ROM, all other values disable CHR-ROM
  6        CS1/CS2=2 enables CHR-ROM, all other values disable CHR-ROM
  7        CS1/CS2=3 enables CHR-ROM, all other values disable CHR-ROM
</pre>
<p>The base of 4 allows distinguishing &quot;CS1/CS2=0&quot; and a Submapper of &quot;0&quot; meaning &quot;Unknown&quot;: Any Submapper other than 4-7 means that the correct CS1/CS2 value is unknown and one of two heuristics must be used instead to allow the game to run:
</p>
<ul><li>Enable CHR-ROM only if the &quot;(latch data &amp;0xF) != 0 &amp;&amp; (latch data) != 0x13&quot;. This heuristic fails for <i>Seicross</i> and is therefore discouraged.</li>
<li>Disable CHR-ROM for the first two reads $2007 after a reset and then enable it. This works with all games, as they all test for the bad value first, and the correct value (if at all) second.</li></ul>
<p>When CHR is disabled, the pattern tables are <a href="Open_bus_behavior.xhtml" class="mw-redirect" title="Open bus">open bus</a>. Theoretically, this should return the LSB of the address read, but real-world behavior varies, and the earlier revision of <i>Mighty Bomb Jack</i> in fact relies on open bus at PPU address $0000 being something other than $00.

<p>The North American and PAL versions of <i>Mighty Bomb Jack</i> mount 32 KiB of CHR-ROM instead and so use normal <a href="INES_Mapper_003.xhtml" title="INES Mapper 003">mapper 3</a>.
