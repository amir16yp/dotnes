</head><body><h1>NES 2.0 Mapper 460</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_460">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_460">other pages</a>

<div class="mw-parser-output"><p><b>NES 2.0 Mapper 460</b> denotes the <b>FC-29-40</b> and <b>K-3101</b> <a href="MMC3.xhtml" title="MMC3">MMC3</a>--based multicart circuit boards, used by the <i>13-in-1 實實在在的好朋友 快打的超値感受</i> and <i>Street Fighter III 40-in-1 - Games Screen Selectable</i> multicarts. Mounting both 512 KiB of CHR ROM and 8 KiB of CHR RAM, they combine the functionalities of <a href="INES_Mapper_197.xhtml" title="INES Mapper 197">INES Mapper 197</a> with NROM-based 32 KiB banking.
</p>
<h2><span id="Extra_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Extra_Register_($6000-$7FFF,_write)">Extra Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

A~[011. .... S.NM .CBB]
             | ||  |++- PRG A18..A17
             | ||  +--- 0: 8 KiB of unbanked CHR RAM
             | ||       1: 512 KiB of CHR ROM
             | ++------ PRG ROM banking mode
             |          0x: MMC3
             |          10: NROM-128
             |          11: NROM-256
             +--------- 1: Disable PRG ROM if solder pad connected

Value on reset: $00
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>WRAM must be enabled in $A001.7 before writing to the extra register.</li>
<li>NROM mode causes the MMC3's CPU A14 line to be held low, making the MMC3's two PRG registers apply to both $8000/$A000 and $C000/$E000.</li>
<li>NROM-256 mode additionally replaces PRG A14 with CPU A14.</li>
<li>512 KiB of CHR ROM is realized by connecting the MMC3 clone according to <a href="INES_Mapper_197.xhtml##Submapper_2" title="INES Mapper 197">mapper 197.2</a>.</li>
<li>Connecting the solder pad or not selects between two menus (20-in-1 and 40-in-1).</li></ul>
