<div class="mw-parser-output"><p><b>NES 2.0 Mapper 434</b> denotes the <b>S-009</b> PCB, used by multicarts consisting of several UNROM games.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF)">Outer Bank Register ($6000-$7FFF)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  ..M. .PPP
    |   +++- PRG A19..A17
    +------- 0: Horizontal mirroring
             1: Vertical mirroring
</pre>
<h2><span id="Inner_Bank_Register_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Inner_Bank_Register_($8000-$FFFF)">Inner Bank Register ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

D~7654 3210 (bus conflicts)
  ---------
  .... .PPP
        +++- PRG A16..A14 if CPU A14=0
</pre>
