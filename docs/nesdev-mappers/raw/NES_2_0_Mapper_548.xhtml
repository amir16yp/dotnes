<div class="mw-parser-output"><p><b>NES 2.0 Mapper 548</b> denotes 科統實業股份有限公司 (Co Tung Co.)'s <b>CTC-15</b> circuit board, used for their cartridge conversion of the FDS game <i>Almanaの奇跡 (Almana no Kiseki)</i>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM</li>
<li>CPU $8000-$BFFF: Switchable 16 KiB PRG-ROM bank</li>
<li>CPU $C000-$FFFF: Fixed 16 KiB PRG-ROM bank #3</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<p>Mirroring is hard-wired to Horizontal.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Latch_and_IRQ_control_.28.244800.2C_write.29"/><span class="mw-headline" id="Latch_and_IRQ_control_($4800,_write)">Latch and IRQ control ($4800, write)</span></h2>
<pre>Mask: $F800

A~FEDC BA98 7654 3210
  -------------------
  0100 1... ..A. BC..
              +--++--- Latch value
                  +--- IRQ control

Power-on value (ABC): $7
</pre>
<ul><li>The latch value is not used until the Latch Apply register is written to.</li>
<li>IRQ control:
<ul><li>0: Enable M2 counting and IRQ generation</li>
<li>1: Disable M2 counting and IRQ generation, acknowledge IRQ, counter is reset to 0.</li></ul></li></ul>
<p>If counting is enabled, the counter is clocked on every falling edge of M2. IRQ is asserted while <tt>((counter÷640)&amp;37)=37</tt>, so it is asserted the first time when the counter reaches 23680 and self-acknowledges the first time when it reaches 24320.
</p>
<h2><span id="Latch_Apply_.28.245000.2C_write.29"/><span class="mw-headline" id="Latch_Apply_($5000,_write)">Latch Apply ($5000, write)</span></h2>
<p>Mask: $F800
</p><p>Upon writing to the $5000-$57FF address range, the latched value written to $4800 is XOR'd with $05 and applied as the 16 KiB PRG-ROM bank at CPU $8000-$BFFF. The power-on bank is $7.
</p>
