<div class="mw-parser-output"><p><b>NES 2.0 Mapper 381</b> denotes the <b>KN-42</b> PCB, used by the <i>2-in-1 High Standard Game (BC-019)</i> reset-based multicart containing two (modified) <a href="UxROM.xhtml" class="mw-redirect" title="UOROM">UOROM</a> games, in this case, the two Codemasters &quot;Bignose&quot; titles.
</p>
<h2><span id="Data_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Data_Latch_($8000-$FFFF,_write)">Data Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  ...b .aaa
     |  +++- PRG A15..A17
     +------ PRG A14
</pre>
<p>The actual 16 KiB bank number is therefore <i>aaab</i>. PRG A14..A17 are forced to $F if CPU A14=1, just like UOROM. PRG A18 is flipped on each reset cycle, which is detected through interruption of the M2 signal. The data latch exhibits bus conflicts.
</p>
