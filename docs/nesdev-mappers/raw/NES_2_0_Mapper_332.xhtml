<div class="mw-parser-output"><p><b>NES 2.0 mapper 332</b> is used for the <i>Super 40-in-1</i> and <i>Super 500-in-1</i> multicarts. Its UNIF board name is <b>BMC-WS</b>.
</p>
<h2><span id="PRG.2FMirroring_Register_.28.246000.29"/><span class="mw-headline" id="PRG/Mirroring_Register_($6000)">PRG/Mirroring Register ($6000)</span></h2>
<pre>Mask: probably $E001

D~7654 3210
  ---------
  .H.M BPPp
   | | |+++- PRG A14..A16 for CPU $8000-$BFFF and $C000-$FFFF
   | | +---- Select PRG A14 Mode
   | |        0: PRG A14=CPU A14 (NROM-256)
   | |        1: PRG A14=p (NROM-128)
   | +------ Select nametable mirroring mode
   |          0: Vertical
   |          1: Horizontal
   +-------- Select PRG A17 and CHR A16
Reset value: $00
</pre>
<h2><span id="CHR.2FSolder_Pad_Register_.28.246001.29"/><span class="mw-headline" id="CHR/Solder_Pad_Register_($6001)">CHR/Solder Pad Register ($6001)</span></h2>
<pre>Mask: probably $E001

D~7654 3210
  ---------
  DDMM .Cdc
  ||||  |++- CHR A13..A14 for PPU $0000-$1FFF if MM=11
  ||||  +--- CHR A15
  ||++------ 00: CNROM-256 mode: CHR A13..A14 from CNROM latch
  ||         10: CNROM-128 mode: CHR A13 from CNROM latch, CHR A14 from d
  ||         11: NROM mode: CHR A13..A14 from dc
  ++-------- Solder pad check
Reset value: $00
</pre>
<p>The solder pads connect the latch output directly to PRG-ROM /CE. The menu code, executing from RAM, sets either bit to check whether CPU $8000-$FFFF now returns open bus, and selects a menu with different game counts depending on the result.
</p>
<h2><span id="CNROM_latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="CNROM_latch_($8000-$FFFF)">CNROM latch ($8000-$FFFF)</span></h2>
<pre>D~7654 3210
  ---------
  .... ..CC
         ++- CHR A13..A14 for PPU $0000-$1FFF if MM=00
Reset value: $00
</pre>
