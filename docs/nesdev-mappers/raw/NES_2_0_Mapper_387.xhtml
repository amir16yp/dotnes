<div class="mw-parser-output"><p><b>NES 2.0 Mapper 387</b> denotes J.Y. Company's <b>YY850735C</b> and <b>YY850817C</b> circuit boards, used for the multicarts:
</p>
<ul><li><i>1996 Super HiK 4-in-1 (JY-087)</i></li>
<li><i>1996 Super HIK 4-in-1 (JY-089)</i></li>
<li><i>1996 Super HIK 4-in-1 (JY-093)</i></li>
<li><i>1996 Super HIK 4-in-1 (JY-094)</i></li></ul>
<p>It uses the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>, has 512 MiB of PRG-ROM and 1 MiB of CHR-ROM. <a href="NES_2_0_Mapper_386.xhtml" title="NES 2.0 Mapper 386">NES 2.0 Mapper 386</a> is almost the same but changes the outer PRG bank size from 128 to 256 KiB.
</p>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<pre>Mask: $F003

7654 3210
---- ----
..L? PCpc
  || |||+- CHR A18, ignored if L=1
  || ||+-- PRG A17
  || |+--- CHR A19
  || +---- PRG A18
  |+------ Always 1
  +------- Select outer CHR-ROM bank size
            0: Mask $900x/$A00x to 256 KiB, use c
            1: Mask $900x/$A00x to 512 KiB, ignore c   
</pre>
<p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
