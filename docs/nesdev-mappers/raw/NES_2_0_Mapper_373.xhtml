<div class="mw-parser-output"><p>NES 2.0 Mapper 373 is used for a <i>Super 4-in-1</i> multicart (PCB ID <b>SFC-13</b>). It is <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">INES Mapper 045</a> but with one bit of outer bank register #2 working as a GNROM switch.
</p>
<h2><span id="CHR-AND.2C_CHR-OR.2FPRG-OR_MSB.2C_CHR_source_.28.246000_.232.2C_write.29"/><span class="mw-headline" id="CHR-AND,_CHR-OR/PRG-OR_MSB,_CHR_source_($6000_#2,_write)">CHR-AND, CHR-OR/PRG-OR MSB, CHR source ($6000 #2, write)</span></h2>
<pre>Mask: $F001

D~7654 3210
  ---------
  PPRC cccc
  |||| ++++- Select number of CHR bits from MMC3
  ||||       ($F: 256 KiB, $E: 128 KiB ... $7-$0: 1 KiB)
  |||+------ Select CHR A18
  ||+------- Select MMC3 (0)/GNROM-like (1) PRG mode
  ++-------- Select CHR A20-A21 and PRG A21-22
</pre>
<p>In GNROM-like mode, the MMC3 clone's CPU A14 input is held low, so that MMC3 registers #6 and #7 apply both to $8000/$C000 and $A000/$E000, with the bank number ANDed with NOT $02 in the lower range and ORed with $02 in the upper range.
</p>
