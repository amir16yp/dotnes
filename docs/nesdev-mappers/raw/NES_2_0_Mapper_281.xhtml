<div class="mw-parser-output"><p><b>NES 2.0 Mapper 281</b> denotes a number of compatible circuit boards from J.Y. Company:
</p>
<ul><li>512 KiB PRG-ROM, 512 KiB CHR-ROM: <b>YY841144C</b>, <b>YY850771C</b>, <b>YY851115C</b>, <b>YY860416C</b>, <b>YY860417C</b>, <b>YY860731C</b></li>
<li>1 MiB PRG-ROM, 1 MiB CHR-ROM: <b>YY850719C</b></li></ul>
<p>and is used for the following multicarts:
</p>
<ul><li><i>1996 Super HiK 4-in-1 (JY-052)</i></li>
<li><i>1997 Super HiK 4-in-1 (JY-052)</i></li>
<li><i>1996 Super HiK 4-in-1 (JY-053)</i></li>
<li><i>1996 Super HiK 4-in-1 (JY-054)</i></li>
<li><i>1997 Super HiK 4-in-1 (JY-054)</i></li>
<li><i>1996 Super HiK 4-in-1 (JY-055)</i></li>
<li><i>1996 Power Rangers HiK 4-in-1 (JY-066)</i></li>
<li><i>1997 Power Rangers HiK 4-in-1 (JY-066)</i></li>
<li><i>1996 Super HiK 3-in-1 (JY-068)</i></li>
<li><i>1996 Super HiK 3-in-1 (JY-080)</i></li>
<li><i>1996 Super HiK 5-in-1 (JY-088)</i></li></ul>
<p>It uses the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<p>Mask: $F003
</p>
<pre>7654 3210
---- ----
.... ..BB
       ++- PRG/CHR A18/A19 (256 KiB outer PRG/CHR-ROM bank)
</pre>
<p>PRG ($8000-$8FFF) and CHR ($9000-$AFFF) bank select register bits that select 256 KiB banks are masked off. 
</p><p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
