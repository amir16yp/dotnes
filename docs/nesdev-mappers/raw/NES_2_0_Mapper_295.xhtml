From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_295">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_295">other pages</a>

<div class="mw-parser-output"><p>NES 2.0 Mapper 295 is used for several multicarts from J.Y. Company: 
</p>
<ul><li><i>1996 Soccer 7-in-1 (JY-014B)</i></li>
<li><i>1997 Super HIK 4-in-1 (JY-095)</i></li>
<li><i>1997 Super HIK 7-in-1 (JY-096)</i></li>
<li><i>1997 Super HIK 4-in-1 (JY-099)</i></li>
<li><i>1997 Super 9-in-1 (JY-109)</i></li>
<li><i>1997 Super 13-in-1 (JY-110)</i></li></ul>
<p>Its UNIF board name is <b>BMC-13in1JY110</b>, although FCEUX' support is non-working. It uses the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>. 
</p><p>The same bits in register $D003 select both PRG and CHR outer banks. It is almost identical to <a href="NES_2_0_Mapper_281.xhtml" title="NES 2.0 Mapper 281">NES 2.0 Mapper 281</a>, except that the outer bank size is 128 KiB rather than 256 KiB.
</p>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<pre>Mask: $F003

7654 3210
---- ----
.... .CCC
      +++- Select 128 KiB outer PRG-ROM bank
      +++- Select 128 KiB outer CHR-ROM bank
</pre>
<p>PRG ($8000-$8FFF) and CHR ($9000-$AFFF) bank select register bits that select 128/256 KiB banks are masked off. 
</p><p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
