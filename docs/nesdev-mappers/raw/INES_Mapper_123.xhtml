<div class="mw-parser-output"><p>iNES Mapper 123 is used for the 卡聖 (Kǎshèng) H2288 board, an <a href="MMC3.xhtml" title="MMC3">MMC3</a>-clone-bearing board with scrambled register indices, and an NROM-like PRG-ROM register that can override the MMC3 clone's PRG-ROM bank. Its UNIF board name is <b>UNL-H2288</b>. Used by:
</p>
<ul><li><i>Mortal Kombat 3</i> (Kǎshèng/Hummer Team, not to be confused with <i>Mortal Kombat 3</i> from SuperGame)</li>
<li><i>Earthworm Jim 2</i> (Kǎshèng/Shin-Shin Electronics, not to be confused with <i>Earthworm Jim 2</i> from SuperGame)</li></ul>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="NROM_Override_Register_.28.245800.29"/><span class="mw-headline" id="NROM_Override_Register_($5800)">NROM Override Register ($5800)</span></h2>
<pre>Mask: $F800

D~7654 3210
  ---------
  .M31 .2S0
   +++--+|+- Select 16 KiB PRG-ROM bank at CPU
   |     |   $8000-$BFFF and $C000-$FFFF (notice the bit order)
   |     +-- 0: Do not replace bit 0 (NROM-128)
   |         1: Replace bit 0 with CPU A14 (NROM-256)
   +-------- 0: Use PRG bank from MMC3; ignore $5800 bits 0-3/5
             1: Ignore PRG bank from MMC3; apply $5800 bits 0-3/5
</pre>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<pre>$8000 index written   MMC3 register meant
-------------------   -------------------
0                     0
1                     3
2                     1
3                     5
4                     6
5                     7
6                     2
7                     4
</pre>
<p>Bits 6 and 7 of the value written to $8000 are unchanged. See <a href="MMC3.xhtml" title="MMC3">MMC3</a> for further details.
</p>
<h1><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h1>
<ul><li>iNES Mappers <a href="INES_Mapper_114.xhtml" title="INES Mapper 114">114</a> and <a href="INES_Mapper_115.xhtml" title="INES Mapper 115">115</a> move the $5800 register to $6000 while rearranging its bits and add an outer CHR-ROM bank register at $6001. Mapper 114 keeps the MMC3 index register scrambling (using the same pattern) and adds register address scrambling, while Mapper 115 drops all scrambling.</li></ul>
