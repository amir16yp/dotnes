<h2><span id="PRG-ROM_Bank_Register_.28.246000.2C_write.29"/><span class="mw-headline" id="PRG-ROM_Bank_Register_($6000,_write)">PRG-ROM Bank Register ($6000, write)</span></h2>
<pre>Mask: probably $6003

D~7654 3210
  ---------
  .... .PP.
        ++- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF
</pre>
<p><br/>
</p>
<h2><span id="Unknown_Register_.28.246001.2C_write.29"/><span class="mw-headline" id="Unknown_Register_($6001,_write)">Unknown Register ($6001, write)</span></h2>
<p>Mask: probably $6003
</p><p>Unknown meaning; the menu writes $01 to it.
</p>
<h2><span id="Jumper_Register_.28.246002.2C_read.29"/><span class="mw-headline" id="Jumper_Register_($6002,_read)">Jumper Register ($6002, read)</span></h2>
<pre>Mask: probably $6003

D~7654 3210
  ---------
  OOOO OOOJ
  |||| |||+- Jumper setting
  |||| |||    0: Show 20-in-1 menu (i.e. with repeats)
  |||| |||    1: Show 5-in-1 menu (i.e. without repeats)
  ++++-+++-- Open bus
  
</pre>
<p>The &quot;hardware test&quot; menu (seen when pressing SELECT+A+B during the menu) expects the jumper at zero.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>Mask: $E001
</p><p>See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<p>The MMC3 clone is only used for Mirroring and CHR-ROM banking; the PRG-ROM bank comes entirely from an additional register. As they use the MMC3 clones's WRAM interface, accessing the $600x registers requires enabling and not write-protecting WRAM in the MMC's $A001 register.
</p>
