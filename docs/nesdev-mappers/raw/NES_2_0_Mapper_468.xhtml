<div class="mw-parser-output"><p><b>NES 2.0 Mapper 468</b> denotes <b>BlazePro</b> multicarts based on the Altera MAX II CPLD. It can emulate sixteen mappers at once, selected via the MSB nibble at $5700. Different multicarts program the CPLD with different sets of mappers, denoted via the NES 2.0 submapper field. The LSB nibble of $5700 contains mapper-specific flags.
