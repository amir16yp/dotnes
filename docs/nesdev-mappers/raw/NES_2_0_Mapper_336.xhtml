<div class="mw-parser-output"><p><b>NES 2.0 mapper 336</b> is used for multicarts containing several UNROM games. Its UNIF board name is <b>BMC-K-3046</b>.
</p><p><b>Submapper 0:</b>
</p>
<ul><li>11-in-1 (K-3046)</li>
<li>2-in-1 (YH-217)</li>
<li>4-in-1 (YH-4109)</li></ul>
<p><b>Submapper 1 (M1K30 PCB):</b>
</p>
<ul><li>Top Gun III 2-in-1</li></ul>
<p><b>Submapper 2:</b>
</p>
<ul><li>2-in-1 (YH-218)</li></ul>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: Switchable 16 KiB inner PRG-ROM bank and switchable 128 KiB outer PRG-ROM bank</li>
<li>CPU $C000-$FFFF: Fixed 16 KiB inner PRG-ROM bank #7 and switchable 128 KiB outer PRG-ROM bank</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB CHR-RAM</li></ul>
<h2><span id="Data_Latch_.28.24C000-.24FFFF.29"/><span class="mw-headline" id="Data_Latch_($C000-$FFFF)">Data Latch ($C000-$FFFF)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  ..OO OIII
    || |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF
    ++-+---- Select 128 KiB outer PRG-ROM bank at CPU $8000-$FFFF
    |  +---- Mirroring (<b>Submapper 2</b>), 1=H, 0=V
    +------- Mirroring (<b>Submappers 0/1</b>), 1=H, 0=V
</pre>
<h2><span class="mw-headline" id="Note">Note</span></h2>
<p><b>Submappers 0</b> and <b>2</b> have no bus conflicts. <b>Submapper 1</b> does: D0-D2 are affected by normal AND-type bus conflicts, while D3 has a resistor in the signal path to ensure that the ROM bit always &quot;wins&quot;, similar to <a href="INES_Mapper_144.xhtml" title="INES Mapper 144">INES Mapper 144</a>. This behavior is necessary for proper function.
</p>
