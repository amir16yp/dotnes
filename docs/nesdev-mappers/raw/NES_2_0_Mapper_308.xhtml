<div class="mw-parser-output"><p>NES 2.0 Mapper 308 is used for a bootleg version of the Sunsoft game <i>Batman</i>. It uses a VRC2 clone (VRC2b, CPU A0=chip A0, CPU A1=chip A1, i.e. similar to Mapper 23 Submapper 3) with custom IRQ functionality. Its UNIF board name is <b>UNL-TH2131-1</b>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="VRC2-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="VRC2-compatible_registers_($8000-$FFFF)">VRC2-compatible registers ($8000-$FFFF)</span></h2>
<p>See description at <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC2">VRC2</a>.
</p>
<h2><span id="IRQ_Acknowledge_and_Reset_.28.24F000.29"/><span class="mw-headline" id="IRQ_Acknowledge_and_Reset_($F000)">IRQ Acknowledge and Reset ($F000)</span></h2>
<p>Mask: $F003
</p><p>Acknowledge IRQ and disable IRQ counting; reset low counter to zero.
</p>
<h2><span id="IRQ_Counter_Enable_.28.24F001.29"/><span class="mw-headline" id="IRQ_Counter_Enable_($F001)">IRQ Counter Enable ($F001)</span></h2>
<p>Mask: $F003
</p><p>Enable IRQ counting.
</p>
<h2><span id="IRQ_High_Counter_Value_.28.24F003.29"/><span class="mw-headline" id="IRQ_High_Counter_Value_($F003)">IRQ High Counter Value ($F003)</span></h2>
<pre>Mask: $F003

D~7654 3210
  ---------
  VVVV ....
  ++++----- Value for high counter
</pre>
<h1><span class="mw-headline" id="IRQ_Operation">IRQ Operation</span></h1>
<p>If IRQ counting is enabled, the 12 bit low counter is increased on every M2 cycle. Upon reaching the value 2048, the high counter is decreased. If the high counter is zero and the low counter is below 2048, an IRQ is asserted.
</p>
