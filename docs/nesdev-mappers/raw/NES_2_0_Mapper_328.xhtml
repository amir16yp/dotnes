<div class="mw-parser-output"><p>NES 2.0 mapper 328 is used for the <i>Test Ver. 1.01 Dlya Proverki TV Pristavok</i> test cartridge. Its UNIF board name is <b>UNL-RT-01</b>. There is only 16K of PRG and 2K of CHR and mirroring is hard-wired.
</p>
<h2><span id="Random_number_generator_or_Protection_.28.24CE80-.24CEFF.2C_.24FE80-.24FEFF.2C_read.29"/><span class="mw-headline" id="Random_number_generator_or_Protection_($CE80-$CEFF,_$FE80-$FEFF,_read)">Random number generator or Protection ($CE80-$CEFF, $FE80-$FEFF, read)</span></h2>
<pre>Mask: unknown. If what CaH4e3 wrote (quoted below) is accurate, $BFFF.

D~7654 3210
  ---------
  1111 RR1R
       ++-+- Random bits
</pre>
<p>CaH4e3 wrote that the &quot;PRG EPROM has copy protected areas with &quot;weak bits&quot;, which is tested at some points of the program. [The random numbers are t]rying to simulate &quot;weak bits&quot; behaviour&quot;
</p><p>The relevant program calculates a 16-bit checksum of the memory in each of these regions and loops until the checksum <i>changes</i>.
</p>
