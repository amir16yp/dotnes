<div class="mw-parser-output"><p><b>NES 2.0 Mapper 439</b> denotes the <b>YS2309</b> UxROM-like multicart PCB. Its UNIF MAPRs are <b>BMC-DS-07</b> and <b>BMC-K86B</b>. All registers set to $00 on reset.
</p>
<h2><span id="Latch_Register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Latch_Register_($8000-$FFFF,_write)">Latch Register ($8000-$FFFF, write)</span></h2>
<pre>D~[M..PP PPPP]  Address mask: $8000
   |  ++-++++- PRG A19..A14 when CPU A14=0,
   |           $3F when CPU A14=1
   +---------- Nametable mirroring, 0=Vertical, 1=Horizontal
</pre>
<p>This is basically an UxROM-like latch register for up to 1 MiB of PRG ROM, plus software-switchable mirroring.
</p>
<h2><span id="Outer_Bank_Register_.28.246000.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000,_write)">Outer Bank Register ($6000, write)</span></h2>
<pre>D~[.PPP ....]  Address mask: $E001
    +++------ PRG A19..A17 if enabled via $6001
</pre>
<h2><span id="Mask_Register_.28.246001.2C_write.29"/><span class="mw-headline" id="Mask_Register_($6001,_write)">Mask Register ($6001, write)</span></h2>
<pre>D~[MPPP ....]  Address mask: $E001
   |||+------- 0: PRG A17 from Latch, 1: PRG A17 from $6000
   ||+-------- 0: PRG A18 from Latch, 1: PRG A18 from $6000
   |+--------- 0: PRG A19 from Latch, 1: PRG A19 from $6000
   +---------- 1: Protect Mirroring bit in Latch from being changed
</pre>
