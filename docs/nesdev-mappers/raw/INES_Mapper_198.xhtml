From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_198">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_198">other pages</a>

<div class="mw-parser-output"><p>iNES Mapper 198 is used for the original Hong Kong release, by an unknown publisher, of 吞食天地: 三国外传 (Tūnshí Tiāndì - Sānguó Wàizhuàn), a Chinese translation of Capcom's 天地を喰らう II: 諸葛孔明伝 (Destiny of an Emperor II). In addition to normal 8 KiB of CHR-RAM and 8 KiB of battery-backed WRAM at $6000-$7FFF, it has an additional non-backed 4 KiB of WRAM at $5000-$5FFF. 640 KiB of PRG-ROM data is spread over two chips, 512 KiB providing the data for 8 KiB PRG-ROM banks $00-$3F, and 128 KiB providing the data for 8 KiB PRG-ROM banks $40-$4F, for a total of 640 KiB of PRG-ROM. Special consideration is needed for the two fixed MMC3 banks, which are located in the second chip, meaning that they are bank numbers $4E and $4F, respectively.
</p><p><a href="INES_Mapper_199.xhtml" title="INES Mapper 199">INES Mapper 199</a> provides the same amount of RAM with more conventional (oversize) PRG-ROM banking.
</p>
