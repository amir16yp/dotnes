<div class="mw-parser-output"><p><b>NES 2.0 Mapper 558</b> denotes the 燕城 (Yànchéng) <b>YC-03-09</b> circuit board, used for the following games:
</p>
<ul><li><i>口袋精靈: 水晶</i> (Pokémon: Crystal Edition)</li>
<li><i>大話三國</i> (Dàhuà Sānguó)</li></ul>
<p>A compatible circuit board with an unknown PCB code is used for the original editions of a few games from 外星 (Wàixīng):
</p>
<ul><li><i>Pet Family - 宠物大家族: 部落纷争</i> (ES-1081)</li>
<li><i>Pet Evolve - 宠物进化史</i> (ES-1085)</li>
<li><i>口袋妖怪꞉ 鑽石版</i> (Pokémon: Diamond Edition, ES-1090)</li>
<li><i>口袋精靈: 紅</i> and its title screen hack <i>宠物: 红</i> (Pokémon: Red Edition, ES-1088)</li>
<li><i>数码暴龙 4: 水晶版</i> and its title screen hack <i> 数码宝贝</i> (Digimon 4: Crystal Edition)</li>
<li><i>盟军敢死队 - Commandos</i></li></ul>
<p>The Yànchéng games save the game state to a 93C66 512-byte serial EEPROM, its &quot;ORG&quot; pin tied to GND, selecting a word size of 8 bits. The Wàixīng games save to 8 KiB battery-backed WRAM. The NES 2.0 Header's PRG-NVRAM field distinguishes between the two board variants.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: up to 8 KiB unbanked PRG-RAM, can be battery-backed</li>
<li>CPU $8000-$FFFF: 32 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM bank</li>
<li>Nametable mirroring: hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>All registers are initialized to $00 on reset.
</p>
<h2><span id="PRG-ROM_Bank_Low_.28.245000.2C_write.29"/><span class="mw-headline" id="PRG-ROM_Bank_Low_($5000,_write)">PRG-ROM Bank Low ($5000, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... PPPP
       ++++- PRG A18..A15
  
</pre>
<ul><li>Note that if $5300.0 is 0, the two lowest bits are swapped during writing.</li></ul>
<h2><span id="PRG-ROM_Bank_High_.28.245100.2C_write.29"/><span class="mw-headline" id="PRG-ROM_Bank_High_($5100,_write)">PRG-ROM Bank High ($5100, write)</span></h2>
<pre>Mask: $FB00

D~7654 3210
  ---------
  .... ..PP
         ++- PRG A20..A19
</pre>
<ul><li>Note that if $5300.0 is 0, the two lowest bits are swapped during writing.</li></ul>
<h2><span id="Microwire_Interface_.28.245200.2C_write.29"/><span class="mw-headline" id="Microwire_Interface_($5200,_write)">Microwire Interface ($5200, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .SDC
        ||+- 93C66 EEPROM CLK ($5300.0=0)/DAT ($5300.0=1) output
        |+-- 93C66 EEPROM DAT ($5300.0=0)/CLK ($5300.0=1) output
        +--- 93C66 EEPROM CS output
</pre>
<h2><span id="Mode_.28.245300.2C_write.29"/><span class="mw-headline" id="Mode_($5300,_write)">Mode ($5300, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .AB.
        |+-  0: Swap D0,D1 on all register writes to $5000-$5200.
        |    1: Leave D0,D1 unmodified on register writes to $5000-$5200.
        +--- 0: PRG A15/A16=1
             1: PRG A15/A16 from $5000
</pre>
<ul><li>Writes to this register are <i>not</i> subject to D0/D1 bit-swapping, i.e. the register is not affected by its own bit 0.</li>
<li>Because this register is initialized to $00 on reset, thus clearing bit 2 which causes PRG A15/A16 to be held high, the game will boot in 32 KiB PRG-ROM bank #3.</li>
<li>Changing the value of $5300.0 without writing to $5000-$5200 afterwards does not change the latched bits.</li></ul>
<h2><span id="Microwire_Interface_.28.245500.2C_read.29"/><span class="mw-headline" id="Microwire_Interface_($5500,_read)">Microwire Interface ($5500, read)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .A..
        |
        |
        +--- 93C66 EEPROM DAT input
</pre>
<p>Unlike <a href="INES_Mapper_164.xhtml" title="INES Mapper 164">INES Mapper 164</a>, the EEPROM input is <i>not</i> inverted.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>CPU D0 and D1 are connected in reverse to the mapper blob compared to other circuit boards using this ASIC. This means that setting $5300.0 to 0, not to 1, will effectively swap PRG A15/A16 and PRG A19/A20. Cartridges using this mapper must be dumped with $5300=$07 during dumping to obtain a readout that matches that of a desoldered ROM chip.</li>
<li>The Wàixīng games using this mapper were previously set to 162/163 or 164, resulting in incompatibility either because of the different address of the PRG-ROM Bank High register (mapper 162/163) or the different startup bank (164).</li></ul>
<h1><span class="mw-headline" id="See_also">See also</span></h1>
<ul><li><a href="INES_Mapper_162.xhtml" title="INES Mapper 162">INES Mapper 162</a>/163 swap the effective meaning of registers $5100 and $5200, the meaning of the D0/D1 bit swap, and use the microwire interface only for protection purposes.</li>
<li><a href="INES_Mapper_164.xhtml" title="INES Mapper 164">INES Mapper 164</a> is an earlier implementation without D0/D1 swapping, optional UNROM-like bankswitching, and a 1 bpp CHR mode.</li>
<li><a rel="nofollow" class="external text" href="">PCB images and analysis</a></li></ul>
