<div class="mw-parser-output"><p><b>NES 2.0 Mapper 551</b> is a variant of <a href="INES_Mapper_178.xhtml" title="INES Mapper 178">INES Mapper 178</a> used for several Jncota re-releases of RPG games that were originally published by C&amp;E and Supertone:
</p>
<ul><li><i>聖火列傳 (Shènghuǒ Lièzhuàn)</i> and its title screen hack <i>侠客传奇 (Xiákè Chuánqí)</i>, originally released for <a href="INES_Mapper_240.xhtml" title="INES Mapper 240">INES Mapper 240</a></li>
<li><i>荊軻新傳 (Jīngkē Xīnzhuàn)</i> and its title screen hack <i>战国风云 (Zhànguó Fēngyún)</i>, originally released for <a href="INES_Mapper_240.xhtml" title="INES Mapper 240">INES Mapper 240</a></li></ul>
<p>Compared to <a href="INES_Mapper_178.xhtml" title="INES Mapper 178">INES Mapper 178</a>, mirroring is hard-wired, and the chipset's internal CHR-RAM is not used in favor of CHR-ROM.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM</li>
<li>CPU $8000-$FFFF: 16/32 KiB PRG-ROM bank, switchable</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR-ROM bank</li>
<li>Nametable mirroring: Hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Mode_Register_.28.244800.29"/><span class="mw-headline" id="Mode_Register_($4800)">Mode Register ($4800)</span></h2>
<pre>7654 3210
---------
.... .SS.
      ||
      ||
      ||
      ++-- PRG banking mode
            0: NROM-256/BNROM (PRG A14=CPU A14)
            1: UNROM (PRG A14..16=111b if CPU A14=1)
            2: NROM-128
            3: UNROM but with bit 0 of &quot;fixed&quot; bank selectable
               (PRG A15..16=11b if CPU A14=1)
</pre>
<h2><span id="Low_PRG_Bank_Register_.28.244801.29"/><span class="mw-headline" id="Low_PRG_Bank_Register_($4801)">Low PRG Bank Register ($4801)</span></h2>
<pre>7654 3210
---------
.... .LLL
      +++- PRG A16..A14
</pre>
<p>This can be considered an inner bank register for UNROM mode.
</p>
<h2><span id="High_PRG_Bank_Register_.28.244802.29"/><span class="mw-headline" id="High_PRG_Bank_Register_($4802)">High PRG Bank Register ($4802)</span></h2>
<pre>7654 3210
---------
HHHH HHHH
++++-++++- PRG A24?..A17
</pre>
<p>This can be considered an outer bank register for UNROM mode.
</p>
<h2><span id="CHR-ROM_Bank_register_.28.244803.29"/><span class="mw-headline" id="CHR-ROM_Bank_register_($4803)">CHR-ROM Bank register ($4803)</span></h2>
<pre>7654 3210
---------
BBBB BBBB
++++-++++- CHR-ROM A20?..A13
</pre>
