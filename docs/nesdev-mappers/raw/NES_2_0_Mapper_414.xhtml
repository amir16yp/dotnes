<div class="mw-parser-output"><p><b>NES 2.0 Mapper 414</b> denotes the PCB of the <i>9999999合1 - 可能是世界上最強組合</i> multicart.
</p>
<pre>Mask $8000:
Write: A~[1.N. ...S ssss .PPM]
            |     | ||||  ||+- 1=Horizonal,
            |     | ||||  ||   0=Vertical mirroring
            |     | ||||  ++-- PRG A15..A14
            |     | ++++------ Solder pad select
            |     +----------- 1=Normal operation
            |                  0=Solder pad test
            +----------- 1=NROM-256 (PRG A14=CPU A14),
                         0=NROM-128

Mask $8000:
Write: D~[.... ..CC]  (bus conflicts)
                 ++- CHR A14..A13
</pre>
<p>In solder pad test mode, CPU $C000-$FFFF becomes open bus if any of the solder pads selected via ssss is connected.
</p>
