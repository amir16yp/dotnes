<div class="mw-parser-output"><p>NES 2.0 Mapper 307 is used for Kaiser's ROM cartridge conversion of the Japanese Famicom Disk System version of <i>Metroid</i>. Its UNIF board name is <b>UNL-KS7037</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$6FFF: 4 KiB fixed PRG-RAM bank #0</li>
<li>CPU $7000-$7FFF: 4 KiB fixed PRG-ROM bank #15</li>
<li>CPU $8000-$9FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $A000-$AFFF: 4 KiB fixed PRG-ROM bank #28</li>
<li>CPU $B000-$BFFF: 4 KiB fixed PRG-RAM bank #1</li>
<li>CPU $C000-$DFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $E000-$FFFF: 8 KiB fixed PRG-ROM bank #15</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id=".248000-.249FFE_.28even.29"/><span class="mw-headline" id="$8000-$9FFE_(even)">$8000-$9FFE (even)</span></h2>
<p>Select bank register number
</p>
<pre>$0-$1: No function
$2: Bit 0 selects 1 KiB CIRAM bank at PPU $2000-$23FF
$3: Bit 0 selects 1 KiB CIRAM bank at PPU $2800-$2BFF
$4: Bit 0 selects 1 KiB CIRAM bank at PPU $2400-$27FF
$5: Bit 0 selects 1 KiB CIRAM bank at PPU $2C00-$2FFF
$6: Select 8 KiB PRG-ROM bank at CPU $8000-$9FFF
$7: Select 8 KiB PRG-ROM bank at CPU $C000-$DFFF
</pre>
<h2><span id=".248001-.249FFF_.28odd.29"/><span class="mw-headline" id="$8001-$9FFF_(odd)">$8001-$9FFF (odd)</span></h2>
<p>Data for bank register selected by $8000-$9FFE (even).
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Kaiser cartridge did not.</li>
<li>Game progress cannot be saved; in fact, the save menu has been removed.</li>
<li>The register layout indicates that an MMC3 or N118 clone is being used, connected in an unusual manner.</li>
<li>Reverse-engineered schematic: <a rel="nofollow" class="external text" href="https://forums.nesdev.org/viewtopic.php?p=242196#p242196">forum</a></li></ul>
