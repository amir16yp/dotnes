</head><body><h1>INES Mapper 222</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_222">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_222">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 222</a> reportedly represents pirate ports of <a rel="nofollow" class="external text" href="http://bootgod.dyndns.org:7777/profile.php?id=2303">Namco's Dragon Ninja</a> (on the PCB <b>CTC-31</b>) and <a rel="nofollow" class="external text" href="http://bootgod.dyndns.org:7777/profile.php?id=4519">Taito's Don Doko Don 2</a> (renamed &quot;Super Mario Bros. 8&quot;).
</p><p>It appears to use a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC2">VRC2</a> and a bunch of 7400-series logic to form some kind of interrupt controller.
</p><p>No better information than FCEUX's source is currently available. The <a rel="nofollow" class="external text" href="http://cah4e3.shedevr.org.ru/collection/_Dragon_Ninja.jpg">cartridge shell</a> doesn't even hint which corporation CTC is.
</p><p>See also: <a rel="nofollow" class="external free" href="http://forums.nesdev.org/viewtopic.php?t=12654">http://forums.nesdev.org/viewtopic.php?t=12654</a>
</p>
