<div class="mw-parser-output"><p>Nestopia's and MESS's source claims that <a class="mw-selflink selflink">iNES Mapper 039</a> is assigned to Subor's “Study &amp; Game 32-in-1”. But what they implement looks identical to oversize <a href="BNROM.xhtml" title="BNROM">BNROM</a> fully supported with <a href="INES_Mapper_241.xhtml" title="INES Mapper 241">iNES Mapper 241</a>.
</p>
