<div class="mw-parser-output"><p><b>NES 2.0 Mapper 433</b> denotes the <b>NC-20MB</b> PCB, used for the <i>20-in-1 (CA-006)</i> multicart. It is almost identical to <a href="INES_Mapper_233.xhtml" title="INES Mapper 233">INES Mapper 233</a>, except that mirroring is selected just by single bit 6 (1=Horizontal).
</p>
