<div class="mw-parser-output"><p>iNES 2.0 Mapper 515 is used for 패밀리 노래방 <i>Family Noraebang</i>, a Korean karaoke cartridge that uses UNROM-style PRG banking, has provisions for an expansion cartridge, an ADC for Microphone input, and a clone of the Yamaha <a rel="nofollow" class="external text" href="https://en.wikipedia.org/wiki/Yamaha_YM2413">YM2413</a> chip for expansion audio: the K-663A.
</p>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$BFFF: 16 KB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: 16 KB PRG ROM bank, fixed to the last bank</li></ul>
<h2><span class="mw-headline" id="PRG-ROM_bankswitching">PRG-ROM bankswitching</span></h2>
<pre>Mask $E00F:
  W 8000: [RBBB BBBB] - R:0-select external ROM; 1-select internal ROM; B-select bank at $8000-$BFFF
                        $C000-$FFFF is always last bank of internal ROM
</pre>
<p>The board does not seem to suffer from bus conflicts. The existing ROM images are arranged similarly to <a href="INES_Mapper_188.xhtml" title="INES Mapper 188">INES Mapper 188</a>: The last 1 MiB of PRG-ROM are the main cartridge, the first (total PRG-ROM size minus 1 MiB) are the expansion cartridge.
</p>
<h2><span class="mw-headline" id="Expansion_sound">Expansion sound</span></h2>
<pre>Mask: $E003:
  W 6000: YM2413 index
  W 6001: YM2413 data
  R 6000: YM2413 read back test register contents
</pre>
<p>Note that the board does not allow the 2A03 audio to be mixed with the YM2413 output.
</p>
<h2><span class="mw-headline" id="Microphone_input">Microphone input</span></h2>
<pre>Mask: $E003:
   R 6003: [D... ....] - SPI (ADC) data
Mask not yet known:
   W C002: [S... ....] - SPI (ADC) chip select
   W C003: [K... ....] - SPI clock / ADC conversion clock
</pre>
