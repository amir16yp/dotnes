<div class="mw-parser-output"><p><b>NES 2.0 Mapper 270</b> denotes <a href="NES_2_0_Mapper_256.xhtml" title="NES 2.0 Mapper 256">OneBus</a> console multicarts that use the consoles' universal input/output (UIO) register $412C to bankswitch higher-order PRG address lines or several PRG chips, and select CHR-RAM via $4242.
</p>

<h1><span class="mw-headline" id="Submapper_0:_Combination">Submapper 0: Combination</span></h1>
<p>Responds to all bank bits of submappers 1-3 at the same time. This is permissible, since the only bit that is used by several submappers has the same function in each of them.
</p>
<h1><span class="mw-headline" id="Submapper_1:_Game_Prince_RS-16">Submapper 1: Game Prince RS-16</span></h1>
<h2><span id="Outer_PRG_Bank_.28.24412C.2C_write.29"/><span class="mw-headline" id="Outer_PRG_Bank_($412C,_write)">Outer PRG Bank ($412C, write)</span></h2>
<pre>D~7654 3210
  ---------
  .... ..A.
         +-- PRG/CHR A24
</pre>
<h1><span class="mw-headline" id="Submapper_2:_Family_Pocket_638-in-1">Submapper 2: Family Pocket 638-in-1</span></h1>
<h2><span id="Outer_PRG_Bank_.28.24412C.2C_write.29_2"/><span class="mw-headline" id="Outer_PRG_Bank_($412C,_write)_2">Outer PRG Bank ($412C, write)</span></h2>
<pre>D~7654 3210
  ---------
  .... ..AB
         |+- PRG/CHR A25
         +-- PRG/CHR A24
</pre>
<h2><span id="Jumper_Cartridge_Detection_.28.24412C.2C_read.29"/><span class="mw-headline" id="Jumper_Cartridge_Detection_($412C,_read)">Jumper Cartridge Detection ($412C, read)</span></h2>
<pre>D~7654 3210
  ---------
  .... B...
       +---- 0: Jumper cartridge not inserted
             1: Jumper cartridge inserted
</pre>
<h2><span id="CHR-RAM_enable_.28.244242.2C_write.29"/><span class="mw-headline" id="CHR-RAM_enable_($4242,_write)">CHR-RAM enable ($4242, write)</span></h2>
<pre>D~7654 3210
  ---------
  .... ...C
          +- 0: Use normal <a href="VT02__CHR_ROM_Bankswitching.xhtml" title="VT02+ CHR-ROM Bankswitching">OneBus CHR banking</a>
             1: Use 8 KiB of unbanked CHR-RAM
</pre>
<h1><span class="mw-headline" id="Submapper_3:_Bittboy_300-in-1">Submapper 3: Bittboy 300-in-1</span></h1>
<h2><span id="Outer_PRG_Bank_.28.24412C.2C_write.29_3"/><span class="mw-headline" id="Outer_PRG_Bank_($412C,_write)_3">Outer PRG Bank ($412C, write)</span></h2>
<pre>D~7654 3210
  ---------
  .... .A..
        +--- PRG/CHR A24
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Any $412C bit can only be read from if the corresponding bit in register $412B (UIO input/output selector) is set to &quot;0&quot; (input).</li>
<li>Any $412C bit can only be written to if the corresponding bit in register $412B (UIO input/output selector) is set to &quot;1&quot; (output).</li></ul>
