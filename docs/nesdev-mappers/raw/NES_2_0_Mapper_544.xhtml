<div class="mw-parser-output"><p>NES 2.0 Mapper 544 denotes the Waixing FS306 board, used for <i>覇王的大陸 (Bàwáng de Dàlù)</i>, which is their Chinese translation of Namco's <i>三国志 II: 覇王の大陸 (Sangokushi II: Haō no Tairiku)</i>. It is similar to <a href="INES_Mapper_253.xhtml" title="INES Mapper 253">INES Mapper 253</a> in combining a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone with a GAL chip that replaces a selectable two or four CHR banks with 2 KiB of CHR-RAM. It differs in the address lines to which the VRC4 responds, in adding a third selectable 8 KiB PRG-ROM bank, and in selecting the CIRAM bank for all four nametables independently.
</p><p>A later re-release of the game uses <a href="INES_Mapper_176.xhtml" title="INES Mapper 176">INES Mapper 176</a>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB fixed PRG-RAM bank (battery-backed)</li>
<li>CPU $8000-$9FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$DFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank, fixed to last bank</li>
<li>PPU $0000-$03FF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $0400-$07FF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $0800-$0BFF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $0C00-$0FFF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $1000-$13FF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $1400-$17FF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $1800-$1BFF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $1C00-$1FFF: 1 KiB switchable CHR-ROM/RAM bank</li>
<li>PPU $2000-$23FF: 1 KiB switchable CIRAM bank</li>
<li>PPU $2400-$27FF: 1 KiB switchable CIRAM bank</li>
<li>PPU $2800-$2BFF: 1 KiB switchable CIRAM bank</li>
<li>PPU $2C00-$2FFF: 1 KiB switchable CIRAM bank</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>The VRC4 clone's A0 and A1 inputs are connected to CPU A10 and A11, respectively. Subaddresses $000/$001/$002/$003 therefore become $000/$400/$800/$C00. The VRC4's External Select at $9C00 (pin 18) is used to select the third PRG-ROM bank and the CIRAM bank for all four nametables.
</p>
<h2><span class="mw-headline" id="VRC4_registers">VRC4 registers</span></h2>
<ul><li>PRG-ROM select #0 ($8000, write)</li>
<li>PRG-ROM select #1 ($A000, write)</li>
<li>CHR Select Low/High ($B000-$EFFF, write)</li>
<li>IRQ Control ($F000-$FFFF, write)</li></ul>
<p>These registers function identically to a normal <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>. Note that the game uses 512 KiB of CHR-ROM, which even the original VRC4 supported. The IRQ seems to occur one M2 cycle later than on an original VRC4.
</p>
<h2><span id="PRG-ROM_select_.232_.28.249C00.2C_write.29"/><span class="mw-headline" id="PRG-ROM_select_#2_($9C00,_write)">PRG-ROM select #2 ($9C00, write)</span></h2>
<pre>Mask: $9C04

D~7654 3210
  ---------
  ...P PPPP
     | ||||
     +-++++- Select 8 KiB PRG bank at $C000-$DFFF
</pre>
<h2><span id="CIRAM_select_.28.249C0C-.249C0F.2C_write.29"/><span class="mw-headline" id="CIRAM_select_($9C0C-$9C0F,_write)">CIRAM select ($9C0C-$9C0F, write)</span></h2>
<pre>Mask: $9C07

D~7654 3210
  ---------
  .... ...N
          +- Select 1 KiB CIRAM bank

$9C0C: Select 1 KiB CIRAM bank at PPU $2000-$23FF
$9C0D: Select 1 KiB CIRAM bank at PPU $2400-$27FF
$9C0E: Select 1 KiB CIRAM bank at PPU $2800-$2BFF
$9C0F: Select 1 KiB CIRAM bank at PPU $2C00-$2FFF
</pre>
<h2><span class="mw-headline" id="CHR-RAM_Bank_Selection">CHR-RAM Bank Selection</span></h2>
<p>The game writes, via the PPU, to specific CHR banks in order to select both which and how many CHR banks are mapped to RAM instead of ROM. Writes to CHR ROM in multiples of 1 KiB:
</p>
<pre>CHRB~[. 1Z.D L.L.]
        || | | |
        |+-|-+-+---------------- Select first bank and size of CHR RAM:
        || |                      $80 = $028-$02B, $128-$12B
        || |                      $82 = $000-$003, $100-$103
        || |                      $88 = $04C-$04F, $14C-$14F
        || |                      $8A = $064-$067, $164-$167
        || |                      $C0 = $046-$047, $146-$147
        || |                      $C2 = $07C-$07D, $17C-$17D
        || |                      $C8 = $004-$005, $104-$105
        || |                      $CA = only CHR ROM
        || +-------------------- If 1, ignore above and always enable CHR ROM / disable CHR RAM
        |+---------------------- Number of adjacent banks of CHR RAM, 0=four, 1=two
        +----------------------- Must be 1 
Power-on value: $80
</pre>
<p>The meanings are identical to <a href="INES_Mapper_195.xhtml" title="INES Mapper 195">INES Mapper 195</a> except for value $C8. The game uses different banks as CHR-RAM for different game situations, so the CHR-RAM Bank Selection feature must be emulated. Unlike Mapper 195, since there are only 2 KiB of CHR-RAM mounted on the circuit board, the 4 KiB settings cause CHR-RAM to be mirrored once, and all settings mapping the same 2 KiB of CHR-RAM.
</p>
