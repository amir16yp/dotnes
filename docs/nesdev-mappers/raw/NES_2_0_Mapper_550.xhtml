<div class="mw-parser-output"><p><b>NES 2.0 Mapper 550</b> denotes the <b>JY820845C</b> circuit board, used by the <i>7-in-1 1993 Chess Series (JY-015)</i> multicart. It combines an <a href="MMC1.xhtml" title="MMC1">MMC1</a> clone with a PAL for outer bank and optional MHROM inner bank switching.
</p>
<h2><span id="Outer_Bank_Register_.28.247000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($7000-$7FFF,_write)">Outer Bank Register ($7000-$7FFF, write)</span></h2>
<pre>Mask: $F000

A~FEDC BA98 7654 3210
  -------------------
  0111 .... .... LBBb
                 |+++- PRG A18..16 (MHROM mode)
                 |++-- PRG A18..17 (MMC1 mode)
                 |++-- CHR A16..15
                 |++-- 0-2: MHROM mode
                 |     3:   MMC1 mode
                 +---- 1: Lock outer bank register
</pre>
<p>In GNROM mode, the latch register selects the inner 2x32 KiB PRG and 4x8 CHR banks.
In MMC1 mode, the MMC1 selects the inner 4x32/8x16 KiB PRG and 4x8/8x4 KiB CHR banks.
The Outer Bank Register overlaps 8 KiB of WRAM in the $6000-$7FFF address range.
</p>
<h2><span id="MHROM_Latch_Register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="MHROM_Latch_Register_($8000-$FFFF,_write)">MHROM Latch Register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  ...P ..CC
     |   ++- CHR A14..13
     +------ PRG A15     
</pre>
<p>The MMC1 still sees the writes to the latch register in MHROM; as a result, the menu writes to the latch register five times to keep the MMC1's serial shift register in a consistent state, at least until the Outer Bank Register's Lock bit is set. It is not known whether the MHROM Latch Register suffers from bus conflicts.
</p><p>Nametable mirroring is decided the by MMC1 even in MHROM mode.
</p>
