<div class="mw-parser-output"><p>iNES Mapper 159 is used for <a href="Bandai_FCG_board.xhtml" class="mw-redirect" title="Bandai FCG">Bandai FCG</a> boards with an <a href="Bandai_LZ93D50_pinout.xhtml" title="Bandai LZ93D50 pinout">LZ93D50 ASIC</a> and a 128-byte serial EEPROM (X24C01). The 128 bytes must be denoted as PRG-NVRAM in the <a href="NES_2_0.xhtml" title="NES 2.0">NES 2.0</a> header using byte value $10.
</p>
<h1><span class="mw-headline" id="Game_List">Game List</span></h1>
<ul><li><i>Dragon Ball Z: Kyoushuu! Saiya-jin</i></li>
<li><i>Magical Taruruuto-kun: Fantastic World!!</i></li>
<li><i>Magical Taruruuto-kun 2: Mahou Daibouken</i></li>
<li><i>SD Gundam Gaiden - Knight Gundam Monogatari</i></li></ul>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$03FF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $0400-$07FF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $0800-$0BFF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $0C00-$0FFF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $1000-$13FF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $1400-$17FF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $1800-$1BFF: 1 KiB switchable CHR ROM bank</li>
<li>PPU $1C00-$1FFF: 1 KiB switchable CHR ROM bank</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>All registers function the same way as <a href="INES_Mapper_016.xhtml" title="INES Mapper 016">INES Mapper 016</a>, submapper 5, except that the serial EEPROM is not a 24C02 but Xicor's X24C01. This EEPROM has operational differences compared to both the larger 24C02 and other vendors' 24C01.  Bandai's developers consistently thought the X24C01 was a little-endian device, and their code clocks in address and data bytes assuming this. However, it's actually a big-endian device, and a multi-byte read or write from EEPROM will increment the address accordingly.
</p>
