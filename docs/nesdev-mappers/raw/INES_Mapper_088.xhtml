</head><body><h1>INES Mapper 088</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_088">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_088">other pages</a>

<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 088</a> is the same as <a href="INES_Mapper_206.xhtml" title="INES Mapper 206">mapper 206</a> with the following exception:
</p>
<ul><li>CHR support is increased to 128KB by connecting PPU's A12 line to the CHR ROM's A16 line.</li></ul>
<p>Consequently, CHR is split into two halves. $0xxx can only have CHR from the first 64K, $1xxx can only have CHR from the second 64K.
</p><p>A possible way to implement this would be to mask the CHR ROM 1K bank output from the mapper by ANDing with $3F, and then OR it with $40 for N108 registers 2, 3, 4, and 5.
</p><p>If the CHR ROM is 64K or smaller, it is identical to mapper 206.
</p><p>There are three games known to use this mapper:
</p>
<ul><li><a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/1576/quinty">Quinty (J)</a></li>
<li><a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/1828/namco-mahjong-iii-mahjong-tengoku">Namcot Mahjong 3 - Mahjong Tengoku</a></li>
<li><a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/2307/dragon-spirit-aratanaru-densetsu">Dragon Spirit - Aratanaru Densetsu</a></li></ul>
