<div class="mw-parser-output"><p>NES 2.0 Mapper 288 is used for two GKCX1 21-in-1 multicarts. Oddly, GoodNES 3.23b has them set to <a href="INES_Mapper_133.xhtml" title="INES Mapper 133">INES Mapper 133</a> even though it is entirely incompatible with that mapper.
</p>
<h1><span class="mw-headline" id="Address_latch">Address latch</span></h1>
<pre>A~1... .... ..MP PCCC
              || |+++- Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF
              |+-+---- Select 32 KiB CHR-ROM bank at CPU $8000-$FFFF
              -------- 0=V mirroring, 1=H mirroring
</pre>
