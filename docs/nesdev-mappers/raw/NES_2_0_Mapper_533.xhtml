<div class="mw-parser-output"><p>NES 2.0 Mapper 533 is used for the <b>Sachen 3014</b> board, used for the game <i>動動腦 II: 國中英文(一)</i> (Dòngdòngnǎo II: Guózhōng Yīngwén (I), also known as <i>Middle School English II</i>, SA-003). It's a <a href="CNROM.xhtml" title="CNROM">CNROM</a>-like board with the added ability to read back the latch content for protection purposes.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$FFFF: Fixed 32 KiB PRG-ROM bank</li>
<li>PPU $0000-$1FFF: Switchable 8 KiB CHR-ROM bank</li>
<li>Mirroring: hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="CHR_Bank_Select_and_Latch_Write_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="CHR_Bank_Select_and_Latch_Write_($8000-$FFFF,_write)">CHR Bank Select and Latch Write ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  LLLl ....
  ++++------ Set latched value that can be read back at $E000-$EFFF
     +------ Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF
</pre>
<h2><span id="Latch_Read_.28.24E000-.24EFFF.2C_Read.29"/><span class="mw-headline" id="Latch_Read_($E000-$EFFF,_Read)">Latch Read ($E000-$EFFF, Read)</span></h2>
<pre>Mask: $F000

D~7654 3210
  ---------
  .... LLLL
  |||| ++++- Latched value previously written to D4-D7 of $8000-$FFFF
  ++++------ value from ROM
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The board is subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a> when writing or reading. The software reads the latch ten times, assuming that after enough tries the driver will overpower the ROM.</li></ul>
