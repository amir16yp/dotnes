<div class="mw-parser-output"><p>iNES Mapper 114 is used for an <a href="MMC3.xhtml" title="MMC3">MMC3</a>-clone-bearing board with scrambled register addresses and indices, a 256 KiB outer CHR-ROM bank register,
and an NROM-like PRG-ROM register that can override the MMC3 clone's PRG-ROM bank.
</p>
<ul><li><b>Submapper 0</b>:
<ul><li><i>Aladdin</i> (SuperGame, not <i>Super Aladdin</i>, and not to be confused with <i>Aladdin</i> from J.Y. Company)</li>
<li><i>The Lion King</i> (SuperGame)</li>
<li><i>Pocohontos</i> (Hosenkan, not to be confused with <i>Pocahontas Part 2</i> from SuperGame)</li>
<li><i>Super Donkey Kong</i> (Hosenkan)</li></ul></li>
<li><b>Submapper 1</b> (different scrambling pattern):
<ul><li><i>Boogerman</i> (SuperGame, not to be confused with <i>Boogerman II</i> by Rex Soft)</li></ul></li></ul>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="NROM_Override_Register_.28.246000.29"/><span class="mw-headline" id="NROM_Override_Register_($6000)">NROM Override Register ($6000)</span></h2>
<pre>Mask: Probably $E001

D~7654 3210
  ---------
  M.S. BBBb
  | |  ++++- Select 16 KiB PRG-ROM bank at CPU
  | |        $8000-$BFFF and $C000-$FFFF
  | +------- 0: Do not replace bit 0 (NROM-128)
  |          1: Replace bit 0 with CPU A14 (NROM-256)
  +--------- 0: Use PRG bank from MMC3; ignore $6000 bits 0-3/5
             1: Ignore PRG bank from MMC3; apply $6000 bits 0-3/5
</pre>
<h2><span id="Outer_CHR-ROM_Bank_Register_.28.246001.29"/><span class="mw-headline" id="Outer_CHR-ROM_Bank_Register_($6001)">Outer CHR-ROM Bank Register ($6001)</span></h2>
<pre>Mask: Probably $E001

D~7654 3210
  ---------
  .... ...+- Select 256 KiB CHR-ROM bank at PPU $0000-$1FFF
</pre>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<h3><span class="mw-headline" id="Submapper_0">Submapper 0</span></h3>
<pre>Address written   MMC3 register meant
---------------   -------------------
$8000             $A001
$8001             $A000
$A000             $8000
$A001             $C000
$C000             $8001
$C001             $C001
$E000             $E000
$E001             $E001
</pre>
<pre>$8000 index written   MMC3 register meant
-------------------   -------------------
0                     0
1                     3
2                     1
3                     5
4                     6
5                     7
6                     2
7                     4
</pre>
<h3><span class="mw-headline" id="Submapper_1">Submapper 1</span></h3>
<pre>Address written   MMC3 register meant
---------------   -------------------
$8000             $A001
$8001             $8001
$A000             $8000
$A001             $C001
$C000             $A000
$C001             $C000
$E000             $E000
$E001             $E001
</pre>
<pre>$8000 index written   MMC3 register meant
-------------------   -------------------
0                     0
1                     2
2                     5
3                     3
4                     6
5                     1
6                     7
7                     4
</pre>
<p>Bits 6 and 7 of the value written to $8000 are unchanged. See <a href="MMC3.xhtml" title="MMC3">MMC3</a> for further details.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Unlike many similar mappers, the $600x registers are not connected to the MMC3 clone's WRAM interface and thus function regardless of whether WRAM is enabled or not.</li>
<li>IRQ behavior resembles that of the MMC3A, i.e. a latch value of zero disables the IRQ, on which <i>Aladdin</i> depends.</li>
<li>Previous descriptions of Mapper 114/182 claim that a write to address $C001 is equivalent to writing both to an MMC3's $C000 and $C001 registers, and that writing to $A001 has no effect. A comparison of <i>Aladdin</i> (Mapper 114) and the <i>Super Aladdin</i> (Mapper 4, by the same developer) however indicates a one-to-one mapping, provided that MMC3A-like IRQ behavior is enforced.</li></ul>
<h1><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h1>
<ul><li><a href="INES_Mapper_115.xhtml" title="INES Mapper 115">INES Mapper 115</a> has the same $6000 and $6001 registers, but does not scramble MMC3 register addresses and indices. Also, Mapper 115's IRQ behavior resembles that of the MMC3C, i.e. a latch value of zero causes an IRQ on every scanline, on which the Chinese version of <i>幽☆遊☆白書 Final</i> (Yuu Yuu Hakusho Final) depends.</li>
<li><a href="INES_Mapper_123.xhtml" title="INES Mapper 123">INES Mapper 123</a> moves the $6000 register to $5800 while rearranging its bits and drops the outer CHR-ROM bank register at $6001 as well as register address scrambling while retaining index register scrambling (using the same pattern).</li>
<li><a href="INES_Mapper_114.xhtml" class="mw-redirect" title="INES Mapper 182">INES Mapper 182</a> is a duplicate of Mapper 114. In fact, FCEUX explicitly reassigns Hosenkan's Mapper 182 ROMs to Mapper 114. Because Hosenkan's games make no use of the $6000-$6001 registers, other than writing zero to both of them on startup, some implementations (such as the EverDrive N8's) do not emulate the $600x registers.</li>
<li><a href="INES_Mapper_215.xhtml" title="INES Mapper 215">INES Mapper 215</a> extends and moves $6000/$6001 to $5000/$5001, and makes the MMC3 register address and index scrambling pattern selectable via $5007.</li></ul>
