<div class="mw-parser-output"><p><b>NES 2.0 Mapper 521</b> is used for <i>장두진 바둑교실: 입문편</i>, commonly known as <i>Korean Igo</i>. Its UNIF board name is <b>DREAMTECH01</b>, without prefix.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB fixed PRG-ROM bank (last bank in ROM file)</li>
<li>PPU $0000-$1FFF: 8 KiB of unbanked CHR-RAM.</li></ul>
<p>Mirroring is hard-wired.
</p><p>Since the fixed PRG-ROM bank comes from a separate PRG-ROM chip, the ROM file can have a non-power-of-two size.
</p>
<h1><span id="Bank_Register_.28.245020.2C_write.29"/><span class="mw-headline" id="Bank_Register_($5020,_write)">Bank Register ($5020, write)</span></h1>
<pre>Mask: $F030
D~[.... BBBB]
        ++++- PRG A18..14 when CPU A14=0
</pre>
<p>Note that writes to $5030 are ignored.
</p>
