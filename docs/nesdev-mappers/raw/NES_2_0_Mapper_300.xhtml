<div class="mw-parser-output"><p>NES 2.0 Mapper 300 is used for <i>Golden 190-in-1</i> multicart. Its UNIF board name is <b>BMC-190in1</b>. It is similar to <a href="INES_Mapper_214.xhtml" title="INES Mapper 214">INES Mapper 214</a> except that mirroring is selectable
</p>
<h2><span id="Address_latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Address_latch_($8000-$FFFF)">Address latch ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  .... .... ...G GG.M
               | || +- Select nametable mirroring type
               | ||     0: Vertical
               | ||     1: Horizontal
               +-++--- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF mirrored at $C000-$FFFF
                       and 8 KiB CHR-ROM bank at PPU $0000-$1FFF
</pre>
