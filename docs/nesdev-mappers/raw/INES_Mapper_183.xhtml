<div class="mw-parser-output"><p><a class="mw-selflink selflink">INES Mapper 183</a> was supposedly assigned to represent the pirate port of Gimmick! known as <a rel="nofollow" class="external text" href="https://www.youtube.com/watch?v=_aFZ52pZh2E">Suikan Pipe</a>.
</p><p>According to Nestopia's source, this is very similar to the <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4e</a> variant, but the PRG banking registers are a little different:
</p>
<pre> Mask: $F80C
 
 $8800: PRG at $8000-$9FFF
 $A800: PRG at $A000-$BFFF
 $A000: PRG at $C000-$DFFF
 $9800: standard VRC4 mirroring control
</pre>
<p>CHR and IRQ are the same as VRC4e.
</p>
