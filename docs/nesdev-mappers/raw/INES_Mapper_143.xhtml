<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 143</a> denotes an NROM circuit board with a simple form of protection:
</p>
<ul><li><i>Dancing Blocks</i></li>
<li><i>Magical Mathematics</i> (NTSC version only)</li></ul>
<p>The functional description is consistent with a <a href="74138.xhtml" title="74138">74138</a> and a 74368.
</p><p>Reads from these addresses produce this output:
</p>
<pre>A:[010. ...1 ..DD DDDD] -&gt; [xxii iiii]
               || ||||      |||| ||||
               ++-++++------||++-++++-- reads provide the logical inversion of DDDDDD in the bits iiiiii
                            ++--------- open bus
</pre>
<p>Nestopia additionally implies that at least <i>Dancing Blocks</i> relies extensively on the values of uninitialized memory, and so manually sets the emulated console's 2K of internal RAM to a different pattern than Nestopia's default.
</p>
