<div class="mw-parser-output"><p>iNES 2.0 Mapper 513 is used for 美少女 夢工場三 (Měi Shàonǚ Mèng Gōngchǎng III), an unauthorized port by Sachen of one of the Princess Maker games. Its UNIF board name is <b>UNL-SA-9602B</b>. It uses a standard <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with 32 KiB battery-backed CHR-RAM, no CHR-ROM, and the MMC3's CHR bank register bits 6 and 7 repurposed as 512 KiB outer PRG bank numbers.
</p>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$9FFF (or $C000-$DFFF): 8 KB switchable PRG ROM bank; outer bank is applied</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank; outer bank is applied</li>
<li>CPU $C000-$DFFF (or $8000-$9FFF): 8 KB PRG ROM bank, fixed to the second-last bank; outer bank is NOT applied</li>
<li>CPU $E000-$FFFF: 8 KB PRG ROM bank, fixed to the last bank; outer bank is NOT applied</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>All same as normal MMC3, except that the CHR Bank Select registers ($8000 values 0-5) have a slightly different meaning:
</p>
<pre>7  bit  0
---- ----
PP.C CCCC
|| +-++++-- Select 1 KiB CHR-RAM bank
++--------- Select 512 KiB PRG-ROM bank (outer bank)
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>The two fixed 8 KiB PRG Banks ($C000-$DFFF or $8000-$9FFF, $E000-$FFFF) are hard-wired to 512 KiB outer bank 0.</li>
<li>The current dump of the game has a PRG ROM size of 1536 KiB. FCEUX emulates outer PRG ROM bank 3 being identical to bank 2. On real hardware, selecting bank 3 would activate two memory chips at the same time, which may potentially damage them.</li>
<li>As with <a href="MMC1.xhtml#SOROM.2C_SUROM_and_SXROM" title="MMC1">SOROM, SUROM and SXROM</a>, if the several CHR bank registers do not specify the same outer PRG ROM bank, then PRG ROM presumably would be bankswitched as the PPU renders.</li>
<li><a rel="nofollow" class="external text" href="http://forums.nesdev.org/viewtopic.php?f=9&amp;p=219216">PCB image and analysis</a></li></ul>
