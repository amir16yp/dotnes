<div class="mw-parser-output"><p><b>NES 2.0 Mapper 471</b> denotes the <b>Impact Soft IM1</b> circuit board, used for <i>Haratyler</i> (without <i>HG</i> or <i>MP</i>) and <i>Haraforce</i>. It is basically <a href="INES_Mapper_201.xhtml" title="INES Mapper 201">INES Mapper 201</a> with the addition of a scanline IRQ.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$FFFF: 32 KiB switchable PRG ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR ROM bank</li>
<li>Nametable mirroring: hard-wired, selectable via solder pad</li></ul>
<h1><span id="Address_Latch.2FAcknowledge_IRQ_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch/Acknowledge_IRQ_($8000-$FFFF,_write)">Address Latch/Acknowledge IRQ ($8000-$FFFF, write)</span></h1>
<pre>A~[1... .... .... ...B]
                     +- Select PRG A15 and CHR A13
</pre>
<p>Writing to this latch acknowledges a pending IRQ.
</p>
<h1><span class="mw-headline" id="Scanline_IRQ">Scanline IRQ</span></h1>
<p>On every falling edge of PPU A12, an IRQ is raised that, unless interrupts are disabled in the CPU flag register, must be acknowledged by writing to the address latch. No filtering is performed; it is assumed that the interrupt handler will take long enough to execute so that it gets to be executed only once per scanline.
</p>
