<div class="mw-parser-output"><p><b>NES 2.0 Mapper 554</b> denotes the Kaiser <b>KS-7010</b> circuit board, used for one of several cartridge conversions of the FDS version of <i>悪魔城 Dracula</i>, the Japanese version of <i>Castlevania</i>. Bankswitching is unusual in being triggered entirely through <i>reads</i> from &quot;magic&quot; addresses. The board mounts 128 KiB PRG-ROM, 128 KiB CHR-ROM, a KS-201 ASIC and a 74'32.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB PRG-ROM bank</li>
<li>CPU $8000-$9FFF: Fixed 8 KiB PRG-ROM bank #10</li>
<li>CPU $A000-$BFFF: Fixed 8 KiB PRG-ROM bank #11</li>
<li>CPU $C000-$DFFF: Fixed 8 KiB PRG-ROM bank #6</li>
<li>CPU $E000-$FFFF: Fixed 8 KiB PRG-ROM bank #7</li>
<li>PPU $0000-$1FFF: Switchable 8 KiB CHR-ROM bank</li>
<li>Nametable mirroring: hard-wired (to vertical)</li></ul>
<h1><span class="mw-headline" id="Bankswitching_Reads">Bankswitching Reads</span></h1>
<p>The 8 KiB PRG-ROM bank at $6000, and the 8 KiB CHR-ROM bank, are both switched to the same bank number whenever certain addresses are read from.
</p>
<pre>A~FEDC BA98 7654 3210
  -------------------
  .??? ???? ??DC BA1.
              ++-++--- PRG/CHR A16..13
</pre>
<p>The exact address mask is not known; the following addresses have been verified to trigger a bankswitch, and are used by the game:
</p>
<ul><li>CAB6-CAD6</li>
<li>EBE2, EE32</li>
<li>FFFC</li></ul>
<h1><span class="mw-headline" id="ASIC_connection">ASIC connection</span></h1>
<p>See: <a href="KS_201_pinout.xhtml" title="KS-201 pinout">KS-201 pinout</a>
</p>
