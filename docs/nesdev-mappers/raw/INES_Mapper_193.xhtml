<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 193</a> represents boards that use <a href="https://en.wikipedia.org/wiki/NTDEC" class="extiw" title="wikipedia:NTDEC">NTDEC</a>'s <a href="NTDEC_TC_112_pinout.xhtml" title="NTDEC TC-112 pinout">TC-112 mapper IC</a>.
</p>
<pre> Example Game:
 --------------------------
 Fighting Hero (Unl)
 <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/4247">War in the Gulf</a> &amp; <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/4248">(Brazilian release)</a>
 
 Registers:
 ---------------------------
 Regs at $6000-7FFF = no SRAM
 
 Range,Mask:   $6000-7FFF, $E007
 
   $6000:  [CCCC CC..] CHR Reg 0
   $6001:  [CCCC CCC.] CHR Reg 1
   $6002:  [CCCC CCC.] CHR Reg 2
   $6003:  [.... PPPP] PRG Reg
   $6004:  [.... ...M] Mirroring
     0 = Vert (A10)
     1 = Horz (A11)
</pre>
<p>No games are known to rely on changing mirroring at run-time. At least some games have hard-wired mirroring.
</p>
<pre> CHR Setup:
 ---------------------------
 
       $0000   $0400   $0800   $0C00   $1000   $1400   $1800   $1C00 
     +-------------------------------+---------------+---------------+
     |           &lt;&lt;$6000&gt;&gt;           |    &lt;$6001&gt;    |    &lt;$6002&gt;    |
     +-------------------------------+---------------+---------------+
 
 PRG Setup:
 ---------------------------
 
       $8000   $A000   $C000   $E000  
     +-------+-------+-------+-------+
     | $6003 | { -3} | { -2} | { -1} |
     +-------+-------+-------+-------+
</pre>
<p>See also: <a rel="nofollow" class="external free" href="https://forums.nesdev.org/viewtopic.php?t=19751">https://forums.nesdev.org/viewtopic.php?t=19751</a>
</p>
