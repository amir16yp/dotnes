<div class="mw-parser-output"><p><b>iNES Mapper 058</b> is used for a number of simple NROM-/CNROM-based multicarts:
</p>
<ul><li><i>21-in-1 (AS-5321)</i></li>
<li><i>50-in-1 (WQ1806 B)</i></li>
<li><i>55-in-1 (WQ2006 B)</i></li>
<li><i>68-in-1 (HKX5268)</i></li>
<li><i>75-in-1 (WQ1905 E)</i></li>
<li><i>86-in-1 (AP-5486)</i></li>
<li><i>92-in-1 (WQ1605 E)</i></li>
<li><i>97-in-1 (WQ1708 B)</i></li></ul>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1... .... MSCC CPPP
            |||| |+++- PRG A16..A14
            ||++-+---- CHR A15..A13
            |+-------- PRG Mode
            |           0: NROM-256 (PRG A14=CPU A14)
            |           1: NROM-128
            +--------- Nametable mirroring
                        0: Vertical
                        1: Horizontal
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li><a href="INES_Mapper_213.xhtml" title="INES Mapper 213">INES Mapper 213</a> is a duplicate.</li></ul>
