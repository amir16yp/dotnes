<div class="mw-parser-output"><p>NES 2.0 Mapper 260 is used for HP10xx/HP20xx multicarts. It is a predecessor to <a href="INES_Mapper_176.xhtml" title="INES Mapper 176">FK23C</a>, both in its register layout, and the fact that
several multicarts exist in HPxx and FK23C versions. Its UNIF board names are <b>BMC-HPxx</b> and <b>BMC-HP2018-A</b>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="DIP_Switch_.28.245000.2C_read.29"/><span class="mw-headline" id="DIP_Switch_($5000,_read)">DIP Switch ($5000, read)</span></h2>
<pre>Mask: Unknown

7654 3210
---------
.... ..DD
       ++- DIP Switch Setting

</pre>
<h2><span id="Mode_Register_.28.245000.2C_write.29"/><span class="mw-headline" id="Mode_Register_($5000,_write)">Mode Register ($5000, write)</span></h2>
<pre>Mask: $F003

7654 3210
---------
L... .MMM
|     +++- Select banking mode
|          0: MMC3: 256 KiB PRG, 256 KiB CHR
|          1: MMC3: 256 KiB PRG, 128 KiB CHR
|          2: MMC3: 128 KiB PRG, 256 KiB CHR
|          3: MMC3: 128 KiB PRG, 128 KiB CHR
|          4: NROM-128: 16 KiB PRG (mirrored at $8000 and $C000), 8 KiB CHR
|          5: NROM-256: 32 KiB PRG, 8 KiB CHR
|          6: CNROM: 32 KiB PRG, 16 KiB CHR
|          7: CNROM: 32 KiB PRG, 32 KiB CHR
+--------- 1= Lock, do not respond to further writes in the $5xxx range

</pre>
<p>In MMC3 modes, the final PRG/CHR bank number is the result of masking the MMC3 bank register content according to the specified size (128 or 256 KiB) and OR'ing with
the opposite-masked content of the PRG ($5001) and CHR ($5002) Base registers. In the CNROM modes, the inner bank comes from the CNROM Latch (one bit only in 16 KiB CHR mode,
two bits in 32 KiB CHR mode) OR'ed with the opposite-masked content of the CHR ($5002) Base register.
</p><p>The nametable arrangement/mirroring is determined by MMC3 register A000 only in modes 0-3. In modes 4-7, it is determined by the <a href="#CNROM/Nametable_Arrangement_Latch_(%248000-%24FFFF,_write)">latch</a>'s M bit..
</p>
<h2><span id="PRG_Base_Register_.28.245001.2C_write.29"/><span class="mw-headline" id="PRG_Base_Register_($5001,_write)">PRG Base Register ($5001, write)</span></h2>
<pre>Mask: $F003

7654 3210
---------
..PP PPPP
  ++-++++- Select 16 KiB PRG Base
  
</pre>
<h2><span id="CHR_Base_Register_.28.245002.2C_write.29"/><span class="mw-headline" id="CHR_Base_Register_($5002,_write)">CHR Base Register ($5002, write)</span></h2>
<pre>Mask: $F003

7654 3210
---------
.PPP PPPP
 +++-++++- Select 8 KiB CHR Base
 
</pre>
<h2><span id="CNROM.2FNametable_Arrangement_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="CNROM/Nametable_Arrangement_Latch_($8000-$FFFF,_write)">CNROM/Nametable Arrangement Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

7654 3210
---------
.... .MLL
      |++- Select 8 KiB Inner CHR Bank in CNROM modes
      +--- Nametable arrangement
           0: Horizontal arrangement/Vertical mirroring
           1: Vertical arrangement/Horizontal mirroring
</pre>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF,_write)">MMC3-compatible registers ($8000-$FFFF, write)</span></h2>
<pre>Mask: $E001

$8000, $8001, $A000, $A001, $C000, $C001, $E000, $E001: As normal <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The description of CNROM mode is based on the FCEUX source code. None of the available ROM images actually use it; instead, the games on those multicarts that originally were CNROM have all been modified to directly modify the CHR Base register ($5002).</li>
<li>WRAM at $6000-$7FFF is supported.</li>
<li>The KY6009 6-in-1 multicart menu times its music by polling $2002 bit 7 but does not take the <a href="NMI.xhtml#Race_condition" title="NMI">race condition</a> into account. As a result, its music is audibly slowed down irregularly when played on an original NES/Famicom console.</li></ul>
