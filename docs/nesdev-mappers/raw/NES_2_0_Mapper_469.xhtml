<div class="mw-parser-output"><p><b>NES 2.0 Mapper 469</b> denotes BlazePro multicarts consisting of games originally released for the Famicom Disk System. The circuit board is physically identical to <a href="NES_2_0_Mapper_468.xhtml" title="NES 2.0 Mapper 468">NES 2.0 Mapper 468</a>, but the CPLD is programmed differently.
</p>
