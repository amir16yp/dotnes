<div class="mw-parser-output"><p><b>NES 2.0 Mapper 404</b> denotes the <b>JY012005</b> <a href="MMC1.xhtml" title="MMC1">MMC1</a>-based multicart circuit board, used only for the <i>1998 Super HiK 8-in-1 (JY-021B)</i> multicart.
</p>
<h2><span id="Outer_Bank_and_Mode_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($6000-$7FFF,_write)">Outer Bank and Mode Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  LM.. ?BBb
  ||   |+++- PRG/CHR A19..A17
  ||   +---- Always set to 1 by the menu
  |+-------- 0: PRG A17=MMC1 A17 (256 KiB inner PRG bank)
  |          1: PRG A17=b        (128 KiB inner PRG bank)
  +--------- 1: Lock outer bank register

Power-on value: $00
</pre>
<h2><span id="MMC1-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC1-compatible_registers_($8000-$FFFF)">MMC1-compatible registers ($8000-$FFFF)</span></h2>
<p>Mask: $E000
</p><p>See <a href="MMC1.xhtml" title="MMC1">MMC1</a>.
</p>
