<div class="mw-parser-output"><p>NES 2.0 Mapper 302 is used for Kaiser's ROM cartridge conversion of the Japanese Famicom Disk System version of <i>Gyruss</i>. Its UNIF board name is <b>UNL-KS7057</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$67FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $6800-$6FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $7000-$77FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $7800-$7FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $8000-$87FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $8800-$8FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $9000-$97FF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $9800-$9FFF: 2 KiB switchable PRG-ROM bank</li>
<li>CPU $A000-$BFFF: 8 KiB fixed PRG-ROM bank #$0D</li>
<li>CPU $C000-$FFFF: 16 KiB fixed PRG-ROM bank #$07</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Mirroring_select_.28.248000-.249FFF.29"/><span class="mw-headline" id="Mirroring_select_($8000-$9FFF)">Mirroring select ($8000-$9FFF)</span></h2>
<pre>Mask: unknown, probably $E000

D~7654 3210
  ---------
  .... ...M
          +- Select nametable mirroring type
             0: Vertical
             1: Horizontal
</pre>
<h2><span id="PRG-ROM_Bank_.28.24B000-.24E003.29"/><span class="mw-headline" id="PRG-ROM_Bank_($B000-$E003)">PRG-ROM Bank ($B000-$E003)</span></h2>
<pre>Mask: unknown, probably $F003

A~FEDC BA98 7654 3210
  -------------------
  1RRR .... .... ..RN
   |||             |+- 0: Select low nibble
   |||             |   1: Select high nibble
   +++-------------+-- Select register number
                       $B000/$B001: Set 2 KiB PRG-ROM bank at CPU $8000-$87FF
                       $B002/$B003: Set 2 KiB PRG-ROM bank at CPU $8800-$8FFF
                       $C000/$C001: Set 2 KiB PRG-ROM bank at CPU $9000-$97FF
                       $C002/$C003: Set 2 KiB PRG-ROM bank at CPU $9800-$9FFF
                       $D000/$D001: Set 2 KiB PRG-ROM bank at CPU $6000-$67FF
                       $D002/$D003: Set 2 KiB PRG-ROM bank at CPU $6800-$6FFF
                       $E000/$E001: Set 2 KiB PRG-ROM bank at CPU $7000-$77FF
                       $E002/$E003: Set 2 KiB PRG-ROM bank at CPU $7800-$7FFF
</pre>
