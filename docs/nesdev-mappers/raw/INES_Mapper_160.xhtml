<div class="mw-parser-output"><p><b>iNES Mapper 160</b> appeared to describe variant behavior of <a href="J_Y__Company_ASIC.xhtml" class="mw-redirect" title="INES Mapper 090">iNES Mapper 090</a>, but Mapper 90 fully encompasses the behavior Mapper 160 was intended to emulate.
</p>
