<div class="mw-parser-output"><p>NES 2.0 Mapper 297 denotes the TXC 01-22110-000 board, used for the multicart <i>2-in-1 Uzi Lightgun</i> (MGC-002). Its hardware can function as an <a href="MMC1.xhtml" title="MMC1">MMC1</a> or as <a href="INES_Mapper_070.xhtml" title="INES Mapper 070">INES Mapper 070</a>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Mode_register_.28.244120.29"/><span class="mw-headline" id="Mode_register_($4120)">Mode register ($4120)</span></h2>
<p>Mask: $E100
</p>
<pre>7654 3210
---------
.... ..AM
       |+- Mapper mode and outer 128 KiB PRG/CHR-ROM bank
       |   0: <a href="INES_Mapper_070.xhtml" title="INES Mapper 070">Mapper 70</a>, Latch at $8000-$FFFF, PRG/CHR A17=0
       |   1: <a href="MMC1.xhtml" class="mw-redirect" title="INES Mapper 001">Mapper 1</a>, MMC1-compatible registers at $8000-$FFFF, PRG/CHR A17=1
       +-- PRG A16 in Mapper 70 mode
</pre>
<h2><span id="Data_latch_in_Mapper_70_mode_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Data_latch_in_Mapper_70_mode_($8000-$FFFF)">Data latch in Mapper 70 mode ($8000-$FFFF)</span></h2>
<p>See <a href="INES_Mapper_070.xhtml" title="INES Mapper 070">INES Mapper 070</a>.
</p>
<h2><span id="MMC1_registers_in_Mapper_1_mode_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC1_registers_in_Mapper_1_mode_($8000-$FFFF)">MMC1 registers in Mapper 1 mode ($8000-$FFFF)</span></h2>
<p>See <a href="MMC1.xhtml" class="mw-redirect" title="INES Mapper 001">INES Mapper 001</a>.
</p>
<h1><span class="mw-headline" id="Nametable_mirroring">Nametable mirroring</span></h1>
<p>Mirroring is fixed to Vertical by way of an additional wire connecting CIRAM A10 to PA10.
</p>
