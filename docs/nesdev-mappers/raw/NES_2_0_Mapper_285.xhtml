<div class="mw-parser-output"><p><b>NES 2.0 Mapper 285</b> is used for the <i>A65AS</i> and <i>JY-066</i> multicarts. The UNIF board name for both incompatible variants is <b>BMC-A65AS</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: In 16 KiB mode: 16 KiB switchable inner bank, 128 KiB switchable outer bank</li>
<li>CPU $C000-$FFFF: In 16 KiB mode: 16 KiB fixed inner bank 7, 128 KiB switchable outer bank</li>
<li>CPU $8000-$FFFF: In 32 KiB mode: 32 KiB switchable bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span id="Data_Latch_.28CPU_.248000-.24FFFF.29"/><span class="mw-headline" id="Data_Latch_(CPU_$8000-$FFFF)">Data Latch (CPU $8000-$FFFF)</span></h1>
<h2><span id="A65AS_.28Submapper_0.29"/><span class="mw-headline" id="A65AS_(Submapper_0)">A65AS (Submapper 0)</span></h2>
<pre>Bit 7654 3210
    ---------
    SPMO OBBB
    |||| |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF in 16 KiB mode (bit 6=0)
    |||| |++-- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF in 32 KiB mode (bit 6=1)
    |||+-+---- Select 128 KiB outer PRG-ROM bank at CPU $8000-$FFFF in 16 KiB mode (bit 6=0)
    ||+------- Select nametable mirroring
    ||         0: Vertical (bit 7=0)/Single-screen, page 0 (bit 7=1)
    ||         1: Horizontal (bit 7=0)/Single-screen, page 1 (bit 7=1)
    |+-------- Select PRG banking mode
    |          0: 16 KiB
    |          1: 32 KiB
    +--------- Select nametable mirroring type
               0: Horizontal/vertical (selected via bit 3)
               1: Single-screen (selected via bit 5)
</pre>
<h2><span id="JY-066_.28Submapper_1.29"/><span class="mw-headline" id="JY-066_(Submapper_1)">JY-066 (Submapper 1)</span></h2>
<pre>Bit 7654 3210
    ---------
    SPMO HBBB
    |||| |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF in 16 KiB mode (bit 6=0)
    |||| |++-- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF in 32 KiB mode (bit 6=1)
    |||| +---- Select nametable mirroring if bit 7=0
    ||||       0: Vertical
    ||||       1: Horizontal
    ||++------ Select 128 KiB outer PRG-ROM bank at CPU $8000-$FFFF in 16 KiB mode (bit 6=0)
    ||+------- Select nametable mirroring if bit 7=1
    ||         0: Single-screen, page 0
    ||         1: Single-screen, page 1
    |+-------- Select PRG banking mode
    |          0: 16 KiB
    |          1: 32 KiB
    +--------- Select nametable mirroring type
               0: Horizontal/vertical (selected via bit 3)
               1: Single-screen (selected via bit 5)
</pre>
