<div class="mw-parser-output"><p><b>NES 2.0 Mapper 424</b> denotes the circuit board used for the <i>Lexibook Retro TV Game Console</i> plug'n play consoles. It extends the <a href="VTxx.xhtml" title="VTxx">VT369</a>'s 32 MiB address space to 64 MiB through an outer bank register at $411E.
</p>
