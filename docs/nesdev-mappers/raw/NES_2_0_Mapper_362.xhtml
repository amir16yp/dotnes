From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_362">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_362">other pages</a>

<div class="mw-parser-output"><p>NES 2.0 Mapper 362 is used for an early VRC4-clone-based multicart PCB (830506C) from J.Y. Company, preceding the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>:
</p>
<ul><li><i>1995 Super HiK 4-in-1 (JY-005)</i></li></ul>
<p>The <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone is wired in the VRC4f configuration, i.e. address 0x001s to A0 and address 0x002s to A1. As each individual game on that multicart only has 128 KiB of PRG/CHR-ROM, the two highest CHR-ROM bank bits are repurposed as outer bank bits:
</p>
<h3><span id="CHR_Select_0_high_.28.24B001.29"/><span class="mw-headline" id="CHR_Select_0_high_($B001)">CHR Select 0 high ($B001)</span></h3>
<pre>7  bit  0
---------
...O OLLL
   | |+++- Select D4..D6 KiB of 1 KiB CHR-ROM bank at PPU $0000-$03FF
   +-+---- Select outer 128 KiB PRG/CHR-ROM bank when PPU $0000-$03FF is accessed
</pre>
<ul><li>The high CHR Select register ($B004) is ignored.</li>
<li>The other seven high CHR bank select registers continue the pattern for the other seven 1 KiB PPU banks.</li></ul>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>As with <a href="MMC1.xhtml#SOROM.2C_SUROM_and_SXROM" title="MMC1">SOROM, SUROM and SXROM</a>, if the several CHR bank registers do not specify the same outer bank, then PRG-ROM will would be bankswitched as the PPU renders.</li>
<li>As with <a href="NES_2_0_Mapper_298.xhtml" title="NES 2.0 Mapper 298">NES 2.0 Mapper 298</a>, the VRC4 clone's F003 register only acknowledges IRQs but does not move the 'A' control bit to the 'E' control bit.</li></ul>
