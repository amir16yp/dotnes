<p><b>iNES Mapper 003</b> is used to designate the <a href="CNROM.xhtml" title="CNROM">CNROM</a> board, and similar boards used by Bandai, Panesian, Sachen and others, generalized to support up to 256 banks (2048 KiB) of CHR ROM.
</p><p>The <a href="NROM_368.xhtml" title="NROM-368">CNROM-368</a> extension was proposed, allowing 46 KiB PRG ROM.
</p><p>Example games:
</p>
<ul><li><i>Solomon's Key</i></li>
<li><i>Arkanoid</i></li>
<li><i>Arkista's Ring</i></li>
<li><i>Bump 'n' Jump</i></li>
<li><i>Cybernoid</i></li></ul>

<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: 16 KiB or 32 KiB</li>
<li>PRG ROM bank size: Not bankswitched</li>
<li>PRG RAM: None</li>
<li>CHR capacity: Up to 2048 KiB ROM</li>
<li>CHR bank size: 8 KiB</li>
<li>Nametable <a href="Mirroring.xhtml" title="Mirroring">mirroring</a>: Fixed vertical or horizontal mirroring</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: Yes (CNROM), but not all compatible boards have bus conflicts.</li></ul>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Bank_select_($8000-$FFFF)">Bank select ($8000-$FFFF)</span></h3>
<pre>7  bit  0
---- ----
cccc ccCC
|||| ||||
++++-++++- Select 8 KB CHR ROM bank for PPU $0000-$1FFF
</pre>
<p>CNROM only implements the lowest 2 bits, capping it at 32 KiB CHR. Other boards may implement 4 or more bits for larger CHR.
</p>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<p>Mapper 3 is normally subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>, where the value seen by the mapper is actually the bitwise AND of the value written by the CPU and the ROM value at that address. Games normally work around this by ensuring the two values are identical. However, the game <i>Cybernoid</i> relies on bus conflicts. Without bus conflicts, the wrong CHR bank will be loaded when the player changes the audio from sound effects to music playback. <i>Cybernoid</i> also uses uninitialized RAM, which can be responsible for behavior differences between hardware and emulator.
</p><p>While bus conflicts are standard, there exist hacks that rely on the absence of bus conflicts. These include Nintendo's updated version of <i>Donkey Kong</i> with the pie factory level and some mapper hacks, such as a common hack of <i>Colorful Dragon (Unl) (Sachen)</i> that changes it from <a href="NINA_003_006.xhtml" class="mw-redirect" title="INES Mapper 079">INES Mapper 079</a> to Mapper 3. Emulating these with bus conflicts will cause the wrong CHR bank to be loaded. Where necessary, NES 2.0 is capable of specifying that a game should be emulated without bus conflicts.
</p><p>The <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/3953/family-trainer-3-aerobics-studio">Japanese version of <i>Dance Aerobics</i></a> adds a <a rel="nofollow" class="external text" href="http://forums.nesdev.org/viewtopic.php?p=102300#p102300">sound playback IC</a> to CNROM. It adds a <a rel="nofollow" class="external text" href="http://forums.nesdev.org/viewtopic.php?t=9449">register mapped from $6000-$7FFF</a> that can play one of eight voice recordings. However, the specifics of the compression are not yet known, and there is no standardized way to bundle audio data with <a href="INES.xhtml" title="INES">iNES</a> images.
</p>
