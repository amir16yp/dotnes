From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_409">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_409">other pages</a>

<div class="mw-parser-output"><p><b>NES 2.0 Mapper 409</b> denotes the <b>retroUSB DPCMcart</b> circuit board, used for the <a rel="nofollow" class="external text" href="https://sergioelisondo.bandcamp.com/album/a-winner-is-you">homebrew music cartridge &quot;A Winner is You&quot;</a> released by <a rel="nofollow" class="external text" href="https://retrousb.com/product_info.php?cPath=36&amp;products_id=143">retroUSB.</a>. It is basically an extremely oversized version of <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> that latches twelve bits of the address, rather than the data, bus for selecting banks from a 64 MiB PRG address space.
</p><p>Despite being called &quot;DPCMcart&quot;, it cannot actually bank DPCM samples because of its fixed bank. Instead, <i>A Winner is You</i> uses the large ROM for PCM sample storage, played back with timed CPU code.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: 16 KiB PRG bank, switchable</li>
<li>CPU $C000-$FFFF: 16 KiB PRG bank, fixed to last bank</li>
<li>PPU $0000-$1FFF. 8 KiB CHR RAM, unbanked</li>
<li>Mirroring: Hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Address_Latch_.28.24C000-.24CFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($C000-$CFFF,_write)">Address Latch ($C000-$CFFF, write)</span></h2>
<pre>Register Mask: $8000 ?
   Value Mask: $0FFF
</pre>
<pre>A~FEDC BA98 7654 3210
  -------------------
  1... BBBB BBBB BBBB
       ++++-++++-++++- Selects bank via PRG A25..A14 at CPU $8000-BFFF (CPU A14=0)
</pre>
<p>This register may respond to all of $8000-FFFF, but it is unknown whether it does. <i>A Winner is You</i> only uses the $C000-CFFF range.
</p>
