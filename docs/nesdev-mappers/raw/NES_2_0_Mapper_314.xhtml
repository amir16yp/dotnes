<div class="mw-parser-output"><p>NES 2.0 Mapper 314 is used for the <i>32-in-1 Y2K</i>, <i>64-in-1 Y2K</i> and <i>76-in-1 Y2K</i> multicarts. Its UNIF board name is <b>BMC-64in1NoRepeat</b>. It exists in both CHR-ROM and unbanked 8 KiB CHR-RAM variants.
</p>

<h2><span id="Miscellaneous_register_.28.245000.2C_write.29"/><span class="mw-headline" id="Miscellaneous_register_($5000,_write)">Miscellaneous register ($5000, write)</span></h2>
<pre>Mask: Unknown, probably $F003

D~7654 3210
  ---------
  U.M. .CC.
  | |   ++- Bits 0-1 of 8 KiB CHR-ROM bank at PPU $0000-$1FFF
  | +------ Select nametable mirroring type
  |          0: Vertical
  |          1: Horizontal
  +-------- 0: UNROM
            1: NROM

Power-on value: $80
</pre>
<h2><span id="PRG-ROM_register_.28.245001.2C_write.29"/><span class="mw-headline" id="PRG-ROM_register_($5001,_write)">PRG-ROM register ($5001, write)</span></h2>
<pre>Mask: Unknown, probably $F003

D~7654 3210
  ---------
  MpPP PPPP
  ||++-++++- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF
  |+-------- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF and
  |          CPU $C000-$FFFF if M==0
  +--------- Select PRG banking mode
              0: NROM-128
              1: NROM-256

Power-on value: $43
</pre>
<h2><span id="CHR-ROM_mode_.28.245002.2C_write.29"/><span class="mw-headline" id="CHR-ROM_mode_($5002,_write)">CHR-ROM mode ($5002, write)</span></h2>
<pre>Mask: Unknown, probably $F003

D~7654 3210
  ---------
  .... CCCC
       ++++- Bits 2-5 of 8 KiB CHR-ROM bank at PPU $0000-$1FFF

Power-on value: $00
</pre>
<h2><span id="UNROM_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="UNROM_Latch_($8000-$FFFF,_write)">UNROM Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  .... .CCC
        +++- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF

Power-on value: $00
</pre>
