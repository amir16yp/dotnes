<div class="mw-parser-output"><p>INES 2.0 Mapper 516 is used for the two <i>Brilliant Com Cocoma Pack</i> cartridges from <i>EduBank</i>. They consist of an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone (AX5202P) with an additional PAL.
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Mask: $E011
</p>
<ul><li>$8000, $8001, $A000, $A001, $C000, $C001, $E000, $E001; addresses where CPU A4 is low: As normal <a href="MMC3.xhtml" title="MMC3">MMC3</a>. Note that the PRG and CHR banks are limited to a 128 KiB inner bank.</li></ul>
<p>Mask: $8010
</p>
<pre>$8010: A~[1xxx xxxx xxx1 CCPP]
                         ||||
                         ||++-- Select 128 KiB outer PRG bank (i.e. PRG A18 and A17)
                         ++---- Select 128 KiB outer CHR bank (i.e. CHR A18 and A17)
</pre>
