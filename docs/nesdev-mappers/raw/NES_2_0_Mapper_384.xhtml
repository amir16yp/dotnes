<div class="mw-parser-output"><p><b>NES 2.0 Mapper 384</b> denotes the <b>L1A16</b> circuit board, used on a <i>4-in-1</i> multicart containing <i>Crisis Force</i>, among other games. It uses a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone in the VRC4e configuration (VRC4 A0=CPU A2, VRC4 A1=CPU A3) and has 2 KiB of WRAM, mirrored once, in the CPU $6000-$6FFF area. The outer bank register overlays this area and contains a Lock bit to prevent Crisis Force's WRAM writes from changing the outer bank.
</p>
<h2><span id="Outer_Bank_Register_.28.246800-.246FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6800-$6FFF,_write)">Outer Bank Register ($6800-$6FFF, write)</span></h2>
<pre>Mask: $F800

D~7654 3210
  ---------
  .... LbBB
       ||++- PRG/CHR A17/A18 (128 KiB outer bank)
       |+--- unused, but could be PRG/CHR A19 on a larger multicart
       +---- 1: Lock outer bank

Power-on value: $00
</pre>
