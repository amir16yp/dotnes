From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_342">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_342">other pages</a>

<div class="mw-parser-output"><p>NES 2.0 Mapper 342 is used for the homebrew COOLGIRL multicart. In addition to native registers, it can simulate about 25 commercial-era mappers on a hardware level. It can address up to 128 MiB of PRG-ROM, 512 KiB of CHR-RAM, and 32 KiB of WRAM. Like the <a href="NES_2_0_Mapper_268.xhtml" title="NES 2.0 Mapper 268">COOLBOY</a> mapper that inspired it, CHR-RAM is filled with pattern data copied from PRG-ROM by the multicart menu after a game has been selected. Its UNIF board name is just <b>COOLGIRL</b>.
</p>

<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Range: $5000-$5FFF
</p><p>Mask: $5007
</p><p>All registers are $00 on power-on and reset.
</p>
<h3><span id=".245xx0"/><span class="mw-headline" id="$5xx0">$5xx0</span></h3>
<pre> 7  bit  0
 ---- ----
 PPPP PPPP
 |||| ||||
 ++++-++++-- PRG base offset (A29-A22)
</pre>
<h3><span id=".245xx1"/><span class="mw-headline" id="$5xx1">$5xx1</span></h3>
<pre> 7  bit  0
 ---- ----
 PPPP PPPP
 |||| ||||
 ++++-++++-- PRG base offset (A21-A14)
</pre>
<h3><span id=".245xx2"/><span class="mw-headline" id="$5xx2">$5xx2</span></h3>
<pre> 7  bit  0
 ---- ----
 AMMM MMMM
 |||| ||||
 |+++-++++-- PRG mask (A20-A14, inverted+anded with PRG address)
 +---------- CHR mask (A18, inverted+anded with CHR address)
</pre>
<h3><span id=".245xx3"/><span class="mw-headline" id="$5xx3">$5xx3</span></h3>
<pre> 7  bit  0
 ---- ----
 BBBC CCCC
 |||| ||||
 |||+-++++-- CHR bank A (bits 7-3)
 +++-------- PRG banking mode (see below)
</pre>
<h3><span id=".245xx4"/><span class="mw-headline" id="$5xx4">$5xx4</span></h3>
<pre> 7  bit  0
 ---- ----
 DDDE EEEE
 |||| ||||
 |||+-++++-- CHR mask (A17-A13, inverted+anded with CHR address)
 +++-------- CHR banking mode (see below)
</pre>
<h3><span id=".245xx5"/><span class="mw-headline" id="$5xx5">$5xx5</span></h3>
<pre> 7  bit  0
 ---- ----
 CDDE EEWW
 |||| ||||
 |||| ||++-- 8KiB WRAM page at $6000-$7FFF
 |+++-++---- PRG bank A (bits 5-1)
 +---------- CHR bank A (bit 8)
</pre>
<h3><span id=".245xx6"/><span class="mw-headline" id="$5xx6">$5xx6</span></h3>
<pre> 7  bit  0
 ---- ----
 FFFM MMMM
 |||| ||||
 |||+ ++++-- Mapper code (bits 4-0, see below)
 +++-------- Flags 2-0, functionality depends on selected mapper
</pre>
<h3><span id=".245xx7"/><span class="mw-headline" id="$5xx7">$5xx7</span></h3>
<pre> 7  bit  0
 ---- ----
 LMTR RSNO
 |||| |||+-- Enable WRAM (read and write) at $6000-$7FFF
 |||| ||+--- Allow writes to CHR RAM
 |||| |+---- Allow writes to flash chip
 |||+-+----- Mirroring (00=vertical, 01=horizontal, 10=1Sa, 11=1Sb)
 ||+-------- Enable four-screen mode
 |+-- ------ Mapper code (bit 5, see below)
 +---------- Lockout bit (prevent further writes to all registers)
</pre>

<h2><span class="mw-headline" id="PRG_banking_modes">PRG banking modes</span></h2>
<p>Power-on/reset state: A=0, B=~2, C=~1, D=~0
</p>
<pre> | Code | $8000 | $A000 | $E000 | $C000 | Notes                                    |
 | ==== + ===== + ===== + ===== + ===== + ======================================== |
 | 000  |       A       |       C       | UxROM, MMC4, MMC1 mode #3, etc.          |
 | ---- + ------------- + ------------- + ---------------------------------------- |
 | 001  |       C       |       A       | Mapper 97 (TAM-S1)                       |
 | ---- + ------------- + ------------- + ---------------------------------------- |
 | 010  |           Reserved            |                                          |
 | ---- + ----------------------------- + ---------------------------------------- |
 | 011  |           Reserved            |                                          |
 | ---- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 100  |   A   |   B   |   C   |   D   | Universal, used by MMC3 mode 0, etc.     |
 | ---- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 101  |   C   |   B   |   A   |   D   | MMC3 mode 1                              |
 | ---- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 110  |               B               | Mapper 163                               |
 | ---- + ----------------------------- + ---------------------------------------- |
 | 111  |               A               | AxROM, MMC1 modes 0/1, Color Dreams      |
</pre>
<h2><span class="mw-headline" id="CHR_banking_modes">CHR banking modes</span></h2>
<p>Power-on/reset state: A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7
</p>
<pre> | Code | $0000 | $0400 | $0800 | $0C00 | $1000 | $1400 | $1800 | $1C00 | Notes                                    |
 | ==== + ===== + ===== + ===== + ===== + ===== + ===== + ===== + ===== + ======================================== |
 | 000  |                               A                               | Used by many simple mappers              |
 | ---- + ------------------------------------------------------------- + ---------------------------------------- |
 | 001  |                          Special mode                         | Used by mapper 163                       |
 | ---- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 010  |       A       |       C       |   E   |   F   |   G   |   H   | Used by MMC3 mode 0                      |
 | ---- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 011  |   E   |   F   |   G   |   H   |       A       |       C       | Used by MMC3 mode 1                      |
 | ---- + ----- + ----- + ----- + ----- + ------------- + ------------- + ---------------------------------------- |
 | 100  |               A               |               E               | Used by MMC1                             |
 | ---- + ----------------------------- + ------------- + ------------- + ---------------------------------------- |
 | 101  |              A/B              |              E/F              | MMC2/MMC4, switched by tiles $FD or $FE  |
 | ---- + ------- ----- + ------------- + ------------- + ------------- + ---------------------------------------- |
 | 110  |       A       |       C       |       E       |       G       | Used by many complicated mappers         |
 | ---- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ----- + ---------------------------------------- |
 | 111  |   A   |   B   |   C   |   D   |   E   |  F    |   G   |   H   | Used by very complicated mappers         |
</pre>
