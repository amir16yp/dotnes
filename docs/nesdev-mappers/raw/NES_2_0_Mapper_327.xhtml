<div class="mw-parser-output"><p>NES 2.0 mapper 327 is used for a <i>6-in-1</i> multicart. Its UNIF board name is <b>BMC-10-24-C-A1</b>. 
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

A~FEDC BA98 7654 3210
  -------------------
  0110 .... ..CT POOO
              || |+++- Select 128 KiB PRG-ROM and CHR-ROM outer bank
              || +---- Select MMC3 inner PRG-ROM bank address mask
              ||        0: 128 KiB
              ||        1: 256 KiB
              |+------ Select CHR memory type
              |         0: CHR-ROM
              |         1: CHR-RAM
              +------- Select MMC3 inner CHR-ROM bank address mask
                        0: 128 KiB
                        1: 256 KiB
</pre>
<p>As it uses the MMC3 clones's WRAM interface, writing to the Outer Bank register requires enabling and not write-protecting WRAM in the MMC's $A001 register. Note that there are also 8 KiB of WRAM in the same address range. The outer bank register becomes locked against further writes once an outer bank other than 0 is selected, and is only unlocked on power-up. 
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
