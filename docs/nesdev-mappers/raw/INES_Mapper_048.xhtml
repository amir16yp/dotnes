From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_048">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_048">other pages</a>

<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 048</a> represents Taito's <a href="Taito_TC0690_pinout.xhtml" title="Taito TC0690 pinout">TC0690</a>. It also represents a superset of the abilities provided the <a href="Taito_TC0190_pinout.xhtml" title="Taito TC0190 pinout">TC0190+PAL16R4</a> boards (which have no interrupts).
</p><p>To the best of our knowledge, the following six games require this mapper:
</p>
<ul><li><a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/2255/bakushou-jinsei-gekijou-3">Bakushou!! Jinsei Gekijou 3</a></li>
<li>Bubble Bobble 2 (J)</li>
<li><a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/4519/don-doko-don-2">Don Doko Don 2</a></li>
<li>Captain Saver (J)</li>
<li>Jetsons, The - Cogswell's Caper! (J)</li>
<li>Flintstones, The - The Rescue of Dino &amp; Hoppy (J)</li></ul>
<pre> Notes:
 --------------------------
 Most dumps of mapper 048 games floating around are erroneously labelled as <a href="INES_Mapper_033.xhtml" title="INES Mapper 033">mapper 033</a>.  Mapper 033 does not
 have IRQs, mapper 048 does, and mirroring on each is handled a bit differently.  Apart from that, the two are
 very similar.
 
 This mapper is very similar to <a href="MMC3.xhtml" title="MMC3">MMC3</a> in a lot of ways, including how the IRQ counter operates.
 
 
 Registers:
 --------------------------
 
 Range,Mask:   $8000-FFFF, $E003
 
   $8000:    PRG Reg 0 (8k @ $8000)
   $8001:    PRG Reg 1 (8k @ $A000)
 
   $8002:    CHR Reg 0 (2k @ $0000)
   $8003:    CHR Reg 1 (2k @ $0800)
   $A000:    CHR Reg 2 (1k @ $1000)
   $A001:    CHR Reg 3 (1k @ $1400)
   $A002:    CHR Reg 4 (1k @ $1800)
   $A003:    CHR Reg 5 (1k @ $1C00)
 
   $C000:    IRQ Reload
   $C001:    IRQ Clear
   $C002:    IRQ Enable
   $C003:    IRQ Acknowledge
 
   $E000: [.M.. ....]   Mirroring
     0 = Vert
     1 = Horz
 
 
 PRG Setup:
 ---------------------------
 
       $8000   $A000   $C000   $E000  
     +-------+-------+-------+-------+
     | $8000 | $8001 | { -2} | { -1} |
     +-------+-------+-------+-------+
 
 
 CHR Setup:
 ---------------------------
 
       $0000   $0400   $0800   $0C00   $1000   $1400   $1800   $1C00 
     +---------------+---------------+-------+-------+-------+-------+
     |     $8002     |     $8003     | $A000 | $A001 | $A002 | $A003 |
     +---------------+---------------+-------+-------+-------+-------+
 
 
 
 IRQs:
 ---------------------------
 
 IRQs on this mapper seem to behave exactly like MMC3's IRQs, with 2 exceptions:
 
  1)  The written reload value is inverted.  EG:  Writing $06 to the reload reg on this mapper would be like
 writing $F9 on MMC3.  You can simply XOR the writes with $FF and it will work just like MMC3.
 
  2)  The IRQ seems to trip a little later than it does on MMC3.  It looks like about a 4 CPU cycle delay from
 the normal MMC3 IRQ time.  Failure to put in this delay results in shaking and other graphical quirks in some
 games.
 
 
 The registers on this mapper corespond directly to regs on the MMC3:
 
   048  -  MMC3
 ---------------
  $C000   $C000   (XOR written value with $FF)
  $C001   $C001
  $C002   $E001
  $C003   $E000
 
 
 For details on MMC3 IRQ operation, see mapper 004.
</pre>
<p>Note that unlike the MMC3, the value written for the two 2 KiB CHR banks do not drop the LSB; the number written specifies the offset into CHR as a multiple of 2 KiB. Furthermore, it turns out the MSB of the register is implemented (even if no games ever used it) and the two 2 KiB CHR banks can address a full 512 KiB of CHR. (The four 1 KiB CHR banks are limited to the first 256 KiB of CHR)
</p><p>Different games seem to require subtly different IRQ timing. Because the cartridges are so rare, it's unclear but possible that there's actually yet another ASIC that we have not yet documented. <a rel="nofollow" class="external autonumber" href="https://forums.nesdev.org/viewtopic.php?t=18277">[1]</a>
</p>
