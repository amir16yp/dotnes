<div class="mw-parser-output"><p><b>NES 2.0 Mapper 447</b> denotes the <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>-based <b>KL-06</b> multicart circuit board used by the <i>1993 New 860-in-1 Over-Valued Golden Version Games</i> multicart. The VRC4 clone's A0/A1 inputs are connected to CPU A2/A3, and its PRG-RAM chip-enable signal drives an outer bank register.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>A~[0110 .... .... .NBB]
                   |++- PRG/CHR A18..A17
                   ||+- 1=Lock outer bank register
                   |+-- 1=NROM-128 mode if N=1, 0=NROM-256 mode if N=1
                   +--- 1=NROM mode
</pre>
<p>NROM mode causes the VRC4's CPU A14 line to be held low, making the VRC4's two PRG registers apply to both $8000/$A000 and $C000/$E000. NROM-256 mode additionally replaces PRG A14 with CPU A14. The 'Lock' functionality is needed because the game that is active when PRG A17=1 (<i>Crisis Force</i>) uses 2 KiB of PRG-RAM that overlap the outer bank register.
</p>
