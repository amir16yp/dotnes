<div class="mw-parser-output"><p><b>NES 2.0 Mapper 385</b> denotes the NTDEC <b>2779</b> circuit board, used for a simple <i>5-in-1</i> multicart with 8 KiB of unbanked CHR-RAM containing NROM-128 games. It is similar to <a href="INES_Mapper_202.xhtml" title="INES Mapper 202">INES Mapper 202</a> except that there is no NROM-128/256 switch, and that it uses CHR-RAM rather than CHR-ROM.
</p>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  .... .... .... BBBM
                 |||+- 0: Vertical, 1: Horizontal mirroring
                 +++-- PRG A14-A16 at CPU $8000-$BFFF and CPU $C000-$FFFF
</pre>
