<div class="mw-parser-output"><p><b>NES 2.0 Mapper 274</b> denotes the <i>Cartridge Story</i> series of multicarts from RCM Group. Its UNIF board name is <b>BMC-80013-B</b>.
</p>
<ul><li><i>Cartridge Story</i> (72-in-1)</li>
<li><i>Cartridge Story II</i> (80-in-1)</li>
<li><i>Cartridge Story III</i> (90-in-1, a.k.a. <i>90-in-1 Hwang Shinwei</i>)</li></ul>
<p><i>Cartridge Story</i> only contains a single main 2 MiB PRG-ROM chip; <i>II</i> and <i>III</i> both add an extra PRG-ROM chip.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: Switchable inner and outer PRG-ROM bank, main or extra PRG-ROM chip</li>
<li>CPU $C000-$FFFF: Fixed inner and switchable outer PRG-ROM, main PRG-ROM chip only</li>
<li>PPU $0000-$1FFF: 8 KiB of CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Inner_Bank_and_Mirroring_.28.248000-.249FFF.2C_write.29"/><span class="mw-headline" id="Inner_Bank_and_Mirroring_($8000-$9FFF,_write)">Inner Bank and Mirroring ($8000-$9FFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  ...M BBBB
     | ++++- Select PRG A17..A14 if CPU A14=0
     +------ Select nametable mirroring
             0: Vertical
             1: Horizontal
</pre>
<h2><span id="Outer_Bank_and_Chip_Select_.28.24A000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Chip_Select_($A000-$FFFF,_write)">Outer Bank and Chip Select ($A000-$FFFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210  A~FEDC BA98 7654 3210
  ---------    -------------------
  .OOO oooo    1C1. .... .... ....
   ||| ||||     +------------------ Select PRG-ROM Chip if CPU A14=0
   ||| ||||                          0: Extra (default)
   ||| ||||                          1: Main
   ||| ++++- Select PRG A17..A14 if CPU A14=1
   +++------ Select PRG A20..A18
</pre>
<p>Notes:
</p>
<ul><li>Since the extra PRG-ROM chip only has 16 KiB (Cartridge Story II)/64 KiB (Cartridge Story III), PRG A16-A20 are ineffective when C=1. Because this yields a PRG-ROM section of the NES 2.0 file that is not a power of two, emulators must mask them off explicitly.</li>
<li>The main PRG-ROM chip is always selected when CPU A14=1.</li>
<li>Because C is set to 0 upon reset, the cartridge will boot with the extra PRG-ROM chip mapped, if present.</li></ul>
