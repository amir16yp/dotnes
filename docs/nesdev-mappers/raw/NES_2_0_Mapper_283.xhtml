<div class="mw-parser-output"><p>NES 2.0 Mapper 283 is used for the <i>Block Family 6-in-1/7-in-1</i> multicarts. Its UNIF board name is <b>BMC-GS-2004</b> (additional 8 KiB PRG-ROM chip present) and <b>BMC-GS-2013</b> (no additional 8 KiB PRG-ROM chip present).
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB PRG-ROM bank, fixed to last 8 KiB bank within the first 256 KiB block, or if present, to the content of an additional 8 KiB PRG-ROM chip.</li>
<li>CPU $8000-$FFFF: 32 KiB switchable PRG-ROM bank.</li>
<li>PPU $0000-$1FFF: 8 KiB of CHR-RAM.</li></ul>
<h1><span class="mw-headline" id="Data_Latch">Data Latch</span></h1>
<ul><li>CPU $8000-$FFFF: Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF.</li></ul>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mirroring is fixed and denoted in the NES header.</li>
<li>The 8 KiB PRG-ROM chip is present and located in the very last PRG-ROM bank if the number of PRG-ROM banks is a power of two <i>plus one</i>. Its data is repeated once since the iNES format only allows for 16 KiB PRG-ROM banks.</li></ul>
