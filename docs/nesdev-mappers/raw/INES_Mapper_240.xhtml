<div class="mw-parser-output"><pre> Here are Disch's original notes:  
 ========================
 =  Mapper 240          =
 ========================
 
 
 Example Games:
 --------------------------
 Jing Ke Xin Zhuan
 Sheng Huo Lie Zhuan
 
 
 Registers:
 --------------------------
   $4020-5FFF:  [PPPP CCCC]
     P = Selects 32k PRG @ $8000
     C = Selects 8k CHR @ $0000
</pre>
<p>This is two similar PCBs with subtly different addresses for the register.
</p><p>Jing Ke Xin Zhuan (荊軻新傳)  decodes the register as: (ADDRESS &amp; $E800) == $4800
</p><p>Sheng Huo Lie Zhuan (聖火列傳)  decodes the register as: (ADDRESS &amp; $E100) == $4100
</p><p>Both boards add PRG RAM at the usual $6000
</p>
