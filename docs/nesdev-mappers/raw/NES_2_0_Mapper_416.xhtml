<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: Fixed 8 KiB PRG-ROM bank #7</li>
<li>CPU $8000-$FFFF: Switchable 8/16/32 KiB PRG-ROM bank(s)</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR-ROM bank</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span class="mw-headline" id="Data_Latch">Data Latch</span></h2>
<pre>Write to $8000 (mask $8000):
D~[BPA. Mcc.]
   |||  |++--- CHR A14..A13
   |||  |+---- 1=Horizontal, 0=Vertical mirroring
   |||  +----- PRG A16, also select SMB2J (0)/Normal (1) mode
   ||+-------- PRG A14 in Normal mode
   +|--------- PRG A15 in Normal mode
   ++--------- 00: NROM-064 banking (PRG A13=0, PRG A14=A)
               01: NROM-128 banking (PRG A13=CPU A13, PRG A14=A)
               1x: NROM-256 banking (PRG A13=CPU A13, PGR A14=CPU A14)
</pre>
<h2><span id="PRG_Bank_Select_.28SMB2J_mode_only.29"/><span class="mw-headline" id="PRG_Bank_Select_(SMB2J_mode_only)">PRG Bank Select (SMB2J mode only)</span></h2>
<pre>Write to $4020 (mask unknown)
D~[.... .BAC]
         ||+- PRG A15
         ++-- PRG A14..13
</pre>
<h2><span id="IRQ_Control_.28SMB2J_mode_only.29"/><span class="mw-headline" id="IRQ_Control_(SMB2J_mode_only)">IRQ Control (SMB2J mode only)</span></h2>
<pre>Write to $4120 (mask unknown)
D~[.... ...E]
           +- 1=Counting, generate IRQ on 12-bit counter overflow
              0=Counter reset, acknowledge/disable IRQ
</pre>
