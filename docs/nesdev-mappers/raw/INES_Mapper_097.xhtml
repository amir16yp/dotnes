<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 097</a> represents the single game that uses <a href="Irem_TAM_S1_pinout.xhtml" title="Irem TAM-S1 pinout">Irem's TAM-S1</a> IC, <a rel="nofollow" class="external text" href="http://bootgod.dyndns.org:7777/profile.php?id=3801">Kaiketsu Yanchamaru</a>.
</p>
<pre> Registers:
 --------------------------
 This mapper does not have bus conflicts.
 
   $8000-BFFF:  [M..P PPPP]
     P = PRG Reg  (16k @ $C000)
     M = Mirroring:
        %0 = Horz (PPU A11)
        %1 = Vert (PPU A10)
 
 
 PRG Setup:
 --------------------------
 
       $8000   $A000   $C000   $E000  
     +---------------+---------------+
     |     { -1}     |     $8000     |
     +---------------+---------------+
</pre>
<p>The underlying hardware is a little more capable, but is wired in a way such that that is inaccessible.
</p><p><a href="INES_Mapper_180.xhtml" title="INES Mapper 180">Mapper 180</a> is basically this mapper without mirroring control. (But the fixed bank is 0, not last)
</p>
