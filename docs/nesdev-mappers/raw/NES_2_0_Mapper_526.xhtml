<div class="mw-parser-output"><p>NES 2.0 Mapper 526 is used for a bootleg version of Namco's 三国志: 中原の覇者 (<i>Sangokushi: Chūgen no Hasha</i>). Its <a href="UNIF.xhtml" title="UNIF">UNIF</a> board name is <b>UNL-BJ-56</b>. Mirroring seems to be hard-wired (to vertical).
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="CHR-ROM_bank_select_.28.248000-.248007.29"/><span class="mw-headline" id="CHR-ROM_bank_select_($8000-$8007)">CHR-ROM bank select ($8000-$8007)</span></h2>
<pre>Mask: unknown, probably $800F
$8000: Set 1 KiB CHR-ROM bank at PPU $0000-$03FF
$8001: Set 1 KiB CHR-ROM bank at PPU $0400-$07FF
$8002: Set 1 KiB CHR-ROM bank at PPU $0800-$0BFF
$8003: Set 1 KiB CHR-ROM bank at PPU $0C00-$0FFF
$8004: Set 1 KiB CHR-ROM bank at PPU $1000-$13FF
$8005: Set 1 KiB CHR-ROM bank at PPU $1400-$17FF
$8006: Set 1 KiB CHR-ROM bank at PPU $1800-$1BFF
$8007: Set 1 KiB CHR-ROM bank at PPU $1C00-$1FFF
</pre>
<h2><span id="PRG-ROM_bank_select_.28.248008-.24800B.29"/><span class="mw-headline" id="PRG-ROM_bank_select_($8008-$800B)">PRG-ROM bank select ($8008-$800B)</span></h2>
<pre>Mask: unknown, probably $800F
$8008: Set 8 KiB PRG-ROM bank at CPU $8000-$9FFF
$8009: Set 8 KiB PRG-ROM bank at CPU $A000-$BFFF
$800A: Set 8 KiB PRG-ROM bank at CPU $C000-$DFFF
$800B: Set 8 KiB PRG-ROM bank at CPU $E000-$FFFF
</pre>
<h2><span id="IRQ_counter_.28.24800D.2F.24800F.29"/><span class="mw-headline" id="IRQ_counter_($800D/$800F)">IRQ counter ($800D/$800F)</span></h2>
<p>Mask: unknown, probably $800F. One of these two acknowledges a pending IRQ, and the other resets to IRQ counter to zero. Because they are always written to one after the other, it's not clear which one does which.
</p>
<h1><span class="mw-headline" id="IRQ_Counter_Operation">IRQ Counter Operation</span></h1>
<p>The IRQ counter is increased on every M2 cycle. The IRQ line is asserted when bit 12 is set and released when bit 12 is cleared. In other words, an IRQ is generated after 4096 M2 cycles and self-acknowledged after further 4096 M2 cycles.
</p>
