From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_406">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_406">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><b>NES 2.0 Mapper 406</b> is used for the homebrew game <i>Haradius Zero</i>. It is basically a homebrew <a href="TxROM.xhtml" class="mw-redirect" title="TLROM">TLROM</a> circuit board that connects the <a href="MMC3.xhtml" title="MMC3">MMC3</a>'s address lines differently, and saves the high score to flash ROM. The game executes the flash ROM chip's &quot;Software ID&quot; command; if the manufacturer and model ID do not match the expected values, or it detects that WRAM exists, the game replaces the first level with an unwinnable boss fight.
</p><p><b>Submapper 0</b> denotes the 60-pin release of the game (saying &quot;AXR&quot; at the bottom of the title screen). The MMC3's A0 input is actually connected to CPU A1, so that $8000/$8002 rather than $8000/$8001 are differentiated. The Flash ROM chip is a Macronix MX29F040 (manufacturer ID=$C2, model ID=$A4).
</p><p><b>Submapper 1</b> denotes the 72-pin release of the game (saying &quot;INL&quot; at the bottom of the title screen). The MMC3's $8xxx and $Exxx registers are swapped, so that $8000/$8001 enables/disable IRQ generation, and $E000/$E001 write to bank registers. The Flash ROM chip is an AMD AM29F040 (manufacturer ID=$01, model ID=$A4).
</p>
