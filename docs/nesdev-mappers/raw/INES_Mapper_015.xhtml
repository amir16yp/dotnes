<div class="mw-parser-output"><p><b>iNES Mapper 015</b> denotes the <b>K-1029</b> and <b>K-1030P</b> circuit boards, used for the <i>100-in-1 Contra Function 16</i> and <i>168-in-1 New Contra Function 16</i> multicarts. 
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$FFFF: Switchable PRG-ROM banks (8/16/32 KiB)</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB of CHR-RAM that can be write-protected</li>
<li>Nametable mirroring: Switchable horizontal/vertical settings</li></ul>
<h1><span id="Address_and_Data_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_and_Data_Latch_($8000-$FFFF,_write)">Address and Data Latch ($8000-$FFFF, write)</span></h1>
<pre>Mask: $8000

A~FEDC BA98 7654 3210  D~7654 3210
  -------------------    ---------
  1... .... .... ..SS    pMPP PPPP
                   ||    ||++-++++- PRG A19..A14
                   ||    |+-------- Nametable mirroring
                   ||    |           0: Vertical
                   ||    |           1: Horizontal
                   ||    +--------- PRG A13 if SS=2, ignored otherwise
                   ++-------------- PRG banking mode
                                     0: NROM-256 (PRG A14=CPU A14)
                                     1: UNROM    (PRG A14..16=111 when CPU A14=1)
                                     2: NROM-64  (PRG A13=p)
                                     3: NROM-128
Power-on and reset value: All bits clear
</pre>
<p>CHR-RAM is write-protected in PRG banking modes 0 and 3, and write-enabled in modes 1 and 2.
</p>
<h1><span class="mw-headline" id="Use_for_mapper_hacks">Use for mapper hacks</span></h1>
<p>The only known two cartridges using this mapper are the two listed multicarts. All other known ROM files claiming to use mapper 15 have been identified as being mapper hacks, usually from mappers <a href="INES_Mapper_164.xhtml" title="INES Mapper 164">164</a> and <a href="INES_Mapper_227.xhtml" title="INES Mapper 227">227</a>. To run these mapper-hacked games, emulators must not enforce CHR-RAM write-protection even though an actual K-1029 PCB would, and must provide 8 KiB of PRG-RAM at CPU $6000-$7FFF even though an actual K-1029 PCB would not.
</p>
