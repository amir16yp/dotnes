<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 2 KB PRG RAM bank, mirrored four times (Namco 175 only)</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $E000-$FFFF: 8 KB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$03FF: 1 KB switchable CHR bank</li>
<li>PPU $0400-$07FF: 1 KB switchable CHR bank</li>
<li>PPU $0800-$0BFF: 1 KB switchable CHR bank</li>
<li>PPU $0C00-$0FFF: 1 KB switchable CHR bank</li>
<li>PPU $1000-$13FF: 1 KB switchable CHR bank</li>
<li>PPU $1400-$17FF: 1 KB switchable CHR bank</li>
<li>PPU $1800-$1BFF: 1 KB switchable CHR bank</li>
<li>PPU $1C00-$1FFF: 1 KB switchable CHR bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>The 175 and 340 have 12 registers within $8000-$FFFF. Each register occupies a range of $800 bytes, so $8000-$87FF all refers to one register, $8800-$8FFF all refers to another register, and so on.
</p>

<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li><i>Family Circuit '91</i> relies on its 2 KiB of WRAM being correctly mirrored throughout the $6000-$7FFF address range.</li>
<li>Many INES Mapper 210 games are incorrectly set to <a href="INES_Mapper_019.xhtml" title="INES Mapper 019">INES Mapper 019</a>.</li>
<li>In the absence of a NES 2.0 header with submapper 1 or 2 to distinguish between Namco 175 and 340, the following heuristics have been suggested:
<ul><li>If $E000.6 or $E000.7 are ever set, this should be a Namcot 340.</li>
<li>If the game ever reads from or writes to PRG RAM, this is a Namco 175 with external RAM.</li>
<li>If the game ever writes to $C000, this is probably a Namco 175.</li></ul></li></ul>
