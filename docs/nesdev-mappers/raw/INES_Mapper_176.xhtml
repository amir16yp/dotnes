<div class="mw-parser-output"><p><b>iNES Mapper 176</b> denotes the <b>8025</b> enhanced <a href="MMC3.xhtml" title="MMC3">MMC3</a> chipset. It used by many multicarts, Chinese single-game and educational computer cartridges, and Techno Source's <i>Intellivision X2</i> Plug-and-Play console. Incompatible variations exist that are denoted via NES 2.0 Submapper.
</p>

<ul><li>The <b>SFC-12B</b> PCB (submapper 0) mounts both CHR-ROM and CHR-RAM that are selected via $5xx0.5.</li>
<li>Eight MMC3 PRG bits mean that bit 6 and 7 of $8000.6/7 are applied, and the fixed banks are $FE/$FF rather than $3E/$3F. This implies that the multicart's reset vector lies at address PRG-ROM address $1FFFFC rather than $7FFFC if the PRG-ROM is that large.</li></ul>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p><b>FS005 (Submapper 2)</b> can disable the registers in the $5000-$5FFF range using the <a href="#RAM_Configuration_Register_(%24A001)">RAM Configuration Register ($A001)</a>. The same register also enables a mixed CHR-ROM/CHR-RAM mode that is similar to <a href="INES_Mapper_195.xhtml" title="INES Mapper 195">INES Mapper 195</a>.
</p>
<h2><span id="Mode_Register_.28.245xx0.29"/><span class="mw-headline" id="Mode_Register_($5xx0)">Mode Register ($5xx0)</span></h2>
<p>Mask: $F<i>xx</i>7 (<b>Submapper 3</b>), $5<i>xx</i>3 (all others), <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
PCTm PMMM
|||| ||||
|||| |+++- Select PRG Banking Mode (ignored in Extended MMC3 Mode)
|||| |      0: MMC3 PRG Mode, 2 MiB/512 KiB Outer PRG Bank Size
|||| |      1: MMC3 PRG Mode, 256 KiB Outer PRG Bank Size
|||| |      2: MMC3 PRG Mode, 128 KiB Outer PRG Bank Size
|||| |      3: NROM-128 PRG Mode, 16 KiB PRG at $8000-$BFFF mirrored at $C000-$FFFF
|||| |      4: NROM-256 PRG Mode, 32 KiB PRG at $8000-$FFFF
|||| |      5: UNROM PRG Mode, 16 KiB PRG at $8000-$BFFF, inner bank #7 at $C000-$FFFF
|||| |      6-7: Never used
|||| +---- PRG A21 (<b>Submapper 2</b> only)
|||+------ Select Outer CHR Bank Size
|||         0: In MMC3 CHR Mode: 256 KiB
|||            In CNROM CHR Mode: 32 KiB (<b>Submapper 1</b> only)
|||         1: In MMC3 CHR Mode: 128 KiB
|||            In CNROM CHR Mode: 16 KiB (<b>Submapper 1</b> only)
||+------- <b>Submappers 0/1</b> with both CHR-ROM and CHR-RAM (e.g. <b>SFC-12B</b> PCB):
||          0: Select CHR-ROM
||          1: Select CHR-RAM
||         <b>Submapper 1</b> with $5xx0.6=1:
||          0: Enable CNROM latch (CNROM mode)
||          1: Disable CNROM latch (NROM mode)
|+-------- CHR A10-12 Mode
|           0: from MMC3
|           1: from PPU
+--------- PRG A22 (<b>Submapper 2</b> only)

Power-on value: $00
</pre>
<h2><span id="PRG_Base_Register_LSB_.28.245xx1.29"/><span class="mw-headline" id="PRG_Base_Register_LSB_($5xx1)">PRG Base Register LSB ($5xx1)</span></h2>
<p>Mask: $F<i>xx</i>7 (<b>Submapper 3</b>), $F<i>xx</i>3 (all others), <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
.PPP PPPP
 ||| ||||
 +++-++++- PRG A20..A14

Power-on value: $00
</pre>
<p>Depending on the PRG banking mode set via $5xx0, only the higher bits of this register are applied:
</p>
<pre>PRG A..
21111111
09876543
--------
MMMMMMMM  Submappers 1/3 in PRG Mode 0 (MMC3 2 MiB) or Extended MMC3 Mode
BBMMMMMM  Submappers 0/2/4 in PRG Mode 0 (MMC3 512 KiB)
BBBMMMMM  PRG Mode 1 (MMC3 256 KiB)
BBBBMMMM  PRG Mode 2 (MMC3 128 KiB)
BBBBBBBC  PRG Mode 3 (NROM-128)
BBBBBBCC  PRG Mode 4 (NROM-256)
BBBBLLLC  PRG Mode 5 (UNROM)

M: Bit comes from MMC3 ($8000.6/7 or fixed bank)
B: Bit comes from PRG Base Register ($5xx1)
L: Bit comes from UNROM Latch ($8000-$FFFF or fixed bank)
C: Bit comes from CPU
</pre>
<p><b>Submapper 5</b> only selects PRG A14-A18 (i.e. 512 KiB) via this register, selecting upper PRG bits via register <a href="#PRG_Base_Register_MSB_(%244800),_Submapper_5_only">$4800</a>.
</p>
<h2><span id="PRG_Base_Register_MSB_.28.245xx5.29.2C_Submapper_3_only"/><span class="mw-headline" id="PRG_Base_Register_MSB_($5xx5),_Submapper_3_only">PRG Base Register MSB ($5xx5), Submapper 3 only</span></h2>
<p>Mask: $F<i>xx</i>7 (<b>Submapper 3</b>), <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
.... PPPP
     ||||
     ++++- PRG Base A24..A21

Power-on value: $00
</pre>
<h2><span id="PRG_Base_Register_MSB_.28.244800.29.2C_Submapper_5_only"/><span class="mw-headline" id="PRG_Base_Register_MSB_($4800),_Submapper_5_only">PRG Base Register MSB ($4800), Submapper 5 only</span></h2>
<p>Mask: $F800
</p>
<pre>7654 3210
---- ----
..PP PPPP
  || ||||
  ++-++++- PRG Base A24..A19

Power-on value: $00
</pre>
<h2><span id="CHR_Base_Register_LSB_.28.245xx2.29"/><span class="mw-headline" id="CHR_Base_Register_LSB_($5xx2)">CHR Base Register LSB ($5xx2)</span></h2>
<p>Mask: $F<i>xx</i>7 (<b>Submapper 3</b>), $5<i>xx</i>3 (all others), <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
ccdC CCCC
|||| ||||
++++-++++- CHR A20..A13
||+------- PRG A25 (<b>Submapper 2</b> only)
++-------- PRG A24..A23 (<b>Submapper 2</b> only)
+--------- PRG A21 (<b>Submapper 4</b>)

Power-on value: $00
</pre>
<p>Depending on the CHR banking mode set via $5xx0, only the higher bits of this register are applied:
</p>
<pre>CHR A..
21111111111
09876543210
-----------
BBBMMMMMMMM  MMC3 CHR Mode ($5xx0.6=0), 256 KiB ($5xx0.4=0)
BBBBMMMMMMM  MMC3 CHR Mode ($5xx0.6=0), 128 KiB ($5xx0.4=1)
BBBBBBLLPPP  CNROM CHR Mode ($5xx0.6=1, $5xx0.5=0), 32 KiB ($5xx0.4=0), <b>Submapper 1</b> only
BBBBBBBLPPP  CNROM CHR Mode ($5xx0.6=1, $5xx0.5=0), 16 KiB ($5xx0.4=1), <b>Submapper 1</b> only
BBBBBBBBPPP  NROM CHR Mode ($5xx0.6=1, $5xx0.5=1 or <b>Submapper</b> other than <b>1</b>)

M: Bit comes from MMC3 ($8000.0-5)
B: Bit comes from CHR Base Register ($5xx2)
L: Bit comes from CNROM Latch ($8000-$FFFF)
P: Bit comes from PPU
</pre>
<h2><span id="CHR_Base_Register_MSB_.28.245xx6.29.2C_Submapper_3_only"/><span class="mw-headline" id="CHR_Base_Register_MSB_($5xx6),_Submapper_3_only">CHR Base Register MSB ($5xx6), Submapper 3 only</span></h2>
<p>Mask: $F<i>xx</i>7 (<b>Submapper 3</b>), <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
.... PPPP
     ||||
     ++++- CHR Base A24..A21

Power-on value: $00
</pre>
<h2><span id="Extended_Mode_Register_.28.245xx3.29.2C_Submappers_1-2_only"/><span class="mw-headline" id="Extended_Mode_Register_($5xx3),_Submappers_1-2_only">Extended Mode Register ($5xx3), Submappers 1-2 only</span></h2>
<p>Mask: $F<i>xx</i>3, <i>x</i> determined by <a href="#Solder_Pad">solder pad setting</a>
</p>
<pre>7654 3210
---- ----
.?.. .?E.
       | 
       +- <a href="#MMC3-compatible_registers_(%248000/%248001,_%24A000,_%24C000/%24C001,_%24E000/%24E001)">Extended MMC3 Mode</a>
           0: disable
           1: enable

Power-on value: $00
</pre>
<p>Most multicarts write value $44 rather than $00 to disable Extended MMC3 Mode. Hardware tests do not indicate any difference in behavior between writing $00 and $44.
</p>
<h2><span id="Mirroring_Register_.28.24A000.29"/><span class="mw-headline" id="Mirroring_Register_($A000)">Mirroring Register ($A000)</span></h2>
<pre>Mask: $E003

7654 3210
---- ----
.... ..MM
       ++- Select nametable mirroring 
           0: Vertical
           1: Horizontal
           2: Single-screen, page 0 (<b>Submapper 2</b> only)
           3: Single-screen, page 1 (<b>Submapper 2</b> only)
Power-on value: $00
</pre>
<p>Single-screen mirroring is only available when the RAM Configuration Register is enabled ($A001.5).
</p>
<h2><span id="RAM_Configuration_Register_.28.24A001.29.2C_Submapper_2_only"/><span class="mw-headline" id="RAM_Configuration_Register_($A001),_Submapper_2_only">RAM Configuration Register ($A001), Submapper 2 only</span></h2>
<p>Mask: $E003
</p><p>This register functions like MMC3 register $A001 until bit 5 is set, which turns it into the RAM Configuration Register.
</p>
<pre>7654 3210
---- ----
RFE. SCWW
|||  ||||
|||  ||++- Select 8 KiB PRG-RAM bank at $6000-$7FFF. Ignored if Bit 5 is clear.
|||  |+--- Select the memory type in the first 8 KiB of CHR space. Ignored if Bit 5 is clear.
|||  |      0: First 8 KiB are CHR-ROM
|||  |      1: First 8 KiB are CHR-RAM
|||  +---- Unknown
||+------- RAM Configuration Register Enable
||          0: RAM Configuration Register disabled, $A001 functions as on MMC3, 8 KiB of WRAM
||          1: RAM Configuration Register enabled, 32 KiB of WRAM
|+-------- Outer Bank Registers Enable. Ignored if Bit 5 is clear.
|           0: Outer Bank Registers disabled, $5000-$5FFF maps to the second 4 KiB of the 8 KiB WRAM bank 2
|           1: Outer Bank Registers enabled in the $5000-$5FFF range
+--------- PRG RAM enable (0: disable, 1: enable)

Power-on value: $00
</pre>
<h2><span id="UNROM_latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="UNROM_latch_($8000-$FFFF)">UNROM latch ($8000-$FFFF)</span></h2>
<p>In UNROM Mode (PRG Mode 5), writing to this address range changes the 16 KiB inner PRG bank at $8000-$BFFF.
</p>
<h2><span id="CNROM_latch_.28.248000-.24FFFF.29.2C_Submapper_1_only"/><span class="mw-headline" id="CNROM_latch_($8000-$FFFF),_Submapper_1_only">CNROM latch ($8000-$FFFF), Submapper 1 only</span></h2>
<p>In CNROM Mode, writing to this address range changes the inner CHR bank.
</p>
<h2><span id="MMC3-compatible_registers.2C_Extended_MMC3_Mode_.28.248000.2F.248001.2C_.24C000.2F.24C001.2C_.24E000.2F.24E001.29"/><span class="mw-headline" id="MMC3-compatible_registers,_Extended_MMC3_Mode_($8000/$8001,_$C000/$C001,_$E000/$E001)">MMC3-compatible registers, Extended MMC3 Mode ($8000/$8001, $C000/$C001, $E000/$E001)</span></h2>
<p>Mask: $E003 (verified on real hardware)
</p><p>Some multicart games depend on writes to $9FFF not doing anything as a result of the MMC3 address mask being $E003 rather than the standard $E001.
</p><p>If the &quot;Extended MMC3 Mode&quot; bit in register $5xx3 is clear, then these registers function identically to the <a href="MMC3.xhtml" title="MMC3">MMC3</a>. On <b>Submappers 1 and 2</b>, if the &quot;Extended MMC3 Mode&quot; bit is set, four more bank registers become available at <a href="MMC3.xhtml#Bank_select_.28.248000-.249FFE.2C_even.29" title="MMC3">$8000/$8001</a>, so that the original two 2 KiB CHR banks become four 1 KiB CHR banks, and the two fixed 8 KiB PRG banks become selectable, similar to the <a href="RAMBO_1.xhtml" title="RAMBO-1">RAMBO-1</a>.  Register $8000 if $5xx3 bit 1 is set:
</p>
<pre>7  bit  0
---- ----
CP.. RRRR
||   ||||
||   ++++- Specify which bank register to update on next write to Bank Data register
||         $0: Select 1 KB CHR bank at PPU $0000-$03FF (or $1000-$13FF)
||         $1: Select 1 KB CHR bank at PPU $0800-$0BFF (or $1800-$1BFF)
||         $2: Select 1 KB CHR bank at PPU $1000-$13FF (or $0000-$03FF)
||         $3: Select 1 KB CHR bank at PPU $1400-$17FF (or $0400-$07FF)
||         $4: Select 1 KB CHR bank at PPU $1800-$1BFF (or $0800-$0BFF)
||         $5: Select 1 KB CHR bank at PPU $1C00-$1FFF (or $0C00-$0FFF)
||         $6: Select 8 KB PRG ROM bank at $8000-$9FFF (or $C000-$DFFF)
||         $7: Select 8 KB PRG ROM bank at $A000-$BFFF
||         $8: Select 8 KB PRG ROM bank at $C000-$DFFF (or $8000-$9FFF)
||         $9: Select 8 KB PRG ROM bank at $E000-$FFFF
||         $A: Select 1 KB CHR bank at PPU $0400-$07FF (or $1400-$17FF)
||         $B: Select 1 KB CHR bank at PPU $0C00-$0FFF (or $1C00-$1FFF)
|+-------- Invert PRG A14
+--------- Invert CHR A12

Power-on values:
* Standard MMC3 Registers $0-$7: $00, $02, $04, $05, $06, $07, $00, $01
* Extended MMC3 Registers $8-$B: $FE, $FF, $FF, $FF
</pre>
<h1><span class="mw-headline" id="Solder_Pad">Solder Pad</span></h1>
<p>The address mask in the $5000-$5FFF range is determined by the solder pad setting:
</p>
<pre>Pad setting  Address mask
-----------  ------------
0            $5013
1            $5023
2            $5043
3            $5083
4            $5103
5            $5203
6            $5403
7            $5803
</pre>
<ul><li>A solder pad setting of zero (address mask $5013) will produce a usable result for any ROM image.</li>
<li>Some multicarts only display their menu at settings other than 0.</li></ul>
<h1><span id="Protection_.28Submapper_2_only.29"/><span class="mw-headline" id="Protection_(Submapper_2_only)">Protection (Submapper 2 only)</span></h1>
<p>Later Waixing games (and re-releases of earlier games) use the RAM Configuration Register for copy-protection purposes:
</p>
<ul><li>Write $A1 to $A001: Address range $5000-$5FFF to second half of 8 KiB WRAM bank 2, mapper registers there are disabled.</li>
<li>Write three values to $5000, $5010 and $5013.</li>
<li>Do further initialization.</li>
<li>Write $E2 to $A001. Mapper registers in address range $5000-$5FFF; WRAM at CPU $6000-$7FFF points to 8 KiB WRAM bank 2.</li>
<li>Copy 20 bytes from $7000 to $6000.</li>
<li>Copy and XOR bytes from $6000, $6010 and $6013 to $0100-$0102.</li>
<li>Execute code at CPU $0100.</li></ul>
<p>Hacked ROMs can be detected by them writing to $5000/$5010/$5013 but then no longer jumping to $0100.
</p>

<ul><li><a href="NES_2_0_Mapper_523.xhtml" title="NES 2.0 Mapper 523">NES 2.0 Mapper 523</a> is a variant of this mapper with hard-wired mirroring that connects CHR-ROM differently to produce 4/2 KiB instead of 2/1 KiB banks.</li></ul>
