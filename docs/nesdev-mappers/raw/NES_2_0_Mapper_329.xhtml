<div class="mw-parser-output"><p>NES 2.0 mapper 329 is used for the <i>Education Computer 2000</i>. Its UNIF board name is <b>UNL-EDU2000</b>. It's basically <a href="BNROM.xhtml" title="BNROM">BNROM</a> with 32 KiB WRAM and selectable mirroring.
</p>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KiB switchable PRG-RAM bank</li>
<li>CPU $8000-$FFFF: 32 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h2><span id="Data_Latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Data_Latch_($8000-$FFFF)">Data Latch ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  WWMP PPPP
  |||+-++++- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF
  ||+------- Select nametable mirroring type
  ||          0: Vertical
  ||          1: Horizontal
  ++-------- Select 8 KiB PRG-RAM bank at CPU $6000-$7FFF
</pre>
