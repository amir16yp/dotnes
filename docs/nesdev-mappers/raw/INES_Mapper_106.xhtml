<div class="mw-parser-output"><p><br/>
This board, made entirely from discrete chips, is used by Super Mario Bros 3 bootleg. The game was modified (with copyright information cut out) and ported from MMC3.

<h2><span class="mw-headline" id="Memory_map">Memory map</span></h2>
<ul><li>PRG-ROM: 2x128 KiB</li>
<li>CHR-ROM: 128 KiB</li>
<li>PRG-RAM: 8 KiB</li></ul>
<p><br/>
</p>
<ul><li>CPU $6000-$7FFF: 8 KB PRG RAM bank</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank0</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank1</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank2</li>
<li>CPU $E000-$FFFF: 8 KB switchable PRG ROM bank3</li></ul>
<p><br/>
</p>
<ul><li>PPU $0000-$03FF  1 KB switchable CHR bank</li>
<li>PPU $0400-$07FF  1 KB switchable CHR bank</li>
<li>PPU $0800-$0BFF  1 KB switchable CHR bank</li>
<li>PPU $0C00-$0FFF  1 KB switchable CHR bank</li>
<li>PPU $1000-$13FF  1 KB switchable CHR bank</li>
<li>PPU $1400-$17FF  1 KB switchable CHR bank</li>
<li>PPU $1800-$1BFF  1 KB switchable CHR bank</li>
<li>PPU $1C00-$1FFF  1 KB switchable CHR bank</li></ul>
<p>Subject to bus conflicts: no
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>There are 16 registers at $8000-$800f. Only A3-A0 is taken into account (mask $800F)
</p>
<h3><span id="CHR_banking_.28.248000-.248007.29"/><span class="mw-headline" id="CHR_banking_($8000-$8007)">CHR banking ($8000-$8007)</span></h3>
<pre>[.CCC CCC0] $8000
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $0000-$03ff
</pre>
<pre>[.CCC CCC1] $8001
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $0400-$07ff
</pre>
<pre>[.CCC CCC0] $8002
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $0800-$0bff
</pre>
<pre>[.CCC CCC1] $8003
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $0c00-$0fff
</pre>
<pre>[.CCC CCCC] $8004
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $1000-$13ff
</pre>
<pre>[.CCC CCCC] $8005
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $1400-$17ff
</pre>
<pre>[.CCC CCCC] $8006
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $1800-$1bff
</pre>
<pre>[.CCC CCCC] $8007
  ||| ||||
  +++-++++- 1 kB CHR ROM bank at $1c00-$1fff
</pre>
<h3><span id="PRG_banking_.28.248008-.24800b.29"/><span class="mw-headline" id="PRG_banking_($8008-$800b)">PRG banking ($8008-$800b)</span></h3>
<pre>[.... PPPP] $8008
      ||||
      ++++- 8 kB PRG ROM bank at $8000-$9fff (from ROM 5602)
</pre>
<pre>[...R PPPP] $8009
    | ||||
    | ++++- 8 kB PRG ROM bank at $a000-$bfff
    +------ ROM select at $a000-$bfff (0: 5601, 1: 5602)
</pre>
<pre>[...R PPPP] $800a
    | ||||
    | ++++- 8 kB PRG ROM bank at $c000-$dfff
    +------ ROM select at $c000-$dfff (0: 5601, 1: 5602)
</pre>
<pre>[.... PPPP] $800b
      ||||
      ++++- 8 kB PRG ROM bank at $e000-$ffff (from ROM 5602)
</pre>
<p>Note: if you combine 128K ROM 5601 with 128K ROM 5602 into one 256K ROM, add 16 to $8008/$800b and treat RPPPP from $8009/$800a as 5-bit bank number.
</p>
<h3><span id="Mirroring_.28.24800c.29"/><span class="mw-headline" id="Mirroring_($800c)">Mirroring ($800c)</span></h3>
<pre>[.... ...M] $800c
         |
         +- mirroring (0: V, 1: H)
</pre>
<h3><span id="Counter_and_interrupts_.28.24800d-.24800f.29"/><span class="mw-headline" id="Counter_and_interrupts_($800d-$800f)">Counter and interrupts ($800d-$800f)</span></h3>
<p>There is one 16 bit counter, which increments at end of each CPU cycle (on falling edges of M2). The counter will count every cycle that it's not equal to $FFFF: it cannot be stopped otherwise. While the counter is $FFFF, if the IRQ is enabled, /IRQ is asserted.
</p>
<pre>[.... ....] $800d - writing any value resets counter to 0 and disables interrupts.
                    This necessarily acknowledges a pending interrupt.
</pre>
<pre>[DDDD DDDD] $800e
 |||| ||||
 ++++-++++- set low byte of counter to this value
</pre>
<pre>[DDDD DDDD] $800f
 |||| ||||
 ++++-++++- set high byte of counter to this value and enable interrupts.
</pre>
<h2><span class="mw-headline" id="Trivia">Trivia</span></h2>
<ul><li>FCEUX implementation is not 100% accurate with hardware. Here are differences:
<ul><li>none of the registers are cleared or initialized to a known value at startup,
<ul><li>The 74LS670, used in this mapper and <a href="INES_Mapper_246.xhtml" title="INES Mapper 246">iNES Mapper 246</a>, seems to reliably power up containing all &quot;$F&quot;. m<a href="INES_Mapper_246.xhtml" title="INES Mapper 246">246</a> relies on this; this game does not expect registers to be at any known state (tested on FCEUX).</li></ul></li>
<li>CHR registers does not take into account bit 7,</li>
<li>writing to $800d does not stop counter, but starts it and interrupt firing is disabled.</li></ul></li>
<li>This bootleg was created for NTSC console. FCEUX implementation of this mapper causes the game to crash immediatelly on title screen in PAL mode (where interrupt comes too early). Improving mapper in the way that real hardware works makes the game work in NTSC/PAL mode, but the game in PAL is almost unplayable, because second nametable, containing status bar, is switched too early, causing half of screen to display garbage.</li></ul>
