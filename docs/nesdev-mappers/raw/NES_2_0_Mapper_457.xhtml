<div class="mw-parser-output"><p><b>NES 2.0 Mapper 457</b> denotes the <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based <b>810431C</b> multicart PCB, used for the <i>92 年超高K 黄金卡 35-in-1 刺激大驚險旅風侠</i> multicart. It is basically an oversized version of <a href="INES_Mapper_047.xhtml" title="INES Mapper 047">INES Mapper 047</a> with a selectable outer PRG and CHR bank size. Alternatively, it can be thought of as a simplified version of <a href="INES_Mapper_052.xhtml" title="INES Mapper 052">INES Mapper 052</a> without independent PRG/CHR control.
</p>
<h2><span id="Extra_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Extra_Register_($6000-$7FFF,_write)">Extra Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

D~[.... SBBB]
        |+++- PRG/CHR A19..A17
        +---- 0: 128 KiB outer PRG and CHR bank size
              1: 256 KiB outer PRG and CHR bank size
Value on reset: $00
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>WRAM must be enabled in $A001.7 before writing to the extra register.</li>
<li>Nestopia Plus! has assigned mapper number <b>2786</b> for this circuit board.</li></ul>
