<div class="mw-parser-output"><p><b>NES 2.0 Mapper 391</b> denotes the MMC3-based <b>BS-110</b> PCB. It is a variation of <a href="INES_Mapper_052.xhtml" title="INES Mapper 052">INES Mapper 052</a> that adds support for GNROM-like PRG bankswitching. Note that the UNIF MAPR <b>BMC-BS-110</b> is incorrectly-named and refers to <a href="NES_2_0_Mapper_444.xhtml" title="NES 2.0 Mapper 444">NES 2.0 Mapper 444</a> instead.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

A~FEDC BA98 7654 3210  D~7654 3210
  -------------------    ---------
  011. ...C .... ....    LcGC pNPP
          |              |||| ||++- PRG A17..A18
          |              |||| |+--- NROM mode type if G=1
          |              |||| |      0=NROM-128
          |              |||| |      1=NROM-256
          |              |||| +---- Outer PRG bank size
          |              ||||        0=256 KiB (PRG A17 from MMC3)
          |              ||||        1=128 KiB (PRG A17 from outer bank register)
          |              |||+------ CHR A17
          |              ||+------- PRG banking mode
          |              ||          0=MMC3 PRG banking mode
          |              ||          1=GNROM-like PRG banking mode
          |              |+-------- Outer CHR bank size
          |              |           0=256 KiB (CHR A17 from MMC3)           |
          |              |           1=128 KiB (CHR A17 from outer bank register)
          |              +--------- 1=Lock outer bank register
          +------------------------ CHR A18
</pre>
<p>GNROM mode means that:
</p>
<ul><li>the MMC3's CPU A14 input is held low, so MMC3 registers 6 and 7 apply to both $8000/$A000 and $C000/$E000,</li>
<li>in NROM-256 mode, PRG A14 is additionally replaced with CPU A14.</li></ul>
<p>As it uses the MMC3 clones's WRAM interface, writing to the outer bank register requires enabling and not write-protecting WRAM in the MMC's $A001 register.
</p>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
