<div class="mw-parser-output"><p>NES 2.0 Mapper 319 denotes the <b>HP-898F</b> and <b>KD-7/9-E</b> circuit boards. Its UNIF board name is <b>BMC-HP898F</b> (<a href="#UNIF_bank_order">with a different bank order</a>). Used for:
</p>
<ul><li><i>Prima Soft 9999999-in-1</i></li>
<li><i>Olympic 2000 1000000-in-1</i></li>
<li><i>4-in-1 (0207)</i></li>
<li><i>4-in-1 (0210)</i></li>
<li><i>4-in-1 (KG-443)</i></li>
<li><i>9999999-in-1 (KD-6037-B)</i></li></ul>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR-ROM bank</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Bank_and_Mirroring_.28.246004.29"/><span class="mw-headline" id="PRG-ROM_Bank_and_Mirroring_($6004)">PRG-ROM Bank and Mirroring ($6004)</span></h2>
<pre>Mask: $6004

D~7654 3210
  ---------   
  MDaB C...
  |||| +---- PRG A15
  |||+------ PRG A16
  ||+------- PRG A14 if D=0
  |+-------- PRG A14 mode
  |           0: PRG A14=p (NROM-128)
  |           1: PRG A14=CPU A14 (NROM-256)
  +--------- Select nametable mirroring type
              0: Horizontal
              1: Vertical
</pre>
<h2><span id="CHR-ROM_Bank_.28.246000.29"/><span class="mw-headline" id="CHR-ROM_Bank_($6000)">CHR-ROM Bank ($6000)</span></h2>
<pre>Mask: $6004

D~7654 3210
  ---------
  CCCC ....
  ||||
  ||||
  ++++------ Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF
</pre>
<h2><span id="Solder_Pad_Register_.28.245FF0.29"/><span class="mw-headline" id="Solder_Pad_Register_($5FF0)">Solder Pad Register ($5FF0)</span></h2>
<pre>Mask: probably $F000

D~7654 3210
  ---------
  .P.. ....
   +-------- Solder pad value
</pre>
<h1><span class="mw-headline" id="UNIF_bank_order">UNIF bank order</span></h1>
<p>The publicly-available UNIF ROM file of <i>Prima Soft 9999999-in-1</i> has the order of the 16 KiB PRG-ROM banks slightly mixed up, so that the PRG A14 mode bit operates on A16 instead of A14. To obtain the correct bank order, use UNIF 16 KiB PRG banks 0, 4, 1, 5, 2, 6, 3, 7.
</p>
