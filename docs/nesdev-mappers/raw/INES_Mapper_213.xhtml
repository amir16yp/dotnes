From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_213">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_213">other pages</a>

<div class="mw-parser-output"><p><b>iNES Mapper 213</b> is a duplicate of <a href="INES_Mapper_058.xhtml" title="INES Mapper 058">INES Mapper 058</a>, assigned to by:
</p>
<ul><li><i>9999999-in-1</i> (<i>Can You Feel the Love Tonight</i> menu music)</li>
<li><i>168-in-1</i> (<i>My Way</i> menu music)</li></ul>
<p><a rel="nofollow" class="external text" href="https://sourceforge.net/p/fceumm/code/186/tree//src/boards/addrlatch.c">Pre-2018 versions of FCEUX</a> as well as <a rel="nofollow" class="external text" href="https://github.com/SourMesen/Mesen/blob/master/Core/Mapper213.h">current versions of Mesen</a> emulate only the NROM-256 setting with hard-wired mirroring, while <a rel="nofollow" class="external text" href="https://github.com/TASVideos/fceux/blob/master/src/boards/addrlatch.cpp">current versions of FCEUX</a> implement a duplicate of mapper 58 with some logic for determining nametable mirroring that only works for one ROM (said <i>168-in-1</i>). Both ROM files run well as mapper 58.
</p>
