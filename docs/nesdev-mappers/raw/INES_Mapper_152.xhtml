<div class="mw-parser-output"><pre> ========================
 =  Mapper 152          =
 ========================
 
 
 Example Games:
 --------------------------
 <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/2253/arkanoid-ii">Arkanoid 2 (J)</a>
 <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/1539/gegege-no-kitarou-2-youkai-gundan-no-chousen">Gegege no Kitarou 2</a>
 
 
 
 Registers: (** BUS CONFLICTS **)
 --------------------------
 
   $8000-FFFF:  [MPPP CCCC]
     M = Mirroring:
         0 = 1ScA
         1 = 1ScB
 
     P = PRG Reg (16k @ $8000)
     C = CHR Reg (8k @ $0000)
 
 
 PRG Setup:
 --------------------------
 
       $8000   $A000   $C000   $E000  
     +---------------+---------------+
     |     $8000     |     { -1}     |
     +---------------+---------------+
</pre>
<p>The version of this board without mirroring control is <a href="INES_Mapper_070.xhtml" title="INES Mapper 070">mapper 70</a>.
One variant of <a href="INES_Mapper_078.xhtml" title="INES Mapper 078">mapper 78</a> is the same thing with the nibbles swapped.
</p>
