<div class="mw-parser-output"><p><br/>
<b>iNES Mapper 067</b> represents the <a href="Sunsoft_3_pinout.xhtml" title="Sunsoft 3 pinout">Sunsoft-3</a> mapper, used in <i>Fantasy Zone II</i> (J), <i>Mito Koumon II - Sekai Manyuu Ki</i>, and the <a href="Vs__System.xhtml" title="Vs. System">Vs. System</a> game <i>Vs. Platoon</i>.
</p>

<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: Hardware supports at most 256 KiB</li>
<li>PRG ROM bank size: 16 KiB</li>
<li>PRG RAM: Unused, but mapper IC provides RAM enables.</li>
<li>CHR bank size: 2 KiB</li>
<li>CHR ROM size: Hardware supports at most 128 KiB</li>
<li>Nametable <a href="Mirroring.xhtml" title="Mirroring">mirroring</a>: Controlled by mapper (Horizontal, Vertical, 1-screen)</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: No</li></ul>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$BFFF: 16 KiB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$07FF: 2 KiB switchable CHR bank</li>
<li>PPU $0800-$0FFF: 2 KiB switchable CHR bank</li>
<li>PPU $1000-$17FF: 2 KiB switchable CHR bank</li>
<li>PPU $1800-$1FFF: 2 KiB switchable CHR bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Interrupt_Acknowledge_.28.248000.29"/><span class="mw-headline" id="Interrupt_Acknowledge_($8000)">Interrupt Acknowledge ($8000)</span></h3>
<p>Mask: $8800
</p><p>Any write to this address or any of its mirrors acknowledges a pending IRQ.
</p>
<h3><span id="CHR_bank_0.E2.80.A63_.28.248800...24BFFF.29"/><span class="mw-headline" id="CHR_bank_0…3_($8800..$BFFF)">CHR bank 0…3 ($8800..$BFFF)</span></h3>
<p>Mask: $F800
</p><p>Note that the hardware only has six pins for CHR banking, for a limit of 128KB of CHR.
</p>

<h3><span id="IRQ_load_.28.24C800.2C_write_twice.29"/><span class="mw-headline" id="IRQ_load_($C800,_write_twice)">IRQ load ($C800, write twice)</span></h3>
<p>Mask: $F800
</p><p>Write the high then low byte of a 16-bit CPU cycle count, much like <a href="PPU_registers.xhtml" title="PPU registers">PPUADDR</a>. This directly affects the current count, not a reload value. The write state is reset by writing to the register at $D800.
</p>
<h3><span id="IRQ_enable_.28.24D800.29"/><span class="mw-headline" id="IRQ_enable_($D800)">IRQ enable ($D800)</span></h3>
<p>Mask: $F800
</p>
<pre>7  bit  0
...P ....
   |
   +------ 0: Pause counter; 1: Count
</pre>
<p>While bit 4 is true, the 16-bit count decreases by 1 every CPU cycle.
Whenever the count wraps from $0000 to $FFFF, the mapper asserts an IRQ and pauses itself.
Writes reset a latch such that the next $C800 write goes to the <i>high</i> byte of the count.
</p><p>Despite previous notes, writes to this register do not acknowledge the IRQ.
</p><p>If counting is enabled, the External IRQ pin is also capable of asserting an IRQ. No existing hardware uses this functionality.
</p>
<h3><span id="Mirroring_.28.24E800.29"/><span class="mw-headline" id="Mirroring_($E800)">Mirroring ($E800)</span></h3>
<p>Mask: $F800
</p>
<pre>7  bit  0
.... ..MM
       ||
       ++- Nametable mirroring (0=vertical, 1=horizontal, 2=1scA, 3=1scB)
            aka connect VRAM A10 to (0=PPU A10, 1=PPU A11, 2=Gnd, 3=Vcc)
</pre>
<h3><span id="PRG_bank_.28.24F800.29"/><span class="mw-headline" id="PRG_bank_($F800)">PRG bank ($F800)</span></h3>
<p>Mask: $F800
</p>
<pre>7  bit  0
...X PPPP
   | ||||
   | ++++- select a 16 KiB CHR ROM bank at CPU $8000-$BFFF. $C000-$FFFF is fixed to the last bank of PRG ROM.
   +------ 1 bit latch, present but unused. Could be combined with an external OR gate to increase PRG capacity to 512KB.
</pre>
<h2><span class="mw-headline" id="IRQ_Operation">IRQ Operation</span></h2>
<p>$C800 is a write-twice register (similar to $2005 and $2006).  The first write sets the <b>high</b> 8 bits of the
IRQ counter, and the second write sets the <b>low</b> 8 bits.  This directly changes the actual IRQ counter – not
a reload value.
</p><p>In addition to enabling/disabling counting, any write to $D800 will reset the toggle so that the next write to $C800 will be the first write.
</p><p>The IRQ counter, when enabled, counts down every CPU cycle.  When it wraps ($0000→FFFF), it disables
itself and triggers an IRQ.
</p>
