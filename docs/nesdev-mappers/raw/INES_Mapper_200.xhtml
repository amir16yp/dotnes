<div class="mw-parser-output"><p><b>iNES Mapper 200</b> denotes the circuit boards of simple address-latch-based NROM-128 multicarts, i.e. CPU $8000-$BFFF is always a mirror of CPU $C000-$FFFF.
</p><p>The mapper number is used for two variants that differ in the bit that selects nametable mirroring.
</p><p>PCB that use this mapper :
</p>
<ul><li><b>MG109</b> for the <i><a href="1993_Super_50_in_1_Game.xhtml" title="1993 Super 50 in 1 Game">1993 Super 50 in 1 Game</a></i> multicart</li></ul>

<h1><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h1>
<h2><span class="mw-headline" id="Submapper_0">Submapper 0</span></h2>
<pre>A~[1... .... .... bBBB]
                  |+++- PRG A16..A14, CHR A15..A13
                  +---- PRG A17, CHR A16, Mirroring:
                         0: Vertical
                         1: Horizontal
</pre>
<h2><span class="mw-headline" id="Submapper_1">Submapper 1</span></h2>
<pre>A~[1... .... .... .bBB]
                   |++- PRG A15..A14, CHR A14..A13
                   +--- PRG A16, CHR A15, Mirroring:
                         0: Vertical
                         1: Horizontal
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Some menus select bank numbers beyond the PRG ROM size, expecting to read back a solder pad value to select one of several displayed game counts.</li>
<li><a href="NES_2_0_Mapper_338.xhtml" title="NES 2.0 Mapper 338">NES 2.0 Mapper 338</a> flips the meaning of the mirroring bit.</li></ul>
