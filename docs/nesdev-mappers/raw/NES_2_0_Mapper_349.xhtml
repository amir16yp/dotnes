<div class="mw-parser-output"><p>NES 2.0 mapper 349 is used for the <i>1994 Super HIK 14-in-1 (G-136)</i> multicart. Its UNIF board name is <b>BMC-G-146</b>. CHR data is stored in 8 KiB of unbanked CHR-RAM.
</p>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1... U... MSOO OPPp
       |    ||++-++++- Select 16 KiB PRG-ROM bank CPU $8000-$BFFF and $C000-$FFFF,
       |    ||         modified by U and S bits
       |    |+-------- Select PRG A14 Mode
       |    |           if U=1 (UNROM mode): 0: PRG A14=p, 1: PRG A14=1
       |    |           if U=0 (NROM mode):  0: PRG A14=PA14 (NROM-256), 1: PRG A14=p (NROM-128)
       |    +--------- Select nametable mirroring type
       |                0: Vertical
       |                1: Horizontal
       +-------------- Select PRG A14-A16 Mode
                        0: PPx (NROM), x determined by S bit
                        1: PPp OR S if PA14=0, 111b if PA14=1 (UNROM-like)
</pre>
