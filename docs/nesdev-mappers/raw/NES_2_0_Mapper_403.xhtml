<div class="mw-parser-output"><p><b>NES 2.0 Mapper 403</b> denotes the <b>89433</b> circuit board with up to 1 MiB PRG-ROM and 32 KiB of CHR-RAM, bankable with 8 KiB granularity.
</p>
<ul><li><i>Tetris Family - 玩家 19-in-1 智瑟實典</i> (NO-1683)</li>
<li><i>Sachen Superpack</i> (versions A-C)</li></ul>
<h2><span id="PRG_bank_register_.28.244100.29"/><span class="mw-headline" id="PRG_bank_register_($4100)">PRG bank register ($4100)</span></h2>
<pre>Mask: $E103

D~[.PPP PPp.]
    +++-+++--- PRG A19..A14

Power-on value: $00
</pre>
<h2><span id="CHR_bank_register_.28.244101.2C_.248000-.24FFFF.29"/><span class="mw-headline" id="CHR_bank_register_($4101,_$8000-$FFFF)">CHR bank register ($4101, $8000-$FFFF)</span></h2>
<pre>Mask: $E103, $8000

D~[.... ..CC]
          ++-- CHR A14..A13

Power-on value: $00
</pre>
<p>The latch at $8000-$FFFF is enabled/disabled via the Mode register's C bit.
</p>
<h2><span id="Mode_register_.28.244102.29"/><span class="mw-headline" id="Mode_register_($4102)">Mode register ($4102)</span></h2>
<pre>Mask: $E103

D~[...H .C.N]
      |  | +- 0: PRG A14=CPU A14 (NROM-256)
      |  |    1: PRG A14=p (NROM-128)
      |  +--- 0: Latch at $8000-$FFFF disabled
      |       1: Latch at $8000-$FFFF enabled
      +------ 0: Vertical mirroring
              1: Horizontal mirroring

Power-on value: $00
</pre>
