<div class="mw-parser-output"><p><b>NES 2.0 Mapper 415</b> denotes the <b>0353</b> circuit board for a cartridge conversion of the FDS game <i>Roger Rabbit</i>, renamed to <i>Lucky Rabbit</i>.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB PRG-ROM bank</li>
<li>CPU $8000-$FFFF: Fixed last 32 KiB PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Data_latch">Data latch</span></h1>
<pre>Mask: $8000
D~[...M PPPP]
      | ++++- PRG A16..A13 at CPU $6000-$7FFF
      +------ 0=Vertical, 1=Horizontal mirroring
</pre>
