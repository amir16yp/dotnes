</head><body><h1>INES Mapper 052</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_052">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_052">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><b>iNES Mapper 052</b> denotes the <b>Realtec 8213</b> and similar <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based multicart circuit boards.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>D~[LTCc SBPp]
   |||| ||++-- PRG A18..A17
   |||| |+---- PRG/CHR A19
   |||| +----- PRG A17 mode: 0=from MMC3, 1=from p
   ||++------- CHR A18..A17
   |+--------- CHR A17 mode: 0=from MMC3, 1=from c
   +---------- 1=Lock Outer Bank register until next reset
Value on reset: $00
</pre>
<p>The MMC3's WRAM interface must be enabled and writeable in <a href="MMC3.xhtml#PRG_RAM_protect_(%24A001-%24BFFF,_odd)" title="MMC3">MMC3 register $A001</a>. The Outer Bank Register overlaps any actual PRG RAM that may be present.
</p>
<h2><span id="Mixed_CHR_ROM.2FCHR_RAM_variants"/><span class="mw-headline" id="Mixed_CHR_ROM/CHR_RAM_variants">Mixed CHR ROM/CHR RAM variants</span></h2>
<p>Nestopia Plus! has defined <b>Submapper 13</b> to denote a PCB variant with 512 KiB of each PRG ROM and CHR ROM that can switch between regular CHR ROM and 8 KiB unbanked CHR RAM. CHR RAM is selected when PRG A17 and PRG A18 are both =1.
</p><p>Nestopia Plus! further uses Submapper 13 to denote the <i>(AB-128) Well 8-in-1</i> multicart with 1 MiB of each PRG ROM and CHR ROM, which is incompatible to the above definition, and which is hereby reassigned to <b>Submapper 14</b>. Its actual PCB name is <b>AB892</b>, and its Outer Bank Register has the following form:
</p>
<pre>D~[LTRc SBBp]
   |||| |||+-- PRG A18..A17
   |||| |++--- PRG/CHR A19..A18
   |||| +----- PRG A17 mode: 0=from MMC3, 1=from p
   |||+------- CHR A17
   ||+-------- 0=CHR-ROM, 1=CHR RAM
   |+--------- CHR A17 mode: 0=from MMC3, 1=from c
   +---------- 1=Lock Outer Bank register until next reset
</pre>
<p>At least one cart (AB-134) re-uses this PCB but leaves the CHR RAM spot unpopulated, still using the combined bit for PRG/CHR A18, but rendering the &quot;R&quot; bit 5 meaningless. The correct NES 2.0 header for this would be submapper 14 but with zero CHR RAM.
</p>
