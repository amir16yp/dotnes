<div class="mw-parser-output"><p><b>iNES Mapper 246</b> denotes the <b>G0151-1</b> circuit board, used only for the Taiwanese game <a href="http://community.fandom.com/wiki/c:bootleggames:Feng_Shen_Bang" class="extiw" title="wikia:c:bootleggames:Feng Shen Bang">封神榜 (<i>Fēngshénbǎng: Fúmó Sān Tàizǐ</i>)</a>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6800-$6FFF: 2 KiB PRG-RAM, battery-banked</li>
<li>CPU $8000-$9FFF: 8 KiB PRG-ROM bank, switchable via $6000</li>
<li>CPU $A000-$BFFF: 8 KiB PRG-ROM bank, switchable via $6001</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-ROM bank, switchable via $6002</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank, switchable via $6003</li>
<li>PPU $0000-$07FF: 2 KiB CHR-ROM bank, switchable via $6004</li>
<li>PPU $0800-$0FFF: 2 KiB CHR-ROM bank, switchable via $6005</li>
<li>PPU $1000-$17FF: 2 KiB CHR-ROM bank, switchable via $6006</li>
<li>PPU $1800-$1FFF: 2 KiB CHR-ROM bank, switchable via $6007</li></ul>
<p>Nametable mirroring is hard-wired and set by the iNES header.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_bank_select_.28.246000-.246003.29.2C_write"/><span class="mw-headline" id="PRG-ROM_bank_select_($6000-$6003),_write">PRG-ROM bank select ($6000-$6003), write</span></h2>
<pre>A~[0110 0000 000. .0rr] D~[..bb bbbb]
                    ||       ++-++++- PRG A18..A13 of bank to select
                    ++--------------- CPU A14..A13 bank to switch
</pre>
<ul><li>When reading from CPU address $FFE4-$FFE7, $FFEC-$FFEF, $FFF4-$FFF7, or $FFFC-$FFFF, PRG A17 is forced high, as if register $6003 were OR'd with $10.</li>
<li>Register $6003 is set to $FF at power-on only.</li></ul>
<h2><span id="CHR-ROM_bank_select_.28.246004-.246007.29.2C_write"/><span class="mw-headline" id="CHR-ROM_bank_select_($6004-$6007),_write">CHR-ROM bank select ($6004-$6007), write</span></h2>
<pre>A~[0110 0000 000. .1rr] D~[bbbb bbbb]
                    ||     ++++-++++- CHR A18..A11 of bank to select
                    ++--------------- PPU A12..A11 bank to switch
</pre>
