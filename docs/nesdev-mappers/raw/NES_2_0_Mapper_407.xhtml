<div class="mw-parser-output"><p><b>NES 2.0 Mapper 407</b> is used by the <i>Win, Lose or Draw</i> Plug-n-Play which came built into a tablet. The game uses the <a href="VTxx.xhtml" class="mw-redirect" title="VT03">VT03</a> enhanced NOAC. The submapper field is set to 15 to denote that the same CPU opcode encryption method as Mapper <a href="NES_2_0_Mapper_256.xhtml" title="NES 2.0 Mapper 256">256</a>'s, submapper 15. The NOAC's PRG A24 selects between PRG-ROM (0) and 64 KiB of PRG-RAM (1), which the OneBus hardware can map to both CPU and PPU address space.
</p>
