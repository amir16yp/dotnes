<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 133</a> is used for two versions of the <a href="http://community.fandom.com/wiki/c:bootleggames:Sachen" class="extiw" title="wikia:c:bootleggames:Sachen">Sachen</a> unlicensed game <i>Jovial Race</i> and the 60-pin Joy Van release of <i>盜帥 (Master Chu and the Drunkard Hu)</i>.
</p>

<h2><span class="mw-headline" id="Original_60-pin_release">Original 60-pin release</span></h2>
<p>The 60-pin releases of both games use the Sachen 3009 board, which wires a <a href="INES_Mapper_206.xhtml" title="INES Mapper 206">Namco 108</a> (marked &quot;ASLIC AX-24G&quot;) clone in an inscrutably complex way. There is no UNIF mapper designated for the Sachen 3009 board.
</p>
<pre> Mask: $E001
 $8000: [..B. .B.B] - Select register for writing
 $8001: [...X XPCC] - Write value to register
            | ||||
            | ||++--- select 8 KiB CHR bank
            | |+----- select 32 KiB PRG bank
            +-+------ analog feedback path
</pre>
<p>Four of the registers produce an analog feedback path through the 108's CHR registers:
</p>
<table class="tabular">
<tbody><tr>
<th>XX bits</th>
<th>if this register was selected by the XX bits, switch to using contents of register
</th></tr>
<tr>
<td>$00</td>
<td>$04
</td></tr>
<tr>
<td>$08</td>
<td>$24
</td></tr>
<tr>
<td>$10</td>
<td>$01
</td></tr>
<tr>
<td>$18</td>
<td>$21
</td></tr></tbody></table>
<p>If this feedback path doesn't settle on one specific register, then the selected banks will rapidly switch between all the registers specified by the feedback path, and the 108 clone will get hot.
</p>
<h2><span class="mw-headline" id="72-pin_release">72-pin release</span></h2>
<p>The 72-pin release of <i>Jovial Race</i> uses the Sachen 72008 board, a much simpler board that is similar but not identical to <a href="NINA_003_006.xhtml" class="mw-redirect" title="INES Mapper 079">INES Mapper 079</a>. Its UNIF MAPR is <b>UNL-SA-72008</b>.
</p>
<pre> Mask: $E100
 $4100: [.... .PCC] - Select 32 KiB PRG bank and 8 KiB CHR bank
</pre>
<p>The 72-pin releases of <i>Master Chu and the Drunkard Hu</i> on the other hand use <a href="Color_Dreams.xhtml" class="mw-redirect" title="INES Mapper 011">INES Mapper 011</a> for the Color Dreams release and <a href="NINA_003_006.xhtml" class="mw-redirect" title="INES Mapper 079">INES Mapper 079</a> for the Sachen release.
</p>
<h2><span class="mw-headline" id="Emulator_compatibility">Emulator compatibility</span></h2>
<p>The 60-pin releases of <i>Jovial Race</i> and <i>盜帥</i> contain bankswitching code for both board variants, whereas the 72-pin release of <i>Jovial Race</i> only contains code for the $4100-based latch variant. For this reason, and because the 60-pin release of <i>Jovial Race</i> was analyzed much later, emulators only emulate, and only need to emulate, the 72-pin variant of the board.
</p>
