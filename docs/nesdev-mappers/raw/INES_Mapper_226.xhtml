</head><body><h1>INES Mapper 226</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_226">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_226">other pages</a>

<div class="mw-parser-output"><pre> Here are Disch's original notes:  
 ========================
 =  Mapper 226          =
 ========================
 
 Example Games:
 --------------------------
 76-in-1
 Super 42-in-1
 
 
 Registers:
 ---------------------------
 
 Range, Mask:  $8000-FFFF, $8001
 
   $8000:  [PMOP PPPP]
      P = Low 6 bits of PRG Reg
      M = Mirroring (0=Horz, 1=Vert)
      O = PRG Mode
 
   $8001:  [.... ...H]
      H = high bit of PRG
 
 
 PRG Setup:
 ---------------------------
 
 Low 6 bits of the PRG Reg come from $8000, high bit comes from $8001
 
 
                $8000   $A000   $C000   $E000  
              +-------------------------------+
 PRG Mode 0:  |             &lt;Reg&gt;             |
              +-------------------------------+
 PRG Mode 1:  |      Reg      |      Reg      |
              +---------------+---------------+
</pre>
<p>The <a rel="nofollow" class="external text" href="http://nesdev.org/226.txt">original describing document</a> states the 2s bit of the register at $8001 disables CHRRAM writes. No games seem to rely on it, though. It also says that the mapper hardware is made of a 74LS74A, 74LS273, <a href="74139.xhtml" title="74139">74LS139</a>, <a href="7402.xhtml" title="7402">74LS02</a>, and <a href="74153.xhtml" title="74153">74LS153</a>.
</p><p>The multicart <a rel="nofollow" class="external text" href="http://web.archive.org/web/20030602133825/http://www.nesplayer.com/pirates/76in1.htm">reportedly relies</a> on the value of uninitialized memory to determine exactly how many games are available.
</p><p>The multicart clears both registers on soft reset.
</p><p>See also: <a rel="nofollow" class="external text" href="http://forums.nesdev.org/viewtopic.php?t=5642">Repair of one such cartridge</a>
</p>
