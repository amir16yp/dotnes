</head><body><h1>INES Mapper 074</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_074">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_074">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><b>iNES Mapper 074</b> denotes the <b>43-393</b>/<b>43-406</b>/<b>860908C</b> PCB, used by several games from Waixing:
</p>
<ul><li><i>機甲戰士</i> (Jījiǎ Zhànshì, Chinese translation of Data East's <i>Metal Max</i>)</li>
<li><i>甲A - China Soccer League for Division A</i></li>
<li><i>第四次: 机器人大战 - Robot War IV</i></li>
<li><i>風雲 - Traitor Legend</i> (original 1997 version)</li></ul>
<p>The circuit board mounts an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone together with a 74LS138 and 74LS139 to redirect 1 KiB CHR-ROM banks #8 and #9 to 2 KiB of CHR-RAM.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>SMYNES and older versions of VirtuaNES EX/Plus use mapper 74 to denote <i>any</i> MMC3-based mixed CHR-ROM/CHR-RAM game by simply making <i>all</i> of CHR-ROM writable, even if those games actually use <a href="INES_Mapper_191.xhtml" title="INES Mapper 191">191</a>, <a href="INES_Mapper_192.xhtml" title="INES Mapper 192">192</a>, <a href="INES_Mapper_194.xhtml" title="INES Mapper 194">194</a>, or <a href="INES_Mapper_195.xhtml" title="INES Mapper 195">195</a>. This approach fails in the case of <i>甲A - China Soccer League for Division A</i>, as the game writes all zeros to whatever CHR-ROM banks are mapped at power-on, overwriting CHR-ROM data in the process. As a result, the publicly available dump of that game (PRG-ROM CRC32 0x78FB3ED6) has been modified to remove those writes.</li>
<li>Nestopia emulates all of Waixing's MMC3 clones with a slight variation on the mirroring control register at $A000, additionally treating a written value of 2 or 3 as 1scA and 1scB mirroring respectively.</li>
<li><a href="INES_Mapper_119.xhtml" title="INES Mapper 119">iNES Mapper 119</a> is Nintendo's first-party analog. Mappers <a href="INES_Mapper_252.xhtml" title="INES Mapper 252">252</a> and <a href="INES_Mapper_253.xhtml" title="INES Mapper 253">253</a>, also used for Waixing's localizations, are similar but use a VRC4.</li></ul>
