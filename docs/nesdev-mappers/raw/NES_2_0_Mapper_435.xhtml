<div class="mw-parser-output"><p><b>NES 2.0 Mapper 435</b> denotes the <b>F-1002</b> multicart circuit board mounting 2 MiB of PRG-ROM plus 8 KiB of unbanked CHR-RAM. It is basically a larger version of <a href="NES_2_0_Mapper_380.xhtml" title="NES 2.0 Mapper 380">NES 2.0 Mapper 380</a>.
</p>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>[A~1... CQOQ .QQP PpMS]
        ||||  ||| |||+-0: PRG A14=CPU A14
        ||||  ||| |||  1: PRG A14=p
        ||||  ||| ||+- 0: Vertical mirroring
        ||||  ||| ||   1: Horizontal mirroring
        ||||  ||+-++-- PRG A16..A14 (inner bank)
        |+|+--++------ PRG A20..A17 (outer bank)
        | +----------- 0: When CPU A14=1: PRG A16..14=111 (UNROM)
        |              1: When CPU A14=1: PRG A16..14=PPp (NROM)
        +------------- 0: CHR-RAM writeable
                       1: CHR-RAM write-protected
Power-on value: 0
</pre>
<p>Effective meaning:
</p>
<pre>Bit 9   Bit 0   Meaning
$200s   $001s
 (O)     (S)
  0       ?     Switchable inner 16 KiB bank PPp at CPU $8000-$BFFF, fixed inner bank #7 at CPU $C000-$FFFF (UNROM)
  1       0     Switchable 32 KiB inner bank PP at CPU $8000-$FFFF (NROM-256)
  1       1     Switchable 16 KiB inner bank PPp at CPU $8000-$BFFF, mirrored at CPU $C000-$FFFF (NROM-128)
</pre>
<p>Because all bits are cleared on reset, CPU $8000-$BFFF is set to 16 KiB bank #0, and $C000-$FFFF is set to 16 KiB bank #7 on reset.
</p>
