<div class="mw-parser-output"><p>This mapper is used on exactly one known game: <a rel="nofollow" class="external text" href="http://bootleggames.wikia.com/wiki/Street_Fighter_IV">快打傳説 Street Fighter IV</a>. It uses <a href="MMC3.xhtml" title="MMC3">MMC3</a>-compatible registers for CHR ROM bankswitching and IRQ control, and additional registers for PRG ROM bankswitching, mirroring control, and protection.
</p>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$FFFF: 32 KB switchable PRG ROM bank</li>
<li>PPU $0000-$07FF (or $1000-$17FF): 2 KB switchable CHR bank (same as MMC3)</li>
<li>PPU $0800-$0FFF (or $1800-$1FFF): 2 KB switchable CHR bank (same as MMC3)</li>
<li>PPU $1000-$13FF (or $0000-$03FF): 1 KB switchable CHR bank (same as MMC3)</li>
<li>PPU $1400-$17FF (or $0400-$07FF): 1 KB switchable CHR bank (same as MMC3)</li>
<li>PPU $1800-$1BFF (or $0800-$0BFF): 1 KB switchable CHR bank (same as MMC3)</li>
<li>PPU $1C00-$1FFF (or $0C00-$0FFF): 1 KB switchable CHR bank (same as MMC3)</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>This description is based on <a rel="nofollow" class="external text" href="https://github.com/asfdfdfd/fceux/blob/master/src/boards/208.cpp">FCEUX's implementation</a>, except for the additional information on the mirroring control.
</p>
<h3><span id="PRG_Bank_and_Mirroring_.28.244800-.244FFF.2C_.246800-.246FFF.2C_write-only.29"/><span class="mw-headline" id="PRG_Bank_and_Mirroring_($4800-$4FFF,_$6800-$6FFF,_write-only)">PRG Bank and Mirroring ($4800-$4FFF, $6800-$6FFF, write-only)</span></h3>
<pre>7  bit  0
---- ----
..MP ...P
  ||    |
  |+----+- Select 32KB page of PRG-ROM at $8000
  +------- Select mirroring
             0: Vertical
             1: Horizontal
</pre>
<p>The initial value of this register is $11.
</p>
<h3><span id="Protection_Table_Index_.28.245000-.2457FF.2C_write-only.29"/><span class="mw-headline" id="Protection_Table_Index_($5000-$57FF,_write-only)">Protection Table Index ($5000-$57FF, write-only)</span></h3>
<p>Specifies the index into the 256-byte table that will be used for the next write to $5800-$5FFF.
</p>
<h3><span id="Protection_Data_Access_.28.245800-.245FFF.2C_read.29"/><span class="mw-headline" id="Protection_Data_Access_($5800-$5FFF,_read)">Protection Data Access ($5800-$5FFF, read)</span></h3>
<p>Returns the content of one of the four protection registers determined by the two lower bits of the address being read. The correct result is checked for by executing code at $5800, which in the case of proper emulation of the protection scheme will result in the execution of a JMP opcode to a desired address.
</p>
<h3><span id="Protection_Data_Access_.28.245800-.245FFF.2C_write.29"/><span class="mw-headline" id="Protection_Data_Access_($5800-$5FFF,_write)">Protection Data Access ($5800-$5FFF, write)</span></h3>

</p>
<h2><span class="mw-headline" id="Submapper_1">Submapper 1</span></h2>
<p>A version of the game that removes the &quot;Gouder Co. Ltd.&quot; copyright notice from the title screen uses a different MMC3-like mapper that is incompatible to the description above. That version of the game is inexplicably labelled &quot;Mortal Kombat (JJ-01) (Ch) [!]&quot; in GoodNES v3.23b. <a rel="nofollow" class="external text" href="http://nestopia.gamemw.com/index.php/34-nestopia-plus-1-4-0-10-r272">The Nestopia Plus! author has assigned this different mapper to submapper number 1 of mapper 208</a>.
</p><p>There are no additional registers, even as the ROM image retains some leftovers of code writing to $5800. Instead of switching PRG ROM banks MMC3-style, there is only one 32k PRG ROM bank at CPU $8000. Its value is determined by MMC3 bank register 6; the actual bank number is the bank register value SHR 2. CHR ROM bankswitching, mirroring and IRQ control are performed using the normal MMC3 registers.
</p>
<h2><span class="mw-headline" id="Related">Related</span></h2>
<p>This is reminiscent of <a href="INES_Mapper_189.xhtml" title="INES Mapper 189">iNES Mapper 189</a>.
</p>
