<div class="mw-parser-output"><p>NES 2.0 Mapper 517 is used for 까치와 노래친구 (Kkachi-wa Nolae Chingu), a Korean Karaoke game. It uses banking similar to <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> without bus conflicts, but has additional ADC hardware (different from <a href="NES_2_0_Mapper_515.xhtml" title="NES 2.0 Mapper 515">NES 2.0 Mapper 515</a>) for its custom microphone socket at $6000 and $6001.
</p>
