<div class="mw-parser-output"><p><b>iNES Mapper 120</b> denotes Whirlwind Manu's <b>LH15</b> cartridge conversion of Square's <a href="Family_Computer_Disk_System.xhtml" class="mw-redirect" title="FDS">FDS</a> game とびだせ大作戦 (Tobidase Daisakusen).
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB switchable PRG ROM bank</li>
<li>CPU $8000-$FFFF: 32 KiB hard-wired PRG ROM bank #2</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR RAM</li>
<li>Nametable mirroring: hard-wired (to vertical)</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_ROM_switch_.28.2441FF.2C_write.29"/><span class="mw-headline" id="PRG_ROM_switch_($41FF,_write)">PRG ROM switch ($41FF, write)</span></h2>
<pre>Address Mask: $E100

D~[.... .PPP]
         +++- Select 8 KiB PRG ROM bank at CPU $6000-$7FFF
</pre>
