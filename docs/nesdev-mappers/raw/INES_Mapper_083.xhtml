From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_083">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_083">other pages</a>

<div class="mw-parser-output"><p>iNES Mapper 83 is used for games from Cony, also known as Yoko. There are three somewhat incompatible subtypes, denoted by <a href="NES_2_0_submappers_Proposals.xhtml#083:_Cony" title="NES 2.0 submappers/Proposals">submappers</a>, although the proper subtype is easy to heuristically discern by looking at the CHR-ROM size:
</p>
<ul><li>256 KiB CHR-ROM =&gt; <b>Submapper 0</b> (1 KiB CHR-ROM banking, no WRAM)
<ul><li>Street Fighter II Pro/Street Blaster II Pro</li>
<li>Street Fighter IV Pro 10/Street Blaster IV Pro 10</li>
<li>Street Blaster V Turbo 20</li>
<li>Street Fighter X Turbo 40</li>
<li>Fatal Fury 2/餓狼伝説 2</li>
<li>Fatal Fury 2'/餓狼伝説 2'</li></ul></li>
<li>512 KiB CHR-ROM =&gt; <b>Submapper 1</b> (2 KiB CHR-ROM banking, no WRAM)
<ul><li>Super Blaster VII Turbo 28</li>
<li>World Heroes 2/快打英雄榜 2</li>
<li>World Heroes 2 Pro//快打英雄榜 2 Pro</li></ul></li>
<li>1024 KiB CHR-ROM =&gt; <b>Submapper 2</b> (1 KiB CHR-ROM banking with outer bank, 32 KiB banked WRAM)
<ul><li>Dragon Ball Party</li></ul></li></ul>
<p>A fourth Yoko mapper, functionally similar but with different register addresses, has been assigned to <a href="NES_2_0_Mapper_264.xhtml" title="NES 2.0 Mapper 264">NES 2.0 Mapper 264</a>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Mode_Register_.28.248100.2C_write.29"/><span class="mw-headline" id="Mode_Register_($8100,_write)">Mode Register ($8100, write)</span></h2>
<p>Mask: $8300
</p>
<pre>7654 3210
---------
ED6M M.mm
|||| | ++- Select nametable mirroring type
|||| |     0: Vertical
|||| |     1: Horizontal
|||| |     2: One screen, page 0
|||| |     3: One screen, page 1
|||+-+---- Select PRG banking mode
|||        0: 16 KiB PRG-ROM bank at $8000-$BFFF, determined by PRG register 4 ($8000)
|||           16 KiB PRG-ROM bank at $C000-$FFFF, fixed to last bank
|||        1: 32 KiB PRG-ROM bank at $8000-$FFFF, determined by PRG register 4 ($8000) SHR 1
|||        2: 8 KiB PRG-ROM bank at $8000-$9FFF, determined by PRG register 0 ($8300)
|||           8 KiB PRG-ROM bank at $A000-$BFFF, determined by PRG register 1 ($8301)
|||           8 KiB PRG-ROM bank at $C000-$DFFF, determined by PRG register 2 ($8302)
|||           8 KiB PRG-ROM bank at $E000-$FFFF, fixed to last bank
|||        3: same as mode 2
||+------- <b>Submappers 0 and 1</b>: Enable/disable 8 KiB PRG-ROM at $6000-$7FFF
||         0: Disabled, open bus at $6000-$7FFF
||         1: 8 KiB PRG-ROM bank at $6000-$7FFF, determined by PRG register 3
||         <b>Submapper 2</b>: no function
|+-------- IRQ counting mode
|          0: Increment
|          1: Decrement
+--------- IRQ Enable latch
           0: Disabled
           1: Enabled
</pre>
<p>In <b>Submapper 2</b>, PRG banking as described above applies to the inner bank within
the 256 KiB outer bank selected by the Outer Bank register ($8000) bits 4-5.
</p>
<h2><span id="PRG-ROM_registers_0-3_.28.248300-.248303.2C_write.29"/><span class="mw-headline" id="PRG-ROM_registers_0-3_($8300-$8303,_write)">PRG-ROM registers 0-3 ($8300-$8303, write)</span></h2>
<p>Mask: $8313
</p>
<pre>$8300: PRG register 0 (8 KiB PRG-ROM bank at $8000-$9FFF in PRG banking mode 2)
$8301: PRG register 1 (8 KiB PRG-ROM bank at $A000-$BFFF in PRG banking mode 2)
$8302: PRG register 2 (8 KiB PRG-ROM bank at $C000-$DFFF in PRG banking mode 2)
$8303: PRG register 3 (8 KiB PRG-ROM bank at $6000-$7FFF if Mode Register ($8100) bit 5 is set
       (<b>Submappers 0 and 1</b> only)
</pre>
<h2><span id="PRG-ROM_register_4.2FOuter_Bank_register_.28.248000.2C_write.29"/><span class="mw-headline" id="PRG-ROM_register_4/Outer_Bank_register_($8000,_write)">PRG-ROM register 4/Outer Bank register ($8000, write)</span></h2>
<p>Mask: $8300
</p>
<pre>7654 3210
---------
WWOO PPPP
|||| ++++- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF in PRG mode 0
|||| +++-- Select 32 KiB PRG-ROM bank at CPU $8000-$FFFF in PRG mode 1
||++------ <b>Submapper 2</b> only: Select 256 KiB Outer PRG/CHR-ROM bank
++-------- <b>Submapper 2</b> only: Select 8 KiB WRAM bank at CPU $6000-$7FFF
           

</pre>
<h2><span id="CHR-ROM_registers_.28.248310-.248317.2C_write.29"/><span class="mw-headline" id="CHR-ROM_registers_($8310-$8317,_write)">CHR-ROM registers ($8310-$8317, write)</span></h2>
<p>Mask: $831F
</p><p><b>Submapper 0 and 2</b>:
</p>
<pre>$8310: Select 1 KiB CHR-ROM bank at PPU $0000-$03FF
$8311: Select 1 KiB CHR-ROM bank at PPU $0400-$07FF
$8312: Select 1 KiB CHR-ROM bank at PPU $0800-$0BFF
$8313: Select 1 KiB CHR-ROM bank at PPU $0C00-$0FFF
$8314: Select 1 KiB CHR-ROM bank at PPU $1000-$13FF
$8315: Select 1 KiB CHR-ROM bank at PPU $1400-$17FF
$8316: Select 1 KiB CHR-ROM bank at PPU $1800-$1BFF
$8317: Select 1 KiB CHR-ROM bank at PPU $1C00-$1FFF
$8318-$831F: No function
</pre>
<p>In <b>Submapper 2</b>, these registers select the inner CHR-ROM bank, while the Outer Bank register ($8000) bits 4-5 select the 256 KiB outer CHR-ROM bank.
</p><p><b>Submapper 1</b>:
</p>
<pre>$8310: Select 2 KiB CHR-ROM bank at PPU $0000-$07FF
$8311: Select 2 KiB CHR-ROM bank at PPU $0800-$0FFF
$8312-$8315: No function
$8316: Select 2 KiB CHR-ROM bank at PPU $1000-$17FF
$8317: Select 2 KiB CHR-ROM bank at PPU $1800-$1FFF
$8318-$831F: No function
</pre>
<h2><span id="DIP_Switch_.28.245000.2C_read.29"/><span class="mw-headline" id="DIP_Switch_($5000,_read)">DIP Switch ($5000, read)</span></h2>
<p>Mask: probably $DF00
</p>
<pre>7654 3210
---------
.... ..DD
       ++- DIP switch setting
</pre>
<p>Several games display different names (<i>Street Fighter</i> versus <i>Street Blaster</i>) depending on the DIP switch setting. Some games will display a garbled title screen
at some DIP switch settings, and the &quot;good&quot; setting is not always 0 or 3!
</p>
<h2><span id="Scratch_RAM_.28.245100-.245FFF.2C_read.2Fwrite.29"/><span class="mw-headline" id="Scratch_RAM_($5100-$5FFF,_read/write)">Scratch RAM ($5100-$5FFF, read/write)</span></h2>
<p>Mask: probably $DF03
</p>
<pre>$5xx0: Scratch RAM byte #0
$5xx1: Scratch RAM byte #1
$5xx2: Scratch RAM byte #2
$5xx3: Scratch RAM byte #3
</pre>
<h2><span id="IRQ_Acknowledge_and_Counter_Low_.28.248200.29"/><span class="mw-headline" id="IRQ_Acknowledge_and_Counter_Low_($8200)">IRQ Acknowledge and Counter Low ($8200)</span></h2>
<p>Mask: $8301
</p><p>A write directly changes the low eight bits of the 16-bit IRQ counter and acknowledges the IRQ.
</p>
<h2><span id="IRQ_Enable_and_Counter_High_.28.248201.29"/><span class="mw-headline" id="IRQ_Enable_and_Counter_High_($8201)">IRQ Enable and Counter High ($8201)</span></h2>
<p>Mask: $8301
</p><p>A write directly changes the high eight bits of the 16-bit IRQ counter, and copies bit 7 of the Mode register
to the actual IRQ Enable register (which is not directly accessible).
</p>
<h1><span class="mw-headline" id="IRQ_Operation">IRQ Operation</span></h1>
<p>If the IRQ counter is enabled (by writing a value to $8201 after setting bit 7 in the Mode register), and the counter is not zero, the counter is increased (Mode register bit 6 clear) or decreased (Mode register bit 6 set) on every M2 cycle. If it reaches zero, an IRQ is raised, and the IRQ counter is automatically disabled.
</p>
