<div class="mw-parser-output"><p><b>iNES Mapper 186</b> was originally assigned for the BIOS of the <a href="Fukutake_Study_Box.xhtml" title="Fukutake Study Box">Fukutake Study Box</a>. The only emulators that emulate this device, Mesen and NintendulatorNRS, both require the BIOS image as a headerless .BIN file however, making this mapper assignment useless.
</p>
