<div class="mw-parser-output"><p>NES 2.0 Mapper 325 is used for <i>Super Mali Splash Bomb</i>, a bootleg hack of <i>Keroppi to Keroriinu no Splash Bomb</i>. Its UNIF board name is <b>UNL-MALISB</b>. It's an MMC3 clone with the address input and output lines connected in an unusual manner: The MMC3 clones' ...
</p>
<ul><li>CPU A0 input is connected to CPU A3 and additionally to CPU A2 if CPU A14==1;</li>
<li>PRG A15 (PRG bank number bit 2) is swapped with PRG A16 (PRG bank number bit 3);</li>
<li>CHR A11 (CHR bank number bit 1) is swapped with CHR A15 (CHR bank number bit 5).</li></ul>
