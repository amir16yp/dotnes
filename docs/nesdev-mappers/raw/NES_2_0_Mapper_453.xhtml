<div class="mw-parser-output"><p><b>NES 2.0 Mapper 453</b> denotes the <b>Realtec 8042</b> multicart circuit board, used for the <i>3-in-1 1995 World Competitive Champion Edition (DG-002)</i> multicart. It supports both AOROM and UNROM banking modes.
</p>
<h2><span id="Data_Latch_.28.248000-.24FFFF.29.2C_write"/><span class="mw-headline" id="Data_Latch_($8000-$FFFF),_write">Data Latch ($8000-$FFFF), write</span></h2>
<pre>D~[.PpM .BBB]
    |||  +++- PRG A16..A14 in UNROM mode,
    |||       PRG A17..A15 in AOROM mode
    ||+------ Mirroring
    ||         0=V, 1=H in UNROM mode,
    ||         CIRAM A10 in AOROM mode
    ++------- Lock Pp if either bit is set
    |+------- PRG A17 in UNROM mode
    +-------- PRG A18
    +-------- PRG banking mode
               0=UNROM, 1=AOROM
</pre>
