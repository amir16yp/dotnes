<div class="mw-parser-output"><p><b>NES 2.0 Mapper 388</b> denotes J.Y. Company's <b>YY841145C</b> and <b>YY850835C</b> circuit boards, used for the multicarts:
</p>
<ul><li><i>1996 Super HiK 4-in-1 (JY-056 earlier version)</i></li>
<li><i>1996 Super HiK 5-in-1 (JY-056 later version)</i></li></ul>
<p>It uses the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>, has 1 MiB of PRG-ROM and CHR-ROM each, and is similar to <a href="NES_2_0_Mapper_386.xhtml" title="NES 2.0 Mapper 386">NES 2.0 Mapper 386</a> but has the Outer Bank register bits in a different order. This particular PCB <b>inhibits</b> ROM nametables and Extended Mirroring that would otherwise be enabled via register, similar to <a href="J_Y__Company_ASIC.xhtml" class="mw-redirect" title="INES Mapper 090">INES Mapper 090</a>.
</p>
<h2><span id="Outer_Bank_Register_.28.24D003.29"/><span class="mw-headline" id="Outer_Bank_Register_($D003)">Outer Bank Register ($D003)</span></h2>
<pre>Mask: $F003

7654 3210
---- ----
..L. PpCc
  |  |||+- CHR A18, ignored if L=1
  |  ||+-- CHR A19
  |  |+--- PRG A18
  |  +---- PRG A19
  +------- Select outer CHR-ROM bank size
            0: Mask $900x/$A00x to 256 KiB, use c
            1: Mask $900x/$A00x to 512 KiB, ignore c   
</pre>
<p>For a description of all other registers, see <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
