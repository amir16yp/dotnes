<div class="mw-parser-output"><p>NES 2.0 Mapper 262 is used for <i>Street Heroes/侍魂 (Shìhún)</i> by Sachen. It uses an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with both CHR-ROM and 8 KiB of CHR-RAM, as well 4 KiB of additional VRAM for four-screen mirroring. Its UNIF board name is <b>UNL-SHERO</b>.
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Mask: probably $E001
</p>
<pre>   $8000, $8001, $A000, $A001, $C000, $C001, $E000, $E001: As normal MMC3.
</pre>
<p>Mask: unknown, but probably $C100
</p>
<pre>$4100 (read): Read jumper setting
   Bit 7654 3210
       ---------
       J... ....
       +--------- Jumper value
                  0: Game title is <i>Street Heroes</i>
                  1: Game title is <i>侍魂 (Shìhún)</i> (Samurai Spirits)

$4100 (write): High CHR-ROM bits and CHR-ROM/-RAM selection
   Bit 7654 3210
       ---------
       .M.. 8421
        |   |||+- Select 256 KiB CHR-ROM bank at PPU $1000-$17FF
        |   ||+-- Select 256 KiB CHR-ROM bank at PPU $1800-$1FFF
        |   |+--- Select 256 KiB CHR-ROM bank at PPU $0800-$0FFF
        |   +---- Select 256 KiB CHR-ROM bank at PPU $0000-$07FF
        +-------- Select CHR-ROM/-RAM
                  0: CHR-ROM
                  1: CHR-RAM
</pre>
