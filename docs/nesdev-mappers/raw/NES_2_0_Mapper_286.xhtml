<div class="mw-parser-output"><p>NES 2.0 Mapper 286 is used for Benshieng multicarts. Its UNIF mapper is <b>BMC-BS-5</b>. The hardware latches the address rather than the data bus bits.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$9FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$DFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $E000-$FFFF: 8 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$07FF: 2 KiB switchable CHR-ROM bank</li>
<li>PPU $0800-$0FFF: 2 KiB switchable CHR-ROM bank</li>
<li>PPU $1000-$17FF: 2 KiB switchable CHR-ROM bank</li>
<li>PPU $1800-$1FFF: 2 KiB switchable CHR-ROM bank</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="CHR-ROM_Select_.28.248000-.249FFF.29"/><span class="mw-headline" id="CHR-ROM_Select_($8000-$9FFF)">CHR-ROM Select ($8000-$9FFF)</span></h2>
<pre>FEDC BA98 7654 3210
-------------------
100. RR.. .... BBBB
     ||        ++++- Select 8 KiB CHR-ROM bank number
     ||              in range selected by address bits 8-9
     ++------------- Select 8 KiB CHR-ROM bank
                     00: PPU $0000-$07FF
                     01: PPU $0800-$0FFF
                     10: PPU $1000-$17FF
                     11: PPU $1800-$1FFF
</pre>
<h2><span id="PRG-ROM_Select_.28.24A000-.24BFFF.29"/><span class="mw-headline" id="PRG-ROM_Select_($A000-$BFFF)">PRG-ROM Select ($A000-$BFFF)</span></h2>
<p>The AND mask to which the PRG-ROM select responds is
determined in bits 4-7 by a DIP switch.
</p>
<pre>FEDC BA98 7654 3210
-------------------
101. RR.. DDDD BBBB
     ||   |||| ++++- Select 8 KiB PRG-ROM bank number
     ||   ||||       in range selected by address bits 8-9
     ||   ++++------ AND mask from DIP switch
     ||              01: Setting #1
     ||              02: Setting #2
     ||              04: Setting #3
     ||              08: Setting #4
     ++------------- Select 8 KiB PRG-ROM bank
                     00: CPU $8000-$9FFF
                     01: CPU $A000-$BFFF
                     10: CPU $C000-$DFFF
                     11: CPU $E000-$FFFF
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The initial PRG bank values are 0xF.</li>
<li>Mirroring is fixed to vertical.</li>
<li>The multicart menu code has a programming error: when pressing Up from the first position to move the selection to the last game, subsequent game selections launch the wrong game.</li></ul>
