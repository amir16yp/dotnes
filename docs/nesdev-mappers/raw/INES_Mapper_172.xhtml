<div class="mw-parser-output"><p>INES Mapper 172 is used to denote the Super Mega P-4070 board, used by the following games:
</p>
<ul><li><i>1991 賭馬 Racing</i> (1991 Dǔmǎ Racing, &quot;Enjoyable Horse Racing&quot;)</li>
<li><i>麻将方块</i> (Mahjong Block) (original release)</li>
<li><i>Venice Beach Volley</i> (Super Mega release)</li></ul>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Mapper 172 uses a custom IC (marked &quot;JV001&quot;) serving as a latch, adder and inverter. There are five registers: Input (6 bits), Output (6 bits), Register (6 bits), Mode (1 bit) and Invert (1 bit). 
</p>
<pre>Mask: $E103
Read $4100-$4103: [..RR RRRR]: Read Register. Bits 4-5 are inverted if Invert==1. 
                  Bits 6-7 are open bus. Note that the bit order D0-D5 is <i>reversed</i>.
Write $4100: When Mode==0: Bits 0-5 of Register := Input, bits 0-3 being inverted if Invert==1.
             When Mode==1: Bits 0-3 of Register incremented by one, bits 4-5 unaffected.
Write $4101: Invert := Written value bit 5.
Write $4102: Input := Written value bits 0-5. Note that the bit order D0-D5 is <i>reversed</i>.
Write $4103: Mode := Written value bit 5.
Write $8000-$FFFF: Output := Register, and nametable mirroring is changed; written value is ignored.
</pre>
<p>In Mapper 172, bits 0/1 of the 8 KiB CHR ROM bank number (CHR A13/A14) come from Output 5/4, or 0/1 after taking the reverse bit order into account:
</p>
<pre>8 KiB CHR-ROM bank number := (Output &amp;3);
</pre>
<p>Games will check the lower six bits of $4100 for the correct value after several increment and inversion operations as a copy-protection measure. Unlike most of the other boards using the JV001/TXC 05-00002-010 ICs, this board allows nametable mirroring to be controlled by software. When writing to $8000-$FFFF, nametable mirroring is changed to Horizontal if Invert was clear, and to Vertical if Invert was set.
</p>
<h2><span class="mw-headline" id="Errata">Errata</span></h2>
<ul><li>The TXC re-release of <i>麻将方块 (Mahjong Block)</i> uses <a href="INES_Mapper_132.xhtml" title="INES Mapper 132">INES Mapper 132</a>.</li></ul>
<h2><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h2>
<p>The board is identical to <a href="INES_Mapper_136.xhtml" title="INES Mapper 136">INES Mapper 136</a> except that the CPU bits D0-D5 are connected in reverse order, and that Mapper 136 has hard-wired nametable mirroring.
</p>
