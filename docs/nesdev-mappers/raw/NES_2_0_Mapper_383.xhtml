<div class="mw-parser-output"><p>NES 2.0 Mapper 383 denotes J.Y. Company's <b>YY840708C</b> circuit board. It consists of an AX5202P MMC3 clone together with a 16V8 PAL. It is used for only one known multicart:
</p>
<ul><li><i>1995 Soccer 6-in-1 足球小将專輯</i> (JY-014)</li></ul>
<p>The PAL maintains four signals for bankswitching and responds both to reads and writes:
</p>
<ul><li><b>PAL PRG A15</b>: Set by writing to CPU $8000-$FFFF.</li>
<li><b>PAL PRG A16</b>: Set by reading from CPU $8000-$BFFF while <b>PAL PRG A17/A18</b> are 0,</li>
<li><b>PAL PRG/CHR A17</b>: Set by writing to CPU $8000-$FFFF.</li>
<li><b>PAL PRG/CHR A18</b>: Set by writing to CPU $8000-$FFFF.</li></ul>

<h2><span id="16V8_Write_.28.248100-.24FFFF.29"/><span class="mw-headline" id="16V8_Write_($8100-$FFFF)">16V8 Write ($8100-$FFFF)</span></h2>
<pre>Mask: $8100

A~FEDC BA98 7654 3210
  -------------------
  1.u. ...1 ..vw ....
    |         |+------ PAL PRG/CHR A17
    |         +------- PAL PRG/CHR A18
    +----------------- PAL PRG A15 in some configurations
</pre>
<p>This register overlays the MMC3's registers in the same address range.
</p>
<h2><span id="16V8_Read_.28.248000-.24BFFF.29"/><span class="mw-headline" id="16V8_Read_($8000-$BFFF)">16V8 Read ($8000-$BFFF)</span></h2>
<p>Mask: $C000
</p><p>When reading from the CPU $8000-$BFFF area while <b>PAL PRG/CHR A17/A18</b> are zero, <b>PAL PRG A16</b> is updated with the MMC3 clone's MMC3 PRG A16 output.
</p>
<h2><span class="mw-headline" id="Effective_PRG-ROM_banks">Effective PRG-ROM banks</span></h2>
<p>The four PAL signals not only provide additional address bits, but also modify the masking of other address bits and which 8 KiB CPU bank the MMC3 clone sees. The following table shows how the 8 KiB PRG-ROM bank coming from the MMC3 clone is first ANDed and then ORed depending on the PAL PRG signals and the CPU bank (all $xx numbers represent 8 KiB bank numbers):
</p>
<pre>  PAL PRG      CPU      MMC3
------------           ------
A17/A18  A16   Bank*    AND   OR
---------------------- ------ ---------------
$00      $00   **       $03   A15|A16|A17|A18
$00      $08   **       $07       A16|A17|A18
$10/$20  -     **       $0F           A17|A18
$30      -     $6-&gt;$E   $0B           A17|A18
$30      -     $8-&gt;$C   $0F           A17|A18
$30      -     $A-&gt;$E   $0F           A17|A18
$30      -     $C-&gt;$8   $0F           A17|A18
$30      -     $E-&gt;$A   $0F           A17|A18

*  CPU banks to which this applies, and which CPU bank the MMC3 clone sees.
** Applies to all CPU banks, which are input to the MMC3 clone unchanged.
</pre>
<p>Therefore, <b>PAL PRG/CHR A17/A18</b> not only select a 128 KiB outer bank, but also select one of three bankswitching modes:
</p>
<ul><li>Setting 0 provides a round-about means of dividing the first 128 KiB bank into two 32 KiB and one 64 KiB bank. <b>PAL PRG A16</b> is updated with the content of the corresponding MMC3 PRG bank bit by <i>reading</i> from the respective address range, which in turn will then be applied across the <i>entire</i> ROM address range. The content of this bit furthermore selects two bankswitching sub-modes:
<ul><li>When clear, the MMC3 only selects <i>within</i> one of the two 32 KiB banks of the first 64 KiB half of 128 KiB bank #0, which one is decided by <b>PAL PRG A15</b>. This is used for the CNROM/NROM-256 games <i>Power Soccer</i> and Nintendo's <i>Soccer</i>.</li>
<li>When set, the MMC3 selects <i>within</i> the second 64 KiB bank of 128 KiB bank #0. This is used for the game <i>Tecmo World Cup Soccer</i> (renamed &quot;Goal 5&quot;).</li></ul></li>
<li>Settings 1 and 2 provide normal 128 KiB MMC3 banking, used for the games <i>Kunio-kun no Nekketsu Soccer League</i> (renamed &quot;Goal 3&quot;) and <i>Nekketsu Koukou Dodgeball Bu - Soccer Hen</i> (renamed &quot;Heroes Soccer&quot;).</li>
<li>Setting 3 provides 128 KiB MMC3 banking with the CPU A14 line fed to the MMC3 clone reversed. This is used for the game <i>Tecmo Cup: Soccer Game</i> (renamed &quot;Tecmo Cup Soccer&quot;), originally an MMC1 game with the fixed bank at $8000-$BFFF and the switchable bank at $C000-$FFFF, a configuration that could not be reproduced with an MMC3 alone. It is also used for the menu, which in part executes from PRG-ROM mapped to the CPU $6000-$7FFF address range on the MMC3 clone's fixed banks alone, as no MMC3 PRG bank register is written to before JMPing to this address range.</li></ul>
