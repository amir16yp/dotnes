<p>This mapper is used on exactly one known game: Super Gun from NTDEC. Although the game's bankswitching code seems to suggest two separate data latches at $6000 and $8000-$FFFF (the latter with bus conflicts), the board actually latches the four lowest address bits, and ignores the write to $6000.
</p>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$BFFF: 16 KB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: 16 KB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="PRG.2FCHR_Bank_Select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="PRG/CHR_Bank_Select_($8000-$FFFF)">PRG/CHR Bank Select ($8000-$FFFF)</span></h3>
<pre> CPU address bit#
1111 1100 0000 0000
5432 1098 7654 3210
---- ---- ---- ----
1... .... .... PPCC
               ||||
               ||++------ Select 8 KB CHR ROM bank for PPU $0000-$1FFF
               ++-------- Select 16 KB PRG ROM bank for CPU $8000-$BFFF
</pre>
