<div class="mw-parser-output"><p>NES 2.0 Mapper 356 is used for the J.Y. Company's <i>7-in-1 Rockman</i> (JY-208) multicart. It is basically <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">INES Mapper 045</a> but with added functionality to switch between CHR-ROM and CHR-RAM, and between normal two-screen and four-screen mirroring.
</p><p>All registers work as <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">INES Mapper 045</a>, except $6000 sequential <b>register 2</b> (third write):
</p>
<pre>D~7654 3210
  ---------
  .4RC SSSS
   ||| ++++ CHR-AND block size (see Mapper 45 description)
   ||+----- High bit of CHR-OR (CHR A18, see Mapper 45 description)
   |+------ CHR memory type select
   |         0: CHR-RAM (8 KiB)
   |         1: CHR-ROM
   +------- Nametable memory select
             0: CIRAM (two nametables, mirrored according to MMC3 setting)
             1: Cartridge VRAM (four nametables)
</pre>
<p>Because unlike the original Mapper 45, there is only one high CHR-OR bit, only 512 KiB of CHR-ROM are supported.
</p>
