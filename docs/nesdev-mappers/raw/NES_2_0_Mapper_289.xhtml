</p>
<ul><li><i>(EW-16-1) Super HiK 17-in-1</i></li>
<li><i>1995 Champion Cassette 1200-in-1 - 94年超值珍藏版</i></li>
<li><i>Super 76-in-1</i> (with Contra)</li></ul>

<h2><span id="Mode_Register_.28.246000.29.2C_write"/><span class="mw-headline" id="Mode_Register_($6000),_write">Mode Register ($6000), write</span></h2>
<pre>D~[.... MLPP]  Address mask: $E001
        ||++- PRG Banking Mode
        ||     0: NROM-128: PRG A14-A16 from Outer Bank Register
        ||     1: NROM-256: PRG A15-A16 from Outer Bank Register, PRG A14=CPU A14
        ||     2: UNROM: PRG A14-A16 from Data Latch when CPU A14=0, and 111b when CPU A14=1
        ||     3: PRG A14-16=1 regardless of CPU A14
        |+--- Protect CHR-RAM
        |      0: CHR-RAM writable
        |      1: CHR-RAM write-protected
        +---- Select nametable mirroring type
               0: Vertical
               1: Horizontal
</pre>
<h2><span id="Outer_Bank_Register_.28.246001.29.2C_write"/><span class="mw-headline" id="Outer_Bank_Register_($6001),_write">Outer Bank Register ($6001), write</span></h2>
<pre>D~[.QQQ QPPp]  Address mask: $E001
    ||| |||+- PRG A14 in NROM-128 PRG Banking Mode
    ||| |++-- PRG A16..15 in NROM-128/-256 Banking Modes
    +++-+---- PRG A20..A17
</pre>
<h2><span id="Solder_Pad_Register_.28.246000.2C_read.29"/><span class="mw-headline" id="Solder_Pad_Register_($6000,_read)">Solder Pad Register ($6000, read)</span></h2>
<pre>D~[.... ..PP]  Address mask: $E000
   |||| ||++- Solder pad setting
   ++++-++--- Open Bus 
</pre>
<h2><span id="Data_Latch_.28.248000-.24FFFF.29.2C_write"/><span class="mw-headline" id="Data_Latch_($8000-$FFFF),_write">Data Latch ($8000-$FFFF), write</span></h2>
<pre>D~[.... .PPP]  Address mask: $8000
         +++- PRG A16..14 in UNROM PRG Banking Mode when CPU A14=0
</pre>
