<p><b>iNES Mapper 018</b> represents the <a href="Jaleco_SS_88006_pinout.xhtml" title="Jaleco SS 88006 pinout">Jaleco SS 88006 mapper</a> used for <i>Magic John</i> (Japanese version of <i>Totally Rad</i>) and about a dozen other games.
</p><p>This mapper is connected only to A12-A14, A0-A1, and D0-D3, so the PRG bank and CHR bank numbers are split over two sequential addresses.  Bits 0-3 are in the lower address of a pair (e.g. $xxx0 or $xxx2), and bits 4-7 are in the next higher address.
</p><p>This mapper resembles a scrambled <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>.
</p>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KB PRG RAM bank (optional)</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $E000-$FFFF: 8 KB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$03FF: 1 KiB switchable CHR bank</li>
<li>PPU $0400-$07FF: 1 KiB switchable CHR bank</li>
<li>PPU $0800-$0BFF: 1 KiB switchable CHR bank</li>
<li>PPU $0C00-$0FFF: 1 KiB switchable CHR bank</li>
<li>PPU $1000-$13FF: 1 KiB switchable CHR bank</li>
<li>PPU $1400-$17FF: 1 KiB switchable CHR bank</li>
<li>PPU $1800-$1BFF: 1 KiB switchable CHR bank</li>
<li>PPU $1C00-$1FFF: 1 KiB switchable CHR bank</li></ul>

<pre>  $8000        $8001
7  bit  0    7  bit  0
---------    ---------
.... LLLL    .... ..HH
     ||||           ||
     ||||           ++- High 2 bits of 8 KiB PRG bank at CPU $8000
     ++++-------------- Low 4 bits
</pre>

<h3><span id="IRQ_reload_value_.28.24E000-.24EFFF.29"/><span class="mw-headline" id="IRQ_reload_value_($E000-$EFFF)">IRQ reload value ($E000-$EFFF)</span></h3>
<p>The four registers here represent a 16-bit reload value, split into four four-bit numbers, least significant four bits first.
</p>
<h3><span id="IRQ_reload_.28.24F000-.24FFFC.29"/><span class="mw-headline" id="IRQ_reload_($F000-$FFFC)">IRQ reload ($F000-$FFFC)</span></h3>
<p>Any write to this register will immediately reload the IRQ counter from the above reload value and acknowledge the IRQ.
</p>
<h3><span id="IRQ_counter_size_.28.24F001-.24FFFD.29"/><span class="mw-headline" id="IRQ_counter_size_($F001-$FFFD)">IRQ counter size ($F001-$FFFD)</span></h3>
<pre>7  bit  0
---------
.... FETC
     ||||
     |||+- 1: Enable counting 
     ||+-- 1: Don't propagate counter borrow to bit 12; instead assert IRQ
     |+--- 1: Don't propagate counter borrow to bit 8; instead assert IRQ
     +---- 1: Don't propagate counter borrow to bit 4; instead assert IRQ
</pre>
<p>F overrides E overrides T. If none are set, the counter is 16 bits wide.
</p><p>Writes to this register also acknowledge the IRQ.
</p><p>When enabled, the counter counts down.
</p>
<h3><span id="Mirroring_Control_.28.24F002-.24FFFE.29"/><span class="mw-headline" id="Mirroring_Control_($F002-$FFFE)">Mirroring Control ($F002-$FFFE)</span></h3>
<pre>7  bit  0
---------
.... ..MM
       ||
       ++-- 0: Horizontal (A11)
            1: Vertical (A10)
            2: 1scA (Ground)
            3: 1scB (Vcc)
</pre>
<h3><span id="Expansion_sound_.28.24F003-.24FFFF.29"/><span class="mw-headline" id="Expansion_sound_($F003-$FFFF)">Expansion sound ($F003-$FFFF)</span></h3>
<p>Some games also have a µPD7755C or µPD7756C ADPCM sound IC. If so,
</p>
<pre>7  bit  0
---------
NNNN NNRS
|||| ||||
|||| |||+-- 1: Assert (drive low) RESET on the ADPCM sound IC. 0: deassert (drive high)
|||| ||+--- 1: Assert START on the ADPCM sound IC. 0: deassert
++++-++---- Which sample to start, if START becomes asserted while RESET is deasserted.
            
</pre>
<p>This is the same audio playback IC used in other Jaleco mappers, with the same timing constraints. 
RESET must be asserted for at least 34 cycles to be assured of stopping playback. 
START must be de-asserted before the sample finishes playback, or else a random sample (depending on the current contents of the data bus) will start playing.
START will be ignored until 23 cycles after RESET is deasserted.
</p>
<h2><span id="Disch.27s_Notes"/><span class="mw-headline" id="Disch's_Notes">Disch's Notes</span></h2>
<pre> Here are Disch's original notes:
 ========================
 =  Mapper 018          =
 ========================
 
 
 Example Games:
 --------------------------
 The Lord of King
 Magic John
 Pizza Pop
 
 
 Registers:
 ---------------------------
 
 Range,Mask:   $8000-FFFF, $F003
 
   $800x,$900x:  [.... PPPP]  PRG Regs
   $A00x-$D00x:  [.... CCCC]  CHR Regs
   $E00x:  [.... IIII]  IRQ Reload value
   $F000:  [.... ....]  IRQ Reset
   $F001:  [.... SSSE]  IRQ Control
      S = Size of IRQ counter
      E = Enable
 
   $F002:  [.... ..MM]  Mirroring
      %00 = Horz
      %01 = Vert
      %10 = 1ScA
      %11 = 1ScB
 
 
 CHR Setup:
 ---------------------------
 
 Only low 4 bits of written value significant [.... CCCC]
 
 2 regs combined to get an 8-bit page number
 
 $x000 or $x002 are the low 4 bits
 $x001 or $x003 are the high 4 bits
 
 
       $0000   $0400   $0800   $0C00   $1000   $1400   $1800   $1C00 
     +-------+-------+-------+-------+-------+-------+-------+-------+
     |$A000+1|$A002+3|$B000+1|$B002+3|$C000+1|$C002+3|$D000+1|$D002+3|
     +-------+-------+-------+-------+-------+-------+-------+-------+
 
 
 PRG Setup:
 ---------------------------
 
 Same as CHR, $x000 low, $x001 high
 
       $8000   $A000   $C000   $E000 
     +-------+-------+-------+-------+
     |$8000+1|$8002+3|$9000+1| { -1} |
     +-------+-------+-------+-------+
 
 
 IRQ:
 ---------------------------
 
 16-bit IRQ Reload value is set via regs $E00x.  $E000 sets the low 4 bits, $E003 sets the high 4 bits.
 
 When enabled, the IRQ counter counts down every CPU cycle.  When it wraps, an IRQ is generated.
 
 The 'S' bits in the control reg determine the size of the IRQ counter.  It can be 4, 8, 12, or 16 bits wide:
 
   %000 = 16 bits wide
   %001 = 12 bits wide
   %01x = 8 bits wide
   %1xx = 4 bits wide
 
 If the counter is less than 16 bits, the high bits are not altered by IRQ counter clocking; they retain their
 value.
 
 Example:  if the IRQ counter contains $1232, and is in 4-bit mode, it counts like so:
 
   $1232
   $1231
   $1230
   $123F  &lt;--- IRQ here
   $123E
    ...
 
 
 Any write to the reset reg ($F000) will copy the 16-bit reload value into the IRQ counter (full 16 bits are
 copied, regardless of current 'S' value).
 
 Any write to $F000 or $F001 will acknowledge the IRQ.
</pre>
