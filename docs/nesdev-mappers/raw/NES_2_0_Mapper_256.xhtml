<div class="mw-parser-output"><p>NES 2.0 Mapper 256 is used for games using the bankswitching behavior of the <a href="VTxx.xhtml" class="mw-redirect" title="VT03">OneBus</a> Famiclones. The UNIF board names are <b>UNL-OneBus</b>, <b>BMC-OneBus</b> and <b>UNL-DANCE</b>.
</p>

<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>To emulate ROM images using mapper 256, one must support bankswitching, nametable mirroring selection and IRQs using both the VTxx native registers (see the <a href="VT02__PRG_ROM_Bankswitching.xhtml" title="VT02+ PRG-ROM Bankswitching">VT02+ PRG-ROM Bankswitching</a> and <a href="VT02__CHR_ROM_Bankswitching.xhtml" title="VT02+ CHR-ROM Bankswitching">VT02+ CHR-ROM Bankswitching</a> articles for details) as well as the <a href="VT02__MMC3_Compatibility_Registers.xhtml" title="VT02+ MMC3 Compatibility Registers">MMC3 compatible registers</a>.
</p>
<h2><span id="Single_and_split_PRG.2FCHR_address_space"/><span class="mw-headline" id="Single_and_split_PRG/CHR_address_space">Single and split PRG/CHR address space</span></h2>
<p>On physical hardware, bankswitching by the VTxx console itself can only be used if the cartridge uses OneBus addressing, signalled by connecting certain pins on the cartridge connector to Vcc/GND, because only in OneBus mode are the CHR address lines repurposed as higher-order address lines for the single address space. Therefore, regular OneBus ROM images will only contain PRG ROM and no CHR ROM, and PRG ROM ($41xx) and CHR ROM ($201x) bankswitch registers apply to the same address space.
</p><p>However, ROM images converted from Waixing's WXN format will have both PRG and CHR ROM, yet use the VTxx-native bankswitch registers and/or <a href="#Register_address_mangling">register address mangling</a>. These images cannot be run unchanged on physical hardware, and were intended to be run by Waixing's proprietary VTxx emulator found on several 32-bit plug-and-play consoles. For simplicity, mapper 256 is also used for such ROM images; to emulate them, simply apply the PRG ROM ($41xx) and CHR ROM ($201x) bankswitch registers to the respective separate address space.
</p>
<h2><span class="mw-headline" id="Bank_register_address_and_CPU_opcode_scrambling">Bank register address and CPU opcode scrambling</span></h2>
<p>Several plug-and-play consoles use a simple protection scheme intended to prevent interchanging the ROM data between different consoles. The protection scheme works by simply swapping the addresses of the bankswitch registers. Some patterns only change the VTxx-native register addresses, others apply to the MMC3 compatibility registers as well. 
</p><p>Other plug-and-play consoles, in particular those by Jungletac, scramble CPU opcode bytes (and only those) by swapping bits. These consoles power-on with opcode scrambling enabled, but allow it to be disabled --- for example, to run a pirated licensed NES game without modifying it --- by writing to register <b>411C</b> (submappers 12 and 14):
</p>
<pre>D~7654 3210
  ---------
  .E.. ....
   +-------- Select CPU opcode encryption (submapper 12+14 only)
              0: disabled
              1: enabled (default at power-on)
</pre>
<p>or <b>$4169</b> (submappers 13 and 15):
</p>
<pre>D~7654 3210
  ---------
  .... ...E
          +- Select CPU opcode encryption (submappers 13+15 only)
              0: enabled (default at power-on)
              1: disabled
</pre>
<p><a href="NES_2_0_submappers.xhtml#NES_2.0_Mapper_256" title="NES 2.0 submappers">Submappers</a> have been allocated to denote the type of protection scheme:

<h2><span class="mw-headline" id="Embedded_VT369_ROM">Embedded VT369 ROM</span></h2>
<p>The VT369 variant of the OneBus famiclones has 4 KiB of ROM embedded into the NoaC glob itself. These 4 KiB are mapped to $1000-$1FFF of the main CPU's address space and to $4000-$4FFF of the sound CPU's address space, and contain initialization code and a sound CPU program. They are included as NES 2.0 Misc ROM.
</p>
