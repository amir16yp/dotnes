<div class="mw-parser-output"><p><b>NES 2.0 Mapper 395</b> denotes the <a href="MMC3.xhtml" title="MMC3">MMC3</a>-compatible <b>Realtec 8210</b> multicart PCB. Both outer bank registers are selected through the MMC3's WRAM interface and overlay any actual WRAM.
</p>
<ul><li><i>Super Card 12-in-1</i> (SPC002)</li>
<li><i>Super Card 13-in-1</i> (SPC003)</li>
<li><i>Super Card 14-in-1</i> (King006)</li>
<li><i>Super Card 14-in-1</i> (King007)</li></ul>
<h2><span id="Outer_Bank_Register_1_.28.246000.29"/><span class="mw-headline" id="Outer_Bank_Register_1_($6000)">Outer Bank Register 1 ($6000)</span></h2>
<pre>Mask: $E010

D~7654 3210
  ---------
  ..BA C...
    || +---- PRG A20
    ++------ PRG/CHR A19..18
    
</pre>
<h2><span id="Outer_Bank_Register_2_.28.246010.29"/><span class="mw-headline" id="Outer_Bank_Register_2_($6010)">Outer Bank Register 2 ($6010)</span></h2>
<pre>Mask: $E010

D~7654 3210
  ---------
  LcCA p..B
  |||| |  +- PRG A17 if p=1
  |||| +---- 0=PRG A17 from MMC3 (256 KiB inner PRG bank)
  ||||       1=PRG A17 from B (128 KiB inner PRG bank)
  |||+------ CHR A17 if c=1
  ||+------- CHR A20
  |+-------- 0=CHR A17 from MMC3 (256 KiB inner CHR bank)
  |          1=CHR A17 from A (128 KiB inner CHR bank)
  +--------- 1=Lock outer bank
</pre>
