From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_252">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_252">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p>iNES Mapper 252 is used for Waixing's Chinese localization of the Japanese Namcot game <i>三国志: 中原の覇者 (Sangokushi: Chūgen no Hasha)</i>. It uses a clone of the Konami <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>, with the chip's A0 connected to CPU A2 and the chip's A1 connected to CPU A3 (VRC4e, Mapper 23 submapper 2). It has 8 KiB of PRG-RAM at CPU $6000-$7FFF, and 1 KiB CHR pages 6 and 7 are CHR-RAM.
</p><p><a href="INES_Mapper_253.xhtml" title="INES Mapper 253">INES Mapper 253</a> is the same, except that it's 1 KiB CHR pages 4 and 5 that are CHR-RAM.
</p><p>Mappers <a href="INES_Mapper_074.xhtml" title="INES Mapper 074">74</a>, <a href="INES_Mapper_192.xhtml" title="INES Mapper 192">192</a>, <a href="INES_Mapper_194.xhtml" title="INES Mapper 194">194</a>, and <a href="INES_Mapper_195.xhtml" title="INES Mapper 195">195</a>, also used for Waixing's localizations, are similar but use an MMC3.
</p>
