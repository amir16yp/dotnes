<div class="mw-parser-output"><p><b>NES 2.0 Mapper 402</b> denotes the <b>J-2282</b> circuit board, used by the <i>22-in-1 Olympic Games</i> multicart with 512 KiB PRG-ROM and unbanked 8 KiB CHR-RAM.
</p>
<pre>A~[1... FC.. MN.P PPPp]
        ||   || +-++++- PRG A18..A14
        ||   |+-------- 0: PRG A14=CPU A14 (NROM-256)
        ||   |          1: PRG A14=p (NROM-128)
        ||   +--------- 0: Vertical mirroring
        ||              1: Horizontal mirroring
        |+------------- 0: CHR-RAM write-protected
        |               1: CHR-RAM write-enabled
        +-------------- 0: CPU $6000-$7FFF open bus
                        1: CPU $6000-$7FFF mirror of $E000-$FFFF
</pre>
<p>The F bit is set to play the FDS-sourced version of <i>Volleyball</i>.
</p>
