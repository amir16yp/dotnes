<div class="mw-parser-output"><p><b>NES 2.0 Mapper 441</b> denotes the <b>841026C</b> and <b>850335C</b> multicart circuit boards. It is similar to <a href="NES_2_0_Mapper_391.xhtml" title="NES 2.0 Mapper 391">NES 2.0 Mapper 391</a> in functionality, but the register bits arranged differently.
</p><p>Known cartridges:
</p>
<ul><li><i>1996 Power Rangers V 4-in-1</i> (MK-412)</li></ul>
<h2><span id="Outer_Bank_and_Mode_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($6000-$7FFF,_write)">Outer Bank and Mode Register ($6000-$7FFF, write)</span></h2>
<pre>D~[LcCC pNPP]
   |||| ||++-- PRG A18..A17
   |||| |+---- 1=NROM-256 mode
   |||| +----- 0=PRG A17 from MMC1, 1=PRG A17 from PP
   ||++------- CHR A18..A17
   |+--------- 0=CHR A17 from MMC1, 1=CHR A17 from CC
   +---------- 1=Lock Outer Bank Register
</pre>
<ul><li>WRAM must be enabled in $A001.7 before writing to this register.</li>
<li>NROM-256 mode forces MMC3's CPU A14 input to GND to make MMC3 bank registers 6 and 7 apply to the entire CPU $8000-$FFFF range, with PRG A13 and PRG A14 being replaced by CPU A13 and A14, respectively.</li></ul>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
