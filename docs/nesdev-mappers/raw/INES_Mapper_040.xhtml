</head><body><h1>INES Mapper 040</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_040">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_040">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 040</a> denotes the NTDEC <b>2722</b> PCB and imitations, used in several cartridge conversions of the Japanese version of <i>Super Mario Bros. 2</i>:
</p>
<ul><li><i>Super Mario Bros. 2</i> from Whirlwind Manu (cartridge code LF36)</li>
<li><i>Super Mario Bros. II+</i> from Hey Sung</li>
<li><i>1990 Super Mario Bros. 4</i></li></ul>
<p>Several other SMB2J conversions running on other mappers reuse the cartridge label from Whirlwind Manu and therefore misleadingly also show an LF36 cartridge code. Hey Sung's version can be distinguished from Whirlwind Manu's by the fact that Whirlwind Manu's does not allow selecting the one of eight starting worlds by holding the D-Pad while pressing START.
</p><p><b>Submapper 1</b> denotes the NTDEC <b>2752</b> PCB, which is a multicart PCB that adds an outer bank register.
</p><p>This description was produced from the source code of FCEUX and Nestopia.
</p>
<pre> Registers:
 ---------------------------
 Range,Mask:   $8000-FFFF, $E000

   $8000:  Disable and acknowledge IRQ
   $A000:  Enable IRQ
   $C000:  Outer bank register (Submapper 1 only)
   $E000:  8 KiB bank mapped at $C000
 
 PRG Setup:
 ---------------------------
 
       $6000   $8000   $A000   $C000   $E000  
     +-------+-------+-------+-------+-------+
     | { 6 } | { 4 } | { 5 } | $E000 | { 7 } |
     +-------+-------+-------+-------+-------+
</pre>
<p>Like <a href="INES_Mapper_050.xhtml" title="INES Mapper 050">INES Mapper 050</a>, this hardware produces an interrupt 4096 M2 cycles after the IRQ is enabled.
</p><p>The corresponding hardware is a <a rel="nofollow" class="external text" href="https://forums.nesdev.org/viewtopic.php?p=217200#p217200">CD4020 functioning as a 13-bit counter</a>, and if the software doesn't acknowledge the interrupt for another 4096 cycles it will self-acknowledge.
</p>
<h2><span id="Outer_bank_register_.28.24C000-.24DFFF.29"/><span class="mw-headline" id="Outer_bank_register_($C000-$DFFF)">Outer bank register ($C000-$DFFF)</span></h2>
<pre>A~[110. .... .ppN PCCM]
              ||| |||+- 0: Vertical mirroring
              ||| |||   1: Horizontal mirroring
              ||| |++-- CHR A14..A13
              ||| +- PRG A16 and mode
              |||    0: SMB2J mode
              |||    1: Regular NROM mode
              ||+--- NROM mode if P=1
              ||     0: NROM-128
              ||     1: NROM-256
              ++---- PRG A15..A14 if P=1
</pre>
