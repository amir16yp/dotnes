<div class="mw-parser-output"><p><a class="mw-selflink selflink">INES Mapper 250</a> is a mapper by Nitra, used for pirate games such as <a href="http://community.fandom.com/wiki/c:bootleggames:Time_Diver:_Avenger" class="extiw" title="wikia:c:bootleggames:Time Diver: Avenger">Time Diver Avenger</a> and the Queen Bee V.
</p><p>Hardware consists of regular MMC3 chip connected in different way:
</p>
<ul><li>A10 instead of A0 is used to determine which register to write to (i.e. the registers are at $8000, $8400, $A000, $A400, $C000, $C400, $E000, $E400 and their associated</li>
<li>A7..A0 is used instead of D7..D0: the value written to each register is the lower byte of the address (i.e. address AND $00FF), data value is discarded</li></ul>
<ul><li>Queen Bee V contains also 74153 mux which controls PRG-A13 resulting in the following change:</li></ul>
<pre>below
$8000 $8000 $a000 $c000 $e000
   0   MMC3  MMC3   0     1
</pre>
<p>Source: <a rel="nofollow" class="external autonumber" href="http://krzysiobal.com/carts/?action=search&amp;mpr=250">[1]</a>
</p>
