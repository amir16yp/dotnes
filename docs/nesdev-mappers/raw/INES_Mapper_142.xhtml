<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 142</a> represents a PCB used for several of Kaiser's unlicensed ports of FDS games. Its UNIF board name is <b>UNL-KS7032</b>, and it features the <a href="VRC3_pinout.xhtml" title="VRC3 pinout">KS202 ASIC</a>, which is an upgrade to Konami's <a href="VRC3.xhtml" title="VRC3">VRC3</a>.
</p>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $E000-$FFFF: 8 KB PRG ROM bank, fixed to the last bank.</li>
<li>PPU $0000-$1FFF: 8 KB CHR RAM, unbanked</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="IRQ_Reload_value_.28.248000-.24BFFF.29"/><span class="mw-headline" id="IRQ_Reload_value_($8000-$BFFF)">IRQ Reload value ($8000-$BFFF)</span></h3>
<p>Writes set IRQ reload value, in four four-bit words, same as <a href="VRC3.xhtml" title="VRC3">VRC3</a>
</p>
<h3><span id="IRQ_Enable_.28.24C000-.24CFFF.29"/><span class="mw-headline" id="IRQ_Enable_($C000-$CFFF)">IRQ Enable ($C000-$CFFF)</span></h3>
<p>Kaiser's SMB2J writes $02 or $05 to enable, and $00 to disable, indicating that bits 1 and 2 may function similarly to the VRC3.
</p>
<h3><span id="IRQ_Acknowledge_.28.24D000-.24DFFF.29"/><span class="mw-headline" id="IRQ_Acknowledge_($D000-$DFFF)">IRQ Acknowledge ($D000-$DFFF)</span></h3>
<p>Any write to this register will acknowledge the pending IRQ, like VRC3. Unlike a VRC3, $C000 bit 0 must not be moved to bit 1, otherwise SMB2J will freeze.
</p>
<h3><span id="Bank_select_.28.24E000-.24EFFF.29"/><span class="mw-headline" id="Bank_select_($E000-$EFFF)">Bank select ($E000-$EFFF)</span></h3>
<p>Select one of four bank registers to update on next write to $F000.
</p>
<pre>7  bit  0
---- ----
.... .RRR
      |||
      +++- Specify which bank register to update on next write to Bank Data register
           1: Select 8 KB PRG bank at CPU $8000-$9FFF
           2: Select 8 KB PRG bank at CPU $A000-$BFFF
           3: Select 8 KB PRG bank at CPU $C000-$DFFF
           4: Select 8 KB PRG bank at CPU $6000-$7FFF
           6: Writes to $F000 have no effect
           0,5,7: unknown
</pre>
<h3><span id="Bank_data_.28.24F000-.24FFFF.29"/><span class="mw-headline" id="Bank_data_($F000-$FFFF)">Bank data ($F000-$FFFF)</span></h3>
<pre>7  bit  0
---- ----
.... DDDD
     ||||
     ++++- New bank value, based on last value written to Bank select register (mentioned above)
</pre>
