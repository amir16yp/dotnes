<div class="mw-parser-output"><p><b>NES 2.0 Mapper 430</b> denotes the MMC3-based <b>831031C/T-308</b> multicart circuit board. 
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

A~FEDC BA98 7654 3210
  -------------------
  011. .... .... MNBb
                 ||++- PRG/CHR A18..A17
                 |+--- 0: CHR A17=MMC3 CHR A17 (256 KiB inner CHR bank)
                 |     1: CHR A17=b (128 KiB inner CHR bank)
                 +---- 0: Normal MMC3 PRG banking mode
                       1: GNROM-like PRG banking mode
</pre>
<p>The MMC3 can only select 128 KiB of PRG-ROM; the b bit always selects PRG A17.
</p><p>GNROM mode means that the MMC3's CPU A14 input is held low, so MMC3 registers 6 and 7 apply to both $8000/$A000 and $C000/$E000,
</p><p>As it uses the MMC3 clones's WRAM interface, writing to the outer bank register requires enabling and not write-protecting WRAM in the MMC's $A001 register.
</p>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
