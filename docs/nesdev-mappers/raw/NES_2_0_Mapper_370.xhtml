<div class="mw-parser-output"><p><b>NES 2.0 Mapper 370</b> denotes the <b>F600</b> circuit board, used for the <i>Golden Mario Party II - Around the World 6-in-1</i> multicart. It uses an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with an outer bank register that also selects <a href="TxROM.xhtml" class="mw-redirect" title="TKROM">TKROM</a> and <a href="TLSROM.xhtml" title="TLSROM">TLSROM</a> configurations (the latter for a Mario-themed <i>Armadillo</i> hack).
</p>
<h2><span id="Outer_Bank_register_.28.245000-.245FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_($5000-$5FFF,_write)">Outer Bank register ($5000-$5FFF, write)</span></h2>
<pre>Mask: $F000

A~FEDC BA98 7654 3210
  -------------------
  0101 .... ..pP PcCC
              || |+++- CHR A17-A19
              || |+--- CHR Mask: 0=128K, 1=256 K
              ++-+---- PRG A17-A19
              +------- PRG Mask: 0=128K, 1=256 K
</pre>
<p><a href="TLSROM.xhtml" title="TLSROM">TLSROM</a> nametable mirroring is used when cCC is 001, otherwise normal <a href="MMC3.xhtml" title="MMC3">MMC3</a> mirroring is used.
</p>
<h2><span id="Solder_Pad_register_.28.245000-5FFF.2C_read.29"/><span class="mw-headline" id="Solder_Pad_register_($5000-5FFF,_read)">Solder Pad register ($5000-5FFF, read)</span></h2>
<pre>Mask: $F000

D~7654 3210
  ---------
  V... ....
  +--------- Solder pad setting
</pre>
<p>The solder pad setting selects one of two different menus.
</p>
