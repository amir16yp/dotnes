</head><body><h1>INES Mapper 218</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_218">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_218">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><b>iNES Mapper 218</b> is used by the homebrew Magic Floor game. The cartridge contains only one single PRG-ROM chip (and a CIC, if required).
</p><p>There's no CHR-ROM or CHR-RAM. Instead, the console's internal 2Kbyte Name Table RAM is mapped as CHR-RAM. The 2K RAM is permanently selected (/VCS wired to GND), and can be used in four modes by wiring VA10 to one of the PPU.A10..A13 address lines:
</p>
<table class="tabular">
<tbody><tr>
<th>VA10 connection</th>
<th>Effect on nametables</th>
<th><a href="INES.xhtml" title="INES">iNES</a> Flags 6</th>
<th>UNIF &quot;MIRR&quot; bit 7-0
</th></tr>
<tr>
<td>PPU.A10</td>
<td>Two-Screen, Vertical Mirroring</td>
<td>$A1 (0001)</td>
<td>$01
</td></tr>
<tr>
<td>PPU.A11</td>
<td>Two-Screen, Horizontal Mirroring</td>
<td>$A0 (0000)</td>
<td>$00
</td></tr>
<tr>
<td>PPU.A12</td>
<td>One-Screen, BLK0</td>
<td>$A8 (1000)</td>
<td>$02
</td></tr>
<tr>
<td>PPU.A13</td>
<td>One-Screen, BLK1</td>
<td>$A9 (1001)</td>
<td>$03
</td></tr></tbody></table>
<p>Note: The &quot;alternative nametables&quot; bit 3 in Byte 6 of iNES header is commonly thought as meaning four screens, but for this mapper it is used to choose between the two one-screen layouts.
</p><p>The VA10 connection also affects the CHR-RAM mapping at 0000h-1FFFh. BLK1 would be the most common case (1K NT plus 1K CHR-RAM). BLK0 would allow to swap CHR RAM via Port 2000h.Bit3-4. Two-Screen would allow to use two NTs (and to squeeze CHR data into unused NT areas). Two-Screen would also allow to use 2K OBJ tiles (when leaving BG unused).
</p><p>Note: 1K CHR-RAM allows to use as much as 64 tiles of 2bpp (or, with suitable color attributes, 128 monochrome tiles of 1bpp).
</p><p>Also note that with if reads/writes to mirrored addresses are avoided, software for this mapper can also be made compatible with <a href="AxROM.xhtml" title="AxROM">AxROM</a> ($A8,$A9), <a href="BNROM.xhtml" class="mw-redirect" title="BxROM">BxROM</a> ($A0,A1) or <a href="NROM.xhtml" title="NROM">NROM</a> + CHR-RAM, or other suitable mappers. <i>Magic Floor</i> itself is well behaved enough to be emulated as AxROM or NROM + CHR-RAM with vertical mirroring.
</p><p>It has been used in two games, and one test ROM:
</p>
<ul><li><a rel="nofollow" class="external text" href="https://problemkaputt.de/magicflr.htm"><i>Magic Floor</i></a> ($A8)</li>
<li><a rel="nofollow" class="external text" href="https://problemkaputt.de/starfigh.htm"><i>Starfight</i></a> ($A8)</li>
<li><a rel="nofollow" class="external text" href="https://forums.nesdev.org/viewtopic.php?p=232238#p232238">OAM corruption stress test ROM</a> ($A0)</li></ul>
