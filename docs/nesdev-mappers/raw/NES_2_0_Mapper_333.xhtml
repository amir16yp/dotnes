<div class="mw-parser-output"><p>NES 2.0 mapper 333 is used for the <i>New Star Super 8-in-1</i> multicart. Its UNIF board name are <b>BMC-8-IN-1</b> and <b>BMC-NEWSTAR-GRM070-8IN1</b>.
</p>
<h2><span id="Outer_Bank_and_PRG_Banking_Mode_Register_.28.249000-.249FFF.2C_.24B000-.24BFFF.2C_.24D000-.24DFFF.2C_.24F000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_PRG_Banking_Mode_Register_($9000-$9FFF,_$B000-$BFFF,_$D000-$DFFF,_$F000-$FFFF,_write)">Outer Bank and PRG Banking Mode Register ($9000-$9FFF, $B000-$BFFF, $D000-$DFFF, $F000-$FFFF, write)</span></h2>
<pre>Mask: $9000

D~7654 3210
  ---------
  ...P OOII
     | ||++- Select inner 32 KiB PRG-ROM bank at CPU $8000-$FFFF if P=0
     | ++--- Select 128 KiB outer PRG-ROM and CHR-ROM bank
     +------ Select PRG Banking Mode
              0: NROM-256
              1: MMC3
</pre>
<h2><span id="MMC3-compatible_registers_.28.248000-.248FFF.2C_.24A000-.24AFFF.2C_.24C000-.24CFFF.2C_.24E000-.24EFFF.2C_write.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$8FFF,_$A000-$AFFF,_$C000-$CFFF,_$E000-$EFFF,_write)">MMC3-compatible registers ($8000-$8FFF, $A000-$AFFF, $C000-$CFFF, $E000-$EFFF, write)</span></h2>
<pre>Mask: $F001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
