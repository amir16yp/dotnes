</head><body><h1>INES Mapper 241</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_241">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_241">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><b>iNES Mapper 241</b> denotes a <a href="BNROM.xhtml" class="mw-redirect" title="BxROM">BxROM</a>-like circuit board with the addition of 8 KiB of WRAM at CPU $6000-$7FFF that can be battery-backed. <a href="INES_Mapper_034.xhtml" title="INES Mapper 034">INES Mapper 034</a> is not commonly used for BNROM with WRAM, because the WRAM's address space is partially overlaid by registers from the NINA-001 part of the mapper specification (although that could be alleviated by disabling the NINA-001 registers in the absence of CHR-ROM).
</p><p>BxROM with WRAM is typically used natively by games from Henge Dianzi with hard-wired mirroring and a few educational computer cartridges, but is more commonly used as a target for mapper hacks of games that originally used mappers <a href="INES_Mapper_164.xhtml" title="INES Mapper 164">164</a>, <a href="INES_Mapper_178.xhtml" title="INES Mapper 178">178</a> and <a href="INES_Mapper_227.xhtml" title="INES Mapper 227">227</a>. Because those mapper hacks rarely take bus conflicts into consideration, mapper 241 should be emulated without bus conflicts. As a result of being mapper hacks, such games may also access registers in the $4800-$5FFF range.
</p><p>Mirroring is hard-wired to horizontal or vertical; <a href="INES_Mapper_177.xhtml" title="INES Mapper 177">INES Mapper 177</a> denotes a variant with mapper-controlled two-screen mirroring.
</p>
