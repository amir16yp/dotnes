<div class="mw-parser-output"><p>NES 2.0 Mapper 306 is used for Kaiser's ROM cartridge conversion of the Japanese Famicom Disk System game <i>Exciting Basket</i> (<i>Double Dribble</i> in North America and Europe). Its UNIF board name is <b>UNL-KS7016</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $8000-$FFFF: 32 KiB fixed PRG-ROM bank #3</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Bank_.28.24D903-.24D943.29"/><span class="mw-headline" id="PRG-ROM_Bank_($D903-$D943)">PRG-ROM Bank ($D903-$D943)</span></h2>
<pre>Mask: $D903 (according to FCEUX)

A~FEDC BA98 7654 3210
  -------------------
  11.1 1..1 .Mpp PP11
             ||| ++-- Bits 0-1 of 8 KiB PRG-ROM bank number at CPU $6000-$7FFF
             |++----- Bits 2-3 of 8 KiB PRG-ROM bank number at CPU $6000-$7FFF if M=1
             +------- 0=Ignore pp, switchable bank number is 10PP
                      1=Obey pp, switchable bank number is ppPP
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mirroring is hard-wired (to Vertical).</li>
<li>Switchable bank numbers $0C-$0F are forced to be mirrors of $0B.</li>
<li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Kaiser cartridge did not.</li></ul>
