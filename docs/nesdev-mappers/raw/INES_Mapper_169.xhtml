<div class="mw-parser-output"><p>This mapper is used in Yuxing's ROMs. PRG ROM=1024KB,CHR ROM=0KB.
see <a rel="nofollow" class="external text" href="http://www.yxleimeng.net">yxleimeng.net</a>(chinese)
</p><p>For some reason, GoodNES used this mapper for the singleton multicart <a href="http://community.fandom.com/wiki/c:bootleggames:Contra_168_in_1" class="extiw" title="wikia:c:bootleggames:Contra 168 in 1">Contra 168-in-1</a>, but that seems to be identical to <a href="INES_Mapper_015.xhtml" title="INES Mapper 015">iNES Mapper 015</a>.
</p>
