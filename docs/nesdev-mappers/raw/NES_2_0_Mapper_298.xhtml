From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_298">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_298">other pages</a>

<div class="mw-parser-output"><p><b>NES 2.0 Mapper 298</b> is used for the unlicensed game <i>Lethal Weapon</i>, which is actually a backport of <a rel="nofollow" class="external text" href="https://en.wikipedia.org/wiki/Lethal_Enforcers">Lethal Enforcers</a>, and not to be confused with the <a rel="nofollow" class="external text" href="http://bootgod.dyndns.org:7777/profile.php?id=702">licensed game of the same name</a>. Its UNIF board name is <b>UNL-TF1201</b>. 
</p><p>The board uses a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone in the VRC4b configuration (CPU 0x02s to VRC4 A0, CPU 0x01s to VRC4 A1). The only difference is that register $F003 is implemented differently than on the original ASIC: writing to $F003 only acknowledges a pending IRQ, but it does not move the 'A' control bit to the 'E' control bit <a href="VRC_IRQ.xhtml#IRQ_Acknowledge" title="VRC IRQ">the way an original VRC4 does</a>. This is relevant for emulation, as the game writes to $F003 immediately after enabling the IRQ by writing $02 to $F002.
</p><p>The level selected by the middle icon in the top row of the level selection screen <a rel="nofollow" class="external text" href="https://youtu.be/YIdkWZuoRXM">will shake greatly on real hardware</a>, and therefore is not an emulation fault.
</p>
