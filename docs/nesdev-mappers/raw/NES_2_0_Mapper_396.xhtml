<div class="mw-parser-output"><p><b>NES 2.0 Mapper 396</b> denotes the 晶太 <b>YY850437C</b> and Realtec <i>GN-51</i> multicart PCBs, basically an <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> mapper with an outer bank register. Its UNIF MAPR is <b>BMC-830752C</b>.
</p>
<ul><li><i>1995 Super 8-in-1</i> (JY-050 rev0)</li>
<li><i>Super 8-in-1 Gold Card Series</i> (JY-085)</li>
<li><i>Super 8-in-1 Gold Card Series</i> (JY-086)</li>
<li><i>2-in-1</i> (Realtec PG-07, GN-51 PCB)</li></ul>
<h2><span id="Outer_Bank_Register_.28.24A000-.24BFFF.29"/><span class="mw-headline" id="Outer_Bank_Register_($A000-$BFFF)">Outer Bank Register ($A000-$BFFF)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  .Mm. .ppp
   ||   +++- PRG A19..A17
   |+------- Mirroring (GN-51), 1=Horizontal
   +-------- Mirroring (YY850437C), 1=Horizontal
</pre>
<p>No bus conflicts. Since no multicart menu sets the respective &quot;other&quot; mirroring bit, submapper-less emulation is possible by selecting horizontal mirroring if either bit is 1, and vertical mirroring if both are 0.
</p>
<h2><span id="Inner_Bank_Register_.28.248000-.249FFF.2C_.24C000-.24FFFF.29"/><span class="mw-headline" id="Inner_Bank_Register_($8000-$9FFF,_$C000-$FFFF)">Inner Bank Register ($8000-$9FFF, $C000-$FFFF)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  .... .PPP
        +++- PRG A16..A14 if CPU A14=0
</pre>
<p>No bus conflicts.
</p>
