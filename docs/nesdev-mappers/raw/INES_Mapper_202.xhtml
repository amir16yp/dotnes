Implemented in BizHawk as of commit f72875b584abd79201ad9d3d0131fa5afcf0c429
</p><p>Used for the 150-in-1 pirate cart (which was shipped with dual sloat SP60 famiclone console).
</p>
<div class="thumb tright"><div class="thumbinner" style="width:302px;"><a href="File_150in1_top_jpg.xhtml" class="image"><img alt="" src="../wiki-images/150in1_top.jpg" decoding="async" width="300" height="132" class="thumbimage" srcset="/w/images/default/thumb/5/59/150in1_top.jpg/450px-150in1_top.jpg 1.5x, /w/images/default/thumb/5/59/150in1_top.jpg/600px-150in1_top.jpg 2x"/></a>  <div class="thumbcaption"><div class="magnify"><a href="File_150in1_top_jpg.xhtml" class="internal" title="Enlarge"/></div>150-in-1 PCB top side</div></div></div> <div class="thumb tright"><div class="thumbinner" style="width:302px;"><a href="File_150in1_bottom_jpg.xhtml" class="image"><img alt="" src="../wiki-images/150in1_bottom.jpg" decoding="async" width="300" height="137" class="thumbimage" srcset="/w/images/default/thumb/c/c2/150in1_bottom.jpg/450px-150in1_bottom.jpg 1.5x, /w/images/default/thumb/c/c2/150in1_bottom.jpg/600px-150in1_bottom.jpg 2x"/></a>  <div class="thumbcaption"><div class="magnify"><a href="File_150in1_bottom_jpg.xhtml" class="internal" title="Enlarge"/></div>150-in-1 PCB bottom side</div></div></div> <div class="thumb tright"><div class="thumbinner" style="width:302px;"><a href="File_150in1_schematics_png.xhtml" class="image"><img alt="" src="../wiki-images/150in1_schematics.png" decoding="async" width="300" height="264" class="thumbimage" srcset="/w/images/default/thumb/7/78/150in1_schematics.png/450px-150in1_schematics.png 1.5x, /w/images/default/thumb/7/78/150in1_schematics.png/600px-150in1_schematics.png 2x"/></a>  <div class="thumbcaption"><div class="magnify"><a href="File_150in1_schematics_png.xhtml" class="internal" title="Enlarge"/></div>150-in-1 schematics</div></div></div>
<pre> Registers:
 $8000-FFFF: A~[.... .... .... O..O]
               [.... .... .... RRRM]
 
 
 O = PRG Mode, if 3, will use 32 PRG mode, else 16
 R = Page registers, used for both CHR 8k banks, and PRG banks (in both 16k and 32k modes)
 M = Mirroring, 0 = Vertical, 1 = Horizontal
 
 CHR Setup:
 
                    $0000   $0400   $0800   $0C00   $1000   $1400   $1800   $1C00 
                   +-------------------------------+-------------------------------+
 CHR-ROM:          |                             $8000                             |
                   +-------------------------------+-------------------------------+
 
 
 
 PRG Setup:
 ------------------------------
 32k Mode:
 
 $8000     $A000     $C000     $E000
 +-------------------------------------+
 |               &lt;$8000&gt;               |
 +-------------------------------------+
 
 
 16k Mode:
 
 In 16k mode both regions are mapped to the same PRG bank
 
 $8000     $A000     $C000     $E000     
 +--------------------------------------+
 |       $8000       |      $8000       |
 +--------------------------------------+
</pre>
