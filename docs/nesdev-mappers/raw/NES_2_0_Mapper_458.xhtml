<div class="mw-parser-output"><p><b>NES 2.0 Mapper 458</b> denotes the <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based <b>K-3102</b> (submapper 0) and <b>GN-23</b> (submapper 1) multicart PCBs. The MMC3 is only used for CHR banking and mirroring, while all PRG banking is controlled by an extra register, similar to <a href="NES_2_0_Mapper_259.xhtml" title="NES 2.0 Mapper 259">NES 2.0 Mapper 259</a>.
</p>
<h2><span id="Extra_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Extra_Register_($6000-$7FFF,_write)">Extra Register ($6000-$7FFF, write)</span></h2>
<pre>A~[011. .... d.DM PPPP]
             | || ++++- PRG A17..A14
             | || +---- 0: NROM-128, 1: NROM-256 (submapper 1)
             | |+------ 0: NROM-128, 1: NROM-256 (submapper 0)
             | +------- 0: Normal, 1: Replace CPU A4..0 with solder pad value (submapper 0)
             +--------- 0: Normal, 1: Replace CPU A4..0 with solder pad value (submapper 1)
Value on reset: $00
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>WRAM must be enabled in $A001.7 before writing to the extra register.</li></ul>
