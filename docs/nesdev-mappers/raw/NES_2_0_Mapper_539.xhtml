</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB fixed PRG-ROM bank $D</li>
<li>CPU $8000-$9FFF: 8 KiB fixed PRG-ROM bank $C</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$DFFF: 8 KiB fixed PRG-ROM bank $E</li>
<li>CPU $E000-$FFFF: 8 KiB fixed PRG-ROM bank $F</li>
<li>PPU $0000-$1FFF: 8 KiB of unbanked CHR-RAM</li></ul>
<p>Certain ranges in the CPU address space are overlaid with portions of 8 KiB of PRG-RAM as follows:
</p>
<ul><li>CPU $6000-$60FF</li>
<li>CPU $6200-$62FF</li>
<li>CPU $6400-$65FF</li>
<li>CPU $8200-$82FF</li>
<li>CPU $C000-$D1FF</li>
<li>CPU $DF00-$DFFF</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_Bank_Select_.28.24A000.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Select_($A000,_write)">PRG Bank Select ($A000, write)</span></h2>
<pre>Mask: unknown

D~7654 3210
  ---------
  .... BBBB
       ++++- Select 8 KiB PRG-ROM bank at CPU $A000-$BFFF
</pre>
<h2><span id="Nametable_Mirroring_Select_.28.24FFFF.2C_write.29"/><span class="mw-headline" id="Nametable_Mirroring_Select_($FFFF,_write)">Nametable Mirroring Select ($FFFF, write)</span></h2>
<pre>Mask: unknown

D~7654 3210
  ---------
  .... M...
       +---- Select nametable mirroring type
              0: Vertical
              1: Horizontal
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Save data is not retained.</li>
<li>The conversion retains all writes to the FDS sound channel registers. An emulator could provide the expansion sound channel even though the original cartridge did not.</li></ul>
