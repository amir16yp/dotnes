<div class="mw-parser-output"><p><b>NES 2.0 Mapper 412</b> denotes an &quot;MMC3 plus NROM&quot; multicart mapper, used for the <i>Intellivision 10-in-1 Plug 'n Play 2nd Edition</i> as well as assorted multicarts from Henggedianzi. It uses an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with additional outer bank registers at $6000-$7FFF that are accessible via the MMC3's WRAM interface, meaning that WRAM must be enabled via $A001 for them to be written to.
</p>
<h2><span id="8_KiB_CHR_Bank_Register_.28.246000.2C_write.29"/><span class="mw-headline" id="8_KiB_CHR_Bank_Register_($6000,_write)">8 KiB CHR Bank Register ($6000, write)</span></h2>
<pre>D~[BBBB BB..]  Mask: $E003, reset value: 0
   ++++-++---- CHR A18..A13
</pre>
<p>Only applicable in NROM banking mode ($6002.1=1).
</p>
<h2><span id="Mode_Register_.28.246001.2C_write.29"/><span class="mw-headline" id="Mode_Register_($6001,_write)">Mode Register ($6001, write)</span></h2>
<pre>D~[CARQ DBPL]  Mask: $E003, reset value: 0
   |||| |||+-- Lock register $6001
   |||| ||+--- 0: PRG A18 from MMC3, 1: from B Bit
   |||| |+---- PRG A18 if Q=2
   |||| +----- CHR A18
   |||+------- 0: PRG A17 from MMC3, 1: from A Bit
   ||+-------- 0: CHR A17 from MMC3, 1: from C Bit
   |+--------- PRG A17 if P=1
   +---------- CHR A17 if R=1
</pre>
<h2><span id="PRG_Bank_Register_.28.246002.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Register_($6002,_write)">PRG Bank Register ($6002, write)</span></h2>
<pre>D~[BBBB bQP.]  Mask: $E003, reset value: 0
   |||| ||+--- 0: MMC3 banking, 1: NROM PRG/CHR banking
   |||| |+---- 0: NROM-128, 1: NROM-256 banking, only if P=1
   |||| +----- PRG A14 if P=1 and Q=0
   ++++------- PRG A18..A15 if P=1
</pre>
