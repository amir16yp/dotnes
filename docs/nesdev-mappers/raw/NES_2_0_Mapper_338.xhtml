<div class="mw-parser-output"><p>NES 2.0 mapper 338 is used for a <i>16-in-1</i> and a <i>200/300/600/1000-in-1</i> multicart. Its UNIF board name is <b>BMC-SA005-A</b>. 
</p>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1... .... .... MBBB
                 ++++- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF and $C000-$FFFF
                 |     and 8 KiB CHR-ROM bank at PPU $0000-$1FFF
                 +---- Select nametable mirroring type
                        0: Horizontal
                        1: Vertical
</pre>
<h2><span class="mw-headline" id="Similar_mappers">Similar mappers</span></h2>
<p><a href="INES_Mapper_200.xhtml" title="INES Mapper 200">INES Mapper 200</a> is similar but with the mirroring bit's meaning flipped, and the mirroring bit being also used as a fourth bank bit.
</p>
