<div class="mw-parser-output"><p><b>NES 2.0 Mapper 401</b> denotes the <b>KC885</b> multicart circuit board, used for the <i>Super 19-in-1</i> (VIP19) multicart. It is basically <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">mapper 45</a> with the higher address lines connected weirdly.
</p>
<ul><li>PRG A13-A17: from $6000 #1 bits 0-4, same as mapper 45</li>
<li>PRG A18: either from $6000 #2 bit 5 or from $6000 #1 bit 6, depending on solder pad setting</li>
<li>PRG A19: either from $6000 #2 bit 6 or from $6000 #1 bit 5, depending on solder pad setting</li>
<li>PRG /CE: $6000 #1 bit 7, if solder pad connected</li></ul>
<p>The menu code tries the two ways of selecting PRG A18 and A19 and whether $6000 #1 bit 7 disables PRG-ROM, and selects one of eight different menus based on what it finds. Other multicarts using mapper 45's chipset do the same thing; KC885 is unique in that the standard mapper 45 way of connecting PRG-ROM will not work at all.
</p>
