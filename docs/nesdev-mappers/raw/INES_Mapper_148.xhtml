<div class="mw-parser-output"><p><b>iNES Mapper 148</b> denotes the <b>Sachen SA-008-A</b> and <b>Tengen 800008</b> circuit boards, which switch up to 64 KiB of PRG-ROM in 32 KiB amounts and up to 64 KiB of CHR-ROM in 8 KiB amounts using a data latch. The bit assignment of the data latch is the same as <a href="NINA_003_006.xhtml" class="mw-redirect" title="INES Mapper 079">INES Mapper 079</a>'s, but unlike mapper 79, the latch register is in the CPU $8000-$FFFF range instead of $4100-$5FFF, introducing bus conflicts. 
</p>
<h2><span class="mw-headline" id="Data_Latch">Data Latch</span></h2>
<pre> Mask: $8000
 Bus conflicts:
 $8000: [.... PCCC] - Select 32 KiB PRG bank and 8 KiB CHR bank
</pre>
<p>Sachen's SA-008-A board uses a mask of $E000 but is otherwise the same.
</p>
