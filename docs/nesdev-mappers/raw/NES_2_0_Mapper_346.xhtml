<div class="mw-parser-output"><p>NES 2.0 Mapper 346 is used for Kaiser's cartridge conversion of the FDS game <i>Zanac</i>. Its UNIF board name is <b>UNL-KS7012</b>.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: Unbanked 8 KiB of PRG-RAM</li>
<li>CPU $8000-$FFFF: Selectable 32 KiB PRG-ROM bank, defaults to #1</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB of CHR-RAM</li></ul>
<p>Mirroring is hard-wired.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>The actual address masks are unknown.
</p>
<ul><li>CPU $E0A0: Select 32 KiB PRG-ROM bank #0 at CPU $8000-$FFFF.</li>
<li>CPU $EE36: Select 32 KiB PRG-ROM bank #1 at CPU $8000-$FFFF.</li></ul>
