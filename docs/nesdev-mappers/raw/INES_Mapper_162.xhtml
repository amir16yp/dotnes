<div class="mw-parser-output"><p><b>iNES Mapper 162</b> denotes the 外星 (Wàixīng) <b>FS304</b> circuit board, used for the following games:
</p>
<ul><li><i>Mummy - 神鬼传奇</i></li>
<li><i>Zelda 传说: 三神之力</i> (ES-1096)</li>
<li><i>法老王 - Pharaoh</i> (ES-1114)</li>
<li><i>火焰纹章 - 圣战的系谱</i> and its title screen hack <i>聖火徽章 III</i> (Shènghuǒ Huīzhāng III/Fire Emblem III)</li>
<li><i>西游记后传</i> (ES-1097)</li></ul>
<p>A compatible circuit board with an unknown PCB code is used for a few games from 南晶 (Nánjīng):
</p>
<ul><li><i>梁山英雄</i> (Liángshān Yīngxióng, NJ023, title screen hack of 水浒神兽, NJ019)</li>
<li><i>时空斗士 - Pegasus Senya</i> (Shíkōng Dòushì, NJ024, title screen hack of 圣斗士星矢: 天马之幻想, NJ022)</li>
<li><i>农场小精灵</i> (Nóngchǎng Xiǎojīnglíng, NJ025, title screen hack of 牧场物语 - Harvest Moon, NJ011)</li></ul>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM, battery-backed</li>
<li>CPU $8000-$FFFF: 32 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM bank, 4 KiB can be automatically switched</li>
<li>Nametable mirroring: hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>All registers are initialized to $00 on reset.
</p>
<h2><span id="PRG-ROM_Bank_Low.2FCHR-RAM_Switch_.28.245000.2C_write.29"/><span class="mw-headline" id="PRG-ROM_Bank_Low/CHR-RAM_Switch_($5000,_write)">PRG-ROM Bank Low/CHR-RAM Switch ($5000, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  C... PPpq
  |    |||+- PRG A15 if $5300.0=1 and $5300.2=1
  |    ||+-- PRG A16 if $5300.2=1
  |    ++--- PRG A18..A17
  +--------- Automatic 4 KiB CHR-RAM switch: when PPU A13=0 (pattern table) ...
              0: CHR A12=PPU A12 (disable auto-switch)
              1: CHR A12=PPU A9 latched on last rise of PPU A13 (enable auto-switch)
</pre>
<p>Automatic 4 KiB CHR-RAM switch means that the left pattern table is used for the the top half of any nametable, and the right pattern table for the bottom half of any nametable, regardless of the scroll position. This auto-switch behavior is similar to that of <a href="INES_Mapper_096.xhtml" title="INES Mapper 096">mapper 96</a>.
</p>
<h2><span id="Alternative_PRG-ROM_Bank_low_.28.245100.2C_write.29"/><span class="mw-headline" id="Alternative_PRG-ROM_Bank_low_($5100,_write)">Alternative PRG-ROM Bank low ($5100, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... ..p.
         +-- PRG A15 if $5300.0=0
</pre>
<h2><span id="PRG-ROM_Bank_High_.28.245200.2C_write.29"/><span class="mw-headline" id="PRG-ROM_Bank_High_($5200,_write)">PRG-ROM Bank High ($5200, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... ..PP
         ++- PRG A20..A19
</pre>
<h2><span id="Mode_.28.245300.2C_write.29"/><span class="mw-headline" id="Mode_($5300,_write)">Mode ($5300, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .A.B
        | +- PRG A15 mode:
        |     0: PRG A15=$5100.1
        |     1: PRG A15=1       if A=0
        |        PRG A15=$5000.0 if A=1
        +--- PRG A16 mode:
              0: PRG A16=1
              1: PRG A16=$5000.1
</pre>
<p>Or in terms of where PRG A15-16 come from:
</p>
<pre>$5300.2/0   PRG A16   PRG A15
-----------------------------
      0.0      1      $5100.1
      0.1      1         1
      1.0   $5000.1   $5100.1
      1.1   $5000.1   $5000.0
</pre>
<p>Because reset clears all registers' bits, games will boot in 32 KiB PRG-ROM bank #2 (A16=1 and A15=$5100.1=0).
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>To ensure that a cartridge to be dumped is really INES Mapper 162, write $04 to $5300 and verify that $5100.1 changes the PRG bank.</li>
<li>The Waixing games run with $5300=$04, using $5100.1 to change PRG A16. The three Nanjing games run with $5300=$07, using $5000.0 to change PRG A16, except for a protection check shortly after the title screen where the described behavior of $5300=$04 is verified.</li></ul>
