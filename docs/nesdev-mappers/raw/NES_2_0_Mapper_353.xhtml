<div class="mw-parser-output"><p>NES 2.0 Mapper 353 is used for the <i>92 Super Mario Family</i> multicart, consisting of an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone ASIC together with a PAL. The PCB code is <b>81-03-05-C</b>.
</p>
<h1><span id="Outer_Bank_Register_.28.248080-.24E080.29"/><span class="mw-headline" id="Outer_Bank_Register_($8080-$E080)">Outer Bank Register ($8080-$E080)</span></h1>
<pre>Mask: Unknown, but must be more than just $8080.

A~FEDC BA98 7654 3210
  -------------------
  1OO. .... 1... ....
   ++----------------- Select 256 KiB outer PRG-ROM bank (PRG A18-19)
                       and 128 KiB outer CHR-ROM bank (CHR A17-18)

Power-up value: $00
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>In addition to the setting the outer PRG-ROM and CHR-ROM bank, the outer bank register also modifies other aspects:
<ul><li>Outer bank 0: Uses CHR A17 instead of the MMC3's Mirroring register, similar to <a href="INES_Mapper_118.xhtml" title="INES Mapper 118">INES Mapper 118</a>.</li>
<li>Outer bank 2: The outer PRG-ROM bank size is just 128 KiB, with CHR A17 serving as PRG A17 instead. Additionally, if CHR A17 is high, 8 KiB of unbanked CHR-RAM are used instead of CHR-ROM.</li>
<li>Outer bank 3: If CHR A17 is low, PRG A17 is replaced with CPU A14, so that CPU $8000-$BFFF are taken from the first and CPU $C000-$FFF are taken from the second 128 KiB half.</li></ul></li>
<li>The conversion of <i>Bio Miracle Bokutte Upa</i> on that multicart retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original multicart did not.</li>
<li>The conversion of <i>Super Mario Bros. 2 (J)</i> is incomplete and will fail to work after World 4-4.</li>
<li>Resetting the console always returns to the main menu (outer bank register reset to $0) due to a circuit detecting interruptions in the M2 signal.</li></ul>
