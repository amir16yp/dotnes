<div class="mw-parser-output"><p>NES 2.0 Mapper 345 is used for the <i>New Star 6-in-1 Game Cartridge</i> multicart. Unusually, it combines <a href="MMC3.xhtml" title="MMC3">MMC3</a> and <a href="AxROM.xhtml" title="AxROM">AxROM</a> games. Its UNIF board name is <b>BMC-L6IN1</b>. CHR data comes from 8 KiB of MMC3-banked CHR-RAM.
</p>
<h2><span id="Outer_Bank_and_Mode_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($6000-$7FFF,_write)">Outer Bank and Mode Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  OOMS mmPP
  |||| ||++- Select 32 KiB inner PRG-ROM bank in AxROM mode
  |||| ++--- Select PRG-ROM banking mode (0=AxROM, 1-3=MMC3)
  |||+------ Select 1 KiB CIRAM bank in one-screen mirroring mode
  ||+------- Select nametable mirroring type
  ||          0: from MMC3
  ||          1: one-screen mirroring
  ++-------- Select 128 KiB outer PRG-ROM bank in either mode
</pre>
<p>As it uses the MMC3 clones's WRAM interface, writing to the Outer Bank register requires enabling and not write-protecting WRAM in the MMC's $A001 register.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
