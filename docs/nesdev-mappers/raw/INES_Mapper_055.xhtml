<p>iNES Mapper 055 is used for the UNIF board <b>BTL-MARIO1-MALEE2</b>, used by several bootleg versions of the first <i>Super Mario Brothers</i> that add a great number of cheats:
</p>
<ul><li><i>Fly Merio Bros.</i></li>
<li><i>Super Mario Bros. Malee 2</i></li>
<li><i>天才瑪琍</i> (<i>Tiāncái Mǎlí</i>, a.k.a. <i>Genius Mario</i>)</li></ul>
<p>It adds 2 KiB of PRG-ROM and PRG-RAM each to a regular NROM-256 PCB, but has no bankswitching functionalities.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$6FFF: 2 KiB PRG-ROM, mirrored once</li>
<li>CPU $7000-$7FFF: 2 KiB PRG-RAM, mirrored once</li>
<li>CPU $8000-$FFFF: 32 KiB PRG-ROM</li>
<li>PPU $0000-$1FFF: 8 KiB CHR-ROM</li></ul>
<h1><span class="mw-headline" id="ROM_layout">ROM layout</span></h1>
<p>Nestopia expects Mapper 055 ROM images to first contain the 32 KiB of PRG-ROM at $8000-$FFFF, then the data for the 2 KiB of PRG-ROM at $6000, appropriately padded or repeated to fit into the 16 KiB iNES bank size, for a total of three 16 KiB PRG-ROM banks.
</p>
