<div class="mw-parser-output"><p>NES 2.0 Mapper 293 is used for the <i>NewStar 12-in-1</i> and <i>76-in-1</i> multicarts. Both use 8 KiB of unbanked CHR-RAM rather than CHR-ROM.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="First_Banking_Register_.28.248000-.249FFF.2C_.24C000-.24DFFF.29"/><span class="mw-headline" id="First_Banking_Register_($8000-$9FFF,_$C000-$DFFF)">First Banking Register ($8000-$9FFF, $C000-$DFFF)</span></h2>
<pre>Mask: $A000

7654 3210
---------
.... PIII
     |+++- Select inner 16 KiB PRG-ROM bank
     +---- Bit 1 of the PRG banking mode number
</pre>
<h2><span id="Second_Banking_Register_.28.248000-.24BFFF.29"/><span class="mw-headline" id="Second_Banking_Register_($8000-$BFFF)">Second Banking Register ($8000-$BFFF)</span></h2>
<pre>Mask: $C000

7654 3210
---------
MP10 ...2
||++----+- Select outer 128 KiB PRG-ROM bank (note the bit distribution)
|+-------- Bit 0 of the PRG banking mode number
+--------- Select nametable mirroring type
            0: Vertical
            1: Horizontal
</pre>
<h1><span class="mw-headline" id="PRG_banking_modes">PRG banking modes</span></h1>
<ul><li>0 (UNROM)</li></ul>
<dl><dd>$8000-$BFFF: Switchable 16 KiB Inner PRG-ROM bank</dd>
<dd>$C000-$FFFF: Fixed 16 KiB Inner PRG-ROM bank #7</dd></dl>
<ul><li>1</li></ul>
<dl><dd>$8000-$BFFF: Switchable 16 KiB Inner PRG-ROM bank AND $FE</dd>
<dd>$C000-$FFFF: Fixed 16 KiB Inner PRG-ROM bank #7</dd></dl>
<ul><li>2 (NROM-128)</li></ul>
<dl><dd>$8000-$BFFF: Switchable 16 KiB Inner PRG-ROM bank</dd>
<dd>$C000-$FFFF: Mirror of $8000-$BFFF</dd></dl>
<ul><li>3 (NROM-256)</li></ul>
<dl><dd>$8000-$FFFF: Switchable 32 KiB Inner PRG-ROM bank (bit 0 of inner bank number ignored)</dd></dl>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>The address ranges of the two banking registers do indeed partially overlap.</li>
<li>Nestopia Plus! assigns this board to Mapper 281 instead.</li></ul>
