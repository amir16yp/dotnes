<div class="mw-parser-output"><p>iNES Mapper 187 is used for the 卡聖 (Kǎshèng) A98402 and similar boards, an <a href="MMC3.xhtml" title="MMC3">MMC3</a>-clone-bearing board with an NROM-like PRG-ROM register that can override the MMC3 clone's PRG-ROM bank, and supports 512 KiB of CHR-ROM. Used by:
</p>
<ul><li><i>Street Fighter Zero 2</i> (Kǎshèng/Hummer Team, not <i>Street Fighter Zero 2 '97</i>)</li>
<li><i>The King of Fighters '96</i> (Kǎshèng/Hummer Team)</li></ul>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="NROM_Override_Register_.28.245000.29"/><span class="mw-headline" id="NROM_Override_Register_($5000)">NROM Override Register ($5000)</span></h2>
<pre>Mask: $F001

D~7654 3210
  ---------
  M.NB BBb.
  | |+-+++-- Select 16 KiB PRG-ROM bank at CPU
  | |        $8000-$BFFF and $C000-$FFFF
  | +------- 0: Do not replace bit 1 (NROM-128)
  |          1: Replace bit 1 with CPU A14 (NROM-256)
  +--------- 0: Use PRG bank from MMC3; ignore $5000 bits 1-4/5
             1: Ignore PRG bank from MMC3; apply $5000 bits 1-4/5
</pre>
<h2><span id="Protection_Read_.28.245000-.245FFF.29"/><span class="mw-headline" id="Protection_Read_($5000-$5FFF)">Protection Read ($5000-$5FFF)</span></h2>
<p>Mask: Unknown
</p><p>The actual values that are returned are unknown; <i>The King of Fighters '96</i> reads from here and only expects bit 7 of the value being returned to be set.
</p>
<h2><span id="CHR_A18_Control_.28.248000-.249FFF.2C_even.29"/><span class="mw-headline" id="CHR_A18_Control_($8000-$9FFF,_even)">CHR A18 Control ($8000-$9FFF, even)</span></h2>
<pre>Mask: $E001

D~7654 3210
  ---------
  M... ....
  +--------- Select CHR A18 Mode
              0: CHR A18=inverted PPU A12
              1: CHR A18=PPU A12
</pre>
<p>Basically, either sprites or background tiles will come from the second 256 KiB of CHR-ROM. Note that setting bit 7 will still also activate the MMC3 clone's CHR A12 inversion.
</p>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<p>Mask: $E001, see <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
<h1><span class="mw-headline" id="Errata">Errata</span></h1>
<ul><li>GoodNES 3.23b has several <a href="INES_Mapper_121.xhtml" title="INES Mapper 121">INES Mapper 121</a> and <a href="INES_Mapper_189.xhtml" title="INES Mapper 189">INES Mapper 189</a> images erroneously set to 187.</li></ul>
<h1><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h1>
<ul><li>iNES Mappers <a href="INES_Mapper_115.xhtml" title="INES Mapper 115">115</a> and <a href="INES_Mapper_123.xhtml" title="INES Mapper 123">123</a> have similar NROM override registers, with Mapper 123's bits arranged a bit differently.</li>
<li>iNES Mapper <a href="INES_Mapper_121.xhtml" title="INES Mapper 121">121</a> has the same CHR A18 behavior, drops the NROM override register, and adds more complex protection.</li></ul>
