<div class="mw-parser-output"><p>iNES Mapper 125 is used for Whirlwind Manu's ROM cartridge conversion of the Japanese Famicom Disk System game <i>モンティのドキドキ大脱走</i> (<i>Monty no Doki Doki Daisassō</i>, Monty on the Run, cartridge code LH32). Its UNIF board name is <b>UNL-LH32</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $8000-$9FFF: 8 KiB fixed PRG-ROM bank #12</li>
<li>CPU $A000-$BFFF: 8 KiB fixed PRG-ROM bank #13</li>
<li>CPU $C000-$DFFF: 8 KiB unbanked PRG-RAM bank</li>
<li>CPU $E000-$FFFF: 8 KiB fixed PRG-ROM bank #15</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Bank_.28.246000-.247FFF.29"/><span class="mw-headline" id="PRG-ROM_Bank_($6000-$7FFF)">PRG-ROM Bank ($6000-$7FFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  .... PPPP
       ++++- Select 8 KiB PRG-ROM bank number at CPU $6000-$7FFF
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mirroring is hard-wired (to Vertical).</li>
<li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Whirlwind Manu cartridge did not.</li></ul>
