<div class="mw-parser-output"><p><b>NES 2.0 Mapper 562</b> denotes ROM image files extracted from disk images for the <i>Venus Turbo Game Doctor 4+</i>, <i>6+</i> and <i>6M</i> <a href="RAM_cartridge.xhtml" title="RAM cartridge">RAM cartridges</a>.
They represent games whose <a href="Game_Doctor_Magic_Card_FDS_Format.xhtml#Venus_Turbo_Game_Doctor_disks" title="Game Doctor/Magic Card FDS Format">Doctor Header file</a> denotes a Turbo Game Doctor disk (byte $0 bit 7 clear). 
A clone of the <a href="Super_Magic_Card.xhtml" title="Super Magic Card">Magic Card 2M</a>, it differs in several aspects.
</p><p>As with <a href="INES_Mapper_006.xhtml" title="INES Mapper 006">mapper 6</a>, the submapper field denotes the initial latch-based banking mode (0-7).
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $4800-$4FFF: BIOS offsets $0800-$0FFF. Some locations checked by games to lock out competing RAM cartridges from Bung and FFE.</li>
<li>CPU $6000-$7FFF: 8 KiB WRAM</li>
<li>CPU $8000-$FFFF: 32 KiB window into 256 KiB (Turbo Game Doctor 6+)/512 KiB (Turbo Game Doctor 4+/6M) PRG memory</li>
<li>PPU $0000-$1FFF: 8 KiB window into 32 KiB (Turbo Game Doctor 4+)/256 KiB (Turbo Game Doctor 6+/6M) CHR memory</li></ul>
<h1><span class="mw-headline" id="Trainer">Trainer</span></h1>
<p>Loadable to any RAM offset and of arbitrary size, Turbo Game Doctor trainers cannot use the <a href="INES.xhtml#Trainer" title="INES">iNES format's trainer bit</a>. Instead, its data is included as NES 2.0 <a href="NES_2_0.xhtml#Miscellaneous_ROM_Area" title="NES 2.0">Misc. ROM</a> data:
</p>
<ul><li>Misc. ROM offset 0: Trainer load address (16-bit little endian)</li>
<li>Misc. ROM offset 2: JSR address of pre-reset-handler initialization routine, or $0000 if none (16-bit little endian)</li>
<li>Misc. ROM offset 4+: Trainer data</li></ul>
<h1><span class="mw-headline" id="Banking_Modes">Banking Modes</span></h1>
<h2><span class="mw-headline" id="Latch-based_modes">Latch-based modes</span></h2>
<ul><li>A bus-conflict-free latch at CPU $8000-$FFFF switches PRG and CHR banks.</li>
<li>The <a href="#1M_banking_mode_(%2442FC-%2442FF,_write-only)">1M Mode Register</a> selects the latch-based mode.</li>
<li>The latch is only active when PRG memory is write-protected.</li>
<li>There are no CNROM-128 or NROM-256 modes; BIOS runs such games in CNROM-256 mode by duplicating CHR banks.</li></ul>
<h3><span class="mw-headline" id="0:_UNROM">0: <a href="UxROM.xhtml" class="mw-redirect" title="INES Mapper 002">UNROM</a></span></h3>
<pre>D~[.... .PPP]
         +++- CPU $8000-$BFFF: switchable 16 KiB PRG bank #0-#7 via PPP
              CPU $C000-$FFFF: fixed 16 KiB PRG bank #7
              PPU $0000-$1FFF: fixed 8 KiB CHR bank #0, writable
</pre>
<h3><span id="1:_UN1ROM.2BCHRSW"/><span class="mw-headline" id="1:_UN1ROM+CHRSW">1: <a href="INES_Mapper_094.xhtml" title="INES Mapper 094">UN1ROM</a>+CHRSW</span></h3>
<pre>D~[..BB BBCC]
     || ||++- PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC, writable
     ++-++--- CPU $8000-$BFFF: switchable 16 KiB PRG bank #0-#15 via PPP
              CPU $C000-$FFFF: fixed 16 KiB PRG bank #7
</pre>
<p>UN1ROM+CHRSW is used for games that originally were <a href="SxROM.xhtml" class="mw-redirect" title="SKROM">SKROM</a> with 128 KiB PRG and 128 KiB CHR data. The original 128 KiB CHR data are stored in the second 128 KiB of PRG address space, with a trainer program copying the most-recentl CHR data into 32 KiB CHR memory.
</p>
<h3><span class="mw-headline" id="2:_UOROM">2: <a href="UxROM.xhtml" class="mw-redirect" title="INES Mapper 002">UOROM</a></span></h3>
<pre>D~[.... PPPP]
        ++++- CPU $8000-$BFFF: switchable 16 KiB PRG bank #0-#15 via PPPP
              CPU $C000-$FFFF: fixed 16 KiB PRG bank #15
              PPU $0000-$1FFF: fixed 8 KiB CHR bank #0, writable
</pre>
<p>With no other means of masking PRG addresses, UNROM vs. UOROM are explicitly differentiated.
</p>
<h3><span id="3:_Reverse_UOROM.2BCHRSW"/><span class="mw-headline" id="3:_Reverse_UOROM+CHRSW">3: <a href="INES_Mapper_097.xhtml" title="INES Mapper 097">Reverse UOROM</a>+CHRSW</span></h3>
<pre>D~[..CC PPPP]
     || ++++- CPU $C000-$FFFF: switchable 16 KiB PRG bank #0-#15 via PPPP
     ||       CPU $8000-$7FFF: fixed 16 KiB PRG bank #15
     ++------ PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC, writable
     
</pre>
<h3><span class="mw-headline" id="4:_GNROM">4: <a href="GxROM.xhtml" class="mw-redirect" title="GNROM">GNROM</a></span></h3>
<pre>D~[..PP ..CC]
     ||   ++- PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC, write-protected
     ++------ CPU $8000-$FFFF: switchable 32 KiB PRG bank #0-#3 via PP
</pre>
<h3><span class="mw-headline" id="5:_CNROM-256">5: <a href="INES_Mapper_003.xhtml" title="INES Mapper 003">CNROM-256</a></span></h3>
<pre>D~[.... ..CC]
          ++- PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC, write-protected
              CPU $8000-$FFFF: fixed 32 KiB PRG bank #3
</pre>
<h3><span id="6:_Custom_.231"/><span class="mw-headline" id="6:_Custom_#1">6: Custom #1</span></h3>
<pre>D~[pppp PPPP]
   |||| ++++- CPU $8000-$9FFF: switchable 8 KiB PRG bank #0-15 via PPPP
   ++++------ CPU $A000-$BFFF: switchable 8 KiB PRG bank #0-15 via pppp
              CPU $C000-$FFFF: fixed 16 bit PRG bank #7
              PPU $0000-$1FFF: fixed 8 KiB CHR bank #0-3 at last-selected value in another mode
</pre>
<p>This mode is used by a few games that originally ran on the <a href="INES_Mapper_206.xhtml" title="INES Mapper 206">Namcot 118</a> ASIC.
</p>
<h3><span id="7:_Custom_.232"/><span class="mw-headline" id="7:_Custom_#2">7: Custom #2</span></h3>
<pre>D~[ppp1 PPP0]
   |||| ++++- CPU $8000-$9FFF: switchable 8 KiB PRG bank #0-14 via PPP0
   ++++------ CPU $A000-$BFFF: switchable 8 KiB PRG bank #1-15 via ppp1
              CPU $C000-$FFFF: fixed 16 bit PRG bank #7
              PPU $0000-$1FFF: fixed 8 KiB CHR bank #0-3 at last-selected value in another mode
</pre>
<h2><span class="mw-headline" id="2M_PRG_banking_mode">2M PRG banking mode</span></h2>
<ul><li>Four registers at $8000-$9FFF/$A000-$BFFF/$C000-$DFFF/$E000-$FFFF switch four 8 KiB PRG banks and the common 8 KiB CHR bank. They overlap with the latch at $8000-$FFFF and accept values even when the 2M PRG banking mode itself is not active.</li>
<li>2M PRG banking mode is enabled by the <a href="#2M_PRG_banking_mode_(%2443FE-%2443FF,_write-only)">2M Mode Register</a>. When active, it overrides the Latch-based mode in all aspects except CHR memory protection, which is still decided by the <a href="#1M_banking_mode_(%2442FC-%2442FF,_write-only)">1M Mode Register</a>.</li>
<li>Only 256 KiB can be reached.</li>
<li>Only the four lowest address bits can be switched on an 8 KiB level; the 128 KiB bit is switched for the entire $8000-$FFFF range via $43FE.</li></ul>
<pre>D~[..PP PPCC]
     || ||++- PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC in $8000-$FFFF
     ++-++--- CPU $8000-$9FFF: switchable 8 KiB PRG Bank #0-31 via PPPP in $8000-$9FFF (LSB) and p (MSB) in $43FE
              CPU $A000-$BFFF: switchable 8 KiB PRG Bank #0-31 via PPPP in $A000-$BFFF (LSB) and p (MSB) in $43FE
              CPU $C000-$DFFF: switchable 8 KiB PRG Bank #0-31 via PPPP in $C000-$DFFF (LSB) and p (MSB) in $43FE
              CPU $E000-$FFFF: switchable 8 KiB PRG Bank #0-31 via PPPP in $E000-$FFFF (LSB) and p (MSB) in $43FE
</pre>
<h2><span class="mw-headline" id="4M_PRG_banking_mode">4M PRG banking mode</span></h2>
<ul><li>Identical in operation to <a href="#2M_PRG_banking_mode">2M PRG Banking Mode</a>, except that all six bits from the four registers at $8000-$9FFF/$A000-$BFFF/$C000-$DFFF/$E000-$FFFF are used.</li>
<li>4M PRG banking mode is enabled by the <a href="#Turbo_Game_Doctor_mode_(%244411,_read/write)">TGD Mode Register</a>. When active, it overrides the Latch-based mode in all aspects except CHR memory protection, which is still decided by the <a href="#1M_banking_mode_(%2442FC-%2442FF,_write-only)">1M Mode Register</a>, and the 2M PRG banking mode.</li>
<li>The entire 512 KiB can be reached if available.</li></ul>
<pre>D~[PPPP PPCC]
   |||| ||++- PPU $0000-$1FFF: switchable 8 KiB CHR bank #0-#3 via CC in $8000-$FFFF
   ++++-++--- CPU $8000-$9FFF: switchable 8 KiB PRG Bank #0-63 via PPPPPP in $8000-$9FFF
              CPU $A000-$BFFF: switchable 8 KiB PRG Bank #0-63 via PPPPPP in $A000-$BFFF
              CPU $C000-$DFFF: switchable 8 KiB PRG Bank #0-63 via PPPPPP in $C000-$DFFF
              CPU $E000-$FFFF: switchable 8 KiB PRG Bank #0-63 via PPPPPP in $E000-$FFFF
</pre>
<h2><span class="mw-headline" id="1_KiB_CHR_banking_mode">1 KiB CHR banking mode</span></h2>
<ul><li>Eight registers at $4400-$4407 switch eight 1 KiB CHR banks. The registers are readable as well.</li>
<li>1 KiB CHR banking mode is enabled via the <a href="#Turbo_Game_Doctor_mode_(%244411,_read/write)">TGD Mode Register</a>. register. When active, it overrides the CC bits that selected 8 KiB banks from 32 KiB.</li>
<li>Although the Turbo Game Doctor 4+ only has 32 KiB of CHR memory, 1 KiB CHR banking mode still exists, allowing the 32 KiB to be banked with finer granularity than on previous Bung and FFE models.</li></ul>
<pre>D~[CCCC CCCC]
   ++++-++++- PPU $0000-$03FF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4400
              PPU $0400-$07FF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4401
              PPU $0800-$0BFF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4402
              PPU $0C00-$0FFF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4403
              PPU $1000-$13FF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4404
              PPU $1400-$17FF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4405
              PPU $1800-$1BFF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4406
              PPU $1C00-$1FFF: switchable 1 KiB CHR Bank #0-255 via CCCCCCC in $4407
</pre>
<h1><span class="mw-headline" id="Interrupts">Interrupts</span></h1>
<p>The Turbo Game Doctors have a cycle-based IRQ counter that operates in an unusual fashion.
After resetting the counter at the start of the NMI handler, a game writes the target value at which an IRQ is to be generated.
If a second IRQ is desired further down the frame, only a new target value is written while keeping the counter running.
This approach avoids accumulating timing errors from delays and jitter.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="1M_banking_mode_.28.2442FC-.2442FF.2C_write-only.29"/><span class="mw-headline" id="1M_banking_mode_($42FC-$42FF,_write-only)">1M banking mode ($42FC-$42FF, write-only)</span></h2>
<pre>A~FEDC BA98 7654 3210  D~7654 3210
  -------------------    ---------
  0100 0010 1111 11bM    BBBM ....
                   |+----|||+------ Set nametable mirroring type
                   |     |||         0: One-screen, page 0
                   |     |||         1: One-screen, page 1
                   |     |||         2: Vertical
                   |     |||         3: Horizontal
                   +-----|||------- 0: PRG memory is writeable, latch is disabled
                         |||        1: PRG memory is write-protected, latch is enabled
                         +++------- Select latch-based banking mode
</pre>
<h2><span id="2M_PRG_banking_mode_.28.2443FE-.2443FF.2C_write-only.29"/><span class="mw-headline" id="2M_PRG_banking_mode_($43FE-$43FF,_write-only)">2M PRG banking mode ($43FE-$43FF, write-only)</span></h2>
<pre>A~FEDC BA98 7654 3210  D~7654 3210
  -------------------    ---------
  0100 0011 1111 111M    .p.. ..CC
                    |     |     ++- switchable 8 KiB CHR bank #0-#3 via CC
                    |     +-------- PRG A17 for CPU $8000-$FFFF
                    +- 2M PRG banking mode select
                        0: Enable
                        1: Disable
</pre>
<p>The CC bits are mirrors of those in the latch at $8000-$FFFF.
</p>
<h2><span id="Turbo_Game_Doctor_mode_.28.244411.2C_read.2Fwrite.29"/><span class="mw-headline" id="Turbo_Game_Doctor_mode_($4411,_read/write)">Turbo Game Doctor mode ($4411, read/write)</span></h2>
<pre>D~7654 3210
  ---------
  41p. GAWW
  |||  ||++- CPU $6000-$7FFF: switchable 8 KiB WRAM bank #0-3 via WW.
  |||  ||    Only usable in floppy disk load mode, and ignored in gameplay mode.
  |||  |+--- Map WRAM in floppy disk load mode. Ignored in gameplay mode.
  |||  +---- Game Saver attachment is active. Related to real-time saving.
  ||+------- PRG A18 in floppy disk mode. Ignored in gameplay mode.
  |+-------- 1=1 KiB CHR banking mode enabled
  +--------- 1=4M PRG banking mode enabled
</pre>
<h2><span id="IRQ_Counter_Target_LSB.2FMSB_.28.24440D.2F.24440C.2C_write-only.29"/><span class="mw-headline" id="IRQ_Counter_Target_LSB/MSB_($440D/$440C,_write-only)">IRQ Counter Target LSB/MSB ($440D/$440C, write-only)</span></h2>
<ul><li>This upwards-counting signed 16-bit counter, when negative, is increased on every M2 or PA12 rise and raises an IRQ when reaching the target value, continuing to count until it reaches $FFFF.</li>
<li>Writing to either register acknowledges a pending IRQ.</li>
<li>The counter is reset and disabled by writing a positive value to $440C.</li></ul>
<h2><span id="IRQ_Counter_Value_LSB.2FMSB_.28.24440D.2F.24440C.2C_read-only.29"/><span class="mw-headline" id="IRQ_Counter_Value_LSB/MSB_($440D/$440C,_read-only)">IRQ Counter Value LSB/MSB ($440D/$440C, read-only)</span></h2>
<p>The current counter value can be read from the same addresses that the target counter value is written to.
</p>
<h2><span id="Current_CHR_Bank_.28.244420.2C_read-only.29"/><span class="mw-headline" id="Current_CHR_Bank_($4420,_read-only)">Current CHR Bank ($4420, read-only)</span></h2>
<p>The value of the current 1 KiB CHR bank register can be read and seen changing as the PPU renders the screen.
The BIOS uses this in test mode to determine correct operation, and some games check the result to lock out competing products from Bung and FFE.
</p>
