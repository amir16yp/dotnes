From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_357">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_357">other pages</a>

<div class="mw-parser-output"><p><b>NES 2.0 Mapper 357</b> is used for a <i>4-in-1</i> multicart (cartridge ID <i>4602</i>) from Bit Corp. The first game is Bit Corp's hack of the <a href="NES_2_0_Mapper_368.xhtml" title="NES 2.0 Mapper 368">YUNG-08</a> conversion of <i>Super Mario Brothers 2 (J)</i> named <i>Mr. Mary 2</i>, the other three games are <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> games.
</p><p>Unlike most multicarts, there is no menu; instead, the desired game is selected via two DIP Switches that protrude through the cartridge shell. The DIP switches directly select the outer 128 KiB PRG-ROM bank, game-specific nametable mirroring and mapper mode --- outer bank 0 selects SMB2J mode, all others select <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> mode. All four games use 8 KiB of unbanked CHR-RAM. Mirroring is Vertical for banks 0-2 and Horizontal for bank 3.
</p>

<h1><span class="mw-headline" id="Banks_in_SMB2J_mode">Banks in SMB2J mode</span></h1>
<ul><li>CPU $5000-$5FFF: 4 KiB PRG-ROM bank, fixed to #16</li>
<li>CPU $6000-$7FFF: 8 KiB PRG-ROM bank, <a href="#PRG_Bank_Select_2_.28.244120.2C_write.29">switchable to #2 or #0</a></li>
<li>CPU $8000-$9FFF: 8 KiB PRG-ROM bank, fixed to #1</li>
<li>CPU $A000-$BFFF: 8 KiB PRG-ROM bank, fixed to #0</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-ROM bank, switchable</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank, <a href="#PRG_Bank_Select_2_.28.244120.2C_write.29">switchable to #10 or #8</a></li>
<li>PPU $0000-$1FFF: unbanked 8 KiB CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers_in_SMB2J_mode">Registers in SMB2J mode</span></h1>
<h2><span id="PRG_Bank_Select_1_.28.244022.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Select_1_($4022,_write)">PRG Bank Select 1 ($4022, write)</span></h2>
<pre>Mask: probably $71FF

Bit 7654 3210
    ---------
    .... .CCC
          +++- Select 8 KiB PRG-ROM bank at CPU $C000-$DFFF.
</pre>
<p>The actual bank number is:
</p>
<pre>Value  Bank#
------------
0      4
1      3
2      5
3      3
4      6
5      3
6      7
7      3
</pre>
<h2><span id="PRG_Bank_Select_2_.28.244120.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Select_2_($4120,_write)">PRG Bank Select 2 ($4120, write)</span></h2>
<pre>Mask: probably $71FF

Bit 7654 3210
    ---------
    .... ...I
            +- 0: CPU $6000-$7FFF to bank 2,
                  CPU $E000-$FFFF to bank 10
               1: CPU $6000-$7FFF to bank 0,
                  CPU $E000-$FFFF to bank 8
</pre>
<h2><span id="IRQ_Control_.28.244122.29"/><span class="mw-headline" id="IRQ_Control_($4122)">IRQ Control ($4122)</span></h2>
<pre>Mask: probably $F1FF

Bit 7654 3210
    ---------
    .... ...I
            +- 0: Acknowledge and disable IRQ, reset counter
               1: Enable IRQ
</pre>
<p>When enabled, the 12-bit IRQ counter increases on every M2 cycle until it overflows, upon which an IRQ is fired.
</p>
