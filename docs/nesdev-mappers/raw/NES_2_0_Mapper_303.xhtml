<div class="mw-parser-output"><p>NES 2.0 Mapper 303 is used for Kaiser's ROM cartridge conversion of the Famicom Disk System game <i>アルマナの奇跡</i> (Almana no Kiseki). Its UNIF board name is <b>UNL-KS7017</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM</li>
<li>CPU $8000-$BFFF: 16 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB fixed PRG-ROM bank #2</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_Bank_Latch_.28.244A00-.244AFF.29"/><span class="mw-headline" id="PRG_Bank_Latch_($4A00-$4AFF)">PRG Bank Latch ($4A00-$4AFF)</span></h2>
<pre>Mask: probably $FF00

A~FEDC BA98 7654 3210
  -------------------
  0100 1010 .P.. PP..
             +---++-- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF
</pre>
<p>The new PRG bank number is not applied until register $5100 is written to.
</p>
<h2><span id="PRG_Bank_Latch_Commit_.28.245100.29"/><span class="mw-headline" id="PRG_Bank_Latch_Commit_($5100)">PRG Bank Latch Commit ($5100)</span></h2>
<pre>Mask: probably $FF00
</pre>
<h2><span id="Mirroring.2C_IRQ_.28.244020.2C_.244021.2C_.244025_bit_3:_write.2C_.244030_bit_0:_read.29"/><span class="mw-headline" id="Mirroring,_IRQ_($4020,_$4021,_$4025_bit_3:_write,_$4030_bit_0:_read)">Mirroring, IRQ ($4020, $4021, $4025 bit 3: write, $4030 bit 0: read)</span></h2>
<p>Identical to their respective equivalents on the <a href="Family_Computer_Disk_System.xhtml" class="mw-redirect" title="Famicom Disk System">Famicom Disk System</a>.
</p>
<h1><span class="mw-headline" id="Note">Note</span></h1>
<p>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Kaiser cartridge did not.
</p>
