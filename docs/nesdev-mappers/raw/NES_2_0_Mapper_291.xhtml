<div class="mw-parser-output"><p>NES 2.0 Mapper 291 is used for at least two Kasheng 2-in-1 multicarts both involving the game <i>Mortal Kombat 6</i>, a title screen hack of <i>餓狼伝説 Special</i> (Garou Densetsu Special) and another game. Nestopia Plus! for some inexplicable reason reuses <a href="INES_Mapper_047.xhtml" title="INES Mapper 047">INES Mapper 047</a> for them. It's an MMC3 clone with an outer bank register.
</p>
<h2><span id="Outer_Bank_Register_.28.246000.29.2C_write"/><span class="mw-headline" id="Outer_Bank_Register_($6000),_write">Outer Bank Register ($6000), write</span></h2>
<pre>Mask: Probably $E000

7654 3210
---------
?OM. .PP.
|||   ++-- Select 32 KiB Inner PRG-ROM bank if Bit 5=1
||+------- Select PRG-ROM banking mode
||          0: Use MMC3 inner PRG-ROM bank (128 KiB)
||          1: Select 32 KiB inner PRG-ROM bank using $6000 Bits 1 and 2
|+-------- Select 128 KiB outer PRG and 256 KiB outer CHR-ROM bank
|           0: First
|           1: Second
+--------- Unknown function
</pre>
<p>The Outer Bank Register responds even when the MMC3 clone's WRAM bit is clear.
</p>
<h2><span class="mw-headline" id="Errata">Errata</span></h2>
<p>The <i>2-in-1 (Mortal Kombat 6, Samurai Spirits)</i> ROM image in GoodNES 3.23b has the outer 128 KiB and 256 KiB CHR-ROM banks swapped. To run that image unmodified using the above description, the value written to $6000 would have to be XORed with 0x40.
</p>
