<div class="mw-parser-output"><p><b>NES 2.0 Mapper 432</b> denotes the MMC3-based Realtec <b>8090</b> multicart circuit board.
</p>
<ul><li><i>3-in-1 High Standerd [sic] (DP-33)</i></li>
<li><i>160000000-in-1</i> (unknown cartridge code)</li></ul>
<h2><span id="Solder_Pad_Enable_Register_.28.246000-.247FFE.2C_even.29"/><span class="mw-headline" id="Solder_Pad_Enable_Register_($6000-$7FFE,_even)">Solder Pad Enable Register ($6000-$7FFE, even)</span></h2>
<pre>Mask: $E001

D~7654 3210
  ---------
  .... ...S
          +- 1=Replace PRG-ROM with solder pad value
               in the CPU $8000-$FFFF address range
</pre>
<h2><span id="Outer_Bank_Register_.28.246001-.247FFF.2C_odd.29"/><span class="mw-headline" id="Outer_Bank_Register_($6001-$7FFF,_odd)">Outer Bank Register ($6001-$7FFF, odd)</span></h2>
<pre>Mask: $E001

D~7654 3210
  ---------
  ?NQP CmMb
   ||| |||+- PRG/CHR A17 if M=1
   ||| ||+-- PRG A17 mode
   ||| ||     0: from MMC3 (256 KiB inner bank)
   ||| ||     1: from b (128 KiB inner bank)
   ||| |+--- CHR A17 mode
   ||| |      0: from MMC3 (256 KiB inner bank)
   ||| |      1: from b (128 KiB inner bank)
   ||| +---- CHR A18
   ||+------ PRG A18
   |+------- PRG+CHR A19
   +-------- NROM-128 mode (1=enabled)
</pre>
<p>As it uses the MMC3 clones's WRAM interface, writing to the outer bank register requires enabling and not write-protecting WRAM in the MMC's $A001 register.
NROM-128 mode forces the MMC3 clone's CPU A14 input low, causing MMC3 register 6 to select both the bank at $8000 and $C000, and register 7 to select both the bank at $A000 and $E000.
</p>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<p>Mask: $E001
</p><p>See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
