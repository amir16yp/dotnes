<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 078</a> was used for two games: <i>Holy Diver</i> and <i>Uchuusen - Cosmo Carrier</i>.
</p>

<h2><span class="mw-headline" id="Overview">Overview</span></h2>
<ul><li>PRG ROM size: 128 KiB</li>
<li>PRG ROM bank size: 16 KiB</li>
<li>PRG RAM: No</li>
<li>CHR capacity: 128KiB ROM</li>
<li>CHR bank size: 8 KiB</li>
<li>Nametable mirroring: Mapper controlled</li>
<li>Subject to <a href="Bus_conflict.xhtml" title="Bus conflict">bus conflicts</a>: Yes</li></ul>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$BFFF: 16KiB switchable PRG ROM bank</li>
<li>CPU $C000-$FFFF: Fixed to last 16KiB of PRG ROM</li>
<li>PPU $0000-$1FFF: 8KiB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_Select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Bank_Select_($8000-$FFFF)">Bank Select ($8000-$FFFF)</span></h3>
<pre>7  bit  0
---- ----
CCCC MPPP
|||| ||||
|||| |+++-- Select 16 KiB PRG ROM bank for CPU $8000-$BFFF
|||| +----- Mirroring.  Holy Diver: 0 = H, 1 = V.  Cosmo Carrier: 0 = 1scA, 1 = 1scB.
++++------- Select 8KiB CHR ROM bank for PPU $0000-$1FFF
</pre>
<p>The two mirroring modes are not compatible, and trying to run either game with the other's hardware will produce major graphical glitching or lockups.
</p><p>iNES1 ROM image headers often set the &quot;alternative nametables&quot; flag for Holy Diver and cleared it for Cosmo Carrier. NES2.0 uses submappers.
</p>
<h2><span class="mw-headline" id="Hardware">Hardware</span></h2>
<p>In both cases, the hardware implementation is simply a <a href="CNROM.xhtml" title="CNROM">CNROM</a> and a <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> put together.  Two <a href="74161.xhtml" title="74161">74HC161</a> are used to form an 8 bit latch, with 4 bits connecting the CHR ROM's high address lines, and 3 bits connecting to a <a href="7432.xhtml" title="7432">74HC32</a>, which provides the logic to fix the top bank of PRG ROM while swapping the first 16KiB.  The last latched bit is connected directly to CIRAM A10 on Cosmo Carrier, as in <a href="AxROM.xhtml" title="AxROM">AxROM</a>.  On Holy Diver, that bit is connected to a <a href="7400.xhtml" title="7400">74HC00</a>, which serves as a 2:1 mux of PPU A10 and PPU A11 into CIRAM A10 to provide the desired mirroring.  Holy Diver also contains a 74HC245 to compensate for a slow CHR ROM chip.
</p><p>For homebrew, both Nestopia-1.4.0 and FCEUX-2.1.5 default to the 1scA/1scB mirroring provided by Uchuusen.
Emulators SHOULD support <a href="NES_2_0_submappers.xhtml" title="NES 2.0 submappers">NES 2.0 submappers</a>: 1 for Uchuusen and 3 for Holy Diver.
</p>
