<div class="mw-parser-output"><p><b>NES 2.0 Mapper 461</b> denotes the <b>CM-9309</b> PCB, used for the <i>6-in-1 Wuzi Gun</i> <a href="MMC1.xhtml" title="MMC1">MMC1</a>-based multicart, consisting of the two MMC1 games <i>Operation Wolf</i> and <i>Mechanized Attack</i> plus four NROM-128 games. There is one 256 KiB CHR ROM chip and one 32 KiB CHR ROM chip, with the 256 KiB one being stored first in the .NES file.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>A~[011. .... .... pMPP]
                  ||++-- PRG A15..A14 in NROM-128 mode
                  |+---- PRG Mode and CHR ROM chip select
                  ||      0: NROM-128 mode PRG, second (32 KiB) CHR chip
                  ||      1: MMC1 mode PRG mode, first (256 KiB) CHR chip
                  ++---- PRG A17..A16
                  +----- CHR A17
                  +----- 0: 128 KiB inner PRG bank in MMC1 mode (for Operation Wolf)
                         1: 64 KiB inner PRG bank in MMC1 mode (for Mechanized Attack)
</pre>
<p>This register connects to the MMC1's WRAM interface. The MMC1 clone mimics an MMC1A, so the WRAM interface cannot be disabled. The MMC1's registers select mirroring as well as 128 KiB PRG and 128 KiB CHR banks
</p>
