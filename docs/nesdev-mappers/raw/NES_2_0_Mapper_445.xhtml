<h2><span id="Outer_PRG_Bank_.28.245000.2C_write.29"/><span class="mw-headline" id="Outer_PRG_Bank_($5000,_write)">Outer PRG Bank ($5000, write)</span></h2>
<pre>D~[.PPP ....]  Address mask: $F003
    +++------- PRG A19..A17
</pre>
<h2><span id="Outer_CHR_Bank_.28.245001.2C_write.29"/><span class="mw-headline" id="Outer_CHR_Bank_($5001,_write)">Outer CHR Bank ($5001, write)</span></h2>
<pre>D~[.CCC ....]  Address mask: $F003
    +++------- CHR A19..A17
</pre>
<h2><span id="Mode_.28.245002.2C_write.29"/><span class="mw-headline" id="Mode_($5002,_write)">Mode ($5002, write)</span></h2>
<pre>D~[...? c.?p]  Address Mask: $F003
        |  +- PRG A17 Mode
        |      0: from MMC3
        |      1: from Outer PRG Bank
        +---- CHR A17 Mode
               0: from MMC3
</pre>
<h2><span id="Lock_.28.245003.2C_write.29"/><span class="mw-headline" id="Lock_($5003,_write)">Lock ($5003, write)</span></h2>
<pre>D~[..L. ....]  Address Mask: $F003
     +------- 1: Lock registers $5000-$5003
</pre>
