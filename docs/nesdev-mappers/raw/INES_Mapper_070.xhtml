<div class="mw-parser-output"><pre> ========================
 =  Mapper 070          =
 ========================
 
 
 Example Games:
 --------------------------
 Family Trainer - Manhattan Police
 <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/4091/family-trainer-5-meiro-daisakusen">Family Trainer - Meiro Daisakusen</a>
 <a rel="nofollow" class="external text" href="https://nescartdb.com/profile/view/1742/kamen-rider-club-gekitotsu-shocker-land">Kamen Rider Club</a>
 Space Shadow
 
 
 Notes:
 ---------------------------
 Many of these games use the <a href="Power_Pad.xhtml#Family_Trainer_Mat" title="Power Pad">Family Trainer Mat</a> as an input device.
 
 
 Registers: **BUS CONFLICTS**
 --------------------------
   $8000-FFFF:  [PPPP CCCC]
     P = Selects 16k PRG @ $8000
     C = Selects 8k CHR @ $0000
 
 
 PRG Setup:
 --------------------------
 
       $8000   $A000   $C000   $E000  
     +---------------+---------------+
     |     $8000     |     { -1}     |
     +---------------+---------------+
</pre>
<p>The version of this board with 1-screen mapper-controlled mirroring is <a href="INES_Mapper_152.xhtml" title="INES Mapper 152">mapper 152</a>, and the version without a fixed bank at $C000-$FFFF is oversize <a href="GxROM.xhtml" title="GxROM">GxROM</a>. Before Mapper 152 was defined, the version with 1-screen mirroring had been denoted by setting the &quot;alternative nametables&quot; bit in the iNES header (according to the FWNES98E.TXT file of the fwNES emulator version 0.302b).
</p>
