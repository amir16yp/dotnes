<div class="mw-parser-output"><p><b>iNES Mapper 163</b> denotes the 南晶 (Nánjīng) <b>FC-001</b> circuit board, used on most of their games, including:
</p>
<ul><li><i>牧场物语 - Harvest Moon</i> (NJ011)</li>
<li><i>水浒神兽</i> (Shuǐhǔ Shénshòu, NJ019)</li>
<li><i>暗黑破坏神 - Diablo</i> (NJ037)</li>
<li><i>轩辕剑外传 之 天之痕</i> (Xuānyuánjiàn Wàizhuàn zhī Tiānzhīhén, NJ045)</li>
<li><i>Final Fantasy IV - 最终幻想 4꞉ 光与暗 水晶纷争</i> (NJ098)</li></ul>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM, battery-backed</li>
<li>CPU $8000-$FFFF: 32 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM bank, 4 KiB can be automatically switched</li>
<li>Nametable mirroring: hard-wired</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<p>All registers are initialized to $00 on reset.
</p>
<h2><span id="PRG_Bank_Low.2FCHR-RAM_Switch_.28.245000.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Low/CHR-RAM_Switch_($5000,_write)">PRG Bank Low/CHR-RAM Switch ($5000, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  C... PPPP
  |    ++++- PRG A18..A15
  +--------- Automatic 4 KiB CHR-RAM switch: when PPU A13=0 (pattern table) ...
              0: CHR A12=PPU A12 (disable auto-switch)
              1: CHR A12=PPU A9 latched on last rise of PPU A13 (enable auto-switch)
</pre>
<ul><li>Automatic 4 KiB CHR-RAM switch means that the left pattern table is used for the the top half of any nametable, and the right pattern table for the bottom half of any nametable, regardless of the scroll position. This auto-switch behavior is similar to that of <a href="INES_Mapper_096.xhtml" title="INES Mapper 096">mapper 96</a>.</li>
<li>Bits 0 and 1 are subject to the <a href="#Mode_(%245300,_write)">Mode register</a>.</li></ul>
<h2><span id="PRG_Bank_High_.28.245200.2C_write.29"/><span class="mw-headline" id="PRG_Bank_High_($5200,_write)">PRG Bank High ($5200, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... ..PP
         ++- PRG A20..A19
</pre>
<ul><li>Bits 0 and 1 are subject to the <a href="#Mode_(%245300,_write)">Mode register</a>. 1 MiB games connect both ASIC PRG A19 and A20 outputs to ROM A19, effectively exempting this register from the bit-swap.</li></ul>
<h2><span id="Feedback_Write_.28.245100-.245101.2C_write.29"/><span class="mw-headline" id="Feedback_Write_($5100-$5101,_write)">Feedback Write ($5100-$5101, write)</span></h2>
<pre>Mask: $FF01

D~7654 3210  A~FEDC BA98 7654 3210
  ---------    -------------------
  .... .F.E    .... .... .... ...A
        | |                      +- Action on write
        | +- A=0: Value latched
        |    A=1: Value latched, and flip the latched F bit on falling edges of E (i.e. 1-&gt;0).
        +--- A=0: Value latched
             A=1: Ignored, previously-latched value either kept or flipped
</pre>
<ul><li>Bit 0 is subject to the <a href="#Mode_(%245300,_write)">Mode register</a>.</li></ul>
<h2><span id="Feedback_Read_.28.245500-.245501.2C_read.29"/><span class="mw-headline" id="Feedback_Read_($5500-$5501,_read)">Feedback Read ($5500-$5501, read)</span></h2>
<pre>Mask: $F300

D~7654 3210
  ---------
  .... .F..
        +--- Inverted value of latched F bit
</pre>
<ul><li><i>暗黑破坏神 - Diablo</i> (Ànhēi Pòhuàishén, NJ037) only checks that F is read back inverted.</li>
<li><i>轩辕剑外传 之 天之痕</i>  (Xuānyuánjiàn Wàizhuàn zhī Tiān zhī Hén, NJ045) checks that F is flipped on falling edges of E.</li></ul>
<h2><span id="Mode_.28.245300.2C_write.29"/><span class="mw-headline" id="Mode_($5300,_write)">Mode ($5300, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .A?B
        | +- 0: Do not swap D0,D1 on writes to $5000-$5200.
        |    1: Swap D0,D1 on writes to $5000-$5200.
        +--- 0: PRG A15/A16=11b
             1: PRG A15/A16 from $5000
</pre>
<ul><li>This register is not subject to bit-swapping, i.e. the register is not affected by its own bit 0.</li>
<li>Because reset clears the A bit, games will boot in 32 KiB PRG-ROM bank #3.</li></ul>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mapper 163 cartridges should be dumped with $5300=$04 to obtain the correct PRG bank order. To verify that the cartridge is really mapper 163 ...
<ul><li>... rule out <a href="INES_Mapper_162.xhtml" title="INES Mapper 162">INES Mapper 162</a> by writing $04 to $5300 and verifying that $5100.1 does not change the PRG bank;</li>
<li>... rule out <a href="NES_2_0_Mapper_558.xhtml" title="NES 2.0 Mapper 558">NES 2.0 Mapper 558</a> by verifying that $5000 value $01 does not result in a different PRG bank between $5300 values $04 and $05 (because the B bit is bit 1 in mapper 558).</li></ul></li>
<li><i>暗黑破坏神 - Diablo</i> (NJ037) and its title screen hack <i>毁灭之神</i> (NJ078) mistakenly disable automatic 4 KiB CHR-RAM switching mid-screen during the ending cutscene, causing flickering on real hardware. <i>魔兽世界: 恶魔猎人</i> (NJ097) puts the 8x16 sprites into the wrong pattern table for automatic 4 KiB CHR-RAM switching, causing a glitched cursor on the title screen on real hardware.</li></ul>
