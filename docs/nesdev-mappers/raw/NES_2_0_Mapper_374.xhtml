<div class="mw-parser-output"><p><b>NES 2.0 Mapper 374</b> denotes reset-based multicarts around the <a href="MMC1.xhtml" title="MMC1">MMC1</a> ASIC. When an interruption of the M2 signal is detected, the higher address lines are automatically incremented. So far, only 128 KiB PRG+128 KiB CHR size variants have been found:
</p>
<ul><li><i>1995 Super HiK 4-in-1 - 新系列機器戰警组合卡 (JY-022)</i></li>
<li><i>1996 Super HiK 4-in-1 - 新系列超級飛狼組合卡 (JY-051)</i></li></ul>
