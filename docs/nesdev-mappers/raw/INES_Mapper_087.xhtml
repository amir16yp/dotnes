<p><br/>
<b>J87</b> (Also known as Mapper 87) refers to the first &quot;mapper&quot; created for the Famicom. Despite this, no games with this mapper ever made it overseas to USA NES owners. <a href="INES_Mapper_101.xhtml" title="INES Mapper 101">iNES Mapper 101</a> is the same board, but for a dump that naïvely reversed the CHR bit-order. <a href="CNROM.xhtml" title="CNROM">CNROM</a> is a later cost-reduced version of this mapper, by cutting down on one logic chip, at the cost of having bus conflicts, and also has the CHR bank order reversed as well. Most games are capped at 16k CHR, however, the JF-09 and JF-10 boards contain an additional trace that allows the design to address 32k. All games with this mapper are emulated as the 32k variant.
</p><p>The name &quot;J87&quot; was given to this mapper due to its historical significance, and creation by Jaleco. Otherwise, no &quot;canonical&quot; name was given to this mapper. Jaleco would later upgrade this mapper to become <a href="INES_Mapper_140.xhtml" title="INES Mapper 140">iNES Mapper 140</a>.
</p>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$FFFF: 16 KB PRG ROM, fixed (if 16 KB PRG ROM used, then this is the same as $C000-$FFFF)</li>
<li>CPU $C000-$FFFF: 16 KB PRG ROM, fixed</li>
<li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="Bank_Select_.28.246000-.247FFF.29"/><span class="mw-headline" id="Bank_Select_($6000-$7FFF)">Bank Select ($6000-$7FFF)</span></h3>
<p>This will select an 8 KB CHR ROM bank for PPU $0000-$1FFF.
</p>
<pre>7  bit  0
---- ----
xxxx xxLH
       ||
       |+- High CHR bit
       +-- Low CHR bit
</pre>
