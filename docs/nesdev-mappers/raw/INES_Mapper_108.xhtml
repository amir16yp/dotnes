<div class="mw-parser-output"><p><b>NES 2.0 Mapper 108</b> denotes at least four different PCBs used for FDS-to-cartridge conversions. All have nametable mirroring hard-wired.
</p>

<h1><span class="mw-headline" id="Submapper_1:_DH-08">Submapper 1: DH-08</span></h1>
<p>Used by Whirlwind Manu's first release of Taito's <i>Bubble Bobble</i> (LH31), and is a modified version of Kaiser's cartridge conversion, originally for <a href="INES_Mapper_142.xhtml" title="INES Mapper 142">INES Mapper 142</a>.
</p><p>Banks:
</p>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB bank</li>
<li>CPU $8000-$FFFF: Fixed to last 32 KiB of PRG-ROM</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB CHR-RAM</li></ul>
<p>Registers:
</p>
<ul><li>CPU $F000-$FFFF: Select 8 KiB PRG-ROM bank at CPU $6000-$7FFF. The game retains writes outside this address range, which must be ignored for the game not to crash.</li></ul>
<h1><span class="mw-headline" id="Submapper_2">Submapper 2</span></h1>
<p>Used by Whirlwind Manu's later release of Taito's <i>Bubble Bobble</i> (LH31) that replaces CHR-RAM with CHR-ROM. UNIF board name is <b>UNL-BB</b>.
</p><p>Banks:
</p>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB bank</li>
<li>CPU $8000-$FFFF: Fixed to last 32 KiB of PRG-ROM</li>
<li>PPU $0000-$1FFF: Switchable 8 KiB CHR-ROM bank</li></ul>
<p>Registers:
</p>
<ul><li>CPU $E000-$FFFF: Select 8 KiB PRG-ROM bank at CPU $6000-$7FFF *and* 8 KiB CHR-ROM bank at PPU $0000-$1FFF. The game retains writes outside this address range, which must be ignored for the game not to crash.</li></ul>
<h1><span class="mw-headline" id="Submapper_3">Submapper 3</span></h1>
<p>Submapper 1 but with the PRG-ROM switch responding in the full CPU $8000-$FFFF address range, which is required for both games to function:
</p>
<ul><li><i>Falsion</i> (LH54)</li>
<li><i>Meikyuu Jiin Dababa</i> (LH28)</li></ul>
<p>Banks:
</p>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB bank</li>
<li>CPU $8000-$FFFF: Fixed to last 32 KiB of PRG-ROM</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB CHR-RAM</li></ul>
<p>Registers:
</p>
<ul><li>CPU $8000-$FFFF: Select 8 KiB PRG-ROM bank at CPU $6000-$7FFF</li></ul>
<h1><span class="mw-headline" id="Submapper_4">Submapper 4</span></h1>
<p>Like Submapper 2, but with the CHR-ROM switch responding in the full CPU $8000-$FFFF address range, and PRG-ROM banks being fixed. UNIF board name is <i>also</i> <b>UNL-BB</b>.
</p>
<ul><li><i> Pro Wrestling</i> (LE05)</li></ul>
<p>Banks:
</p>
<ul><li>CPU $6000-$7FFF: 8 KiB bank, fixed to last 8 KiB</li>
<li>CPU $8000-$FFFF: Fixed to last 32 KiB of PRG-ROM</li>
<li>PPU $0000-$1FFF: Switchable 8 KiB CHR-ROM bank</li></ul>
<p>Registers:
</p>
<ul><li>CPU $8000-$FFFF: Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF</li></ul>
<h1><span class="mw-headline" id="Heuristics">Heuristics</span></h1>
<p>FCEUX and Mesen manage to emulate all four PCBs without disambiguation by heuristically considering the addresses that all games write to:
</p>
<pre>if((addr &amp; 0x9000) == 0x8000 || addr &gt;= 0xF000){
	//A version of Bubble Bobble expects writes to $F000+ to switch the PRG banks
	_prgReg = _chrReg = value;
} else {
	//For ProWres
	_chrReg = value &amp; 0x01;
}
</pre>
<p>To disambiguate the four different PCBs in advance:
</p>
<ul><li>CHR-RAM -&gt; Submappers 1 or 3
<ul><li>Horizontal Mirroring -&gt; Submapper 1, otherwise 3</li></ul></li>
<li>CHR-ROM -&gt; Submappers 2 or 4
<ul><li>More than 16 KiB of CHR-ROM -&gt; Submapper 2, otherwise 4</li></ul></li></ul>
