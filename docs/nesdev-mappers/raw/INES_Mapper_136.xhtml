<div class="mw-parser-output"><p>INES Mapper 136 is used to denote the Sachen 3011 board, used by four early releases from Joy Van/Sachen:
</p>
<ul><li><i>未来小子</i> (Wèilái Xiǎozi, &quot;Joy Van Kid&quot;, original Taiwan release of <i>Metal Fighter µ</i> with Chinese title screen) (TC-008)</li>
<li><i>蝶變</i> (Diébiàn, &quot;Incantation&quot;, original Taiwan release of <i>Galactic Crusader</i> with Chinese title screen, often incorrectly rendered as Japanese &quot;Chou Hen&quot;) (TC-009)</li>
<li><i>四川麻將</i> (Sìchuān Májiàng, &quot;Mahjong Trap&quot;, original Taiwan release of <i>Shisen Mahjong - Seifuku Hen</i>) (TC-010)</li>
<li><i>Mahjong Companion</i> (alternative version, more common version use mappers <a href="NINA_003_006.xhtml" class="mw-redirect" title="INES Mapper 079">79</a> or <a href="Sachen_8259.xhtml" class="mw-redirect" title="INES Mapper 139">139</a> instead.</li></ul>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$FFFF: 32 KiB switchable PRG ROM bank (only used for <i>Mahjong Companion</i>)</li>
<li>PPU $0000-$1FFF: 8 KB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Mapper 136 uses a custom IC (real number &quot;JV001&quot;, fake marking &quot;GS63030-A&quot;) serving as a latch, adder and inverter. There are five registers: Input (6 bits), Output (6 bits), Register (6 bits), Mode (1 bit) and Invert (1 bit).
</p>
<pre>Mask: $E103
Read $4100-$4103: [..RR RRRR]: Read Register. Bits 4-5 are inverted if Invert==1. Bits 6-7 are open bus.
Write $4100: When Mode==0: Bits 0-5 of Register := Input, bits 0-3 being inverted if Invert==1.
             When Mode==1: Bits 0-3 of Register incremented by one, bits 4-5 unaffected.
Write $4101: Invert := Written value bit 0.
Write $4102: Input := Written value bits 0-5.
Write $4103: Mode := Written value bit 0.
Write $8000-$FFFF: Output := Register; written value is ignored.
</pre>
<p>In Mapper 136, bits 0/2 of the 8 KiB CHR ROM bank number (CHR A13..A15) come from Output bits 0-2, and the 32 KiB PRG ROM bank number (PRG A15) comes from Output bit 4:
</p>
<pre>8 KiB CHR ROM bank number := (Output &amp;7);
32 KiB PRG ROM bank number := (Output &gt;&gt;4) &amp;1;
</pre>
<p>Sachen's original <b>3011</b> circuit board only supported CHR ROM switching. The connection to switch 32 KiB PRG ROM was obtained by <a rel="nofollow" class="external text" href="https://datomatic.no-intro.org/attachments%20-%20sources/Nintendo%20-%20Nintendo%20Entertainment%20System/20210330_144245_3138_pcb_back.jpg">soldering an additional wire/resistor</a>.
</p><p>Games will check the lower four or six bits of $4100 for the correct value after several increment and inversion operations as a copy-protection measure.
</p>
<h2><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h2>
<ul><li>Mapper 136 is almost identical to <a href="INES_Mapper_132.xhtml" title="INES Mapper 132">INES Mapper 132</a> with only 32 KiB PRG-ROM except in the value read from $4100 due to Mapper 136 having four (28-pin JV001 ASIC) versus Mapper 132 having three adder bits (24-pin 05-00002-010 ASIC).</li>
<li><a href="INES_Mapper_147.xhtml" title="INES Mapper 147">INES Mapper 147</a> expands CHR-ROM size to 128 KiB and additionally supports 128 KiB PRG-ROM, switched in 32 KiB amounts.</li>
<li><a href="INES_Mapper_172.xhtml" title="INES Mapper 172">INES Mapper 172</a> is similar to Mapper 136, connecting the six CPU bits in reverse order due to the JV001 ASIC being mounted upside down.</li></ul>
