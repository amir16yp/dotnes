<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KB PRG RAM bank (not battery backed!)</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $E000-$FFFF: 8 KB semi-fixed PRG ROM bank (banks 15 or 31)</li>
<li>PPU $0000-$03FF: 1 KB switchable CHR bank</li>
<li>PPU $0400-$07FF: 1 KB switchable CHR bank</li>
<li>PPU $0800-$0BFF: 1 KB switchable CHR bank</li>
<li>PPU $0C00-$0FFF: 1 KB switchable CHR bank</li>
<li>PPU $1000-$13FF: 1 KB switchable CHR bank</li>
<li>PPU $1400-$17FF: 1 KB switchable CHR bank</li>
<li>PPU $1800-$1BFF: 1 KB switchable CHR bank</li>
<li>PPU $1C00-$1FFF: 1 KB switchable CHR bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<h3><span id="IRQ_.28.248000-.24DFFF.29"/><span class="mw-headline" id="IRQ_($8000-$DFFF)">IRQ ($8000-$DFFF)</span></h3>
<p>The IRQ functionality on this board is implemented by the KS202 ASIC on it. That IC was used in isolation in <a href="INES_Mapper_142.xhtml" title="INES Mapper 142">iNES Mapper 142</a>, and this mapper's IRQ will behave identically.
</p>
<h3><span id="Bank_select_.28.24E000-.24EFFF.29"/><span class="mw-headline" id="Bank_select_($E000-$EFFF)">Bank select ($E000-$EFFF)</span></h3>
<p>Select one of three bank registers to update on next write to $F000.
</p>
<pre>7  bit  0
---- ----
.... .RRR
      |||
      +++- Specify which bank register to update on next write to Bank Data register
           1: Select 8 KB PRG bank at CPU $8000-$9FFF
           2: Select 8 KB PRG bank at CPU $A000-$BFFF
           3: Select 8 KB PRG bank at CPU $C000-$DFFF
           4,6: Writes to $F000 have no effect
           0,5,7: unknown
</pre>
<h3><span id="Bank_data_.28.24F000-.24FFFF.29"/><span class="mw-headline" id="Bank_data_($F000-$FFFF)">Bank data ($F000-$FFFF)</span></h3>
<p>Note that this register is logically superimposed on the next thirteen registers.
</p>
<pre>7  bit  0
---- ----
.... DDDD
     ||||
     ++++- New bank value, based on last value written to Bank select register (mentioned above)
</pre>
<h3><span id="PRG_bank_upper_bits_.28.24F000-.24F3FF.29"/><span class="mw-headline" id="PRG_bank_upper_bits_($F000-$F3FF)">PRG bank upper bits ($F000-$F3FF)</span></h3>
<p>Note that these registers are superimposed on the Bank data register.
</p><p>Mask: $FC03
</p>
<pre>$F000: [...P ....] - select PRG ROM A17 during reads from $8000-$9FFF
$F001: [...P ....] - same, for reads from $A000-$BFFF
$F002: [...P ....] - same, for reads from $C000-$DFFF
$F003: [...P ....] - same, for reads from $E000-$FFFF
</pre>
<p>The game relies on these four registers powering up holding 1.
</p><p>The original hardware dummies out the upper three bits, but they could have been connected.
</p><p>The above six registers are intended be used together as
</p>
<pre> LDX #2
 STX $E000
 LDA bankA000
 STA $F001
</pre>
<h3><span id="Mirroring_control_.28.24F800-.24FBFF.29"/><span class="mw-headline" id="Mirroring_control_($F800-$FBFF)">Mirroring control ($F800-$FBFF)</span></h3>
<p>Note that this register is superimposed on the Bank data register.
</p><p>Mask: $FC00
</p>
<pre>$F800: [.... ...M] - 0: H (PPU A11), 1: V (PPU A10)
</pre>
<h3><span id="CHR_banking_control_.28.24FC00-.24FFFF.29"/><span class="mw-headline" id="CHR_banking_control_($FC00-$FFFF)">CHR banking control ($FC00-$FFFF)</span></h3>
<p>Note that these registers are superimposed on the Bank data register.
</p><p>Mask: $FC07
</p>
<pre> $FC00 [.CCCCCCC] - select 1kB CHR for $0000-$03ff
 $FC01 [.CCCCCCC] - select 1kB CHR for $0400-$07ff
 $FC02 [.CCCCCCC] - select 1kB CHR for $0800-$0bff
 $FC03 [.CCCCCCC] - select 1kB CHR for $0c00-$0fff
 $FC04 [.CCCCCCC] - select 1kB CHR for $1000-$13ff
 $FC05 [.CCCCCCC] - select 1kB CHR for $1400-$17ff
 $FC06 [.CCCCCCC] - select 1kB CHR for $1800-$1bff
 $FC07 [.CCCCCCC] - select 1kB CHR for $1c00-$1fff
</pre>
<p>The original hardware dummies out the top bit, but it could have been connected.
</p>
