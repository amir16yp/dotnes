<div class="mw-parser-output"><p>NES 2.0 Mapper is used for the <i>FC Pocket RS-20</i> and <i>dreamGEAR My Arcade Gamer V</i> handheld consoles. They use VT3x hardware, which is mostly compatible hardware to the earlier <a href="VTxx.xhtml" title="VTxx">VT0x and VT1x</a> consoles, but add an outer bank register and extended support for legacy mappers. While the original OneBus hardware only has MMC3-compatible registers, this type can directly emulate CNROM, UNROM and MMC1 behavior as well.
</p>

<h1><span class="mw-headline" id="Banking_registers">Banking registers</span></h1>
<h2><span id="Mapper_Configuration_Register_.28.24411D.2C_write.29"/><span class="mw-headline" id="Mapper_Configuration_Register_($411D,_write)">Mapper Configuration Register ($411D, write)</span></h2>
<pre>7654 3210
---------
.... .CMM
      |++- Select legacy mapper to emulate in the $8000-$FFFF range
      |     0: MMC3
      |     1: MMC1
      |     2: UNROM
      |     3: CNROM
      +--- Select CHR memory type
            0: CHR-ROM (banked)
            1: CHR-RAM (unbanked)
</pre>
<h2><span id="Encryption_Control_.28.24411E.2C_write.29"/><span class="mw-headline" id="Encryption_Control_($411E,_write)">Encryption Control ($411E, write)</span></h2>
<pre>7654 3210
---------
cc.. .C.C
||    +-+- 00: Disable CPU opcode encryption after the next JMP instruction
||         11: Enable CPU opcode encryption after the next JMP instruction
++-------- 00: Disable CHR data encryption
           11: Enable CHR data encryption
</pre>
<ul><li>When CPU encryption is active, CPU opcode bytes only are XORed with $A1.</li>
<li>When CHR data encryption is active, CHR data bytes' bits 0 and 4, 1 and 2, 3 and 7, and 5 and 6 are swapped.</li></ul>
<h2><span id="Outer_Bank_Register_.28.24412C.29"/><span class="mw-headline" id="Outer_Bank_Register_($412C)">Outer Bank Register ($412C)</span></h2>
<pre>7654 3210
---------
.... cpCP
     |||+- PRG A25 (32 MiB)
     ||+-- CHR A25 (32 MiB)
     |+--- PRG A26 (64 MiB)
     +---- CHR A26 (64 MiB)
</pre>
<h2><span id="Outer_Bank_Register_2_.28.24412E.29"/><span class="mw-headline" id="Outer_Bank_Register_2_($412E)">Outer Bank Register 2 ($412E)</span></h2>
<pre>7654 3210
---------
.... ...B
        +- PRG/CHR A27 (128 MiB)
</pre>
<h1><span class="mw-headline" id="Two-channel_PCM_expansion_sound">Two-channel PCM expansion sound</span></h1>
<p>Expansion sound involves two simultaneous linear 8 bit unsigned PCM channels which just keep playing from their current address until byte $FF is encountered. Note that the address (excluding bits 0-5) is programmed directly and not relative to other bankswitching registers except the 32 MiB outer bank. The playback rate is set using the normal <a href="APU_DMC.xhtml" title="APU DMC">$4010 register</a> bits 0-3.
</p>
<h2><span id="Select_channel_0_and_set_volume_.28.244031.2C_write.29.2C_Select_channel_1_and_set_volume_.28.244032.2C_write.29"/><span class="mw-headline" id="Select_channel_0_and_set_volume_($4031,_write),_Select_channel_1_and_set_volume_($4032,_write)">Select channel 0 and set volume ($4031, write), Select channel 1 and set volume ($4032, write)</span></h2>
<p>Selects the channel to which the next writes to $4012, $4035 and $4036 will apply, and sets its linear volume (0-255).
</p>
<h2><span id="Expansion_sound_and_channel_enable_.28.244033.2C_write.29"/><span class="mw-headline" id="Expansion_sound_and_channel_enable_($4033,_write)">Expansion sound and channel enable ($4033, write)</span></h2>
<pre>7654 3210
---------
E..0 1...
|  | +---- 1=Enable channel 1
|  +------ 1=Enable channel 0
+--------- 1=Enable expansion sound
</pre>
<p>Note that the order of the channel bits is reversed from $4014 (see below).
</p>
<h2><span id="Select_playback_address_bits_6-13_.28.244012.29.2C_bits_14-20_.28.244035.29.2C_bits_21-28_.28.244036.29"/><span class="mw-headline" id="Select_playback_address_bits_6-13_($4012),_bits_14-20_($4035),_bits_21-28_($4036)">Select playback address bits 6-13 ($4012), bits 14-20 ($4035), bits 21-28 ($4036)</span></h2>
<p>These registers can only be accessed if expansion sound is enabled (via $4033 bit 7, otherwise it $4012 will go to the regular DPCM channel register), and if the selected channel has been <i>disabled</i> via the respective bit in $4033, otherwise the write will be ignored.
</p>
<h2><span id="Channel_status_.28.244014.2C_read.29"/><span class="mw-headline" id="Channel_status_($4014,_read)">Channel status ($4014, read)</span></h2>
<pre>7654 3210
---------
.... ..10
       |+- 1=Channel 0 still playing
       +-- 1=Channel 1 still playing
</pre>
<p>These bits can be used to detect when a sample has finished playing (having encountered byte $FF) in order to restart it. Once a sample has finished playing, these bits return zero, and the channels are no longer enabled. Note that the <i>FC Pocket RS-20</i> menu apparently confuses the two channel bits and continuously writes to restart the background music, which however does not actually occur because the hardware blocks accesss to the playback address registers while the sample is still playing.
</p>
<h1><span class="mw-headline" id="Palette">Palette</span></h1>
<p>While the original <a href="VT03__Enhanced_Palette.xhtml" title="VT03+ Enhanced Palette">VT03+ Enhanced Palette</a> uses four bits each for hue, saturation and luminance, the VT3x 12-bit palette simply directly encodes 4-bit RGB values:
</p>
<pre>BA98 7654 3210
--------------
BBBB GGGG RRRR
|||| |||| ++++- Red level (0-15)
|||| ++++------ Green level (0-15)
++++----------- Blue level (0-15)
</pre>
<p>The <i>dreamGEAR My Arcade Gamer V</i> multicart contains a few games that were previously published on VT03 multicarts. When converting these games to VT3x, the developers apparently forgot to change a few colors to the new format, resulting in some elements using strange color combinations even on real hardware (e.g. the waterfall in Curly Monkey).
</p>
