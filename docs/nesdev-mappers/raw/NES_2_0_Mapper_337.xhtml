<div class="mw-parser-output"><p>NES 2.0 mapper 337 is used for a <i>12-in-1 Game Card</i> multicart. Its UNIF board name is <b>BMC-CTC-12IN1</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB fixed PRG-ROM bank #1</li>
<li>CPU $8000-$BFFF: 16 KiB switchable PRG-ROM bank</li>
<li>CPU $C000-$FFFF: 16 KiB switchable PRG-ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB of unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Outer_Bank_Register_.28.248000-.24BFFF.29"/><span class="mw-headline" id="Outer_Bank_Register_($8000-$BFFF)">Outer Bank Register ($8000-$BFFF)</span></h2>
<pre>Mask: $C000

D~7654 3210
  ---------
  PPMB B...
  |||+-+---- Select 128 KiB outer PRG-ROM bank
  ||+------- Select nametable mirroring type
  ||          0: Vertical
  ||          1: Horizontal
  ++-------- Select PRG-ROM banking mode
              0: NROM-128
              1: NROM-256 (inner bank bit 0 replaced with CPU A14)
              2: UNROM (inner bank fixed to #7 at CPU $C000-$FFFF)
              3: same as 2
</pre>
<p>CHR-RAM is write-protected in the NROM modes.
</p>
<h2><span id="Inner_Bank_Register_.28.24C000-.24FFFF.29"/><span class="mw-headline" id="Inner_Bank_Register_($C000-$FFFF)">Inner Bank Register ($C000-$FFFF)</span></h2>
<pre>Mask: $C000

D~7654 3210    A~FEDC BA98 7654 3210
  ---------      -------------------
  .... .BBB      11W. .... .... ....
        |||        +----------------- 1=Write-protect CHR-RAM
        +++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF/$C000-$FFFF
</pre>
