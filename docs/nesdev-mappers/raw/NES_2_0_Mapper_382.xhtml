<div class="mw-parser-output"><p><b>NES 2.0 Mapper 382</b> denotes the <b>830928C</b> circuit board, used on a 512 KiB <i>5-in-1</i> and a 1 MiB <i>9-in-1</i> multicart containing the <a href="BNROM.xhtml" title="BNROM">BNROM</a> game <i>Journey to the West</i> and Capcom/Konami <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> games.
</p><p>The written address sets the mode and outer bank number, the data latch the inner bank number. The data latch is subject to bus conflicts, making it difficult to write a desired inner bank value as long as the outer bank is not locked.
</p>
<h2><span id="Outer_Bank_register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_($8000-$FFFF,_write)">Outer Bank register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1... .... ..LM UPPP
              || |+++- PRG A19..A17 (outer 128 KiB PRG-ROM bank)
              || +---- 0: UNROM mode
              ||       1: BNROM mode
              |+------ 0: Vertical mirroring
              |        1: Horizontal mirroring
              +------- 1: Lock outer bank
Power-on value: $00
</pre>
<h2><span id="Inner_Bank_register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Inner_Bank_register_($8000-$FFFF,_write)">Inner Bank register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210 (bus conflicts)
  ---------
  .... .ABB
        |++- In BNROM mode: PRG A16..A15 (inner 32 KiB PRG-ROM bank)
        +++- In UNROM mode: PRG A16..A14 (inner 16 KiB PRG-ROM bank
                                          at CPU $8000-$BFFF)
</pre>
