<div class="mw-parser-output"><p><b>NES 2.0 Mapper 392</b> denotes the <b>00202650</b> PCB, used on an 8-in-1 multicart. It uses an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with both CHR-ROM and CHR-RAM and an outer bank register that is implemented using a GAL16v8.
</p><p>The circuit board mounts two PRG-ROM chips each holding 512 KiB of game data (U2/U3), a third PRG-ROM chip with 32 KiB of menu data (U1), as well as two 512 KiB CHR-ROM chips holding game graphics (U10/U4) and 8 KiB of CHR-RAM (U6). The NES 2.0 file holds these chips' data in the order U2-U3-U1-U10-U4.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF,_write)">Outer Bank Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  ...M .BBB
     |  +++- PRG/CHR A19..A17 in game mode
     +------ 0: Menu Mode
             1: Game Mode, lock register
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>In menu mode, the 32 KiB PRG-ROM chip is mapped into CPU address space, and 8 KiB of unbanked CHR-RAM is mapped into PPU address space.</li>
<li>In game mode, the 1 MiB PRG-ROM and 1 MiB CHR-ROM chips are mapped and banked by the MMC3 clone within the 128 KiB PRG/CHR window selected by the outer bank register.</li>
<li>The outer bank register functions independently of the MMC3's WRAM register.</li>
<li>See also: <a rel="nofollow" class="external text" href="https://forums.nesdev.org/viewtopic.php?f=9&amp;t=19390&amp;p=243217">NesDev forum post with krzysiobal's analysis</a></li></ul>
