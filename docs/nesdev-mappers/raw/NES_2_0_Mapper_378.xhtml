<div class="mw-parser-output"><p><b>NES 2.0 Mapper 378</b> denotes a circuit board with unknown ID, used for an 8-in-1 512 KiB multicart containing one <a href="AxROM.xhtml" title="AxROM">AxROM</a> and two <a href="UxROM.xhtml" class="mw-redirect" title="UNROM">UNROM</a> games.
</p>
<h2><span id="Outer_Bank_register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_($8000-$FFFF,_write)">Outer Bank register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210
  -------------------
  1... .... ..MS cbaa
              || |+++- PRG A15-A17
              || |+--- UNROM only: 0=Vertical, 1=Horizontal mirroring
              || +---- UNROM only: PRG A14 when CPU A14=0
              |+------ CIRAM A10 in AxROM mode
              +------- PRG A18, also:
                        0: AxROM mode: PRG A14=CPU A14
                        1: UNROM mode: PRG A14=c if CPU A14=0,
                                       PRG A14..16=7 if CPU A14=1
</pre>
