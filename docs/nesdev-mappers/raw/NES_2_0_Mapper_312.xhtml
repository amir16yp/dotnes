<div class="mw-parser-output"><p>NES 2.0 Mapper 312 is used for Kaiser's bootleg version of <i>Highway Star</i>. Its UNIF board name is <b>UNL-KS7013B</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: Switchable 16 KiB PRG-ROM bank</li>
<li>CPU $C000-$FFFF: Fixed 16 KiB PRG-ROM bank #7</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB of CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Select_.28.246000-.247FFF.29"/><span class="mw-headline" id="PRG-ROM_Select_($6000-$7FFF)">PRG-ROM Select ($6000-$7FFF)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  .... .PPP
        +++- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF
</pre>
<h2><span id="Nametable_Mirroring_Type_Select_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Nametable_Mirroring_Type_Select_($8000-$FFFF)">Nametable Mirroring Type Select ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

D~7654 3210
  ---------
  .... ...M
          +- Select nametable mirroring type
              0: Vertical
              1: Horizontal
</pre>
