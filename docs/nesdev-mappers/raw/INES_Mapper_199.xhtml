<div class="mw-parser-output"><p>iNES Mapper 199 is used for two kinds of Waixing boards:
</p>
<ul><li>A duplicate of <a href="INES_Mapper_176.xhtml" title="INES Mapper 176">INES Mapper 176</a>. Such games can be detected by them writing $02 to $5FF3 to enable Mapper 176's Extended MMC3 Mode.</li>
<li>The Waixing <b>FS309</b> circuit board, a <a href="TxROM.xhtml" class="mw-redirect" title="TNROM">TNROM</a>-compatible board with 32 KiB of battery-backed PRG RAM, of which 12 KiB are mapped into CPU address space from $5000-$7FFF. Used by the following games:
<ul><li>成吉思汗 (Chéngjísīhán), Waixing's Chinese translation of Koei's <i>Genghis Khan</i></li>
<li>風色幻想 (Fēngsè Huànxiǎng) / 湯姆歷險記中文版 (Tāngmǔ Lìxiǎn jì Zhōngwén bǎn) / 汤姆寻宝记 (Tāngmǔ Xúnbǎo jì); Waixing's Chinese translation of <i>Square no Tom Sawyer</i></li>
<li>吞食天地: 三国外传 (Tūnshí Tiāndì - Sānguó Wàizhuàn): Waixing's re-release of Capcom's 天地を喰らう II: 諸葛孔明伝 (Destiny of an Emperor II). Unlike the <a href="INES_Mapper_198.xhtml" title="INES Mapper 198">original 1994 Hong Kong release</a> by an unknown publisher, this release uses one conventional 1 MiB of PRG-ROM.</li></ul></li>
<li>The MMC3 clone used by this board supports more than 512 KiB PRG-ROM, necessary for that last game in the list.</li>
<li>The 8 KiB of CHR RAM are unbanked, and games do not initialize the MMC3's CHR bank registers to a contiguous 8 KiB block!</li></ul>
