<div class="mw-parser-output"><p><b>NES 2.0 Mapper 426</b> denotes VT369-based handheld plug'n play consoles from that connect a 256-byte serial ROM to the VT369's GPIO port at $4150. The serial ROM's data is included as NES 2.0 Misc. ROM at the end of the ROM image file.
</p>
