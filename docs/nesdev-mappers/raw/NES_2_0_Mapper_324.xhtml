<div class="mw-parser-output"><p>NES 2.0 Mapper 324 is used for Farid's homebrew 8-in-1 UNROM multicart board. It consists of an UNROM latch with an additional outer bank register. Mirroring is hard-wired. Its UNIF board name is <b>FARID_UNROM_8-IN-1</b>.
</p>
<h2><span id="Bank_Register_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Bank_Register_($8000-$FFFF,_write)">Bank Register ($8000-$FFFF, write)</span></h2>
<pre>Mask: $8000

D~7654 3210  **BUS CONFLICTS**
  ---------
  Cooo kIII
  |||| ||||
  |||| |+++- Standard UNROM inner bank (select 16K at $8000-$BFFF)
  |||| +---- 1=Lock Outer Bank
  |+++------ Select 128 KiB outer PRG-ROM bank
  +--------- Clock Generator (&quot;oook&quot; bits latched only when this changes from 0 to 1 if k had been 0)
</pre>
<p>The middle four bits ($78, lowercase) are one 74'161; their contents are explicitly zeroed on power-up or reset.
The outer four bits ($87, uppercase) are the other 74'161; their contents are NOT.
</p>
<h2><span id="UNROM_latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="UNROM_latch_($8000-$FFFF)">UNROM latch ($8000-$FFFF)</span></h2>
<p>See <a href="UxROM.xhtml" class="mw-redirect" title="INES Mapper 002">INES Mapper 002</a>.
</p>
