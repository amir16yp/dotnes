</p>

<h2><span id="Set_CHR-ROM_Base_.28.245000.2C_write.29"/><span class="mw-headline" id="Set_CHR-ROM_Base_($5000,_write)">Set CHR-ROM Base ($5000, write)</span></h2>
<pre>Mask: $F003

D~7654 3210
  ---------
  BBBB BBMM
  |||| ||++- ASIC compatibility mode for inner bank selection
  |||| ||     0/1: <a href="MMC3.xhtml" title="MMC3">MMC3</a>
  |||| ||     2: <a href="MMC1.xhtml" title="MMC1">MMC1</a>
  |||| ||     3: <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>
  ++++-++--- Select 8 KiB CHR-ROM base
</pre>
<p>All bits are cleared on reset, so that MMC3 mode is active. VRC4 mode uses bits 2 and 3 ($004s and $008s) as VRC A0/A1 if address bit 11 ($800s) is clear, and as VRC A1/A0 if bit 11 is address set during a write.
</p>
<h2><span id="Set_PRG-ROM_Base_.28.245001.2C_write.29"/><span class="mw-headline" id="Set_PRG-ROM_Base_($5001,_write)">Set PRG-ROM Base ($5001, write)</span></h2>
<pre>Mask: $F003

D~7654 3210
  ---------
  BBBB BB..
  ++++-++--- Select 16 KiB PRG-ROM base
</pre>
<p>All bits are cleared on reset.
</p>
<h2><span id="Set_Banking_Mode_.28.245002.2C_write.29"/><span class="mw-headline" id="Set_Banking_Mode_($5002,_write)">Set Banking Mode ($5002, write)</span></h2>
<pre>Mask: $F003

D~7654 3210
  ---------
  .CCp PP.R
   ||| || +- 0: CHR-ROM mode
   ||| ||    1: CHR-RAM mode
   ||| ++--- Inner PRG-ROM bank size
   |||        00: 256 KiB (p=0), 32 KiB (p=1)
   |||        01: 128 KiB (p=0), 16 KiB (p=1)
   |||        1x: 8 KiB (p=1)
   ||+------ PRG-ROM banking mode
   |||        0: ASIC (selecte by $5000.0-1)
   |||        1: NROM
   +++------ Inner CHR-ROM bank size
              1xx: 8 KiB
              01x: 128 KiB
              001: 32 KiB
              000: 256 KiB
</pre>
<p>All bits are cleared on reset. Unusually, in CHR-RAM mode (R=1), CHR-ROM becomes the second half of an enlarged PRG address space that becomes addressable via register $5001. At least one multicart containing both TLROM and UNROM games makes use of this feature and puts the UNROM game's PRG data into CHR-ROM. This seems to be possible as the mapper ASIC, PRG and CHR-ROM are under a single glob.
</p>
<h2><span id="NROM_Mirroring_.28.244025.2C_write.29"/><span class="mw-headline" id="NROM_Mirroring_($4025,_write)">NROM Mirroring ($4025, write)</span></h2>
<pre>Mask: $FFFF

D~7654 3210
  ---------
  .... M...
       +---- 0: Vertical Mirroring
             1: Horizontal Mirroring
</pre>
<p>In NROM mode ($5002.4=1), mirroring can be changed via this <a href="Family_Computer_Disk_System.xhtml" class="mw-redirect" title="FDS">FDS</a>-inspired register as well, apparently in an attempt to become compatible with FDS conversions.
</p>
