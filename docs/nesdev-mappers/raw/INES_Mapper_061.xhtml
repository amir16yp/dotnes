<div class="mw-parser-output"><p><b>iNES Mapper 61</b>, when using CHR ROM, denotes the NTDEC <b>0324</b> PCB, used for two <i>HQ 高品質合卡 15-in-1</i> multicarts. A compatible PCB with ID <b>GS-2017</b> mounts 8 KiB of unbanked CHR RAM instead, used for the <i>方塊外傳 9合1 - Tetris Family 9-in-1</i> and <i>RCM 20-in-1</i> multicarts.
</p>
<h2><span id="Address_Latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_Latch_($8000-$FFFF,_write)">Address Latch ($8000-$FFFF, write)</span></h2>
<pre>A~[1... CCCC M.pN PPPP]
        |||| | || ++++- PRG A18..A15
        |||| | |+------ 0: PRG A14=CPU A14 (NROM-256)
        |||| | |        1: PRG A14=p (NROM-128)
        |||| | +------- PRG A14 if M=1
        |||| +--------- Mirroring, 0=Vertical, 1=Horizontal
        ++++----------- CHR A16..A13 (when using CHR ROM)
</pre>
