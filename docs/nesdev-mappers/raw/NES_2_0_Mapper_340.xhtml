<div class="mw-parser-output"><p>NES 2.0 mapper 340 is used for a <i>35-in-1</i> multicart. Its UNIF board name is <b>BMC-K-3036</b>.
</p>
<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$BFFF: Switchable 16 KiB inner PRG-ROM bank and switchable 128 KiB outer PRG-ROM bank</li>
<li>CPU $C000-$FFFF: Fixed 16 KiB inner PRG-ROM bank #7/Mirror of $8000-$BFFF and switchable 128 KiB outer PRG-ROM bank</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB CHR-RAM</li></ul>
<h2><span id="Address.2FData_Latch_.28.248000-.24FFFF.29"/><span class="mw-headline" id="Address/Data_Latch_($8000-$FFFF)">Address/Data Latch ($8000-$FFFF)</span></h2>
<pre>Mask: $8000

A~FEDC BA98 7654 3210   D~7654 3210
  -------------------     ---- ----
  .... .... ..MO OIII     .... .III
              || ||||           +++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF in UNROM mode
              || |+++- Select 16 KiB inner PRG-ROM bank at CPU $8000-$BFFF/$C000-$FFFF in NROM-128 mode
              |+-+|-|- Select 128 KiB outer PRG-ROM bank at CPU $8000-$FFFF
              +---|-|- Select $C000-$FFFF behavior
              |   | |   0: UNROM (Inner Bank forced to #7 at CPU $C000-$FFFF)
              |   | |   1: NROM-128 (CPU $C000-$FFFF mirror of $8000-$BFFF)
              +---+-+- Select nametable mirroring type
                        0x25: Horizontal
                        all others: Vertical
</pre>
