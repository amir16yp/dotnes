<div class="mw-parser-output"><p>According to FCEUX's source, <a class="mw-selflink selflink">iNES Mapper 212</a> is yet another simple discrete logic pirate multicart mapper.
</p><p>Nestopia calls it &quot;BMC Super HiK 300-in-1&quot;.
</p>
<pre>Write $8000-$FFFF:
 A~[1o.. .... .... MBBb]
     |             ||||
     |             |+++-- Combined PRG and CHR bank number
     |             +----- Nametable mirroring (0:V/A10, 1:H/A11)
     +------------------- Banking style
</pre>
<p>When Banking style is 0, BBb specifies a 16 KiB PRG bank at both CPU $8000 and $C000.
When it's 1, BB is 32 KiB PRG bank at CPU $8000.
</p><p>Regardless of the value of the &quot;o&quot; bit, BBb is 8 KiB CHR bank at PPU $0000.
</p><p>Equivalently, the latched copy of A2 through A0 goes to PRG A16 through A14 and CHR A15 through A13.
</p><p><br/>
</p>
<pre>Mask: $E010
Read: $6000: [1... ....]
 reads from these addresses return a value with the most significant bit set, while all other addresses and bits are open bus.
</pre>
<p>This is reminiscent of <a href="INES_Mapper_107.xhtml" title="INES Mapper 107">iNES Mapper 107</a>.
</p>
