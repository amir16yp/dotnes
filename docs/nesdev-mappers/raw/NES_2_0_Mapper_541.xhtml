<div class="mw-parser-output"><p>NES 2.0 Mapper 541 denotes the Korean <i>리틀컴 (LittleCom) 160-in-1</i> multicart.
</p>
<h2><span id="Address_latch_.28.24C000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_latch_($C000-$FFFF,_write)">Address latch ($C000-$FFFF, write)</span></h2>
<pre>Mask: $C000

A~FEDC BA98 7654 3210
  -------------------
  11.. .... PPPP PpBM
            |||| |||+- Nametable mirroring
            |||| |||    0: Horizontal
            |||| |||    1: Vertical
            |||| ||+-- Set PRG A14 behavior
            |||| ||     0: PRG A14=CPU A14 (NROM-256)
            |||| ||     1: PRG A14=p (NROM-128)
            ++++-++--- Set 16 KiB PRG-ROM bank (PRG A14..A19)
                       at CPU $8000-$BFFF/$C000-$FFFF,
                       p replaced with CPU A14 if B=0
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>CHR pattern data is stored in 8 KiB of unbanked CHR-RAM.</li>
<li>Some games write to the unmapped CPU address range $8000-$BFFF. These writes have no effect.</li>
<li>The mirroring bit works in the opposite way compared to most mappers.</li></ul>
