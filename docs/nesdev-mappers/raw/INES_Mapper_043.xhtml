<div class="mw-parser-output"><p><b>iNES Mapper 043</b> is used for the <b>TONY-I</b> and <b>YS-612</b> circuit boards, both containing conversions of <i>Super Mario Brothers 2</i> (Japanese) from Famicom Disk System to ROM cartridge. There are two 32 KiB, one 2 KiB and one 8 KiB PRG-ROM chip. iNES-format ROM images first include the data of both 32 KiB ROM chips, then the data of the 2 KiB chip repeated four times, then the data of the 8 KiB ROM chip, for a total of 80 KiB of PRG-ROM.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $5000-$5FFF: 2 KiB PRG-ROM bank, repeated once, from 2 KiB PRG-ROM chip</li>
<li>CPU $6000-$7FFF: 8 KiB PRG-ROM bank, fixed to #2, from 2x32 KiB PRG-ROM chips</li>
<li>CPU $8000-$9FFF: 8 KiB PRG-ROM bank, fixed to #1, from 2x32 KiB PRG-ROM chips</li>
<li>CPU $A000-$BFFF: 8 KiB PRG-ROM bank, fixed to #0, from 2x32 KiB PRG-ROM chips</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-ROM bank, switchable, from 2x32 KiB PRG-ROM chips</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank from 8 KiB PRG-ROM chip</li>
<li>PPU $0000-$1FFF: unbanked 8 KiB CHR-ROM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_Bank_Select_.28.244022.29"/><span class="mw-headline" id="PRG_Bank_Select_($4022)">PRG Bank Select ($4022)</span></h2>
<pre>Mask: $71FF

Bit 7654 3210
    ---------
    .... .CCC
          +++- Select 8 KiB PRG-ROM bank at CPU $C000-$DFFF.
</pre>
<p>The actual bank number is:
</p>
<pre>Value  Bank#
------------
0      4
1      3
2      4
3      4
4      4
5      7
6      5
7      6
</pre>
<h2><span id="IRQ_Control_.28.244122_on_TONY-I.2C_.248122_on_YS-612.29"/><span class="mw-headline" id="IRQ_Control_($4122_on_TONY-I,_$8122_on_YS-612)">IRQ Control ($4122 on TONY-I, $8122 on YS-612)</span></h2>
<pre>Mask: $71FF?

Bit 7654 3210
    ---------
    .... ...I
            +- 0: Acknowledge and disable IRQ, reset counter
               1: Enable IRQ
</pre>
<p>When enabled, the 12-bit IRQ counter increases on every M2 cycle until it overflows, upon which an IRQ is fired.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>FCEUX emulates a multicart extract of <i>Mr. Mary 2</i> under this mapper number. Since that particular SMB2J conversion was never released in single-cartridge form, its description of is part of the <a href="NES_2_0_Mapper_357.xhtml" title="NES 2.0 Mapper 357">multicarts' description</a>.</li>
<li>A modified iNES ROM file of YS-612 has different title screen variants in the four representations of the 2 KiB ROM chip. Nintendulator implements a dialog to switch between two of them.</li></ul>
