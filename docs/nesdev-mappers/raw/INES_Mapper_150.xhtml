<div class="mw-parser-output"><p><b>iNES Mapper 150</b> denotes the Sachen <b>SA-015</b> circuit board and its chip-on-board variant, <b>SA-630</b>. Using an eight-register ASIC with a fake &quot;<a href="Sachen_74LS374N_pinout.xhtml" title="Sachen 74LS374N pinout">74LS374N</a>&quot; marking, it supports up to 128 KiB PRG-ROM, and 64 KiB of CHR-ROM. Its UNIF board name is <b>UNL-Sachen-74LS374N</b>. Used for the following games:
</p>
<ul><li><i>영어, 피라미드</i> (Yeong-eo, Pyramid, K-001)</li>
<li><i>将棋学園 - Chess Academy</i> (Shōgi Gakuen, SA-015)</li>
<li><i>Tasac</i> (SA-020)</li>
<li><i>2-in-1: Cosmo Cop/Cyber Monster</i> (SA-023)</li>
<li><i>2-in-1: Tough Cop/Super Tough Cop</i> (SA-024)</li>
<li><i>臺灣 16 花牌麻将</i> (Táiwān 16 Huāpái Májiàng, SA-025)</li>
<li><i>Poker II</i> (TC-013)</li>
<li><i>Strategist</i> (TC-014)</li>
<li><i>Olympic I.Q.</i> (TC-015)</li>
<li><i>Happy Pairs</i> (TC-016)</li>
<li><i>Auto-Upturn</i> (TC-017)</li>
<li><i>Magic Cube</i> (TC-018)</li>
<li><i>Chinese Checkers</i> (TC-019)</li>
<li><i>Poker III 5-in-1</i> (TC-020)</li></ul>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$FFFF: switchable 32 KiB PRG-ROM bank</li>
<li>PPU $0000-$1FFF: switchable 8 KiB CHR-ROM bank</li>
<li>Nametable mirroring: switchable H/V/Vertically-flipped L/One-screen</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Register_Index_.28.244100.2C_write.29"/><span class="mw-headline" id="Register_Index_($4100,_write)">Register Index ($4100, write)</span></h2>
<pre>Mask: $C101

D~7654 3210
  ---------
  .... .RRR
        +++- Select register number (Rx)
</pre>
<h2><span id="Register_Data_.28.244101.2C_read.2Fwrite.29"/><span class="mw-headline" id="Register_Data_($4101,_read/write)">Register Data ($4101, read/write)</span></h2>
<pre>Mask: $C101

D~7654 3210
  ---------
  .... .RRR
        +++- Register data

D~7654 3210
  ---------
  .... ...C  R4: CHR A15
  .... ..PP  R5: PRG A16..A15
  .... ..BA  R6: CHR A14..A13
  ...  .MM.  R7: Nametable mirroring
              0: S0-S0-S0-S1 (lower right unique, or vertically-flipped L)
              1: Horizontal
              2: Vertical
              3: Single-screen, page 1
</pre>
<p>Registers 0-3 are completely unused. <i>Shōgi Gakuen</i> checks that the registers are actually readable (in addition to checking the solder pad setting), presumably as a protection measure. All three bits in all eight registers are fully implemented and can be read from and written to.
</p>
<h1><span class="mw-headline" id="Solder_Pad">Solder Pad</span></h1>
<p>The circuit board has a solder pad that selects whether ASIC pin 14 is connected to CPU D2 or to Vcc. In the latter setting, the ASIC sees all writes as being OR'd with $04, while on reads, D2 is open bus. The pad setting only makes a difference for the game <i>Shōgi Gakuen</i>, which writes to R2 and reads from R6 to check whether it now holds that written value, as would be the case if the solder pad were in the Vcc position; depending on the setting, a different copyright tag (&quot;Sachen&quot; vs. &quot;Sachen and Hacker International&quot;) is displayed.
</p>
<h1><span class="mw-headline" id="Errata">Errata</span></h1>
<p>The <b>SA-020A</b> PCB, used for <i>美女拳 - Honey Peach</i> (SA-006) and denoted by <a href="INES_Mapper_243.xhtml" title="INES Mapper 243">INES Mapper 243</a>, connects the same ASIC differently to support 128 KiB of CHR-ROM. The game is commonly found with an incorrect CHR-ROM bank order set to mapper 150; if that misordered ROM file is to be emulated, R2 bit 0 must additionally provide CHR A16.
</p>
