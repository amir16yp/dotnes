<div class="mw-parser-output"><p>NES 2.0 Mapper 372 is used for a revision of the Rockman I-VI multicart (PCB ID <b>SFC-12</b>). It is <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">INES Mapper 045</a> but with one bit of outer bank register #2 working as a CHR-ROM/RAM switch.
</p>
<h2><span id="CHR-AND.2C_CHR-OR.2FPRG-OR_MSB.2C_CHR_source_.28.246000_.232.2C_write.29"/><span class="mw-headline" id="CHR-AND,_CHR-OR/PRG-OR_MSB,_CHR_source_($6000_#2,_write)">CHR-AND, CHR-OR/PRG-OR MSB, CHR source ($6000 #2, write)</span></h2>
<pre>Mask: $F001

D~7654 3210
  ---------
  PPRC cccc
  |||| ++++- Select number of CHR bits from MMC3
  ||||       ($F: 256 KiB, $E: 128 KiB ... $7-$0: 1 KiB)
  |||+------ Select CHR A18
  ||+------- Select CHR-ROM (0)/CHR-RAM (1, unbanked)
  ++-------- Select CHR A20-A21 and PRG A21-22
</pre>
<p>Note that the CHR-RAM bit works in the opposite direction from <a href="NES_2_0_Mapper_356.xhtml" title="NES 2.0 Mapper 356">NES 2.0 Mapper 356</a>.
</p>
