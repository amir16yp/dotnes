<p><b>iNES Mapper 019</b> is used to denote Famicom boards bearing the <b>Namco 129</b> and <b>Namco 163</b> ASICs. These chips contain 128 bytes of internal RAM that can be used either for <a href="Namco_163_audio.xhtml" title="Namco 163 audio">expansion audio</a> or, together with a battery, for 128 bytes of save RAM. Games may also come with the regular 8 KiB of additional battery-backed WRAM mapped into CPU address space at $6000-$7FFF. 
</p><p>In <a href="NES_2_0.xhtml" title="NES 2.0">NES 2.0</a>, the 128 bytes of internal chip RAM are not included in the PRG-RAM and PRG-NVRAM fields. NES 2.0 Mapper 19 ROM images therefore either have:
</p>
<ul><li>no battery and no WRAM: battery bit clear, PRG-RAM/PRG-NVRAM both set to zero.</li>
<li>a battery but no WRAM: battery bit set, PRG-RAM/PRG-NVRAM both set to zero. The game writes its save data into the 128 byte internal RAM.</li>
<li>a battery and WRAM: battery bit set, PRG-RAM set to zero and PRG-NVRAM set to 8192.</li></ul>
<p>The NES 2.0 submapper is used to specify the mixing resistor that determines the relative volume of the expansion audio channels against the <a href="APU.xhtml" title="APU">APU</a>'s audio channels:

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KB PRG RAM bank, if WRAM is present</li>
<li>CPU $8000-$9FFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $A000-$BFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $C000-$DFFF: 8 KB switchable PRG ROM bank</li>
<li>CPU $E000-$FFFF: 8 KB PRG ROM bank, fixed to the last bank</li>
<li>PPU $0000-$03FF: 1 KB switchable CHR bank</li>
<li>PPU $0400-$07FF: 1 KB switchable CHR bank</li>
<li>PPU $0800-$0BFF: 1 KB switchable CHR bank</li>
<li>PPU $0C00-$0FFF: 1 KB switchable CHR bank</li>
<li>PPU $1000-$13FF: 1 KB switchable CHR bank</li>
<li>PPU $1400-$17FF: 1 KB switchable CHR bank</li>
<li>PPU $1800-$1BFF: 1 KB switchable CHR bank</li>
<li>PPU $1C00-$1FFF: 1 KB switchable CHR bank</li>
<li>PPU $2000-$23FF: 1 KB switchable CHR bank</li>
<li>PPU $2400-$27FF: 1 KB switchable CHR bank</li>
<li>PPU $2800-$2BFF: 1 KB switchable CHR bank</li>
<li>PPU $2C00-$2FFF: 1 KB switchable CHR bank</li></ul>
<p>These ASICs have the unusual ability to select the internal 2 KB nametable RAM as a CHR bank page, allowing it to be used as CHR RAM in combination with the existing CHR ROM.
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>The 163 has 19 registers within $4800-$5FFF and $8000-$FFFF. Each register occupies a range of $800 bytes, so $4800-$4FFF all refers to one register, $5000-$57FF all refers to another register, and so on.
</p>

<h3><span id="PRG_Select_1_.28.24E000-.24E7FF.29_w"/><span class="mw-headline" id="PRG_Select_1_($E000-$E7FF)_w">PRG Select 1 ($E000-$E7FF) w</span></h3>
<pre>7  bit  0
---- ----

|||| ||||
||++-++++- Select 8KB page of PRG-ROM at $8000
|+-------- Disable sound if set
+--------- Pin 22 (open collector) reflects the inverse of this value, unchanged by the address bus inputs.
</pre>
<p>If not battery backed, the internal sound RAM powers on in a random state, and similarly the N163 may power on with sound enabled. A short burst of sound due to these random settings may be heard at first power-on, before the game software manages to disable it.
</p>

<pre>7  bit  0
---- ----

|||| ||||
|||| |||+- 1: Write-protect 2kB window of external RAM from $6000-$67FF (0: write enable)
|||| ||+-- 1: Write-protect 2kB window of external RAM from $6800-$6FFF (0: write enable)
|||| |+--- 1: Write-protect 2kB window of external RAM from $7000-$77FF (0: write enable)

<p>Any value outside of the range $40-$4E will cause all PRG RAM to be read-only.
</p><p>Also see <a href="Namco_163_audio.xhtml" title="Namco 163 audio">Namco 163 audio</a>.

<h2><span class="mw-headline" id="IRQ_Operation">IRQ Operation</span></h2>
<p>The IRQ is a 15-bit CPU cycle up-counter. $5000 and $5800 provide <i>direct</i> access to the counter itself (i.e., this isn't a reload value). Games can read and write to these registers in realtime.
</p><p>The IRQ counter increments on each CPU cycle. Upon reaching $7FFF, an IRQ is fired, and it stops counting. Writing to $5000 or $5800 will acknowledge any pending IRQs.
</p>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>Many older programs incorrectly identify this mapper by the name Namco 106. Some sources use the name Namcot instead of Namco, as some games and PCBs use this variation on the company name.</li>
<li>The N163 supports 8k of PRG-RAM but also has 128 bytes of internal memory. If there is a battery, then both will be battery backed. The internal memory is battery backed for several games that have no additional PRG-RAM.</li>
<li>If it is not battery backed, the internal RAM state will be undefined at power-on<sup id="cite_ref-1" class="reference"><a href="#cite_note-1">[1]</a></sup>.</li>
<li>The only known difference between the Namco 129 and 163 is the 129's subtly different design of expansion audio. The only known game (Star Wars) using the Namco 129 can also be found in later runs with a Namco 163 ASIC.</li>
<li>An IC labelled &quot;160&quot; has been found with a copy of <i>Dokuganryuu Masamune</i>: <a rel="nofollow" class="external autonumber" href="https://forums.nesdev.org/viewtopic.php?p=248291#p248291">[1]</a></li>
<li>Many <a href="INES_Mapper_210.xhtml" title="INES Mapper 210">INES Mapper 210</a> games are incorrectly set to Mapper 019.</li>
<li><i>Dokuganryuu Masamune</i> is often thought as having WRAM. Tests have indicated however that the fourth glob is not SRAM but a <a rel="nofollow" class="external text" href="http://forums.nesdev.org/viewtopic.php?t=7727#p111097">protection circuit for the chip-internal RAM</a>.</li></ul>
