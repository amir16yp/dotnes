<div class="mw-parser-output"><p>NES 2.0 Mapper 542 denotes the unmarked PCB used in <i>毛泽东诞辰: 一百周年纪念 1893-1993</i> (Máozédōng Dànchén꞉ Yībǎi Zhōunián Jìniàn 1893-1993, Mao Zedong's Birthday: 100th Anniversary 1893-1993). The game is a modification of <i>英雄傳 - World Hero</i>, which is assigned either to mapper <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">23.1</a> or to <a href="INES_Mapper_027.xhtml" title="INES Mapper 027">27</a>.
</p><p>It uses the same VRC4 clone (A0/A1), increases the PRG-ROM size from the original's 128 KiB to 256 KiB, keeps the 512 KiB of CHR-ROM, additionally maps another fixed part of PRG-ROM to $6000-$7FFF, and most interestingly, can map CIRAM into CHR address space.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB PRG-ROM bank, fixed to bank $0F</li>
<li>CPU $8000-$9FFF (or $C000-$DFFF): 8 KiB switchable PRG ROM bank (like VRC4)</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG ROM bank (like VRC4)</li>
<li>CPU $C000-$DFFF (or $8000-$9FFF): 8 KiB PRG ROM bank, fixed to the second-last bank (like VRC4)</li>
<li>CPU $E000-$FFFF: 8 KiB PRG ROM bank, fixed to the last bank (like VRC4, $1F in this case)</li>
<li>PPU $0000-$03FF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $0400-$07FF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $0800-$0BFF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $0C00-$0FFF: 1 KiB switchable CHR bank (like VRC4) <i>or</i> 1 KiB CIRAM bank #1</li>
<li>PPU $1000-$13FF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $1400-$17FF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $1800-$1BFF: 1 KiB switchable CHR bank (like VRC4)</li>
<li>PPU $1C00-$1FFF: 1 KiB switchable CHR bank (like VRC4)</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Enable_CIRAM_mapping_to_PPU_.240C00-.240FFF_.28.24D800.2C_write.29"/><span class="mw-headline" id="Enable_CIRAM_mapping_to_PPU_$0C00-$0FFF_($D800,_write)">Enable CIRAM mapping to PPU $0C00-$0FFF ($D800, write)</span></h2>
<p>Mask: $F800
</p><p>Once address $D800 is written to, PPU $0C00-$0FFF is mapped to CIRAM bank 1 instead, ignoring the respective VRC4 register. The game uses this CIRAM as pseudo-CHR-RAM to animate the screen showing the next opponent.
</p>
<h2><span id="Disable_CIRAM_mapping_to_PPU_.240C00-.240FFF_.28.24E800.2C_write.29"/><span class="mw-headline" id="Disable_CIRAM_mapping_to_PPU_$0C00-$0FFF_($E800,_write)">Disable CIRAM mapping to PPU $0C00-$0FFF ($E800, write)</span></h2>
<p>Mask: $F800
</p><p>Once address $E800 is written to, PPU $0C00-$0FFF is no longer mapped to CIRAM bank 1, and the respective VRC4 register applies again.
</p>
<h2><span id="VRC4_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="VRC4_registers_($8000-$FFFF)">VRC4 registers ($8000-$FFFF)</span></h2>
<p>Same as on <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a>.
</p>
