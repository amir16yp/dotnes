<div class="mw-parser-output"><p>NES 2.0 Mapper 304 is used for several ROM cartridge conversions of Famicom Disk Systems for which, along with the entirely-different <a href="INES_Mapper_043.xhtml" title="INES Mapper 043">INES Mapper 043</a> and <a href="NES_2_0_Mapper_311.xhtml" title="NES 2.0 Mapper 311">NES 2.0 Mapper 311</a>, UNIF MAPR <b>UNL-SMB2J</b> is used.
</p>
<ul><li><i>Super Mario Bros. 2 (J)</i> (Whirlwind Manu LE10, <a rel="nofollow" class="external text" href="https://archive.org/details/youtube-M2-ovBQW978">hangs after completing level 4-4 on real hardware</a>)</li>
<li><i>Volleyball (J)</i> (Whirlwind Manu LE08)</li>
<li><i>Zanac (J)</i> (Whirlwind Manu LF11)</li></ul>
<p>FCEUX' source code says that the PCB for both the CHR-ROM and CHR-RAM variants is named <i>09-034A</i>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: Switchable 8 KiB PRG-ROM bank (#4-#5)</li>
<li>CPU $8000-$FFFF: Fixed 32 KiB PRG-ROM bank #0</li>
<li>PPU $0000-$1FFF: Unbanked 8 KiB CHR-ROM or CHR-RAM.</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Unknown_Registers_.28.244042-.244055.2C_read.29"/><span class="mw-headline" id="Unknown_Registers_($4042-$4055,_read)">Unknown Registers ($4042-$4055, read)</span></h2>
<p>Reading from these addresses must return $FF rather than open bus, otherwise SMB2J will freeze.
</p>
<h2><span id="PRG_Bank_Select_.28.244027.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Select_($4027,_write)">PRG Bank Select ($4027, write)</span></h2>
<p>Mask: Unknown
</p>
<pre>Bit 7654 3210
    ---------
    .... ...B
            +- 0: CPU $6000-$7FFF to 8 KiB bank #4
               1: CPU $6000-$7FFF to 8 KiB bank #5
</pre>
<p>On games with only 32 KiB ROM, $6000-$7FFF will (as usual) wrap to banks #0 and #1.
</p>
<h2><span id="IRQ_Control_.28.244068.2C_write.29"/><span class="mw-headline" id="IRQ_Control_($4068,_write)">IRQ Control ($4068, write)</span></h2>
<p>Mask: Unknown
</p>
<pre>Bit 7654 3210
    ---------
    .... ...I
            +- 0: Disable and Acknowledge IRQ, and reset counter
               1: Enable IRQ
</pre>
<p>According to <a rel="nofollow" class="external text" href="https://github.com/TASVideos/fceux/blob/master/src/boards/09-034a.cpp">FCEUX</a>, when enabled, IRQ counter increases on every M2 cycle until it reaches 5750, upon which an IRQ is fired. While this does work nicely with the ROM image of LE10, the <a rel="nofollow" class="external text" href="https://archive.org/details/youtube-M2-ovBQW978">hardware video recording</a> seems to indicate that the actual hardware does not have a functioning IRQ counter.
</p>
