<div class="mw-parser-output"><p>NES 2.0 Mapper 267 is used for the 8-in-1 JY-119 multicart. It consists of an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with an outer bank register at $6000.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>Mask: $E001
</p>
<ul><li>$8000, $8001, $A000, $A001, $C000, $C001, $E000, $E001: As normal <a href="MMC3.xhtml" title="MMC3">MMC3</a>. Inner PRG banks are limited to 256 KiB, Inner CHR banks to 128 KiB.</li></ul>
<h2><span id="Outer_Bank_.28.246000.29"/><span class="mw-headline" id="Outer_Bank_($6000)">Outer Bank ($6000)</span></h2>
<p>Mask: Unknown
</p>
<pre>7654 3210
---- ----
UUB. .BB.
||+---++-- Select 256 KiB outer PRG-ROM and 128 KiB outer CHR-ROM bank
++-------- Unknown, cleared when the menu is shown, both set once a game has been selected.
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>The initial value of this register must be $00 for the multicart menu to be shown.</li>
<li>The cart seems to run just fine when ignoring the two unknown bits.</li></ul>
