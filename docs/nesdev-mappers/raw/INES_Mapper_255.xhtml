<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 255</a> is apparently assigned to the <i>110-in-1</i> multicart.
</p>
<pre> A~[1BMZ PPPP  PpCC CCCC]
     ||| ||||  |||| ||||
     +-----------++-++++ - Select 8 KiB CHR at PPU $0000
     ||| ||||  ||
     +---++++--++------- - Select 16 KiB PRG at CPU $8000 and $C000 if Z=1
     +---++++--+-------- - Select 32 KiB PRG at CPU $8000 if Z=0
      |+---------------- - Select PRG bank size: 0-32K 1-16K
      +----------------- - Nametable mirroring: 0-PPUA10 (&quot;vertical&quot;) 1-PPUA11 (&quot;horizontal&quot;)
</pre>
<p>Hardware on the board includes
</p>
<ul><li>four 512 KiB ROMs for PRG</li>
<li>two 512 KiB ROMs for CHR</li>
<li>two 74'273 8-bit latches</li>
<li><a href="74139.xhtml" title="74139">74139</a></li>
<li>PAL16L8 emulating a <a href="74153.xhtml" title="74153">74153</a></li>
<li>an unpopulated footprint for a 74'670</li></ul>
<p>The two latches' reset inputs are tied to 5V, so the banking register boots with random contents.
</p><p><br/>
This looks like a duplicate of <a href="INES_Mapper_225.xhtml" title="INES Mapper 225">iNES Mapper 225</a>. It's not clear why Nestopia implemented it twice.
</p><p>See also: <a rel="nofollow" class="external free" href="https://forums.nesdev.org/viewtopic.php?p=209732#p209732">https://forums.nesdev.org/viewtopic.php?p=209732#p209732</a>
</p>
