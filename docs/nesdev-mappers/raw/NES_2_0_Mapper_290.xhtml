<div class="mw-parser-output"><p>NES 2.0 Mapper 290 is used for the <i>Asder 20-in-1</i> multicart. Its UNIF board name is <b>BMC-NTD-03</b>.
</p>
<h2><span class="mw-headline" id="Address_latch">Address latch</span></h2>
<pre>Mask: $8000

$8000: A~[1PPP PMCC Sp.. .CCC]
           ||| |||| ||    |||
           ||| ||++-------+++- Select 8 KiB CHR-ROM bank at PPU $0000-$1FFF
           ||| ||   |+-------- Select 16 KiB PRG-ROM bank at CPU $8000/$C000 if S=1
           ||| ||   +--------- Select PRG-ROM bank size, 0=32 KiB, 1=16 KiB
           ||| |+------------- Select nametable mirroring, 0=vertical, 1=horizontal 
           +++-+-------------- Select 32 KiB PRG-ROM bank at CPU $8000
</pre>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>The game <i>Benico</i> on that multicart has graphical glitches during attract mode on real hardware.</li></ul>
