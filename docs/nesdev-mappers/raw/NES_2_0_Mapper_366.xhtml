<h2><span id="Outer_Bank_Register_.28.246800.29"/><span class="mw-headline" id="Outer_Bank_Register_($6800)">Outer Bank Register ($6800)</span></h2>
<pre>Mask: unknown, probably $E0F0

A~FEDC BA98 7654 3210
  -------------------
  0110 1000 LOOO ....
            |+++------ Select outer 128 KiB PRG-ROM and CHR-ROM bank
            +--------- 1=Lock outer bank
</pre>
<p>This register is accessible regardless of whether WRAM is enabled in the MMC3 clone's A001 register.
It overlays the 8 KiB of WRAM that both multicarts have, making the Lock bit necessary to prevent the outer bank from changing once the game writes to WRAM.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
<h2><span class="mw-headline" id="Note">Note</span></h2>
<p><a rel="nofollow" class="external text" href="https://github.com/TASVideos/fceux/blob/master/src/boards/mmc3.cpp">FCEUX emulates this PCB under mapper number 205</a> together with &quot;OK-411&quot; (<a href="NES_2_0_Mapper_361.xhtml" title="NES 2.0 Mapper 361">NES 2.0 Mapper 361</a>), both of which are in turn different from the <a href="INES_Mapper_205.xhtml" title="INES Mapper 205">iNES Mapper 205</a> described in that mapper's wiki article.
</p>
