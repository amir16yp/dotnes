<div class="mw-parser-output"><p><b>NES 2.0 Mapper 451</b> is used for the homebrew game <i>Haratyler HP/MP</i>. It is basically a homebrew TLROM-like circuit board that implements the MMC3 register's in an unusual fashion, and saves the high score to flash ROM. The game executes the AMIC A29040B flash ROM chip's &quot;Software ID&quot; command; if the manufacturer and model ID do not match the expected values ($37 and $86), or it detects that WRAM exists, the game replaces the first level with an unwinnable boss fight. <i>Haratyler MP</i> additionally provides MP3 playback from a built-in microSD card, similar to <a href="GTROM.xhtml#GTMP3" title="GTROM">GTMP3</a>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$9FFF: 8 KiB fixed PRG ROM bank $00</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG ROM bank $10+x</li>
<li>CPU $C000-$DFFF: 8 KiB switchable PRG ROM bank $20+x</li>
<li>CPU $E000-$FFFF: 8 KiB fixed PRG ROM bank $30</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR RAM bank from 16 KiB total</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="MP3_Playback_Controller_.28.246000-.247FFF.29"/><span class="mw-headline" id="MP3_Playback_Controller_($6000-$7FFF)">MP3 Playback Controller ($6000-$7FFF)</span></h2>
<h2><span id="Mirroring_Register_.28.24A000-.24BFFF.29"/><span class="mw-headline" id="Mirroring_Register_($A000-$BFFF)">Mirroring Register ($A000-$BFFF)</span></h2>
<pre>A~[101. .... .... ...M]
                     +- 0: Vertical, 1: Horizontal
</pre>
<h2><span id="IRQ_Register_.28.24C000-.24DFFF.29"/><span class="mw-headline" id="IRQ_Register_($C000-$DFFF)">IRQ Register ($C000-$DFFF)</span></h2>
<pre>A~[110. .... VVVV VVVV]
</pre>
<p>A write to this register amounts to the following writes on a normal MMC3:
</p>
<ul><li>$C000=VVVVVVVV -1</li>
<li>$C001=0</li>
<li>If V=$FF: $E000, otherwise $E001</li></ul>
<h2><span id="Bank_Register_.28.24E000-.24FFFF.29"/><span class="mw-headline" id="Bank_Register_($E000-$FFFF)">Bank Register ($E000-$FFFF)</span></h2>
<pre>A~[111. .... .... ..BA]
                    |+- PRG/CHR A13
                    +-- PRG A16
</pre>
<p>This means effectively:
</p>
<pre>BA    CPU $A000   CPU $C000   PPU $0000
 0        $10         $20        0
 1        $11         $21        1
 2        $18         $28        0
 3        $19         $29        1
</pre>
<p>Together with the fixed banks, this means that only PRG ROM banks $00/$10/$11/$18/$19/$20/$21/$28/$29/$30 are accessible. The rest serve as padding for the flash ROM chip's 64 KiB sector size.
</p>
