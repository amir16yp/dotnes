<div class="mw-parser-output"><p>NES 2.0 Mapper 309 is used for Whirlwind Manu's ROM cartridge conversion of the Japanese Famicom Disk System game <i>愛戦士ニコル</i> (<i>Ai Senshi Nicol</i>, cartridge code LH51). Its UNIF board name is <b>UNL-LH51</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB unbanked PRG-RAM</li>
<li>CPU $8000-$9FFF: 8 KiB switchable PRG-ROM bank</li>
<li>CPU $A000-$BFFF: 8 KiB fixed PRG-ROM bank #13</li>
<li>CPU $C000-$DFFF: 8 KiB fixed PRG-ROM bank #14</li>
<li>CPU $E000-$FFFF: 8 KiB fixed PRG-ROM bank #15</li>
<li>PPU $0000-$1FFF: 8 KiB unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG-ROM_Bank_.28.248000-9FFF.29"/><span class="mw-headline" id="PRG-ROM_Bank_($8000-9FFF)">PRG-ROM Bank ($8000-9FFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  .... PPPP
       ++++- Select 8 KiB PRG-ROM bank number at CPU $8000-$9FFF
</pre>
<h2><span id="Mirroring_.28.24E000-9FFF.29"/><span class="mw-headline" id="Mirroring_($E000-9FFF)">Mirroring ($E000-9FFF)</span></h2>
<pre>Mask: probably $E000

D~7654 3210
  ---------
  .... M...
       +---- Select nametable mirroring type
              0: Vertical
              1: Horizontal
</pre>
<p><br/>
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>This particular conversion of the game has broken sound <a rel="nofollow" class="external text" href="https://www.youtube.com/watch?v=Rgt9cWk0yh0">even on real hardware</a>. Other conversions of the game that run under <a href="INES_Mapper_042.xhtml" title="INES Mapper 042">INES Mapper 042</a> do not suffer from this problem.</li>
<li>The conversion retains all writes to the FDS sound channel registers, so an emulator could provide the expansion sound channel even though the original Whirlwind Manu cartridge did not. Given that the sound routine itself is broken however, doing such a thing may not be worthwhile.</li></ul>
