<div class="mw-parser-output"><p><b>NES 2.0 Mapper 410</b> is a variant of <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">mapper 45</a> where the ASIC's PRG A21/CHR A20 output (set by bit 6 of the <a href="INES_Mapper_045.xhtml#CHR-AND.2C_CHR-OR.2FPRG-OR_MSB_.28.246000_.232.2C_write.29" title="INES Mapper 045">third write to $6000</a>) selects between regularly-banked CHR-ROM (=0) and 8 KiB of unbanked CHR-RAM (=1). It is used solely for the <i>Super 8-in-1 - 98格鬥天王＋熱血</i> (JY-302) multicart.
</p>
