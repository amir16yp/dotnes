<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 149</a> is just like mapper <a href="INES_Mapper_145.xhtml" title="INES Mapper 145">145</a>, but moves the register to overlap with PRG ROM and so has bus conflicts. It's a singleton, PCB labeled SA-0036, and used by the Sachen game <i>Taiwan Mahjong 16</i>.
</p>
<pre> Mask: $8000
 Bus conflicts:
 $8000: [C... ....] - select 8 KiB CHR bank.
</pre>
