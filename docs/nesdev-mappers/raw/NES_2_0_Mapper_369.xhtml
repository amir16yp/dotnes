From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/NES_2.0_Mapper_369">current version</a> | View <a href="Special_AllPages.xhtml#NES_2_0_Mapper_369">other pages</a>

<div class="mw-parser-output"><p><b>NES 2.0 mapper 369</b> denotes the <b>N49C-300</b> circuit board, used for the <i>Super Mario Bros. Party</i> multicart. Accordingly, it combines all the mappers used for the various Mario games (including SMB2J): <a href="NROM.xhtml" class="mw-redirect" title="INES Mapper 000">0</a>, <a href="MMC3.xhtml" class="mw-redirect" title="INES Mapper 004">4</a> and <a href="INES_Mapper_040.xhtml" title="INES Mapper 040">40</a> with an outer bank register. Its UNIF board name is <b>BMC-N49C-300</b>.
</p>
<h2><span id="Outer_Bank_register_.28.244100.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_($4100,_write)">Outer Bank register ($4100, write)</span></h2>
<p>Mask: $C100
</p><p>The meaning of the individual bits is not understood yet. The following values are used:
</p>
<pre>$4100  PRG offset  CHR offset  Mapper
Value  (8K bank#)  (8K bank#)
-------------------------------------
$00    $00         $00         <a href="NROM.xhtml" class="mw-redirect" title="INES Mapper 000">000: NROM</a> (Mario Bros.)
$01    $01         $01         <a href="NROM.xhtml" class="mw-redirect" title="INES Mapper 000">000: NROM</a> (Super Mario Bros.)
$13    $08         $03         <a href="INES_Mapper_040.xhtml" title="INES Mapper 040">040: NTDEC 2722</a> (Super Mario Bros. 2J)
$37    $10         $10         <a href="MMC3.xhtml" class="mw-redirect" title="INES Mapper 004">004: TLROM</a> (Super Mario Bros. 2), PRG-ROM bank limited to 128 KiB
$FF    $20         $20         <a href="MMC3.xhtml" class="mw-redirect" title="INES Mapper 004">004: TKROM</a> (Super Mario Bros. 3), PRG-ROM bank limited to 256 KiB
</pre>
