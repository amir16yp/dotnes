<div class="mw-parser-output"><p><b>NES 2.0 Mapper 436</b> denotes the <b>ZLX-08</b> plug-and-play VT02 console PCB, used by the <i>Entertainment System 620-in-1</i> plug-and-play console. It is uses normal <a href="NES_2_0_Mapper_256.xhtml" title="NES 2.0 Mapper 256">OneBus banking</a>, with one exception: the VT02's PRG A23 output (register $4100 bit 6 for PRG and bit 2 for CHR accesses) is connected to PRG-ROM A24, and PRG A23 comes from the VT02's I/O port at $410F, bit 5 instead. Since the I/O port is high-impedance on reset, which is pulled-up to a logical &quot;1&quot;, the reset vectors are in the <i>second</i> 8 MiB part of ROM.
</p>
