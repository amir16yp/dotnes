<div class="mw-parser-output"><p>NES 2.0 Mapper 269 is used for at least one plug-and-play console and two multicarts with an MMC3 clone and four additional outer bank registers:
</p>
<ul><li><i>Games Xplosion 121-in-1</i></li>
<li><i>15000-in-1</i></li>
<li><i>18000-in-1</i></li></ul>
<p>PRG and CHR fetches are mapped to different areas of a single address space, similar to the <a href="VTxx.xhtml" title="VTxx">VTxx</a> consoles in OneBus mode. <a rel="nofollow" class="external text" href="https://youtu.be/CFZ9yeS6984?t=31s">As the plug-and-play console's square wave duty cycles are not reversed</a> however, the actual hardware cannot be VTxx.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>Mask: probably $E001
</p>
<pre>$8000, $8001, $A000, $A001, $C000, $C001, $E000, $E001: As normal MMC3.
</pre>
<h2><span id="Outer_bank_registers_.28.245000.29"/><span class="mw-headline" id="Outer_bank_registers_($5000)">Outer bank registers ($5000)</span></h2>
<p>There are four outer bank registers, all of which are accessed at address $5000. The first write goes to the first register, the second write to the second, and so on; the fifth write goes to the first register again.
</p><p>Mask: unknown, but probably $F008, as a few games' writes to $5008 must be ignored
</p><p>Register 0:
</p>
<pre>7654 3210
---------
CCCC CCCC
++++-++++- Bits 0-7 of the 1 KiB Outer CHR Bank number
</pre>
<p>Register 1:
</p>
<pre>7654 3210
---------
PPPP PPPP
++++-++++- Bits 0-7 of the 8 KiB Outer PRG Bank number
</pre>
<p>Register 2:
</p>
<pre>7654 3210
---------
CCCC MMMM
|||| ++++- Outer CHR Bank mask in number of most significant bits,
||||       e.g. 0=0x00, 1=0x80, 2=0xC0, 3=0xE0, 4=0xF0
++++------ Bits 8-11 of the 1 KiB Outer CHR Bank number
</pre>
<p>Register 3:
</p>
<pre>7654 3210
---------
OOMM MMMM
||++-++++- Outer PRG Bank mask (bit mask, not number of bits)
++-------- Bits 8/9 of the 8 KiB Outer PRG Bank number, also
           Bits 12/13 of the 1 KiB Outer CHR Bank number
</pre>
<p>The final 8 KiB PRG and 1 KiB CHR bank number are therefore:
</p>
<pre>PRGBank := (MMC3PRGBank &amp;~OuterPRGBankMask) | (OuterPRGBank &amp;OuterPRGBankMask);
CHRBank := (MMC3CHRBank &amp;~OuterCHRBankMask) | (OuterCHRBank &amp;OuterCHRBankMask);
</pre>
<h1><span class="mw-headline" id="CHR_Scrambling">CHR Scrambling</span></h1>
<p>The CHR data is scrambled by changing the bit order.
</p>
<pre>Stored bit  76543210
            --------
Actual bit  70615243
</pre>
<p>Which means that to get from the stored data to the actual data, the following operation must be performed: 
</p>
<pre>Val =((Val &amp;1) &lt;&lt;6) | ((Val &amp;2) &lt;&lt;3) | ((Val &amp;4) &lt;&lt;0) | ((Val &amp;8) &gt;&gt;3) | ((Val &amp;16) &gt;&gt;3) | ((Val &amp;32) &gt;&gt;2) | ((Val &amp;64) &gt;&gt;1) | ((Val &amp;128) &lt;&lt;0);
</pre>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Initial register values must be 0x00 for registers 0, 1 and 3, and 0x0F for register 2.</li>
<li>This mapper seems to be an enhanced version of <a href="INES_Mapper_045.xhtml" title="INES Mapper 045">Mapper 45</a>.</li>
<li>This mapper supports WRAM at CPU $6000-$7FFF, which is necessary for <i>18000-in-1'</i>s <i>Super Mario Bros. 3</i>.</li>
<li>On the <i>Games Xplosion 121-in-1</i> multicart, game #48 (First Defender) enables interrupts but fails to disable the <a href="APU_Frame_Counter.xhtml" title="APU Frame Counter">frame IRQ</a>, freezing on emulators that accurately <a href="CPU_power_up_state.xhtml" title="CPU power up state">power-on with the frame IRQ enabled</a>.</li></ul>
