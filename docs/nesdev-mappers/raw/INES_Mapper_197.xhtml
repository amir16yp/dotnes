<div class="mw-parser-output"><p>iNES Mapper 197 denotes an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone wired to support 512 KiB of CHR-ROM by increasing CHR banking granularity from 1/2 KiB to 2/4 KiB.
All of its games are mapper hacks, usually by 卡聖 (Kǎshèng, NT-xxx cartridge codes), of games originally released on mappers <a href="J_Y__Company_ASIC.xhtml" class="mw-redirect" title="INES Mapper 090">90</a> and <a href="INES_Mapper_091.xhtml" title="INES Mapper 091">91</a>.
Submappers, assigned by Nestopia Plus!, denote three different wiring variants. PRG-ROM, nametable mirroring and IRQs function as in mapper <a href="MMC3.xhtml" class="mw-redirect" title="INES Mapper 004">4</a>.
</p>

<h2><span class="mw-headline" id="Submapper_0">Submapper 0</span></h2>
<ul><li><i>Super Fighter III</i> (PRG-ROM CRC32 0xC333F621), originally for Mapper <a href="INES_Mapper_091.xhtml" title="INES Mapper 091">91</a>.1.</li></ul>
<pre>Pin            Connected to
PPU A10        CHR-ROM A10
PPU A11        MMC3 PA10
GND            MMC3 PA11
PPU A12        MMC3 PA12
MMC3 CHR A10   CHR-ROM A11
    :             :
MMC3 CHR A17   CHR-ROM A18
</pre>
<p>So that the MMC3 sees the followings addresses:
</p>
<pre>Real PPU Addr  MMC3 PPU Addr
$0000          $0000 -&gt; reg 0 AND $FE
$0400          $0000 -&gt; reg 0 AND $FE
$0800          $0400 -&gt; reg 0 OR $01
$0C00          $0400 -&gt; reg 0 OR $01
$1000          $1000 -&gt; reg 2
$1400          $1000 -&gt; reg 2
$1800          $1400 -&gt; reg 3
$1C00          $1400 -&gt; reg 3
</pre>
<p>This results in the following CHR banks:
</p>
<pre>MMC3 reg#      Meaning
0              4 KiB CHR-ROM bank at PPU $0000-$0FFF
1              unused
2              2 KiB CHR-ROM bank at PPU $1000-$17FF
3              2 KiB CHR-ROM bank at PPU $1800-$1FFF
4              unused
5              unused
</pre>
<h2><span class="mw-headline" id="Submapper_1">Submapper 1</span></h2>
<ul><li><i>Super Fighter III</i> (PRG-ROM CRC32 0x2091BEB2), UNIF board name <b>UNL-FC-28-5027</b>, originally for Mapper <a href="INES_Mapper_091.xhtml" title="INES Mapper 091">91</a>.1.</li></ul>
<pre>Pin            Connected to
PPU A10        CHR-ROM A10
PPU A11        MMC3 PA10
Vcc            MMC3 PA11
PPU A12        MMC3 PA12
MMC3 CHR A10   CHR-ROM A11
    :             :
MMC3 CHR A17   CHR-ROM A18
</pre>
<p>So that the MMC3 sees the followings addresses:
</p>
<pre>Real PPU Addr  MMC3 PPU Addr
$0000          $0800 -&gt; reg 1 AND $FE
$0400          $0800 -&gt; reg 1 AND $FE
$0800          $0C00 -&gt; reg 1 OR $01
$0C00          $0C00 -&gt; reg 1 OR $01
$1000          $1800 -&gt; reg 4
$1400          $1800 -&gt; reg 4
$1800          $1C00 -&gt; reg 5
$1C00          $1C00 -&gt; reg 5
</pre>
<p>This results in the following CHR banks:
</p>
<pre>MMC3 reg#      Meaning
0              unused
1              4 KiB CHR-ROM bank at PPU $0000-$0FFF
2              unused
3              unused
4              2 KiB CHR-ROM bank at PPU $1000-$17FF
5              2 KiB CHR-ROM bank at PPU $1800-$1FFF
</pre>
<h2><span class="mw-headline" id="Submapper_2">Submapper 2</span></h2>
<ul><li><i>Mortal Kombat III Special (NT-328/YY-030)</i> (PRG-ROM CRC32 0x60815A7D), originally for Mapper <a href="J_Y__Company_ASIC.xhtml" class="mw-redirect" title="INES Mapper 090">90</a>.</li></ul>
<pre>Pin            Connected to
PPU A10        CHR-ROM A10
PPU A11        MMC3 PA10 and MMC3 PA11
PPU A12        MMC3 PA12
MMC3 CHR A10   CHR-ROM A11
    :             :
MMC3 CHR A17   CHR-ROM A18
</pre>
<p>So that the MMC3 sees the followings addresses:
</p>
<pre>Real PPU Addr  MMC3 PPU Addr
$0000          $0000 -&gt; reg 0 AND $FE
$0400          $0000 -&gt; reg 0 AND $FE
$0800          $0C00 -&gt; reg 1 OR $01
$0C00          $0C00 -&gt; reg 1 OR $01
$1000          $1000 -&gt; reg 2
$1400          $1000 -&gt; reg 2
$1800          $1C00 -&gt; reg 5
$1C00          $1C00 -&gt; reg 5
</pre>
<p>This results in the following CHR banks:
</p>
<pre>MMC3 reg#      Meaning
0 (AND $FE)    2 KiB CHR-ROM bank at PPU $0000-$07FF
1 (OR $01)     2 KiB CHR-ROM bank at PPU $0800-$0FFF
2              2 KiB CHR-ROM bank at PPU $1000-$17FF
3              unused
4              unused
5              2 KiB CHR-ROM bank at PPU $1800-$1FFF
</pre>
<h2><span class="mw-headline" id="Submapper_3">Submapper 3</span></h2>
<ul><li><i>1995 Super 2-in-1 (2B20)</i></li></ul>
<p>Like Submapper 0, but with an additional outer bank register at $6000-$7FFF:
</p>
<pre>Mask: $E000

D~7654 3210
  ---------
  .... S..P
       |  +- PRG A17 if S=1
       +---- PRG A17 mode
              0: PRG A17=MMC3 PRG A17 (256 KiB)
              1: PRG A17=P (128 KiB)
</pre>
<p>As the outer bank register uses the MMC3 clone's WRAM interface, writes only have an effect if WRAM is enabled and not write-protected via $A001.
</p>
