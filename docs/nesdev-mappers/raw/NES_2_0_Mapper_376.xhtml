<div class="mw-parser-output"><p><b>NES 2.0 Mapper 376</b> denotes J.Y. Company's <b>YY841155C</b> circuit board, used for one one known multicart:
</p>
<ul><li><i>1996 大金鋼專輯 8-in-1</i> (JY-041)</li></ul>
<p>Similarly to <a href="NES_2_0_Mapper_361.xhtml" title="NES 2.0 Mapper 361">NES 2.0 Mapper 361</a>, it uses an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with two outer bank registers at $7000/$7001. This variant adds an NROM PRG mode.
</p>
<h2><span id="Outer_Bank_register_.230_.28.247000.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_#0_($7000,_write)">Outer Bank register #0 ($7000, write)</span></h2>
<pre>Mask: $F001

D~7654 3210
  ---------
  UaV. .bbb
  |||   +++- In NROM mode: PRG A14..16
  |+|------- PRG/CHR A17
  +-+------- UV  PRG banking mode
             --------------------
             10  NROM-128
             11  NROM-256
             0x  MMC3
</pre>
<p>Regardless of the PRG banking mode, CHR-ROM A10..A16 will come from the MMC3.
</p>
<h2><span id="Outer_Bank_register_.231_.28.247001.2C_write.29"/><span class="mw-headline" id="Outer_Bank_register_#1_($7001,_write)">Outer Bank register #1 ($7001, write)</span></h2>
<pre>Mask: $F001

D~7654 3210
  ---------
  .... ...B
          +- PRG/CHR A18
</pre>
