<p>NES 2.0 Mapper 371 denotes the Spanish PEC-586 home computer main cartridge, which differs from both the Chinese and Russian equivalents. It has two PRG-ROM chips, one with 64 KiB, one with 512 KiB, for a total of 576 KiB. The first chip contains normal home computer applications such as a BASIC interpreter and a text editor, while the second chip contains a selection of common NROM games. Like all PEC-586 machines and cartridges, it adds a 1bpp video mode by appropriately mapping CHR-RAM, and requires the <a href="https://www.nesdev.org/w/index.php?title=PEC-586_Keyboard&amp;action=edit&amp;redlink=1" class="new" title="PEC-586 Keyboard (page does not exist)">PEC-586 Keyboard</a> to operate.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<p>Common:
</p>
<ul><li>CPU $6000-$7FFF: 8 KiB of unbanked PRG-RAM</li>
<li>PPU $0000-$1FFF: 8 KiB of unbanked CHR-RAM</li></ul>
<p>When the first (64 KiB) PRG-ROM chip is selected
</p>
<ul><li>CPU $8000-$BFFF: Switchable 16 KiB PRG-ROM bank (#0-#3)</li>
<li>CPU $C000-$FFFF: Fixed 16 KiB PRG-ROM bank #3</li></ul>
<p>When the second (512 KiB) PRG-ROM chip is selected:
</p>
<ul><li>CPU $8000-$BFFF: Switchable 16 KiB PRG-ROM bank</li>
<li>CPU $C000-$FFFF: Mirror of CPU $8000-$BFFF</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Main_Register_.28.245000.2C_write.29"/><span class="mw-headline" id="Main_Register_($5000,_write)">Main Register ($5000, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  1CCC PPPP
  |||| ++++- Select 16 KiB PRG-ROM bank at CPU $8000-$BFFF (PRG A14..A17)
  |+++------ Select PRG-ROM source
  |           0: First chip (64 KiB)
  |           5: Second chip (512 KiB)
  |           7: Expansion slot
  +--------- Select 1bpp CHR mode
              0: Disabled
              1: Enabled
</pre>
<p>Power-on value: $00
</p>
<h2><span id="Auxiliary_Register_.28.245100.2C_write.29"/><span class="mw-headline" id="Auxiliary_Register_($5100,_write)">Auxiliary Register ($5100, write)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... ..MP
         |+- If first PRG-ROM chip selected: Tape Out data
         |   If second PRG-ROM chip selected: PRG A18 (256 KiB)
         +-- Select nametable mirroring type
              0: Horizontal
              1: Vertical
</pre>
<p>Power-on value: $03
</p>
<h2><span id="Tape_In_.28.245500.2C_read.29"/><span class="mw-headline" id="Tape_In_($5500,_read)">Tape In ($5500, read)</span></h2>
<pre>Mask: $FF00

D~7654 3210
  ---------
  .... .T..
        +--- Tape In data
</pre>
<h1><span class="mw-headline" id="Protection">Protection</span></h1>
<p>When the second PRG-ROM chip is selected <i>and</i> PRG A18=0, the cartridge hardware will forcibly reset on attempts to read from CPU $D100-$D1FF. As the first 256 KiB bank of the second PRG-ROM chip only contains data for CHR-RAM as well as some code that is copied into and executed from PRG-RAM, and $C000-$FFFF is a mirror of $8000-$BFFF in that configuration, the $D100-$D1FF range is never read from during normal operation.
</p>
<h1><span class="mw-headline" id="1bpp_CHR_mode">1bpp CHR mode</span></h1>
<p>When register $5000 bit 7 is set, CHR A3 is substituted with PPU A0 from the last nametable (not attribute table) read, and CHR A12 is substituted with PPU A9 from the last nametable (not attribute table) read. This creates a 1bpp all-points-addressable video mode that allows the 8 KiB CHR-RAM to hold just enough data for one screen.
</p>
