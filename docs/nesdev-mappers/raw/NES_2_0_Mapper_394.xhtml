<div class="mw-parser-output"><p><b>NES 2.0 Mapper 394</b> denotes Realtec's <b>HSK007</b> multicart PCB. Unusually, it can be set to function either as an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone or as a <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>.
</p>
<h2><span id="Mode_Register_.28.245009.2C_write.29"/><span class="mw-headline" id="Mode_Register_($5009,_write)">Mode Register ($5009, write)</span></h2>
<pre>Mask: unknown, but A3 must be set

D~7654 3210
  ---------
  ...M MCBP
     | |||+- PRG A18
     | ||+-- PRG/CHR A19
     | |+--- CHR A18
     +-+---- Mapper Mode
             0: BNROM
             1: MMC3
             2: J.Y. Company ASIC
             3: Same as 2

Power-on value: $0F
</pre>
<h2><span id="Outer_Bank_Register_.28.24500B.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($500B,_write)">Outer Bank Register ($500B, write)</span></h2>
<pre>Mask: unknown, but A3 must be set

D~7654 3210
  ---------
  cC.p PBB.
  || | |++-- PRG A16..A15 in BNROM mode
  || | +---- PRG A17 if p=0
  || +------ PRG A17 in MMC3 mode
  ||          0: From Outer Bank Register (128 KiB inner bank)
  ||          1: From MMC3 (256 KiB inner bank)
  |+-------- CHR A17 if c=0
  +--------- CHR A17 in MMC3 mode
              0: From Outer Bank Register (128 KiB inner bank)
              1: From MMC3 (256 KiB inner bank)

Power-on value: $90
</pre>
<p>In J.Y. Company ASIC Mode, PRG/CHR A17 always come from the J.Y. Company ASIC.
</p>
