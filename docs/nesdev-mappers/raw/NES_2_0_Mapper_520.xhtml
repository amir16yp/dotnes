<div class="mw-parser-output"><p>NES 2.0 Mapper 520 is used for the <i>2-in-1 Datach Dragon Ball Z/Datach Yu Yu Hakusho</i> multicart. It uses a <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC4">VRC4</a> clone (in the VRC4e configuration, i.e. address 0x004s to A0 and address 0x008s to A1) using 8 KiB of banked CHR-RAM rather than CHR-ROM:
</p>
<h3><span id="CHR_Select_0_low_.28.24B000.29"/><span class="mw-headline" id="CHR_Select_0_low_($B000)">CHR Select 0 low ($B000)</span></h3>
<pre>7  bit  0
---------
.... OLLL
     |+++- Select 1 KiB CHR-RAM bank at PPU $0000-$03FF
     +---- Select outer 256 KiB PRG-ROM bank when PPU $0000-$03FF is accessed
</pre>
<ul><li>The high CHR Select register ($B004) is ignored.</li>
<li>The other seven low CHR bank select registers continue the pattern for the other seven 1 KiB PPU banks.</li></ul>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li>The ROM image in GoodNES 3.23b is set to Mapper 23, even as the outer bank register is not part of that mapper's specification.</li>
<li>As with <a href="MMC1.xhtml#SOROM.2C_SUROM_and_SXROM" title="MMC1">SOROM, SUROM and SXROM</a>, if the several CHR bank registers do not specify the same outer PRG ROM bank, then PRG ROM presumably would be bankswitched as the PPU renders.</li></ul>
