<div class="mw-parser-output"><p><b>NES 2.0 Mapper 344</b> denotes the <b>GN-26</b> <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based multicart circuit board. Its UNIF board name is <b>BMC-GN-26</b> (with incorrect PRG bank order).
</p>
<ul><li><i>快打金卡终极挑战 (Kuàidǎ Jīnkǎ Zhōngjí Tiǎozhàn) 3/6-in-1</i></li></ul>
<h2><span id="Outer_Bank_and_Mode_Register_.28.246000-.247FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_and_Mode_Register_($6000-$7FFF,_write)">Outer Bank and Mode Register ($6000-$7FFF, write)</span></h2>
<pre>Mask: $E00F

A~FEDC BA98 7654 3210
  -------------------
  011. .... .... SMBA
                 ||++- PRG/CHR A18..17
                 ||+-- CHR A17 mode
                 ||     0: CHR A17=MMC3 A17
                 ||     1: CHR A17=$6000.0
                 |+--- Select PRG-ROM mode
                 |      0: MMC3 PRG mode
                 |      1: NROM PRG mode
                 +---- Solder pad test
</pre>
<ul><li>WRAM must be enabled in $A001.7 before writing to this register.</li>
<li>The inner PRG bank is restricted to 128 KiB.</li>
<li>NROM mode PRG forces MMC3's CPU A13 and A14 inputs to GND and replaces MMC3's PRG A13 output with CPU A13. This means that MMC3 bank register 6 bits 1-3 provide PRG A14..A16 for the entire CPU $8000-$FFFF range.</li>
<li>The common dump of <i>快打金卡终极挑战 (Kuàidǎ Jīnkǎ Zhōngjí Tiǎozhàn) 3/6-in-1</i> has the 128 KiB PRG-ROM banks mixed-up, correct would be in the order 0, 3, 1, 2.</li>
<li>Depending on whether a solder pad is connected, setting the S bit may disable PRG-ROM. The menu sets this bit to select between two different game counts.</li></ul>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<p>Mask: $E001
</p><p>See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</p>
