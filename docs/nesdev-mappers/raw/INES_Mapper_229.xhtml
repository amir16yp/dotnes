<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 229</a> aka &quot;BMC 31-IN-1&quot; is a simple mapper. Writing to anywhere in $8000-FFFF will affect both mirroring and its mapping for CHR and both PRG pages.
</p>
<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>PRG: 2x16KiB</li>
<li>CHR: 1x8KiB</li></ul>
<h2><span class="mw-headline" id="Register">Register</span></h2>
<pre>Mask $803F, range $8000-FFFF
Address:
%1xxx xxxx xxHP PPPP
              C CCCC
 H = mirroring [0=vertical, 1=horizontal]
 P,C = bits for mapping both CHR and PRG, all pages
</pre>
<p>This means that both PRG pages will be loaded with the same bank. However, if all M bits are 0, then the second page of PRG gets mapped to 1 instead of 0.
</p><p>Nestopia does not seem to restrict the CHR banking to the lower five bits, potentially using all 16. Otherwise, Nintendulator does the same. 
</p>
<h2><span class="mw-headline" id="Sources">Sources</span></h2>
