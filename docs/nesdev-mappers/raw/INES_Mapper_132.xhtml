<div class="mw-parser-output"><p>INES Mapper 132 is used to denote three compatible boards used by games from TXC Corporation:
</p>
<ul><li>TXC 01-22003-400 PCB: 72 pins with <a href="CIC_lockout_chip.xhtml" class="mw-redirect" title="CIC">CIC</a> stun circuit, <a href="TXC_05_00002_010_pinout.xhtml" title="TXC 05-00002-010 pinout">TXC 05-00002-010</a> ASIC, max. 64 KiB PRG-ROM, max. 32 KiB CHR-ROM</li>
<li>TXC 01-22111-100 PCB: 60 pins, TXC 05-00002-010 ASIC, max. 64 KiB PRG-ROM, max. 32 KiB CHR-ROM</li>
<li>TXC 01-22270-000 PCB: 60 pins, TXC 05-00002-010 ASIC or 74LS161 latch, max. 64 KiB PRG-ROM, max. 32 KiB CHR-ROM</li></ul>

<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $8000-$FFFF: 32 KiB switchable PRG ROM bank</li>
<li>PPU $0000-$1FFF: 8 KiB switchable CHR ROM bank</li></ul>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Mapper 132 uses a custom IC (real number 05-00002-010, often with fake markings) serving as a latch, adder and inverter. There are six registers: &quot;P&quot;, &quot;R&quot;, and Output (three bits each); &quot;S&quot;, inCrement, and and inVert (one bit each).
</p>
<pre>Mask: $E100
 read $4100: [xxxx SRRR]
              |||| ||||
              |||| ++++- Copy internal registers 'RRR' and<b> 'S' XOR 'V' </b>to data bus.
              ++++------ open bus
Mask: $E103
 write $4100: If Increment is set, internal register 'RRR' &lt;- 'RRR'+1
              Otherwise, if Invert is clear, copy internal register 'PPP' to 'RRR'
                         if Invert is set, copy '~PPP' to 'RRR'
              'S' is not changed at all.
 write $4101: [.... ...V] - Invert Mode
 write $4102: [.... SPPP] - Copy data bus to internal registers 'S' and 'PPP'.
                            'S' can be read back immediately; 'PPP' must be copied using $4100 first.
 write $4103: [.... ...C] - Increment Mode
Mask: $8000
 write $8000: copy internal register 'RRR' to PRG A15, CHR A14, and CHR A13 banking pins, in order.
</pre>
<p>Games will also check the lower three or four bits of $4100 for the correct value after several increment and inversion operations as a copy-protection measure.
</p>
<h2><span class="mw-headline" id="TXC_01-22270-000_PCB_with_74LS161_latch">TXC 01-22270-000 PCB with 74LS161 latch</span></h2>
<p>Instead of the 05-00002-010 ASIC, the 01-22270-000 PCB variant can also use a simple 74LS161 latch, which would make the board function as <a href="GxROM.xhtml" class="mw-redirect" title="MHROM">MHROM</a>.
</p>
<h2><span class="mw-headline" id="Notes">Notes</span></h2>
<ul><li><i>戰國四川省</i> (Zhànguó Sìchuān Shěng, original version of AVE's <i>Tiles of Fate</i>) is set to Mapper 132 in GoodNES 3.23b. That ROM image is actually a mapper hack with the PRG-ROM code unmodified but the CHR-ROM banks rearranged to work as Mapper 132; the correct mapper is <a href="INES_Mapper_173.xhtml" title="INES Mapper 173">INES Mapper 173</a>. That mapper hack only works on certain emulators' implementation of Mapper 132, not on the above implementation based on studying the circuit board.</li>
<li>The TXC re-release of <i>小瑪琍</i> (Xiǎo Mǎlí), with cartridge code MGC-005, uses the 01-22111-100 board as well, but since it does not use any bankswitching whatsoever, it can be emulated as mapper 0.</li>
<li><i>麻将方块 (Mahjong Block)</i> (TXC re-release, headerless CRC32 0ACFC3CD) is commonly set to <a href="INES_Mapper_173.xhtml" title="INES Mapper 173">INES Mapper 173</a>, but since it expects Output bit 1 to select CHR A14, it actually uses INES Mapper 132. Note that the original <i>Super Mega</i> release of the game uses <a href="INES_Mapper_172.xhtml" title="INES Mapper 172">INES Mapper 172</a>.</li></ul>
<h2><span class="mw-headline" id="Similar_Mappers">Similar Mappers</span></h2>
<ul><li>On games with only 32 KiB PRG-ROM, Mapper 132 is almost identical to <a href="INES_Mapper_136.xhtml" title="INES Mapper 136">INES Mapper 136</a> except in the value read from $4100 due to Mapper 136 having four (28-pin JV001 ASIC) versus Mapper 132 having three adder bits (24-pin 05-00002-010 ASIC).</li>
<li>On games with only 32 KiB PRG-ROM, <a href="INES_Mapper_173.xhtml" title="INES Mapper 173">INES Mapper 173</a> is similar to Mapper 132 except that CHR A14 is taken from the inverse of the Invert bit rather than Output bit 1.</li>
<li><a href="INES_Mapper_036.xhtml" title="INES Mapper 036">INES Mapper 036</a> is somewhat similar, using the same 05-00002-010 ASIC. It utilizes CPU bits 4 and 5 instead of 2 for PRG-ROM banking and moves CHR-ROM banking to a separate data latch.</li></ul>
