<div class="mw-parser-output"><p><b>NES 2.0 Mapper 455</b> denotes the NTDEC <b>N625836</b> <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based multicart circuit PCB, used for a <i>9000000-in-1</i> multicart.
</p>
<h2><span id="Extra_Register_.28.244100.2C_write.29"/><span class="mw-headline" id="Extra_Register_($4100,_write)">Extra Register ($4100, write)</span></h2>
<pre>A~[010. .... ..Q. .qDC] D~[...P PPBA]
               |   |||        | |||+- 0: MMC3 mode, 1: NROM mode
               |   |||        | ||+-- 0: NROM-128 mode, 1: NROM-256 mode (if A=1)
               |   |||        +-++--- PRG A16..A14 in NROM mode
               |   ||+--------------- 0: 128 KiB MMC3 inner PRG bank, 1: 256 KiB MMC3 inner PRG bank
               |   |+---------------- 0: 128 KiB MMC3 inner CHR bank, 1: 256 KiB MMC3 inner CHR bank
               +---+----------------- PRG/CHR A18..A17
</pre>
