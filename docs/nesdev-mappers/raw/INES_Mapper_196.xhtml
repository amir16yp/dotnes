</head><body><h1>INES Mapper 196</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_196">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_196">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 196</a> is a pirate variant of MMC3, most often used for games where the protagonist has been replaced with Mario. A common characteristic of <a href="http://community.fandom.com/wiki/c:bootleggames:Mario_Pirate_Hacks" class="extiw" title="wikia:c:bootleggames:Mario Pirate Hacks">these hacks</a> is referring to Mario as &quot;Mali&quot; or &quot;Mari&quot; (e.g. Super Bros. 17: Fighting of the Mali Lugi, Mali Boss, etc.), a result of the way the name &quot;Mario&quot; is represented in Chinese (玛莉/瑪莉, 马利/馬利, or 玛琍/瑪琍, all of which are pronounced &quot;ma li&quot;).
</p><p>Nestopia's source indicates that it is identical to an &quot;ordinary&quot; MMC3, except that it distinguishes between registers based on A2 instead of A0, and corresponds to the two games <i>Super Mario Bros. 11 (Unl) [!]</i> and <i>Super Mario Bros Jurassk Park (Unl) [!]</i>.
</p><p>FCEUX's source further implies that there're far too many different variants that have been assigned to this mapper, using A1, A2, or A3; and additionally that writing to $6000-$7FFF switches the board into a BNROM-like PRG layout.
</p>
