<div class="mw-parser-output"><p>NES 2.0 Mapper 528 is used for the <i>1995 New Series Super 2-in-1</i> multicart (title screen: Rugby 2-in-1), containing both of Sunsoft's <i>Dodge Danpei</i> games. Its UNIF board name is <b>UNL-831128C</b>. Although the ROM image's common name is &quot;1995 New Series Super 2-in-1 (Unl,Vrc7p)&quot;, only the IRQ counter functions like the <a href="VRC7.xhtml" title="VRC7">VRC7</a>'s; the other registers are more like Sunsoft's <a href="Sunsoft_FME_7.xhtml" class="mw-redirect" title="FME-7">FME-7</a>.
</p>

<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="Game_select_.28.24A00x.2FC00x.29"/><span class="mw-headline" id="Game_select_($A00x/C00x)">Game select ($A00x/C00x)</span></h2>
<pre>A~FEDC BA98 7654 3210
  -------------------
  1G.. .... .... ....
   +------------------ Select game
                        0: Dodge Danpei
                        1: Dodge Danpei 2
</pre>
<h2><span id="FME-7-compatible_registers_.28.24A000-A00C.2F.24C000-.24C00C.29"/><span class="mw-headline" id="FME-7-compatible_registers_($A000-A00C/$C000-$C00C)">FME-7-compatible registers ($A000-A00C/$C000-$C00C)</span></h2>
<p>These registers function like the Sunsoft <a href="Sunsoft_FME_7.xhtml" class="mw-redirect" title="FME-7">FME-7</a>'s registers $0-$C (excluding $8 and $B), except that A0-A3 select the register directly; there is no index register. Register $B is not functional, as the CPU $C000-$DFFF is hard-wired to the second-to-last bank (unlike the FME-7), and CPU $E000-$FFFF hard-wired to the last bank (as on the FME-7).
</p>
<pre>$A000: Set 1 KiB CHR-ROM bank at PPU $0000-$03FF
$A001: Set 1 KiB CHR-ROM bank at PPU $0400-$07FF
$A002: Set 1 KiB CHR-ROM bank at PPU $0800-$0BFF
$A003: Set 1 KiB CHR-ROM bank at PPU $0C00-$0FFF
$A004: Set 1 KiB CHR-ROM bank at PPU $1000-$13FF
$A005: Set 1 KiB CHR-ROM bank at PPU $1400-$17FF
$A006: Set 1 KiB CHR-ROM bank at PPU $1800-$1BFF
$A007: Set 1 KiB CHR-ROM bank at PPU $1C00-$1FFF
$A008: See below.
$A009: Set 8 KiB PRG-ROM bank at CPU $8000-$9FFF
$A00A: Set 8 KiB PRG-ROM bank at CPU $A000-$BFFF
$A00B: No function
$A00C: Select nametable mirroring type (V/H/S0/S1).
</pre>
<h2><span id="PRG_.246000-.247FFF_control_.28.24A008.2F.24C008.29"/><span class="mw-headline" id="PRG_$6000-$7FFF_control_($A008/$C008)">PRG $6000-$7FFF control ($A008/$C008)</span></h2>
<p>This register seems to be a simplified version of the FME-7's register $8. Value $01 selects PRG-RAM, all other values select an 8 KiB PRG-ROM bank at CPU $6000-$7FFF.
</p>
<h2><span id="VRC-compatible_IRQ_.28.24A00D-.24A00F.2F.24C00D-.24C00F.29"/><span class="mw-headline" id="VRC-compatible_IRQ_($A00D-$A00F/$C00D-$C00F)">VRC-compatible IRQ ($A00D-$A00F/$C00D-$C00F)</span></h2>
<pre>$A00D/$C00D: IRQ Control
$A00E/$C00E: IRQ Acknowledge
$A00F/$C00F: IRQ Latch.
</pre>
<p>See <a href="VRC_IRQ.xhtml" title="VRC IRQ">VRC IRQ</a> for details.
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<p>Note that the first Dodge Danpei game only has 128 KiB of PRG-ROM while the second has 256 KiB, requiring careful application of PRG-ROM base offsets and masks. Although the commonly-available UNIF ROM image only has one PRG chunk, it is highly likely that the cartridge used two PRG-ROM chips.
</p>
