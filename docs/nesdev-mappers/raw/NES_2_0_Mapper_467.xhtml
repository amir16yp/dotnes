<div class="mw-parser-output"><p><b>NES 2.0 Mapper 467</b> denotes the <b>47-2</b> <a href="MMC3.xhtml" title="MMC3">MMC3</a>-based circuit board, used for a <i>72-in-1</i> multicart. It is effectively <a href="INES_Mapper_197.xhtml" title="INES Mapper 197">INES Mapper 197</a> submapper 0 with an outer bank register and an NROM mode.
</p>
<h2><span id="Outer_Bank_Register_.28.249000.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($9000,_write)">Outer Bank Register ($9000, write)</span></h2>
<pre>Mask: $F000?

D~[MSNQ QPPp]
   ||++-++++- PRG A18..A14
   ||+------- PRG banking mode
   ||          0=NROM-128
   ||          1=MMC3-based
   |+-------- PRG (if N=1)/CHR banking mode
   |           0=PRG A14..A13 from MMC3, PRG A19..A15 from NQQPP
   |             CHR A12..A10=PPU A12..A10, CHR A18..A13 from MMC3 CHR A17..A12, CHR A19=0
   |           1=PRG A16..A13 from MMC3, PRG A19..A17 from NQQ
   |             CHR A10=PPU A10, CHR A18..A11 from MMC3 CHR A17..A10, CHR A19=1
   +--------- Nametable mirroring
               0=Vertical
               1=Horizontal
</pre>
<p>The MMC3 clone ignores the PRG/CHR inversion bits D6 and D7 in the pointer register $8000, and its mirroring output is ignored in favor of the Outer Bank Register's.
</p>
