<h2><span class="mw-headline" id="Banks">Banks</span></h2>
<ul><li>CPU $6000-$7FFF: 8 KiB RAM, or 8 KiB controllable ROM bank.</li>
<li>CPU $8000-$B7FF: 14 KiB ROM, starting at ROM offset 0x18000</li>
<li>CPU $B800-$D7FF: 8 KiB RAM, or 8 KiB fixed ROM bank, starting at ROM offset 0x1B800</li>
<li>CPU $D800-$FFFF: 10 KiB ROM, starting at ROM offset 0x1D800</li></ul>
<p>Writes to regions where RAM can be mapped will always write to RAM, even if RAM isn't enabled for reading.
</p>
<h2><span class="mw-headline" id="Registers">Registers</span></h2>
<p>Registers are not cleared on reset, and state is unknown on power-up. No bus conflicts.
</p>
<h3><span id="PRG_bank_.28.248000-.248FFF.29"/><span class="mw-headline" id="PRG_bank_($8000-$8FFF)">PRG bank ($8000-$8FFF)</span></h3>
<p>Mask: $F000
</p>
<pre>7  bit  0
---- ----
.... PPPP
     ||||
     ++++-- select 8 KiB PRG bank at $6000
</pre>
<h3><span id="Mirroring_control_.28.24E000-.24EFFF.29"/><span class="mw-headline" id="Mirroring_control_($E000-$EFFF)">Mirroring control ($E000-$EFFF)</span></h3>
<p>Mask: $F000
</p>
<pre>7  bit  0
---- ----
.... m...
     |
     +----- 0=V (PPU A10), 1=H (PPU A11)
</pre>
<h3><span id="RAM_disable_.28.24F000-.24FFFF.29"/><span class="mw-headline" id="RAM_disable_($F000-$FFFF)">RAM disable ($F000-$FFFF)</span></h3>
<p>Mask: $F000
</p>
<pre>7  bit  0
---- ----
...d ....
   |
   +------- 0=RAM available at $6000-$7FFF and $B800-$D7FF
            1=ROM instead
</pre>
<h2><span class="mw-headline" id="Hardware">Hardware</span></h2>
<p>This hardware involves three <a href="7400.xhtml" title="7400">7400</a>, two <a href="7410.xhtml" title="7410">7410</a>, a <a href="7432.xhtml" title="7432">7432</a>, a <a href="7474.xhtml" title="7474">7474</a>, a <a href="74138.xhtml" title="74138">74138</a>, a <a href="74157.xhtml" title="74157">74157</a>, and a <a href="74161.xhtml" title="74161">74161</a>.
</p>
