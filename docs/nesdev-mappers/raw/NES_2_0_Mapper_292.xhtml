<div class="mw-parser-output"><p>NES 2.0 Mapper 292 is used for the unlicensed game <i>Dragon Fighter</i>. Its PCB name is &quot;BMW8544&quot;, its UNIF board name is <b>UNL-DRAGONFIGHTER</b>. It's an <a href="MMC3.xhtml" title="MMC3">MMC3</a> clone with some extremely odd bankswitching that is poorly understood. The description below is based on the <a rel="nofollow" class="external text" href="https://github.com/asfdfdfd/fceux/blob/master/src/boards/BMW8544.cpp">FCEUX source code</a>, which sort-of runs the game, albeit with occasional graphical glitches.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $8000-$9FFF: 8 KiB switchable PRG-ROM bank selected by writing to $6000.</li>
<li>CPU $A000-$BFFF: 8 KiB switchable PRG-ROM bank selected by MMC3 register $07, or fixed to last bank if PRG A14 inversion is active</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-ROM bank, fixed to the second-last bank, or switchable PRG-ROM bank selected by MMC3 register $06 if PRG A14 inversion is active</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM bank, fixed to the last bank, or switchable PRG-ROM bank selected by MMC3 register $07 if PRG A14 inversion is active</li>
<li>PPU $0000-$07FF: 2 KiB switchable CHR-ROM bank selected by (MMC3 register 0 SHR 1) XOR the low CHR bank.</li>
<li>PPU $0800-$0FFF: 2 KiB switchable CHR-ROM bank selected by (MMC3 register 2 SHR 1) ORed with (bit 6 of the high CHR bank SHR 1).</li>
<li>PPU $1000-$1FFF: 4 KiB switchable CHR-ROM bank selected by bits 0-5 of the high CHR bank.</li></ul>
<p>MMC3 CHR A12 inversion ($8000 bit 7) is not supported.
</p>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id="PRG_Bank_Register_.28.246000.2C_write.29"/><span class="mw-headline" id="PRG_Bank_Register_($6000,_write)">PRG Bank Register ($6000, write)</span></h2>
<p>Mask: Probably $E001
</p><p>Selects the 8 KiB PRG-ROM bank at CPU $8000-$9FFF.
</p>
<h2><span id="CHR_Bank_Register_.28.246000.2C_read.29"/><span class="mw-headline" id="CHR_Bank_Register_($6000,_read)">CHR Bank Register ($6000, read)</span></h2>
<p>Mask: Probably $E001
</p>
<ul><li>When this register is <b>read</b> <i>and</i> the PRG Bank AND $E0 is ==$C0, then the low CHR bank is replaced with the value previously written to CPU RAM at $006A.</li>
<li>When this register is <b>read</b> <i>and</i> the PRG Bank AND $E0 is !=$C0, then the high CHR bank is replaced with the value previously written to CPU RAM at $00FF.</li></ul>
<h2><span id="MMC3-compatible_registers_.28.248000-.24FFFF.29"/><span class="mw-headline" id="MMC3-compatible_registers_($8000-$FFFF)">MMC3-compatible registers ($8000-$FFFF)</span></h2>
<p>Mask: $E001
</p><p>Same as regular <a href="MMC3.xhtml" title="MMC3">MMC3</a> except where noted.
</p>
