<div class="mw-parser-output"><p><b>NES 2.0 Mapper 450</b> denotes the <a href="VRC2_and_VRC4.xhtml" class="mw-redirect" title="VRC2">VRC2</a>-based 晶太 (Jingtai) <b>YY841157C</b> multicart circuit board used for J.Y. Company's <i>1996 Super HiK 4-in-1 - 新系列瑪莉13代組合卡</i> multicart. The VRC2 clone's A0/A1 inputs are connected to CPU A0/A1; its µ-write interface is used to form an additional outer bank register at CPU $6000-$6FFF. It can be seen as the oversize VRC2 equivalent of <a href="INES_Mapper_047.xhtml" title="INES Mapper 047">INES Mapper 047</a>.
</p>
<h2><span id="Outer_Bank_Register_.28.246000-.246FFF.2C_write.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$6FFF,_write)">Outer Bank Register ($6000-$6FFF, write)</span></h2>
<pre>D~[.... ..BB]
          ++- PRG/CHR A18..A17
</pre>
