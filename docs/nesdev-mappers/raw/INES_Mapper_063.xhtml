</head><body><h1>INES Mapper 063</h1><nav class="fromwiki">
From <a href="Nesdev_Wiki.xhtml">NESdev Wiki</a> | View <a class="canonical" href="https://www.nesdev.org/wiki/INES_Mapper_063">current version</a> | View <a href="Special_AllPages.xhtml#INES_Mapper_063">other pages</a>
</nav><div class="article">
<div class="mw-parser-output"><p><a class="mw-selflink selflink">iNES Mapper 063</a> is used for NTDEC's &quot;Powerful 250-in-1&quot; multicart (PCB ID <b>TH2291-3</b>) and its pirate-of-a-pirate equivalent, the &quot;Hello Kitty 255-in-1&quot; (PCB ID <b>CH-011</b>) multicart (Submapper 0), as well as the <b>82AB</b> PCB used by a <i>82-in-1</i> multicart (Submapper 1). The address-latch-based bankswitching hardware supports only NROM-128 and NROM-256 games. CHR data is stored in 8 KiB of unbanked CHR-RAM that can be write-protected.
</p>
<h2><span id="Address_latch_.28.248000-.24FFFF.2C_write.29"/><span class="mw-headline" id="Address_latch_($8000-$FFFF,_write)">Address latch ($8000-$FFFF, write)</span></h2>
<p>Submapper 0:
</p>
<pre>A~FEDC BA98 7654 3210
  -------------------
  1... .CBB BBBB BbPM
        ||| |||| |||+- Select nametable mirroring type
        ||| |||| |||    0: Vertical
        ||| |||| |||    1: Horizontal
        ||| |||| ||+-- Select PRG banking mode
        ||| |||| ||     0: NROM-128, CPU A14 replaced with b
        ||| |||| ||     1: NROM-256, CPU A14 unmodified
        |++-++++-++--- Select 16 KiB PRG-ROM bank (A14..A21)
        +------------- Select CHR-RAM write-protection
                        0: Disabled, CHR-RAM writable
                        1: Enabled, CHR-RAM write-protected
</pre>
<p>For the menu code to correctly detect the number of games, selecting unpopulated PRG-ROM banks must result in open bus rather than wrapped addresses.
</p><p>Submapper 1:
</p>
<pre>A~FEDC BA98 7654 3210
  -------------------
  1... ..CB BBBB BbPM
         || |||| |||+- Select nametable mirroring type
         || |||| |||    0: Vertical
         || |||| |||    1: Horizontal
         || |||| ||+-- Select PRG banking mode
         || |||| ||     0: NROM-128, CPU A14 replaced with b
         || |||| ||     1: NROM-256, CPU A14 unmodified
         |+-++++-++--- Select 16 KiB PRG-ROM bank (A14..A21)
         +------------ Select CHR-RAM write-protection
                        0: Disabled, CHR-RAM writable
                        1: Enabled, CHR-RAM write-protected
</pre>
<p>Compared to Submapper 0, Submapper 1 can be thought as having one PRG-ROM bit less, and moving the CHR-RAM Protect bit into its place.
</p>
