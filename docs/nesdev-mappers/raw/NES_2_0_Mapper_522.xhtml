<div class="mw-parser-output"><p>NES 2.0 Mapper 522 is used for Whirlwind Manu's cartridge conversion of the Famicom Disk System game 風雲 少林拳 (Fūun Shōrinken). Its UNIF board name is <b>UNL-LH10</b>.
</p>

<h1><span class="mw-headline" id="Banks">Banks</span></h1>
<ul><li>CPU $6000-$7FFF: 8 KiB PRG-ROM, hard-wired to second-to-last bank</li>
<li>CPU $8000-$9FFF: 8 KiB PRG-ROM, switchable</li>
<li>CPU $A000-$BFFF: 8 KiB PRG-ROM, switchable</li>
<li>CPU $C000-$DFFF: 8 KiB PRG-RAM</li>
<li>CPU $E000-$FFFF: 8 KiB PRG-ROM, hard-wired to last bank</li>
<li>PPU $0000-$1FFF: 8 KiB of unbanked CHR-RAM</li></ul>
<h1><span class="mw-headline" id="Registers">Registers</span></h1>
<h2><span id=".248000-.249FFE_.28even.29"/><span class="mw-headline" id="$8000-$9FFE_(even)">$8000-$9FFE (even)</span></h2>
<p>Select bank register number
</p>
<pre>$0-$5: No function
$6: Select 8 KiB PRG-ROM bank at CPU $8000-$9FFF
$7: Select 8 KiB PRG-ROM bank at CPU $A000-$BFFF
</pre>
<h2><span id=".248001-.249FFF_.28odd.29"/><span class="mw-headline" id="$8001-$9FFF_(odd)">$8001-$9FFF (odd)</span></h2>
<p>Data for bank register selected by $8000-$9FFE (even).
</p>
<h1><span class="mw-headline" id="Notes">Notes</span></h1>
<ul><li>Mirroring is hard-wired (to Vertical in Fūun Shōrinken's case).</li>
<li>The register layout indicates that an MMC3 clone is being used, connected in a restricted manner.</li></ul>
