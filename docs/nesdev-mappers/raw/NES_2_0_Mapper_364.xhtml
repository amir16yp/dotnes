<div class="mw-parser-output"><p><b>NES 2.0 Mapper 364</b> is used for an early MMC3-based multicart PCB (<b>JY830832C</b>) from J.Y. Company, preceding the <a href="J_Y__Company_ASIC.xhtml" title="J.Y. Company ASIC">J.Y. Company ASIC</a>. A compatible PCB has the code <b>9053</b>.
</p>
<ul><li><i>1994 Super HiK 3-in-1 (JY-007)</i></li>
<li><i>1996 Super HiK Gold Card (LT-953)</i></li></ul>
<h2><span id="Outer_Bank_Register_.28.246000-.247FFF.29"/><span class="mw-headline" id="Outer_Bank_Register_($6000-$7FFF)">Outer Bank Register ($6000-$7FFF)</span></h2>
<pre>Mask: $E000

D~7654 3210
  ---------
  .PSC ....
   ||+------ CHR A18
   |+------- PRG/CHR A17 mode
   |          0: Preserve MMC3's PRG/CHR A17
   |          1: Force PRG/CHR A17 to 0
   +-------- PRG A18
</pre>
<p>This register is accessible regardless of whether WRAM is enabled in the MMC3 clone's A001 register. It may be possible that there is another bit, unused on the only discovered cartridge using this mapper, that selects the bit value which PRG/CHR A17 is forced to when S=1.
</p>
<h2><span class="mw-headline" id="MMC3-compatible_registers">MMC3-compatible registers</span></h2>
<pre>Mask: $E001

See <a href="MMC3.xhtml" title="MMC3">MMC3</a>.
</pre>
